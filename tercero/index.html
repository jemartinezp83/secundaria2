<script>
"use strict";
/* ===== Utilidades matemáticas y de formato ===== */
const R = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const RNZ = (a, b) => { let x; do { x = R(a, b); } while (x === 0); return x; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; };
const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);
const rnd = (x, d = 10) => { const p = Math.pow(10, d); return Math.round(x * p) / p; };
const MINUS = '−';
const PI = 3.14;

function fmt(x, dec) {
  if (dec !== undefined) x = rnd(x, dec);
  x = rnd(x, 9);
  if (Object.is(x, -0)) x = 0;
  const neg = x < 0;
  let s = Math.abs(x).toString();
  if (s.includes('e')) s = Math.abs(x).toFixed(12).replace(/0+$/, '').replace(/\.$/, '');
  let [i, d] = s.split('.');
  if (i.length > 4) i = i.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? MINUS : '') + i + (d ? '.' + d : '');
}
const P = x => (x < 0 ? `(${fmt(x)})` : fmt(x));
const money = x => { const s = fmt(x, 2); return '$' + (/\.\d$/.test(s) ? s + '0' : s); };
const sgn = x => (x < 0 ? '(−)' : '(+)');
function simp(n, d) { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return [n / g, d / g]; }
function frRaw(n, d) { const neg = (n < 0) !== (d < 0) && n !== 0; return `${neg ? MINUS : ''}<span class="fr"><span>${Math.abs(n)}</span><span>${Math.abs(d)}</span></span>`; }
function rf(maxD = 9, minD = 2) { let n, d; do { d = R(minD, maxD); n = R(1, d - 1); } while (gcd(n, d) !== 1); return [n, d]; }
function frS(t, b) { return `<span class="fr"><span>${t}</span><span>${b}</span></span>`; }
function fr(n, d) { [n, d] = simp(n, d); if (d === 1) return fmt(n); return frRaw(n, d); }
function mixed(n, d) { [n, d] = simp(n, d); const w = Math.trunc(n / d), r = Math.abs(n % d); if (r === 0) return fmt(w); return (w ? fmt(w) + ' ' : (n < 0 ? MINUS : '')) + frRaw(r, d); }
function frP(n, d) { [n, d] = simp(n, d); return n < 0 ? `(${fr(n, d)})` : fr(n, d); }
const pw = (b, e) => `${b}<sup>${typeof e === 'number' ? fmt(e) : e}</sup>`;
const sci = (m, e) => `${fmt(m)} × 10<sup>${fmt(e)}</sup>`;
const B = s => `<b>${s}</b>`;

/* Polinomios: terms = [[coef, 'x'], [coef, '']] */
function poly(terms) {
  let s = '', first = true;
  for (const [c, v] of terms) {
    if (c === 0) continue;
    const a = Math.abs(c);
    const body = v ? (a === 1 ? v : fmt(a) + v) : fmt(a);
    if (first) s += (c < 0 ? MINUS : '') + body;
    else s += (c < 0 ? ` ${MINUS} ` : ' + ') + body;
    first = false;
  }
  return s || '0';
}
const X2 = 'x<sup>2</sup>';

/* Constructores de preguntas */
function num(q, ans, extra = {}) { return Object.assign({ q, type: 'num', ans }, extra); }
function pair(q, x, y, extra = {}) { return Object.assign({ q, type: 'pair', ans: [x, y] }, extra); }
function mc(q, correct, distract, extra = {}) {
  const seen = new Set([String(correct)]); const opts = [correct];
  for (const d of distract) { if (opts.length >= 4) break; const k = String(d); if (!seen.has(k)) { seen.add(k); opts.push(d); } }
  const order = shuffle(opts.map((o, i) => i));
  return Object.assign({ q, type: 'mc', opts: order.map(i => opts[i]), ans: order.indexOf(0) }, extra);
}

/* Lectura de respuestas: enteros, decimales, fracciones, mixtos, signo unicode */
function parseAnswer(str) {
  if (str == null) return NaN;
  let s = String(str).trim().replace(/[−–—]/g, '-').replace(/[$%°]/g, '').replace(/[a-zA-Záéíóúñ²³]+\.?$/g, '').trim();
  if (!s) return NaN;
  if (s.includes(',') && s.includes('.')) s = s.replace(/,/g, '');

  let m = s.match(/^(-?)(\d+) (\d+)\/(\d+)$/);
  if (m) { const v = +m[2] + (+m[3]) / (+m[4]); return m[1] ? -v : v; }
  m = s.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);
  if (m) { const d = parseFloat(m[2]); return d === 0 ? NaN : parseFloat(m[1]) / d; }
  if (/^[-+]?\d*\.?\d+$/.test(s)) return parseFloat(s);
  return NaN;

/* ===== SVG ===== */
let _svgId = 0;
function gridSVG({ lines = [], points = [], range = 6, labels = true } = {}) {

  }

/* ===== Análisis dimensional (factores de conversión) =====
   Criterio pedagógico: no se usan atajos (“÷ 3.6”, “de grande a chica multiplica”) ni regla de tres.
   Toda conversión se resuelve multiplicando por factores de conversión que valen 1 y cancelando unidades.
   start: { v, n: [unidades arriba], d: [unidades abajo] }  ·  factors: [{ n: [número, unidad], d: [número, unidad] }]
   Devuelve { steps: [...], value, unit }. */
const UXS = u => `<span class="ux">${u}</span>`, UCX = u => `<span class="uc">${u}</span>`;
function dimAnalysis(start, factors, o = {}) {
  const num = [{ v: start.v, u: start.n || [] }].concat(factors.map(f => ({ v: f.n[0], u: [f.n[1]] })));
  const den = [{ v: 1, u: start.d || [] }].concat(factors.map(f => ({ v: f.d[0], u: [f.d[1]] })));
  const nU = num.flatMap((t, i) => t.u.map((u, j) => ({ u, i, j, c: false }))), dU = den.flatMap((t, i) => t.u.map((u, j) => ({ u, i, j, c: false })));
  for (const a of nU) { const b = dU.find(x => !x.c && x.u === a.u); if (b) { a.c = true; b.c = true; } }
  const isC = (L, i, j) => (L.find(x => x.i === i && x.j === j) || {}).c;
  const term = (t, i, L) => `${fmt(t.v)}${t.u.length ? ' ' : ''}${t.u.map((u, j) => isC(L, i, j) ? UCX(u) : UXS(u)).join('·')}`;
  const fracs = num.map((t, i) => `(${frS(term(t, i, nU), term(den[i], i, dU))})`).join(' × ');
  const cancelled = [...new Set(nU.filter(x => x.c).map(x => x.u))];
  const remN = nU.filter(x => !x.c).map(x => x.u), remD = dU.filter(x => !x.c).map(x => x.u);
  const unit = remN.join('·') + (remD.length ? '/' + remD.join('·') : '');
  const pn = num.reduce((a, t) => a * t.v, 1), pd = den.reduce((a, t) => a * t.v, 1); const value = rnd(pn / pd, 9);
  const startTxt = (start.d && start.d.length) ? `${fmt(start.v)} ${start.n.join('·')}/${start.d.join('·')}` : `${fmt(start.v)} ${start.n.join('·')}`;
  const steps = [
    `<b>Dato y unidad que buscamos:</b> tenemos ${startTxt} y queremos el resultado en ${o.target || unit}.${(start.d && start.d.length) ? ` Escribimos la cantidad como fracción: ${frS(fmt(start.v) + ' ' + start.n.join('·'), '1 ' + start.d.join('·'))}.` : ` Escribimos la cantidad como fracción sobre 1: ${frS(fmt(start.v) + ' ' + start.n.join('·'), '1')}.`}`,
    `<b>Equivalencias:</b> ${factors.map(f => f.eq || (f.n[0] === 1 && f.d[0] !== 1 ? `1 ${f.n[1]} = ${fmt(f.d[0])} ${f.d[1]}` : `${fmt(f.d[0])} ${f.d[1]} = ${fmt(f.n[0])} ${f.n[1]}`)).join(' · ')}.`,
    `<b>Factores de conversión:</b> con cada equivalencia formamos una fracción que vale 1, porque arriba y abajo está la misma cantidad escrita en distinta unidad; multiplicar por 1 no cambia la cantidad, solo su unidad. Acomodamos cada fracción para que la unidad que queremos eliminar quede <b>en el lado contrario</b> al que está en el dato (si está arriba, en el factor va abajo).`,
    `<b>Multiplicamos y cancelamos:</b> ${fracs}`,
    `${cancelled.length ? `Se cancelan ${cancelled.map(u => UCX(u)).join(' y ')}: la misma unidad arriba y abajo se divide entre sí y da 1. ` : ''}Quedan ${remN.length ? remN.join('·') : 'números'} arriba${remD.length ? ` y ${remD.join('·')} abajo` : ''}, que es la unidad buscada.`,
    `<b>Operamos los números:</b> arriba ${num.map(t => fmt(t.v)).join(' × ')} = ${fmt(pn)}; abajo ${den.map(t => fmt(t.v)).join(' × ')} = ${fmt(pd)}. ${pd === 1 ? `Resultado: ${B(fmt(rnd(value, o.dec ?? 9)) + ' ' + (o.target || unit))}` : `${frS(fmt(pn) + ' ' + (remN.join('·') || ''), fmt(pd) + (remD.length ? ' ' + remD.join('·') : ''))} = ${B(fmt(rnd(value, o.dec ?? 9)) + ' ' + (o.target || unit))}`}`];
  return { steps, value, unit };
}
const DA_HINT = 'Usa análisis dimensional: multiplica el dato por factores de conversión (fracciones que valen 1) acomodados para que se cancele la unidad que no quieres.';

/* ===== Despejes por balance de la igualdad =====
   Criterio pedagógico: no se usa “pasa restando / pasa dividiendo”. Una igualdad es una balanza: cualquier operación
   se hace en AMBOS lados para que siga en equilibrio. Para “quitar” algo de un lado se aplica su operación contraria. */
const BAL = 'Para que la igualdad siga balanceada, la misma operación se hace en <b>ambos lados</b>.';
/* Y = f1·f2·… → despejar T */
function despMul(Y, fs, T) {
  const o = fs.filter(f => f !== T), oS = o.join(' · ');
  return [`Partimos de la fórmula <b>${Y} = ${fs.join(' · ')}</b> y queremos dejar sola a <b>${T}</b>.`,
    `${T} está <b>multiplicada</b> por ${oS}. La operación contraria de multiplicar es dividir, así que dividimos ambos lados entre ${oS}. ${BAL}<br>${frS(Y, oS)} = ${frS(fs.join(' · '), oS)}`,
    `En el lado derecho, ${oS} entre ${oS} es igual a 1, así que ${T} queda sola: <b>${T} = ${frS(Y, oS)}</b>`];
}
/* Y = X / Z → despejar el numerador X */
function despNum(Y, X, Z) {
  return [`Partimos de la fórmula <b>${Y} = ${frS(X, Z)}</b> y queremos dejar sola a <b>${X}</b>.`,
    `${X} está <b>dividida</b> entre ${Z}. La operación contraria de dividir es multiplicar, así que multiplicamos ambos lados por ${Z}. ${BAL}<br>${Y} · ${Z} = ${frS(X, Z)} · ${Z}`,
    `En el lado derecho, ${Z} entre ${Z} es igual a 1, así que ${X} queda sola: <b>${X} = ${Y} · ${Z}</b>`];
}
/* Y = X / Z → despejar el denominador Z */
function despDen(Y, X, Z) {
  return [`Partimos de la fórmula <b>${Y} = ${frS(X, Z)}</b> y queremos dejar sola a <b>${Z}</b>, que está abajo (en el denominador).`,
    `Primero multiplicamos ambos lados por ${Z} para sacarla del denominador. ${BAL}<br>${Y} · ${Z} = ${frS(X, Z)} · ${Z} &nbsp;→&nbsp; ${Y} · ${Z} = ${X}`,
    `Ahora ${Z} está <b>multiplicada</b> por ${Y}. La operación contraria es dividir: dividimos ambos lados entre ${Y}.<br>${frS(Y + ' · ' + Z, Y)} = ${frS(X, Y)}`,
    `${Y} entre ${Y} es igual a 1, así que: <b>${Z} = ${frS(X, Y)}</b>`];
}
/* Paso de sustitución con unidades */
const sust = (lhs, expr, res) => `Sustituimos los datos con sus unidades: ${lhs} = ${expr} = ${res}`;

/* Ecuación lineal A·v + Bc = C·v + D → pasos de balance (v = nombre de la incógnita) */
function eqSteps(A, Bc, C, D, v = 'x', o = {}) {
  const t = (c, s) => poly([[c, s]]); const side = (a, b) => poly([[a, v], [b, '']]);
  const st = [];
  if (!o.noStart) st.push(`Ecuación: <b>${side(A, Bc)} = ${side(C, D)}</b>. Queremos dejar sola a ${v}. ${BAL}`);
  let a = A, b = Bc, c = C, d = D;
  if (c !== 0) {
    const op = c > 0 ? 'restamos' : 'sumamos', T = t(Math.abs(c), v);
    st.push(`Hay términos con ${v} en los dos lados. Para quitar ${t(c, v)} del lado derecho aplicamos su operación contraria: <b>${op} ${T} en ambos lados</b>.<br>${side(a, b)} ${c > 0 ? '−' : '+'} ${T} = ${side(c, d)} ${c > 0 ? '−' : '+'} ${T} &nbsp;→&nbsp; ${side(a - c, b)} = ${fmt(d)}`);
    a -= c; c = 0;
  }
  if (b !== 0) {
    const op = b > 0 ? 'restamos' : 'sumamos', N = fmt(Math.abs(b));
    st.push(`Al término ${t(a, v)} se le ${b > 0 ? 'suma' : 'resta'} ${N}. La operación contraria de ${b > 0 ? 'sumar' : 'restar'} es ${b > 0 ? 'restar' : 'sumar'}: <b>${op} ${N} en ambos lados</b>.<br>${side(a, b)} ${b > 0 ? '−' : '+'} ${N} = ${fmt(d)} ${b > 0 ? '−' : '+'} ${N} &nbsp;→&nbsp; ${t(a, v)} = ${fmt(d - b)}`);
    d -= b; b = 0;

  } else st.push(`${v} ya quedó sola: <b>${v} = ${fmt(d)}</b>`);

bankTopic({ id: 'es_variantes', eje: 'esle', m: 1, title: 'Variantes lingüísticas y diversidad del español',

    p: ['<b>Geográficas:</b> en Tabasco se dice “chanchamito”, en el centro “tamal”; en el Caribe se dice “guagua” y en México “camión”.', '<b>Sociales:</b> dependen de la edad, la profesión o el grupo (lenguaje juvenil, tecnicismos médicos).', '<b>Situacionales o de registro:</b> no hablamos igual con un amigo que en una entrevista de trabajo.', 'La <b>norma estándar</b> es la variante que se enseña en la escuela y se usa en textos formales; sirve para entendernos entre regiones, pero no hace “incorrectas” a las demás.', 'En México se hablan 68 lenguas indígenas con más de 360 variantes.'],

    [3, '¿Cuál es la actitud adecuada ante una variante distinta a la tuya?', 'Respetarla y entender su contexto', ['Corregirla porque es incorrecta', 'Burlarse para que la cambien', 'Evitar hablar con esas personas']],

    [4, '¿Cuál expresión es adecuada para un oficio dirigido al director?', '“Me permito solicitarle su apoyo”', ['“¿Qué onda?, échame la mano”', '“Oiga, pásele el dato al profe”', '“Ahí nos vidrios, jefazo”']],
    [4, 'Un abuelo dice “mercar” en lugar de “comprar”. Es una variante:', 'Por edad o generación', ['Geográfica de otro país', 'Situacional de una entrevista', 'Profesional de los médicos']],
    [5, '¿Por qué discriminar a alguien por su forma de hablar es injusto?', 'Todas las variantes son sistemas válidos', ['Porque nadie habla de forma distinta', 'Porque la norma estándar no existe', 'Porque solo importa la ortografía']],

bankTopic({ id: 'es_gramatica', eje: 'esle', m: 5, title: 'Oraciones compuestas, nexos y puntuación',
  nem: 'Recursos gramaticales para dar coherencia y cohesión a los textos: oraciones compuestas coordinadas y subordinadas, nexos y signos de puntuación.',
  formula: 'Oración simple: un verbo conjugado. Compuesta: dos o más. Coordinadas (mismo nivel): y, ni, o, pero, sino. Subordinadas (una depende de otra): que, porque, cuando, si, aunque. Coma antes de pero; punto y coma entre oraciones largas relacionadas; dos puntos antes de una enumeración o explicación.',
  lesson: lesson({ k: 'Las oraciones compuestas unen ideas. El nexo que elijas dice qué relación hay entre ellas: suma, contraste, causa, condición o tiempo. Elegir bien el nexo hace que el texto se entienda.',
    p: ['<b>Coordinadas:</b> las dos oraciones tienen el mismo nivel. Copulativas (y, ni): suman. Disyuntivas (o): opciones. Adversativas (pero, sino, aunque): contraste.', '<b>Subordinadas:</b> una oración depende de la principal: causales (porque, ya que), condicionales (si), temporales (cuando), concesivas (aunque).', '<b>Coma:</b> separa elementos de una lista y va antes de “pero”. Nunca se pone coma entre sujeto y verbo.', '<b>Punto y coma:</b> separa oraciones relacionadas o elementos de listas que ya llevan comas.'],
    ex: '“Estudié mucho, pero el examen fue difícil” (contraste). “Aprobé porque estudié” (causa). “Si estudias, aprobarás” (condición).',
    er: ['Poner coma entre sujeto y verbo: “Los alumnos de tercero, salieron temprano” es incorrecto.', 'Usar “sino” y “si no” como iguales.'],
    v: 'Para escribir ensayos, reportes y mensajes claros y bien conectados.' }),
  qs: [
    [1, '¿Cuántos verbos conjugados tiene una oración simple?', 'Uno', ['Dos', 'Tres', 'Ninguno']],
    [1, '¿Qué nexo expresa contraste?', 'Pero', ['Y', 'Porque', 'Cuando']],
    [2, 'En “No vino porque estaba enfermo”, “porque” introduce una:', 'Causa', ['Condición', 'Consecuencia', 'Enumeración']],
    [2, '¿Qué signo va antes de una enumeración anunciada?', 'Dos puntos', ['Punto y coma', 'Comillas', 'Guion largo']],
    [3, '¿Cuál oración tiene la coma bien puesta?', 'Quería ir, pero llovió mucho', ['Los alumnos, salieron temprano', 'Mi hermana, estudia química', 'El perro de Ana, ladra mucho']],
    [3, '“Si estudias, aprobarás” es una oración subordinada:', 'Condicional', ['Causal', 'Temporal', 'Copulativa']],
    [4, '¿Cuál es correcta?', 'No es rojo, sino azul', ['No es rojo, si no azul', 'No es rojo sino, azul', 'No es rojo, sí no azul']],
    [4, '“Aunque estaba cansado, terminó la tarea” expresa:', 'Una dificultad que no impide la acción', ['La causa de terminar la tarea', 'Una condición para terminarla', 'El momento en que la terminó']],
    [5, '¿Qué nexo une mejor “El río se desbordó” y “llovió tres días”?', 'Porque', ['Pero', 'Aunque', 'O']],
    [5, '¿Por qué es incorrecto “El director de la escuela, anunció el evento”?', 'Separa con coma el sujeto de su verbo', ['Le falta un punto y coma al final', 'Debe llevar dos puntos después de escuela', 'Debe escribirse todo con mayúsculas']]
  ] });

<h4>Binomios con término común</h4>
<p>(x + 2)(x + 7) = x² + 7x + 2x + 14 = x² + 9x + 14. El coeficiente de x es la <b>suma</b> (2 + 7) y el término independiente es el <b>producto</b> (2 × 7).</p>

<h4>4. Trinomio cuadrado perfecto</h4><p>x² + 10x + 25 = (x + 5)²: el primero y el último son cuadrados (x² y 5²) y el del medio es el doble del producto (2·x·5).</p>

<h4>La propiedad del producto cero</h4>
<p>Si multiplicas dos números y el resultado es 0, al menos uno de ellos tiene que ser 0. Por eso, si logramos escribir la ecuación como (x − 2)(x + 5) = 0, basta con resolver x − 2 = 0 y x + 5 = 0 por separado.</p>
<h4>Pasos</h4><ol><li>Deja la ecuación igualada a cero (todo en un lado, balanceando).</li><li>Factoriza.</li><li>Iguala cada factor a cero y resuelve cada ecuación lineal con operaciones contrarias en ambos lados.</li><li>Comprueba las dos soluciones en la ecuación original.</li></ol>

<p>a, b y c son los coeficientes de la ecuación escrita como ax² + bx + c = 0 (con todo igualado a cero). El símbolo ± indica que hay dos cálculos: uno sumando la raíz y otro restándola.</p>
<h4>El discriminante</h4>
<p>Lo que está dentro de la raíz, <b>Δ = b² − 4ac</b>, decide cuántas soluciones hay: si es positivo, dos; si es cero, una (la raíz vale 0 y el ± no cambia nada); si es negativo, ninguna real, porque ningún número real al cuadrado da negativo.</p>
<div class="ex"><b>Ejemplo resuelto:</b> 2x² − 3x − 2 = 0<ol class="steps"><li>a = 2, b = −3, c = −2.</li><li>Δ = (−3)² − 4(2)(−2) = 9 + 16 = 25; √25 = 5.</li><li>x = (3 ± 5) ÷ 4.</li><li>x₁ = (3 + 5) ÷ 4 = 2; x₂ = (3 − 5) ÷ 4 = −0.5.</li></ol></div>
<div class="warn"><b>Errores comunes</b><ul><li>Olvidar los signos de a, b y c: en x² − 5x + 6 = 0, b = −5 y −b = 5.</li><li>Calcular −b² en lugar de (−b)²: el cuadrado de un número negativo es positivo.</li><li>Dividir solo la raíz entre 2a: se divide todo el numerador.</li></ul></div>
<div class="life"><b>¿Para qué sirve?</b> En ingeniería y física: para saber cuándo un objeto lanzado cae al suelo o qué medidas debe tener una pieza para tener cierta área.</div>`,
  gen(L) {
    const lab = { labels: ['x₁', 'x₂'], anyOrder: true };
    const mk = () => { let a, p, q; do { a = pick([1, 1, 2, 3]); p = RNZ(-6, 6); q = RNZ(-6, 6); } while (p === q); return [a, -a * (p + q), a * p * q, p, q]; };
    if (L === 1) { const a = RNZ(-4, 5), b = RNZ(-9, 9), c = RNZ(-9, 9); const D = b * b - 4 * a * c; return num(`Calcula el discriminante Δ = b<sup>2</sup> − 4ac de ${tri(a, b, c)} = 0`, D, { hint: 'Identifica a, b y c con su signo; luego calcula b² − 4ac con paréntesis.', sol: [`a = ${fmt(a)}, b = ${fmt(b)}, c = ${fmt(c)}`, `Δ = ${P(b)}<sup>2</sup> − 4 · ${P(a)} · ${P(c)} = ${b * b} − ${P(4 * a * c)}`, `Δ = ${B(fmt(D))}`] }); }
    if (L === 2) { const t = pick([2, 1, 0]); let a, b, c; if (t === 2) { const e = mk(); [a, b, c] = e; } else if (t === 1) { const p = RNZ(-6, 6); a = 1; b = -2 * p; c = p * p; } else { a = R(1, 3); b = RNZ(-4, 4); c = R(Math.ceil((b * b) / (4 * a)) + 1, 12); } const D = b * b - 4 * a * c;
      return mc(`¿Cuántas soluciones reales tiene ${tri(a, b, c)} = 0?`, t === 2 ? 'Dos' : t === 1 ? 'Una' : 'Ninguna', ['Dos', 'Una', 'Ninguna', 'Infinitas'], { hint: 'Calcula el discriminante b² − 4ac y fíjate en su signo.', sol: [`Δ = ${P(b)}<sup>2</sup> − 4 · ${P(a)} · ${P(c)} = ${fmt(D)}`, D > 0 ? 'Δ > 0: la raíz existe y es distinta de cero, así que el ± da dos resultados distintos.' : D === 0 ? 'Δ = 0: la raíz vale 0 y el ± da el mismo número: una solución.' : 'Δ < 0: no existe la raíz cuadrada real de un número negativo: no hay soluciones reales.', `Respuesta: ${B(t === 2 ? 'Dos' : t === 1 ? 'Una' : 'Ninguna')}`] }); }
    if (L === 3) { const [a, b, c, p, q] = mk(); const D = b * b - 4 * a * c, sD = Math.sqrt(D);
      return pair(`Resuelve con la fórmula general: ${tri(a, b, c)} = 0`, p, q, Object.assign({ hint: 'x = (−b ± √(b² − 4ac)) ÷ (2a). Calcula primero el discriminante.', sol: [`a = ${fmt(a)}, b = ${fmt(b)}, c = ${fmt(c)}`, `Δ = ${P(b)}<sup>2</sup> − 4·${P(a)}·${P(c)} = ${D}; √${D} = ${fmt(sD)}`, `x = ${frS(`${fmt(-b)} ± ${fmt(sD)}`, `2·${a}`)}`, `x₁ = ${frS(fmt(-b + sD), fmt(2 * a))} = ${fmt(rnd((-b + sD) / (2 * a), 6))}; x₂ = ${frS(fmt(-b - sD), fmt(2 * a))} = ${fmt(rnd((-b - sD) / (2 * a), 6))}`] }, lab)); }

    let p, q; do { p = RNZ(-6, 6); q = RNZ(-6, 6); } while (p === q); const k = RNZ(-4, 4), m = R(1, 5);

  }
});

    if (L === 3) { const k = R(1, 6); return pair(`¿En qué puntos cruza el eje x la parábola y = x<sup>2</sup> − ${k * k}? Escribe los dos valores de x.`, k, -k, { labels: ['x₁', 'x₂'], anyOrder: true, fig: parabSVG({ a: 1, c: -k * k, range: 8 }), hint: 'Cruza el eje x donde y = 0.', sol: [`y = 0 → x<sup>2</sup> − ${k * k} = 0`, `Sumamos ${k * k} en ambos lados: x<sup>2</sup> = ${k * k}`, `Raíz cuadrada en ambos lados: x = ${k} o x = −${k}`] }); }
    if (L === 4) { const a = -R(1, 3), h = R(-3, 3), k = R(2, 9); const b = -2 * a * h, c = a * h * h + k;
      return num(`La altura de un proyectil es y = ${tri(a, b, c)}. ¿Cuál es la altura máxima?`, k, { hint: 'Como a < 0, la parábola abre hacia abajo y el vértice es el máximo. Usa x = −b/(2a).', sol: [`a = ${a} < 0: abre hacia abajo; el vértice es el punto más alto.`, `x del vértice = ${frS('−b', '2a')} = ${frS(fmt(-b), fmt(2 * a))} = ${h}`, `y = ${a}·${P(h)}<sup>2</sup> ${b < 0 ? '−' : '+'} ${Math.abs(b)}·${P(h)} ${c < 0 ? '−' : '+'} ${Math.abs(c)} = ${k}`, `Altura máxima: ${B(k)}`] }); }
    const h = RNZ(-4, 4), k = R(-6, 4); const b = -2 * h, c = h * h + k;
    return pair(`Encuentra el vértice de y = ${tri(1, b, c)}.`, h, k, Object.assign({ hint: 'La x del vértice es −b/(2a); luego sustituye para obtener y.', sol: [`a = 1, b = ${fmt(b)}: x = ${frS('−b', '2a')} = ${frS(fmt(-b), '2')} = ${h}`, `y = ${P(h)}<sup>2</sup> ${b < 0 ? '−' : '+'} ${Math.abs(b)}·${P(h)} ${c < 0 ? '−' : '+'} ${Math.abs(c)} = ${k}`, `Vértice: ${B(`(${h}, ${k})`)}`] }, lab));
  }
});

TOPICS.push({
  id: 'algareas', eje: 'alg', title: 'Áreas y volúmenes con expresiones algebraicas',
  nem: 'Representa algebraicamente áreas y volúmenes de cuerpos geométricos y calcula el valor de una variable en función de las otras.',
  formula: 'Rectángulo A = b·h · Triángulo A = b·h/2 · Prisma V = A<sub>base</sub>·h · Cilindro V = π r² h · Para calcular una variable en función de las otras, se despeja balanceando la fórmula.',
  lesson: `
<h4>Idea clave</h4>
<p>Una fórmula es una igualdad entre cantidades. Si conocemos todas menos una, podemos encontrar la que falta <b>despejándola</b>: aplicando la operación contraria en ambos lados hasta dejarla sola.</p>
<div class="ex"><b>Ejemplo 1 (expresión):</b> Un rectángulo mide x de ancho y x + 4 de largo. Su área es x(x + 4) = x² + 4x y su perímetro es 2x + 2(x + 4) = 4x + 8.</div>
<div class="ex"><b>Ejemplo 2 (despeje):</b> De A = ${frS('b · h', '2')}, obtener h.<ol class="steps"><li>b · h está dividido entre 2: multiplicamos ambos lados por 2 → 2A = b · h.</li><li>h está multiplicada por b: dividimos ambos lados entre b → h = ${frS('2A', 'b')}.</li></ol></div>
<div class="warn"><b>Errores comunes</b><ul><li>Quitar un número de un solo lado de la fórmula.</li><li>En π r² h, despejar r y olvidar sacar la raíz cuadrada al final.</li></ul></div>
<div class="life"><b>¿Para qué sirve?</b> Para saber qué altura debe tener un tinaco para guardar cierto volumen, o cuánto material se necesita para una caja.</div>`,

    if (L === 2) { const d = R(1, 8), x = R(2, 12); return num(`Un rectángulo mide x de ancho y (2x + ${d}) de largo. Si x = ${x} cm, ¿cuál es su perímetro?`, 2 * x + 2 * (2 * x + d), { unit: 'cm', hint: 'Perímetro = 2·ancho + 2·largo. Primero escribe la expresión y después sustituye.', sol: [`P = 2x + 2(2x + ${d}) = ${poly([[6, 'x'], [2 * d, '']])}`, `Sustituimos x = ${x}: 6·${x} + ${2 * d} = ${B(6 * x + 2 * d + ' cm')}`] }); }
    if (L === 3) { const l = R(2, 12), a = R(2, 10), h = R(2, 15); return num(`Una caja (prisma rectangular) tiene un volumen de ${l * a * h} cm³, ${l} cm de largo y ${a} cm de ancho. ¿Cuál es su altura?`, h, { unit: 'cm', hint: 'V = largo · ancho · altura. La altura está multiplicada por largo · ancho: divide ambos lados entre ese producto.', sol: despMul('V', ['l', 'a', 'h'], 'h').concat([sust('h', frS(`${l * a * h} cm³`, `${l} cm × ${a} cm`) + ` = ${frS(`${l * a * h} cm³`, `${l * a} cm²`)}`, B(h + ' cm'))]) }); }
    if (L === 4) { const b = R(3, 14), h = R(2, 16), A = b * h / 2; return num(`Un triángulo tiene ${fmt(A)} cm² de área y ${b} cm de base. ¿Cuál es su altura?`, h, { unit: 'cm', hint: 'A = b·h/2. Multiplica ambos lados por 2 y después divide ambos lados entre b.', sol: [`Partimos de <b>A = ${frS('b · h', '2')}</b> y queremos h sola.`, `b · h está dividido entre 2: <b>multiplicamos ambos lados por 2</b> → 2A = b · h`, `h está multiplicada por b: <b>dividimos ambos lados entre b</b> → h = ${frS('2A', 'b')}`, sust('h', frS(`2 × ${fmt(A)} cm²`, `${b} cm`), B(h + ' cm'))] }); }
    const r = R(2, 9), h = R(3, 20), V = rnd(PI * r * r * h, 2);
    return num(`Un tinaco cilíndrico tiene ${fmt(V)} cm³ de volumen y ${h} cm de altura. ¿Cuánto mide su radio? (π ≈ 3.14)`, r, { unit: 'cm', tol: 0.02, hint: 'V = π r² h. Divide ambos lados entre π h y después saca raíz cuadrada en ambos lados.', sol: [`Partimos de <b>V = π · r<sup>2</sup> · h</b>.`, `r<sup>2</sup> está multiplicada por π · h: <b>dividimos ambos lados entre π · h</b> → r<sup>2</sup> = ${frS('V', 'π · h')}`, `r está al cuadrado: <b>raíz cuadrada en ambos lados</b> → r = √(${frS('V', 'π · h')})`, sust('r', `√(${frS(`${fmt(V)} cm³`, `3.14 × ${h} cm`)}) = √${fmt(rnd(V / (PI * h), 3))} cm²`, B(r + ' cm'))] });
  }
});

TOPICS.push({
  id: 'reparto3', eje: 'fun', title: 'Reparto proporcional',
  nem: 'Explora diversos procedimientos para resolver problemas de reparto proporcional (directo e inverso).',
  formula: 'Reparto directo: cada parte = (total ÷ suma de las cantidades) × cantidad de cada quien. Reparto inverso: se reparte proporcionalmente a los recíprocos (1/a).',
  lesson: `
<h4>Idea clave</h4>
<p>Repartir proporcionalmente es justo porque a cada unidad aportada le toca lo mismo. Primero se calcula <b>cuánto le toca a cada unidad</b> (la constante) y después se multiplica por las unidades de cada quien. Es análisis dimensional: si a cada hora trabajada le tocan $150, a 12 h les tocan ${frS('$150', '1 h')} × 12 h = $1 800.</p>
<div class="ex"><b>Ejemplo:</b> Tres amigos aportaron $200, $300 y $500 y ganaron $3 000.<ol class="steps"><li>Total aportado: $1 000. A cada peso aportado le toca 3 000 ÷ 1 000 = $3.</li><li>Partes: 200 × 3 = $600; 300 × 3 = $900; 500 × 3 = $1 500.</li><li>Comprobación: 600 + 900 + 1 500 = $3 000 ✔</li></ol></div>
<p><b>Reparto en razón a:b:c</b> (por ejemplo 2:3:5): se reparte en 2 + 3 + 5 = 10 partes iguales y cada quien toma las que le corresponden.</p>
<p><b>Reparto inverso:</b> quien tiene más del criterio (faltas, días de ausencia) recibe menos. Se reparte proporcionalmente a 1/a.</p>
<div class="warn"><b>Errores comunes</b><ul><li>Repartir en partes iguales cuando las aportaciones son distintas.</li><li>No comprobar que la suma de las partes sea el total.</li></ul></div>`,
  gen(L) {
    if (L === 1) { const a = R(1, 9) * 100, b = R(1, 9) * 100, k = R(2, 6); const T = (a + b) * k; return num(`Ana aportó $${fmt(a)} y Luis $${fmt(b)} para un negocio. Ganaron $${fmt(T)} y lo reparten proporcionalmente a lo aportado. ¿Cuánto le toca a Ana?`, a * k, { unit: 'pesos', hint: 'Calcula cuánto le toca a cada peso aportado.', sol: [`Total aportado: ${fmt(a)} + ${fmt(b)} = $${fmt(a + b)}`, `A cada peso aportado le toca ${fmt(T)} ÷ ${fmt(a + b)} = $${k}`, `Ana: ${frS('$' + k, '$1 aportado')} × $${fmt(a)} = ${B(money(a * k))}`] }); }
    if (L === 2 || L === 4) { const r = [R(1, 6), R(1, 6), R(1, 6)], u = R(2, 30) * 10, T = (r[0] + r[1] + r[2]) * u, i = R(0, 2), nm = ['Sofía', 'Diego', 'Elena'];
      return num(`Se reparten $${fmt(T)} entre ${nm.join(', ')} en razón ${r.join(':')}. ¿Cuánto recibe ${nm[i]}?`, r[i] * u, { unit: 'pesos', hint: `Suma las partes de la razón (${r.join(' + ')}) y calcula cuánto vale cada parte.`, sol: [`Total de partes: ${r.join(' + ')} = ${r[0] + r[1] + r[2]}`, `Cada parte vale ${fmt(T)} ÷ ${r[0] + r[1] + r[2]} = $${fmt(u)}`, `${nm[i]} recibe ${r[i]} partes: ${r[i]} × $${fmt(u)} = ${B(money(r[i] * u))}`, `Comprobación: ${r.map(x => fmt(x * u)).join(' + ')} = ${fmt(T)} ✔`] }); }
    if (L === 3) { const f1 = 1, f2 = pick([2, 3, 4]); const T = (f2 + f1) * R(1, 9) * 100; const p1 = T * f2 / (f1 + f2);
      return num(`Se reparte un premio de $${fmt(T)} entre dos alumnos en forma <b>inversamente</b> proporcional a sus faltas: Carla tuvo ${f1} falta y Raúl ${f2}. ¿Cuánto recibe Carla?`, p1, { unit: 'pesos', hint: 'Reparte proporcionalmente a 1/faltas: quien faltó menos recibe más.', sol: [`Recíprocos: Carla 1/${f1} = 1, Raúl 1/${f2}`, `Para tener enteros multiplicamos los dos por ${f2}: Carla ${f2} partes, Raúl ${f1} parte`, `Cada parte: ${fmt(T)} ÷ ${f1 + f2} = $${fmt(T / (f1 + f2))}`, `Carla: ${f2} × $${fmt(T / (f1 + f2))} = ${B(money(p1))}`] }); }
    const h = [R(4, 12), R(4, 12), R(4, 12)], k = R(5, 20) * 10, T = (h[0] + h[1] + h[2]) * k;
    return num(`Tres hermanos trabajaron ${h[0]}, ${h[1]} y ${h[2]} horas para pintar una barda y les pagaron $${fmt(T)} en total. Si se reparte según las horas, ¿cuánto recibe el que trabajó ${h[2]} horas?`, h[2] * k, { unit: 'pesos', hint: 'Calcula el pago por hora y multiplícalo por las horas trabajadas (análisis dimensional).', sol: [`Horas totales: ${h.join(' + ')} = ${h[0] + h[1] + h[2]} h`, `Pago por hora: ${frS('$' + fmt(T), (h[0] + h[1] + h[2]) + ' h')} = $${k} por hora`, `${frS('$' + k, '1 ' + UCX('h'))} × ${h[2]} ${UCX('h')} = ${B(money(h[2] * k))}`] });
  }
});

/* ===== MATEMÁTICAS 3.° — Geometría, medida, estadística y probabilidad ===== */
const PTOL = 0.006; // probabilidades: fracción exacta o decimal con 2 cifras
const frac = (n, d) => fr(n, d);
const TRIPLES = [[3, 4, 5], [5, 12, 13], [8, 15, 17], [7, 24, 25], [6, 8, 10], [9, 12, 15], [12, 16, 20], [20, 21, 29], [9, 40, 41], [15, 20, 25]];

TOPICS.push({
  id: 'congsem', eje: 'geo', title: 'Congruencia y semejanza de triángulos',
  nem: 'Aplica las propiedades de la congruencia y semejanza de triángulos al construir y resolver problemas.',
  formula: 'Congruencia: LLL, LAL, ALA. Semejanza: ángulos iguales (AA) o lados proporcionales. Razón de semejanza k = lado de la copia ÷ lado correspondiente del original; perímetros × k; áreas × k².',
  lesson: `
<h4>Idea clave</h4>
<p>Dos triángulos son <b>congruentes</b> si son idénticos (misma forma y mismo tamaño). Son <b>semejantes</b> si tienen la misma forma aunque distinto tamaño: uno es una ampliación o reducción del otro.</p>
<h4>Criterios de congruencia</h4><ul><li><b>LLL:</b> tres lados iguales.</li><li><b>LAL:</b> dos lados y el ángulo entre ellos.</li><li><b>ALA:</b> dos ángulos y el lado entre ellos.</li></ul>
<h4>Semejanza</h4><p>En triángulos semejantes los ángulos correspondientes son iguales y los lados correspondientes son <b>proporcionales</b>: todos se multiplican por el mismo número k (razón de semejanza). Basta con que dos ángulos sean iguales (AA), porque el tercero es lo que falta para 180°.</p>
<div class="ex"><b>Ejemplo:</b> Un triángulo de lados 3, 4 y 5 cm se amplía y el lado de 3 cm queda de 6 cm. k = 6 ÷ 3 = 2. Los otros lados: 4 × 2 = 8 cm y 5 × 2 = 10 cm. El perímetro se duplica (12 → 24 cm) y el área se multiplica por 4 (6 → 24 cm²).</div>
<div class="warn"><b>Errores comunes</b><ul><li>Comparar lados que no se corresponden: ordena los lados de menor a mayor en los dos triángulos.</li><li>Pensar que el área también se multiplica por k: se multiplica por k².</li></ul></div>
<div class="life"><b>¿Para qué sirve?</b> Para hacer planos y maquetas a escala, ampliar fotos sin deformarlas y medir alturas inaccesibles.</div>`,
  gen(L) {
    if (L === 1) { const cs = [['Se conocen los tres lados de ambos triángulos y son iguales.', 'LLL'], ['Se conocen dos lados iguales y el ángulo comprendido entre ellos.', 'LAL'], ['Se conocen dos ángulos iguales y el lado comprendido entre ellos.', 'ALA']]; const c = pick(cs);
      return mc(`¿Qué criterio asegura que dos triángulos son congruentes? ${c[0]}`, c[1], ['LLL', 'LAL', 'ALA', 'AAA'], { hint: 'L = lado, A = ángulo; el orden indica qué está entre qué.', sol: [`Los datos corresponden a ${c[1]}.`, 'AAA no es criterio de congruencia: con los mismos ángulos puede haber triángulos de distinto tamaño.', `Respuesta: ${B(c[1])}`] }); }
    if (L === 2 || L === 3) { const t = pick(TRIPLES.slice(0, 5)), k = L === 2 ? R(2, 4) : pick([1.5, 2.5, 3, 0.5]); const i = R(0, 2), j = (i + 1) % 3;
      return num(`Dos triángulos son semejantes. El original mide ${t.join(', ')} cm. En la copia, el lado que corresponde al de ${t[i]} cm mide ${fmt(t[i] * k)} cm. ¿Cuánto mide en la copia el lado que corresponde al de ${t[j]} cm?`, rnd(t[j] * k, 4), { unit: 'cm', hint: 'Calcula la razón de semejanza k dividiendo los lados correspondientes que conoces.', sol: [`k = ${frS(fmt(t[i] * k) + ' cm', t[i] + ' cm')} = ${fmt(k)}`, `Todos los lados de la copia son ${fmt(k)} veces los del original.`, `${t[j]} cm × ${fmt(k)} = ${B(fmt(rnd(t[j] * k, 4)) + ' cm')}`] }); }
    if (L === 4) { const k = R(2, 5), A = R(3, 20) * 2; return num(`Un triángulo tiene ${A} cm² de área. Se amplía con razón de semejanza ${k}. ¿Cuál es el área de la ampliación?`, A * k * k, { unit: 'cm²', hint: 'Base y altura se multiplican por k, así que el área se multiplica por k · k.', errs: [{ v: A * k, m: 'Multiplicaste solo por k; el área depende de dos medidas, cada una multiplicada por k.' }], sol: [`Base y altura se multiplican por ${k}.`, `Área nueva = ${frS(`(${k}b)(${k}h)`, '2')} = ${k}<sup>2</sup> × ${frS('b·h', '2')}`, `${A} cm² × ${k * k} = ${B(A * k * k + ' cm²')}`] }); }
    const t = [R(2, 9), R(2, 9), R(2, 9)].sort((a, b) => a - b); const k = R(2, 3); const yes = Math.random() < 0.5; const u = yes ? t.map(x => x * k) : [t[0] * k, t[1] * k, t[2] * k + 1];
    return mc(`¿Son semejantes un triángulo de lados ${t.join(', ')} cm y otro de lados ${u.join(', ')} cm?`, yes ? `Sí, todos los lados se multiplican por ${k}` : 'No, las razones entre lados no son iguales', [`Sí, todos los lados se multiplican por ${k}`, 'No, las razones entre lados no son iguales', 'Sí, porque los dos son triángulos', 'No se puede saber sin medir los ángulos'], { hint: 'Divide cada lado del segundo entre el lado correspondiente del primero (ordenados de menor a mayor).', sol: [`Razones: ${u.map((x, i) => `${x}/${t[i]} = ${fmt(rnd(x / t[i], 3))}`).join('; ')}`, yes ? 'Todas son iguales: los lados son proporcionales → semejantes.' : 'No son todas iguales → no son semejantes.'] });
  }
});

TOPICS.push({
  id: 'tales', eje: 'geo', title: 'Semejanza aplicada: Tales, sombras y escalas',
  nem: 'Resuelve problemas que implican la aplicación de la congruencia y semejanza de triángulos.',
  formula: 'Rectas paralelas cortadas por dos secantes forman segmentos proporcionales (Tales). Sombras a la misma hora: altura₁/sombra₁ = altura₂/sombra₂. Escala 1:n → 1 cm del plano = n cm reales.',
  lesson: `
<h4>Idea clave</h4>
<p>A la misma hora, los rayos del sol llegan con la misma inclinación a todos los objetos. Un poste y su sombra forman un triángulo rectángulo semejante al que forman tú y tu sombra. Por eso la razón <b>altura ÷ sombra</b> es la misma para los dos.</p>
<div class="ex"><b>Ejemplo:</b> Mides 1.5 m y tu sombra mide 2 m. La sombra de un árbol mide 12 m. Cada metro de sombra corresponde a 1.5 ÷ 2 = 0.75 m de altura. Árbol: ${frS('0.75 m de altura', '1 m de sombra')} × 12 m de sombra = 9 m.</div>
<p><b>Teorema de Tales:</b> si varias rectas paralelas cortan a dos rectas, los segmentos que se forman en una son proporcionales a los de la otra.</p>
<p><b>Escalas:</b> en un mapa 1:50 000, 1 cm del mapa representa 50 000 cm reales. Para convertir, usa análisis dimensional.</p>
<div class="warn"><b>Errores comunes</b><ul><li>Dividir sombra entre altura en un caso y altura entre sombra en el otro.</li><li>Olvidar convertir unidades en las escalas.</li></ul></div>
<div class="life"><b>¿Para qué sirve?</b> Tales midió así la altura de las pirámides de Egipto. Hoy se usa en topografía, mapas y planos de construcción.</div>`,
  gen(L) {
    if (L === 1) { const hp = pick([1.5, 1.6, 1.8, 2]), sp = pick([1, 2, 2.5, 3, 4]), sa = R(4, 20); const h = rnd(hp * sa / sp, 4);
      return num(`A la misma hora, una persona de ${fmt(hp)} m proyecta una sombra de ${fmt(sp)} m y un árbol una sombra de ${sa} m. ¿Cuánto mide el árbol?`, h, { unit: 'm', tol: 0.011, hint: 'La razón altura ÷ sombra es la misma para los dos.', sol: [`Triángulos semejantes: ${frS('altura árbol', 'sombra árbol')} = ${frS(fmt(hp) + ' m', fmt(sp) + ' m')}`, `Altura por cada metro de sombra: ${fmt(hp)} ÷ ${fmt(sp)} = ${fmt(rnd(hp / sp, 4))}`, `Árbol: ${fmt(rnd(hp / sp, 4))} × ${sa} = ${B(fmt(h) + ' m')}`] }); }
    if (L === 2) { const a = R(2, 9), b = R(2, 9), k = pick([1.5, 2, 2.5, 3]); return num(`Tres rectas paralelas cortan a dos rectas. En la primera se forman segmentos de ${a} cm y ${b} cm. En la segunda, el segmento que corresponde al de ${a} cm mide ${fmt(a * k)} cm. ¿Cuánto mide el que corresponde al de ${b} cm?`, rnd(b * k, 4), { unit: 'cm', hint: 'Por Tales, los segmentos son proporcionales: calcula cuántas veces creció el primero.', sol: [`Razón: ${fmt(a * k)} ÷ ${a} = ${fmt(k)}`, `${b} × ${fmt(k)} = ${B(fmt(rnd(b * k, 4)) + ' cm')}`] }); }
    if (L === 3) { const n = pick([25000, 50000, 100000, 200000]), cm = R(2, 15); const km = cm * n / 100000;
      return num(`En un mapa a escala 1:${fmt(n)}, dos pueblos están a ${cm} cm. ¿Cuál es la distancia real en km?`, km, { unit: 'km', hint: 'Cada cm del mapa son ' + fmt(n) + ' cm reales; después convierte cm a km con análisis dimensional.', sol: [`Distancia real en cm: ${cm} cm de mapa × ${frS(fmt(n) + ' cm reales', '1 cm de mapa')} = ${fmt(cm * n)} cm`].concat(dimAnalysis({ v: cm * n, n: ['cm'] }, [{ n: [1, 'm'], d: [100, 'cm'] }, { n: [1, 'km'], d: [1000, 'm'] }]).steps.slice(1)) }); }

TOPICS.push({

TOPICS.push({
  id: 'trigo', eje: 'geo', title: 'Razones trigonométricas',

  lesson: `
<h4>Idea clave</h4>
<p>Todos los triángulos rectángulos con el mismo ángulo agudo θ son <b>semejantes</b>. Por eso la razón entre dos de sus lados no depende del tamaño del triángulo, solo del ángulo. A esas razones les damos nombre:</p>
<ul><li><b>sen θ</b> = cateto opuesto ÷ hipotenusa</li><li><b>cos θ</b> = cateto adyacente ÷ hipotenusa</li><li><b>tan θ</b> = cateto opuesto ÷ cateto adyacente</li></ul>
<p>El cateto <b>opuesto</b> está enfrente del ángulo; el <b>adyacente</b> lo forma junto con la hipotenusa.</p>
<div class="ex"><b>Ejemplo resuelto:</b> Desde 20 m de un edificio se ve su azotea con un ángulo de 35°. ¿Qué altura tiene?<ol class="steps"><li>Conocemos el adyacente (20 m) y buscamos el opuesto (h): usamos la tangente.</li><li>tan 35° = h ÷ 20.</li><li>h está dividida entre 20: multiplicamos ambos lados por 20 → h = 20 · tan 35° ≈ 20 × 0.700 = 14 m.</li></ol></div>
<div class="warn"><b>Errores comunes</b><ul><li>Confundir el opuesto con el adyacente: depende del ángulo que se use.</li><li>Tener la calculadora en radianes: debe estar en grados (DEG).</li></ul></div>
<div class="life"><b>¿Para qué sirve?</b> Para calcular alturas, la inclinación de rampas y techos, la navegación y la topografía.</div>`,
  gen(L) {
    const t = pick(TRIPLES.slice(0, 5));
    if (L === 1) { const r = pick([['sen θ', `${t[0]}/${t[2]}`], ['cos θ', `${t[1]}/${t[2]}`], ['tan θ', `${t[0]}/${t[1]}`]]);
      return mc(`En el triángulo, ¿cuánto vale ${r[0]}? (θ es el ángulo marcado)`, r[1], [`${t[0]}/${t[2]}`, `${t[1]}/${t[2]}`, `${t[0]}/${t[1]}`, `${t[1]}/${t[0]}`, `${t[2]}/${t[0]}`], { fig: rightTriSVG({ a: t[0], b: t[1], c: t[2], ang: 'θ' }), hint: 'Opuesto: enfrente de θ. Adyacente: junto a θ (no es la hipotenusa).', sol: [`Opuesto a θ: ${t[0]}; adyacente: ${t[1]}; hipotenusa: ${t[2]}`, `${r[0]} = ${r[0] === 'sen θ' ? 'opuesto/hipotenusa' : r[0] === 'cos θ' ? 'adyacente/hipotenusa' : 'opuesto/adyacente'} = ${B(r[1])}`] }); }
    if (L === 2) { const which = pick(['sen', 'cos', 'tan']); const v = which === 'sen' ? t[0] / t[2] : which === 'cos' ? t[1] / t[2] : t[0] / t[1];
      return num(`Con el triángulo de la figura, calcula ${which} θ (como fracción o decimal con dos cifras).`, rnd(v, 6), { tol: PTOL, fig: rightTriSVG({ a: t[0], b: t[1], c: t[2], ang: 'θ' }), hint: 'Identifica opuesto, adyacente e hipotenusa respecto de θ.', sol: [`${which} θ = ${which === 'sen' ? `${t[0]}/${t[2]}` : which === 'cos' ? `${t[1]}/${t[2]}` : `${t[0]}/${t[1]}`} = ${B(fmt(rnd(v, 3)))}`] }); }
    const ang = pick([20, 25, 30, 35, 40, 45, 50, 55, 60]), rad = ang * Math.PI / 180;

TOPICS.push({
  id: 'dispersion', eje: 'dat', title: 'Tendencia central y dispersión',
  nem: 'Determina y compara las medidas de tendencia central (media, mediana y moda) y de dispersión (rango y desviación media) de dos conjuntos de datos para tomar decisiones.',
  formula: 'Media = suma ÷ número de datos · Mediana = dato central ordenado · Moda = el más frecuente · Rango = mayor − menor · Desviación media = promedio de las distancias de cada dato a la media.',
  lesson: `
<h4>Idea clave</h4>
<p>Las medidas de <b>tendencia central</b> dicen alrededor de qué valor están los datos. Las de <b>dispersión</b> dicen qué tan separados están. Dos grupos pueden tener la misma media y ser muy distintos.</p>
<h4>Desviación media</h4><p>Mide, en promedio, qué tan lejos está cada dato de la media:</p><ol><li>Calcula la media.</li><li>Calcula la distancia de cada dato a la media (sin signo).</li><li>Promedia esas distancias.</li></ol>
<div class="ex"><b>Ejemplo:</b> 4, 6, 8, 10, 12 → media 8. Distancias: 4, 2, 0, 2, 4 → suman 12 → desviación media = 12 ÷ 5 = 2.4.</div>
<p>Un jugador con calificaciones 8, 8, 8 y otro con 6, 8, 10 tienen la misma media (8), pero el primero es más <b>constante</b> (desviación media 0 contra 1.33).</p>
<div class="warn"><b>Errores comunes</b><ul><li>Calcular la mediana sin ordenar los datos.</li><li>Sumar distancias con signo: positivas y negativas se cancelan y siempre da 0.</li></ul></div>
<div class="life"><b>¿Para qué sirve?</b> Para elegir al jugador más constante, comparar precios, tiempos de entrega o el rendimiento de dos grupos.</div>`,
  gen(L) {
    const n = R(5, 7); let d; do { d = Array.from({ length: n }, () => R(2, 20)); } while (false);
    if (L === 1) { const k = R(5, 7), base = Array.from({ length: k - 1 }, () => R(2, 20)); const s = base.reduce((a, b) => a + b, 0); const last = k * Math.ceil((s + 2) / k) - s; const D = base.concat([last]); const m = D.reduce((a, b) => a + b, 0) / k;
      return num(`Calcula la media de: ${D.join(', ')}`, m, { hint: 'Suma todos los datos y divide entre cuántos son.', sol: [`Suma: ${D.join(' + ')} = ${D.reduce((a, b) => a + b, 0)}`, `Media = ${D.reduce((a, b) => a + b, 0)} ÷ ${k} = ${B(fmt(m))}`] }); }
    if (L === 2) { const o = d.slice().sort((a, b) => a - b); const med = n % 2 ? o[(n - 1) / 2] : (o[n / 2 - 1] + o[n / 2]) / 2; return num(`Calcula la mediana de: ${d.join(', ')}`, med, { hint: 'Primero ordena los datos de menor a mayor.', sol: [`Ordenados: ${o.join(', ')}`, n % 2 ? `Son ${n} datos: el central es el ${(n + 1) / 2}.º → ${B(med)}` : `Son ${n} datos: los centrales son ${o[n / 2 - 1]} y ${o[n / 2]} → promedio ${B(fmt(med))}`] }); }
    if (L === 3) return num(`Calcula el rango de: ${d.join(', ')}`, Math.max(...d) - Math.min(...d), { hint: 'Rango = dato mayor − dato menor.', sol: [`Mayor: ${Math.max(...d)}; menor: ${Math.min(...d)}`, `Rango = ${B(Math.max(...d) - Math.min(...d))}`] });
    if (L === 4) { const k = 5, m = R(6, 15), dev = [R(0, 5), R(0, 5)]; const D = [m - dev[0], m + dev[0], m - dev[1], m + dev[1], m]; const sh = shuffle(D); const dm = sh.reduce((a, x) => a + Math.abs(x - m), 0) / k;
      return num(`Calcula la desviación media de: ${sh.join(', ')}`, rnd(dm, 2), { tol: 0.011, hint: 'Media → distancia de cada dato a la media (sin signo) → promedio de las distancias.', sol: [`Media: ${D.reduce((a, b) => a + b, 0)} ÷ 5 = ${m}`, `Distancias a la media: ${sh.map(x => Math.abs(x - m)).join(', ')}`, `Suma: ${sh.reduce((a, x) => a + Math.abs(x - m), 0)}; desviación media = ${sh.reduce((a, x) => a + Math.abs(x - m), 0)} ÷ 5 = ${B(fmt(rnd(dm, 2)))}`] }); }
    const m = R(7, 9); const A = [m, m, m - 1, m + 1, m], Bv = [m - 3, m + 3, m - 2, m + 2, m]; const dA = A.reduce((a, x) => a + Math.abs(x - m), 0) / 5, dB = Bv.reduce((a, x) => a + Math.abs(x - m), 0) / 5;
    return mc(`Dos jugadores anotaron estos puntos en 5 partidos. Ana: ${shuffle(A).join(', ')}. Bruno: ${shuffle(Bv).join(', ')}. Los dos tienen media ${m}. ¿Quién es más constante?`, 'Ana, porque su desviación media es menor', ['Ana, porque su desviación media es menor', 'Bruno, porque su desviación media es mayor', 'Son igual de constantes porque tienen la misma media', 'Bruno, porque anotó el puntaje más alto'], { hint: 'Ser constante es variar poco: compara la dispersión, no la media.', sol: [`Desviación media de Ana: ${fmt(dA)}; de Bruno: ${fmt(dB)}`, 'Menor dispersión = puntos más parecidos entre sí → más constante: Ana.'] });
  }

TOPICS.push({

  formula: 'Principio multiplicativo: si una cosa se hace de m formas y otra de n formas, juntas se hacen de m × n formas. Probabilidad clásica: P = casos favorables ÷ casos posibles (si son equiprobables).',
  lesson: `
<h4>Idea clave</h4>
<p>El <b>espacio muestral</b> es la lista de todos los resultados posibles. Para contarlos sin escribirlos todos se usa el <b>principio multiplicativo</b>: con 3 camisas y 4 pantalones hay 3 × 4 = 12 combinaciones, porque cada camisa se combina con los 4 pantalones.</p>
<p>Un <b>diagrama de árbol</b> muestra ese conteo: cada rama es una elección y cada camino completo es un resultado.</p>
<div class="ex"><b>Ejemplo:</b> Al lanzar dos dados hay 6 × 6 = 36 resultados igual de probables. La suma 7 sale con (1,6), (2,5), (3,4), (4,3), (5,2), (6,1): 6 casos. P(suma 7) = 6/36 = 1/6.</div>
<div class="warn"><b>Errores comunes</b><ul><li>Contar (2,5) y (5,2) como un solo caso: con dos dados son resultados distintos.</li><li>Sumar en lugar de multiplicar las opciones de cada etapa.</li></ul></div>
<div class="life"><b>¿Para qué sirve?</b> Para saber cuántas contraseñas o placas se pueden formar, cuántos menús posibles hay o qué tan probable es un resultado en un juego.</div>`,
  gen(L) {
    if (L === 1) { const a = R(2, 6), b = R(2, 6), c = R(2, 4); return num(`Una cafetería ofrece ${a} tipos de pan, ${b} bebidas y ${c} postres. Si un desayuno lleva uno de cada uno, ¿cuántos desayunos distintos hay?`, a * b * c, { hint: 'Principio multiplicativo: multiplica las opciones de cada elección.', sol: [`Cada pan se combina con ${b} bebidas: ${a} × ${b} = ${a * b}`, `Cada una de esas combinaciones con ${c} postres: ${a * b} × ${c} = ${B(a * b * c)}`] }); }
    if (L === 2) { const c = pick([['lanzar una moneda y un dado', 12, '2 × 6'], ['lanzar tres monedas', 8, '2 × 2 × 2'], ['lanzar dos dados', 36, '6 × 6'], ['lanzar dos monedas y un dado', 24, '2 × 2 × 6']]); return num(`¿Cuántos resultados tiene el espacio muestral de ${c[0]}?`, c[1], { hint: 'Multiplica los resultados posibles de cada objeto.', sol: [`${c[2]} = ${B(c[1])}`] }); }
    if (L === 3) { const s = R(2, 12), f = 6 - Math.abs(7 - s); return num(`Se lanzan dos dados. ¿Cuál es la probabilidad de que la suma sea ${s}? (fracción o decimal con dos cifras)`, f / 36, { tol: PTOL, hint: 'Hay 36 resultados posibles. Cuenta las parejas que suman ' + s + '.', sol: [`Parejas que suman ${s}: ${[1, 2, 3, 4, 5, 6].filter(a => s - a >= 1 && s - a <= 6).map(a => `(${a},${s - a})`).join(', ')} → ${f} casos`, `P = ${frS(f, 36)} = ${B(fr(f, 36))}`] }); }
    if (L === 4) { const l = R(2, 3), d = R(2, 4); return num(`Una contraseña tiene ${l} letras (de 26) seguidas de ${d} dígitos (0 a 9), y se pueden repetir. ¿Cuántas contraseñas distintas hay?`, 26 ** l * 10 ** d, { hint: 'Cada posición se elige independientemente: multiplica las opciones de todas las posiciones.', sol: [`Letras: ${Array(l).fill(26).join(' × ')} = ${fmt(26 ** l)}`, `Dígitos: ${Array(d).fill(10).join(' × ')} = ${fmt(10 ** d)}`, `Total: ${fmt(26 ** l)} × ${fmt(10 ** d)} = ${B(fmt(26 ** l * 10 ** d))}`] }); }
    const k = pick([0, 1, 2, 3]); const f = [1, 3, 3, 1][k];
    return num(`Se lanzan tres monedas. ¿Cuál es la probabilidad de obtener exactamente ${k} sol${k === 1 ? '' : 'es'}?`, f / 8, { tol: PTOL, hint: 'Haz un diagrama de árbol: hay 8 resultados igualmente probables.', sol: ['Espacio muestral: SSS, SSA, SAS, SAA, ASS, ASA, AAS, AAA (8 resultados)', `Con exactamente ${k} sol${k === 1 ? '' : 'es'}: ${f} caso${f === 1 ? '' : 's'}`, `P = ${frS(f, 8)} = ${B(fr(f, 8))}`] });
  }
});

TOPICS.push({
  id: 'reglasuma', eje: 'dat', title: 'Regla de la suma: eventos excluyentes y complementarios',
  nem: 'Resuelve problemas donde se calcule la probabilidad de ocurrencia de dos eventos mutuamente excluyentes y de eventos complementarios (regla de la suma).',
  formula: 'Mutuamente excluyentes (no pueden ocurrir a la vez): P(A o B) = P(A) + P(B). Complemento: P(no A) = 1 − P(A). Si no son excluyentes: P(A o B) = P(A) + P(B) − P(A y B).',
  lesson: `
<h4>Idea clave</h4>
<p>Dos eventos son <b>mutuamente excluyentes</b> si no pueden ocurrir al mismo tiempo (sacar 2 y sacar 5 en un solo dado). Entonces sus casos favorables no se repiten y se pueden sumar: P(2 o 5) = 1/6 + 1/6 = 2/6.</p>
<p>El <b>complemento</b> de A es “que no ocurra A”. Entre los dos cubren todos los casos, así que P(A) + P(no A) = 1. A veces es más fácil calcular el complemento: P(no sacar 6) = 1 − 1/6 = 5/6.</p>
<p>Si los eventos <b>sí</b> pueden ocurrir juntos, al sumar se cuentan dos veces los casos comunes; por eso se resta P(A y B).</p>
<div class="ex"><b>Ejemplo:</b> En un dado, A = par (2, 4, 6) y B = mayor que 3 (4, 5, 6). Comunes: 4 y 6. P(A o B) = 3/6 + 3/6 − 2/6 = 4/6 = 2/3 (casos 2, 4, 5, 6).</div>
<div class="warn"><b>Errores comunes</b><ul><li>Sumar probabilidades de eventos que se traslapan sin restar lo común.</li><li>Obtener una probabilidad mayor que 1: señal segura de un error.</li></ul></div>`,
  gen(L) {
    if (L === 1) { const n = pick([5, 8, 10, 20, 25]), k = R(1, n - 1); return num(`La probabilidad de que llueva mañana es ${fr(k, n)}. ¿Cuál es la probabilidad de que <b>no</b> llueva?`, 1 - k / n, { tol: PTOL, hint: 'Llover y no llover son complementarios: suman 1.', sol: [`P(no llueva) = 1 − ${fr(k, n)} = ${B(fr(n - k, n))}`] }); }
    if (L === 2) { const a = R(1, 6); let b; do { b = R(1, 6); } while (b === a); return num(`Se lanza un dado. ¿Cuál es la probabilidad de obtener ${a} o ${b}?`, 2 / 6, { tol: PTOL, hint: 'No pueden salir los dos a la vez: son mutuamente excluyentes, suma sus probabilidades.', sol: [`P(${a}) = 1/6; P(${b}) = 1/6`, `Excluyentes: P(${a} o ${b}) = 1/6 + 1/6 = ${B('1/3')}`] }); }
    if (L === 3) { const r = R(2, 8), a = R(2, 8), v = R(2, 8), T = r + a + v; return num(`En una bolsa hay ${r} canicas rojas, ${a} azules y ${v} verdes. Se saca una al azar. ¿Cuál es la probabilidad de que sea roja o azul?`, (r + a) / T, { tol: PTOL, hint: 'Una canica no puede ser roja y azul a la vez: suma las probabilidades.', sol: [`P(roja) = ${fr(r, T)}; P(azul) = ${fr(a, T)}`, `P(roja o azul) = ${frS(r, T)} + ${frS(a, T)} = ${B(fr(r + a, T))}`, `Otra forma: 1 − P(verde) = 1 − ${fr(v, T)} = ${fr(r + a, T)}`] }); }
    if (L === 4) { const c = pick([['par', [2, 4, 6], 'mayor que 3', [4, 5, 6]], ['impar', [1, 3, 5], 'menor que 4', [1, 2, 3]], ['múltiplo de 3', [3, 6], 'par', [2, 4, 6]], ['primo', [2, 3, 5], 'mayor que 2', [3, 4, 5, 6]]]); const both = c[1].filter(x => c[3].includes(x)), u = new Set([...c[1], ...c[3]]);
      return num(`Se lanza un dado. ¿Cuál es la probabilidad de que salga un número ${c[0]} o ${c[2]}?`, u.size / 6, { tol: PTOL, hint: 'Estos eventos pueden ocurrir juntos: resta los casos comunes para no contarlos dos veces.', sol: [`${c[0]}: {${c[1].join(', ')}} → ${c[1].length}/6; ${c[2]}: {${c[3].join(', ')}} → ${c[3].length}/6`, `Comunes: {${both.join(', ')}} → ${both.length}/6`, `P = ${c[1].length}/6 + ${c[3].length}/6 − ${both.length}/6 = ${B(fr(u.size, 6))}`] }); }
    const c = pick([['Sacar un 2 y sacar un 5 al lanzar un dado una vez', 'Sí'], ['Sacar un número par y sacar un 4 al lanzar un dado una vez', 'No'], ['Que una carta sea de corazones y que sea un rey', 'No'], ['Que un alumno elegido al azar sea de 1.º y que sea de 3.º', 'Sí']]);
    return mc(`¿Son mutuamente excluyentes estos eventos? ${c[0]}.`, c[1] === 'Sí' ? 'Sí, porque no pueden ocurrir al mismo tiempo' : 'No, porque pueden ocurrir al mismo tiempo', ['Sí, porque no pueden ocurrir al mismo tiempo', 'No, porque pueden ocurrir al mismo tiempo', 'Sí, porque los dos tienen la misma probabilidad', 'No, porque sus probabilidades suman más de 1'], { hint: '¿Existe algún resultado en el que ocurran los dos?', sol: [c[1] === 'Sí' ? 'No existe un resultado que cumpla ambos: son excluyentes.' : 'Hay al menos un resultado que cumple ambos (por ejemplo, el rey de corazones o el 4): no son excluyentes.'] });
  }
});

TOPICS.push({
  id: 'reglaproducto', eje: 'dat', title: 'Regla del producto: eventos independientes y dependientes',
  nem: 'Resuelve problemas donde se calcule la probabilidad de ocurrencia de dos eventos independientes (regla del producto); eventos dependientes.',
  formula: 'Independientes: P(A y B) = P(A) × P(B). Dependientes (sin reemplazo): P(A y B) = P(A) × P(B después de A).',
  lesson: `
<h4>Idea clave</h4>
<p>Dos eventos son <b>independientes</b> si el resultado de uno no cambia la probabilidad del otro: lanzar una moneda y un dado. La probabilidad de que ocurran <b>los dos</b> es el producto: P(sol y 6) = 1/2 × 1/6 = 1/12. Es el principio multiplicativo: de 12 resultados igual de probables, solo uno es (sol, 6).</p>
<p>Si el primer evento <b>cambia</b> las condiciones del segundo (por ejemplo, sacar dos canicas sin regresar la primera), son <b>dependientes</b>: la segunda probabilidad se calcula con lo que queda.</p>
<div class="ex"><b>Ejemplo:</b> 3 rojas y 2 azules. Sacar dos rojas <b>sin</b> regresar: 3/5 × 2/4 = 6/20 = 3/10. <b>Con</b> reemplazo: 3/5 × 3/5 = 9/25.</div>
<div class="warn"><b>Errores comunes</b><ul><li>Sumar en lugar de multiplicar cuando se piden los dos eventos (“y”).</li><li>No restar la canica que ya salió cuando no hay reemplazo.</li></ul></div>`,
  gen(L) {
    if (L === 1) { const k = R(1, 6); return num(`Se lanza una moneda y un dado. ¿Cuál es la probabilidad de obtener sol y ${k}?`, 1 / 12, { tol: PTOL, hint: 'Son independientes: multiplica las probabilidades.', sol: [`P(sol) = 1/2; P(${k}) = 1/6`, `P(sol y ${k}) = 1/2 × 1/6 = ${B('1/12')}`] }); }
    if (L === 2) { const n = R(2, 4); return num(`Se lanza un dado ${n} veces. ¿Cuál es la probabilidad de obtener 6 en todos los lanzamientos?`, 1 / 6 ** n, { tol: 0.0006, hint: 'Cada lanzamiento es independiente de los demás.', sol: [`P = ${Array(n).fill('1/6').join(' × ')} = ${B('1/' + 6 ** n)}`] }); }
    if (L === 3) { const r = R(2, 7), a = R(2, 7), T = r + a; return num(`En una urna hay ${r} bolas rojas y ${a} azules. Se saca una, se regresa y se saca otra. ¿Cuál es la probabilidad de que las dos sean rojas?`, (r / T) ** 2, { tol: PTOL, hint: 'Con reemplazo las condiciones no cambian: los eventos son independientes.', sol: [`P(roja) = ${fr(r, T)} en cada extracción (se regresa)`, `P(roja y roja) = ${frS(r, T)} × ${frS(r, T)} = ${B(fr(r * r, T * T))}`] }); }
    if (L === 4) { const r = R(3, 7), a = R(2, 6), T = r + a; return num(`En una urna hay ${r} bolas rojas y ${a} azules. Se sacan dos <b>sin regresar</b> la primera. ¿Cuál es la probabilidad de que las dos sean rojas?`, r * (r - 1) / (T * (T - 1)), { tol: PTOL, hint: 'Después de sacar una roja quedan una roja menos y una bola menos.', errs: [{ v: (r / T) ** 2, m: 'Así sería con reemplazo; sin regresar, la segunda probabilidad cambia.' }], sol: [`1.ª roja: ${fr(r, T)}`, `Quedan ${r - 1} rojas de ${T - 1}: ${fr(r - 1, T - 1)}`, `P = ${frS(r, T)} × ${frS(r - 1, T - 1)} = ${B(fr(r * (r - 1), T * (T - 1)))}`] }); }
    const c = pick([['Lanzar un dado dos veces', 'Independientes'], ['Sacar dos cartas de una baraja sin regresar la primera', 'Dependientes'], ['Que llueva hoy en Tabasco y que salga águila en un volado', 'Independientes'], ['Elegir dos alumnos distintos de un grupo para dos cargos', 'Dependientes']]);
    return mc(`¿Los eventos son independientes o dependientes? ${c[0]}.`, c[1] === 'Independientes' ? 'Independientes: el primero no cambia la probabilidad del segundo' : 'Dependientes: el primero cambia las condiciones del segundo', ['Independientes: el primero no cambia la probabilidad del segundo', 'Dependientes: el primero cambia las condiciones del segundo', 'Independientes, porque ocurren en momentos distintos', 'Dependientes, porque tienen la misma probabilidad'], { hint: 'Pregúntate: ¿después del primero, cambian los casos posibles del segundo?', sol: [c[1] === 'Independientes' ? 'El segundo evento tiene las mismas probabilidades sin importar el primero.' : 'Después del primero quedan menos elementos: la probabilidad del segundo cambia.'] });
  }
});

TOPICS.push({
  id: 'juegojusto', eje: 'dat', title: 'Juegos justos',
  nem: 'Indaga las condiciones necesarias para que un juego de azar sea justo, con base en la noción de resultados equiprobables o no equiprobables.',
  formula: 'Un juego es justo si todos los jugadores tienen la misma probabilidad de ganar (o si lo que se gana compensa la probabilidad: probabilidad × premio igual para todos).',
  lesson: `
<h4>Idea clave</h4>
<p>Un juego es <b>justo</b> cuando ningún jugador tiene ventaja: todos tienen la misma probabilidad de ganar. Si las probabilidades son distintas, se puede compensar con premios: quien tiene menos probabilidad debe ganar más.</p>
<div class="ex"><b>Ejemplo:</b> Se lanzan dos dados. Ana gana si la suma es 7 (6 casos de 36); Beto gana si la suma es 2 (1 caso). No es justo: Ana tiene 6 veces más probabilidad. Para compensar, cada victoria de Beto debería valer 6 puntos por cada punto de Ana.</div>
<div class="warn"><b>Errores comunes</b><ul><li>Pensar que las sumas de dos dados son igual de probables: 7 es la más probable y 2 y 12 las menos.</li><li>Creer que un juego es justo porque “cada quien tiene un número”.</li></ul></div>
<div class="life"><b>¿Para qué sirve?</b> Para diseñar juegos y rifas justas, y para entender por qué las loterías y casinos siempre ganan a largo plazo.</div>`,
  gen(L) {
    if (L === 1) { const c = pick([['Se lanza un dado: Ana gana si sale par y Beto si sale impar.', true], ['Se lanza un dado: Ana gana si sale 1 o 2 y Beto si sale 3, 4, 5 o 6.', false], ['Se lanza una moneda: Ana gana con sol y Beto con águila.', true], ['Se lanzan dos monedas: Ana gana si salen iguales y Beto si salen distintas.', true]]);
      return mc(`¿Es justo el juego? ${c[0]}`, c[1] ? 'Sí, los dos tienen la misma probabilidad de ganar' : 'No, uno tiene mayor probabilidad de ganar', ['Sí, los dos tienen la misma probabilidad de ganar', 'No, uno tiene mayor probabilidad de ganar', 'Sí, porque los dos pueden ganar alguna vez', 'No, porque depende de quién tire primero'], { hint: 'Cuenta los casos favorables de cada jugador.', sol: [c[1] ? 'Los casos favorables son iguales: probabilidades iguales → justo.' : 'Ana tiene 2/6 y Beto 4/6: Beto tiene ventaja → no es justo.'] }); }
    if (L === 2) { const a = R(2, 12); let b; do { b = R(2, 12); } while (b === a); const fa = 6 - Math.abs(7 - a), fb = 6 - Math.abs(7 - b);
      return num(`Se lanzan dos dados. Ana gana si la suma es ${a} y Beto si es ${b}. ¿Cuál es la probabilidad de que gane Ana?`, fa / 36, { tol: PTOL, hint: 'Cuenta las parejas que suman ' + a + ' de los 36 resultados.', sol: [`Parejas que suman ${a}: ${fa}; que suman ${b}: ${fb}`, `P(Ana) = ${frS(fa, 36)} = ${B(fr(fa, 36))}; P(Beto) = ${fr(fb, 36)} → ${fa === fb ? 'es justo' : 'no es justo'}`] }); }
    if (L === 3) { const fa = pick([1, 2, 3]), fb = pick([2, 4, 6].filter(x => x !== fa)); return num(`En un juego, Ana gana con probabilidad ${fr(fa, 12)} y Beto con probabilidad ${fr(fb, 12)}. Si cada victoria de Beto vale 1 punto, ¿cuántos puntos debe valer cada victoria de Ana para que el juego sea justo?`, fb / fa, { hint: 'Para que sea justo, probabilidad × puntos debe ser igual para los dos.', sol: [`Justo: P(Ana) × puntos de Ana = P(Beto) × 1`, `${fr(fa, 12)} × p = ${fr(fb, 12)}`, `p está multiplicada por ${fr(fa, 12)}: dividimos ambos lados entre ${fr(fa, 12)} → p = ${fb}/${fa} = ${B(fmt(fb / fa))} puntos`] }); }
    if (L === 4) return mc('Se lanzan dos dados. Ana gana si la suma es 6, 7 u 8; Beto si es cualquier otra suma. ¿Es justo?', 'No: Ana gana en 16 de 36 casos y Beto en 20', ['No: Ana gana en 16 de 36 casos y Beto en 20', 'Sí: los dos tienen el mismo número de sumas posibles', 'No: Ana gana en 3 casos y Beto en 8', 'Sí: el 7 es el número de la suerte de los dos'], { hint: 'Cuenta casos de cada suma: 6 → 5, 7 → 6, 8 → 5.', sol: ['Ana: 5 + 6 + 5 = 16 casos de 36', 'Beto: 36 − 16 = 20 casos', 'No es justo: Beto tiene ventaja.'] });
    return num('Se lanzan dos monedas. Ana gana si salen dos soles; Beto si sale al menos un águila. ¿Cuál es la probabilidad de que gane Beto?', 3 / 4, { tol: PTOL, hint: 'Usa el complemento: “al menos un águila” es lo contrario de “dos soles”.', sol: ['Espacio muestral: SS, SA, AS, AA', 'P(Ana) = P(SS) = 1/4', `P(Beto) = 1 − 1/4 = ${B('3/4')}: el juego no es justo`] });
  }
});

  lesson: `
<h4>Idea clave</h4>
<p>Una propiedad <b>extensiva</b> cambia con la cantidad de material: 2 kg de agua tienen el doble de masa y de volumen que 1 kg. Una propiedad <b>intensiva</b> no cambia: un vaso o una alberca de agua hierven a la misma temperatura y tienen la misma densidad. Las intensivas sirven para <b>identificar</b> sustancias.</p>
<h4>Densidad: ¿de dónde sale?</h4>
<p>Si un cubo de aluminio de 10 cm³ tiene 27 g, cada cm³ tiene 2.7 g. Ese “cuántos gramos hay en cada cm³” es la densidad: ρ = m ÷ V. Si duplicas el trozo, masa y volumen se duplican y su cociente sigue siendo 2.7 g/cm³: por eso es intensiva.</p>
<div class="ex"><b>Ejemplo:</b> 50 mL de aceite pesan 46 g. ρ = 46 g ÷ 50 mL = 0.92 g/mL. Como es menor que la del agua (1 g/mL), el aceite flota.</div>
<p><b>Despeje:</b> para la masa, m está dividida entre V en ρ = m/V; multiplicamos ambos lados por V: m = ρ · V.</p>
<div class="warn"><b>Errores comunes</b><ul><li>Pensar que un objeto grande es más denso: la densidad no depende del tamaño.</li><li>Dividir V entre m: las unidades (mL/g) te avisan del error.</li></ul></div>
<div class="life"><b>¿Para qué sirve?</b> Para saber si algo flota, detectar si la leche o la gasolina están adulteradas e identificar metales.</div>`,
  gen(L) {

    const ob = pick([['corcho', 0.24], ['hielo', 0.92], ['plomo', 11.3], ['madera de pino', 0.5], ['vidrio', 2.5], ['plástico PET', 1.38]]); const fl = ob[1] < 1;

TOPICS.push({
  id: 'qu_concentracion', eje: 'qmat', title: 'Concentración: porcentaje en masa y en volumen',
  nem: 'Concentración de las disoluciones expresada en porcentaje en masa y en volumen; su importancia en productos de uso cotidiano.',
  formula: '% m/m = (masa de soluto ÷ masa de disolución) × 100 · % v/v = (volumen de soluto ÷ volumen de disolución) × 100 · disolución = soluto + disolvente',
  lesson: `
<h4>Idea clave</h4>
<p>La concentración dice <b>cuánto soluto hay en cada porción de disolución</b>. “5% de ácido acético en volumen” significa que en cada 100 mL de vinagre hay 5 mL de ácido acético. Por eso un porcentaje es un factor de conversión: ${frS('5 mL de ácido', '100 mL de vinagre')}.</p>
<div class="ex"><b>Ejemplo:</b> Disuelves 20 g de sal en 180 g de agua.<ol class="steps"><li>Masa de la disolución = 20 g + 180 g = 200 g (¡no 180 g!).</li><li>% m/m = ${frS('20 g de sal', '200 g de disolución')} × 100 = 10%.</li></ol></div>
<div class="ex"><b>Con análisis dimensional:</b> ¿cuánto alcohol hay en 350 mL de una bebida al 6% v/v? 350 mL de bebida × ${frS('6 mL de alcohol', '100 mL de bebida')} = 21 mL de alcohol.</div>
<div class="warn"><b>Errores comunes</b><ul><li>Dividir entre la masa del disolvente en lugar de la de la disolución.</li><li>No escribir “de qué” es cada unidad (mL de alcohol, mL de bebida): por eso no se ve qué se cancela.</li></ul></div>
<div class="life"><b>¿Para qué sirve?</b> Para leer etiquetas (alcohol 70% para desinfectar, vinagre 5%, suero oral), preparar disoluciones y entender las bebidas alcohólicas.</div>`,
  gen(L) {
    if (L === 1) { const s = R(1, 9) * 5, d = R(5, 30) * 10; return num(`Se disuelven ${s} g de azúcar en ${d} g de agua. ¿Cuál es el porcentaje en masa de azúcar? (redondea a décimos)`, rnd(100 * s / (s + d), 1), { unit: '%', tol: 0.051, hint: 'La masa de la disolución es soluto + disolvente.', errs: [{ v: rnd(100 * s / d, 1), m: 'Dividiste entre la masa del agua; debe ser entre la masa de toda la disolución.' }], sol: [`Disolución: ${s} g + ${d} g = ${s + d} g`, `% m/m = ${frS(s + ' g de azúcar', (s + d) + ' g de disolución')} × 100 ≈ ${B(fmt(rnd(100 * s / (s + d), 1)) + '%')}`] }); }
    if (L === 2) { const p = pick([4, 5, 6, 12, 38, 40]), V = pick([250, 350, 355, 500, 750]); return num(`Una bebida tiene ${p}% de alcohol en volumen. ¿Cuántos mL de alcohol hay en ${V} mL?`, rnd(p * V / 100, 2), { unit: 'mL', tol: 0.011, hint: `El ${p}% es un factor: ${p} mL de alcohol por cada 100 mL de bebida.`, sol: [`${V} mL de bebida × ${frS(p + ' mL de alcohol', '100 mL de bebida')}`, `Se cancelan los mL de bebida: ${B(fmt(rnd(p * V / 100, 2)) + ' mL de alcohol')}`] }); }
    if (L === 3) { const p = pick([2, 5, 10, 15, 20]), M = R(2, 20) * 50; return num(`Se quieren preparar ${M} g de una disolución de sal al ${p}% m/m. ¿Cuántos gramos de sal se necesitan?`, p * M / 100, { unit: 'g', hint: 'Despeja la masa de soluto de la fórmula del porcentaje, o usa el porcentaje como factor de conversión.', sol: [`${p} = ${frS('m<sub>sal</sub>', M + ' g')} × 100`, `m<sub>sal</sub> está dividida entre ${M} y multiplicada por 100: <b>dividimos ambos lados entre 100</b> y <b>multiplicamos ambos lados por ${M}</b> → m<sub>sal</sub> = ${frS(p + ' × ' + M, '100')}`, `m<sub>sal</sub> = ${B(fmt(p * M / 100) + ' g')}; agua: ${fmt(M - p * M / 100)} g`] }); }
    if (L === 4) { const p = pick([4, 5, 6]), Lt = pick([0.5, 1, 1.5, 2, 2.5]); return num(`Un vinagre tiene ${p}% v/v de ácido acético. ¿Cuántos mL de ácido acético hay en ${fmt(Lt)} L de vinagre?`, p * Lt * 10, { unit: 'mL', hint: 'Primero convierte L a mL y después usa el porcentaje como factor; todo en una sola cadena.', sol: [`${fmt(Lt)} L de vinagre × ${frS('1000 mL', '1 L')} × ${frS(p + ' mL de ácido', '100 mL de vinagre')}`, 'Se cancelan L con L y mL de vinagre con mL de vinagre.', `= ${frS(fmt(Lt) + ' × 1000 × ' + p, '100')} = ${B(fmt(p * Lt * 10) + ' mL de ácido acético')}`] }); }
    const a = [R(5, 30), R(50, 200)], b = [R(5, 30), R(50, 200)]; const pa = a[0] / (a[0] + a[1]), pb = b[0] / (b[0] + b[1]); if (Math.abs(pa - pb) < 0.01) return this.gen(5);
    return mc(`Jarra A: ${a[0]} g de azúcar en ${a[1]} g de agua. Jarra B: ${b[0]} g de azúcar en ${b[1]} g de agua. ¿Cuál está más concentrada?`, pa > pb ? 'La jarra A' : 'La jarra B', ['La jarra A', 'La jarra B', 'Las dos tienen la misma concentración', 'La que tenga más agua'], { hint: 'Compara el porcentaje de azúcar, no la cantidad de azúcar.', sol: [`A: ${frS(a[0], a[0] + a[1])} × 100 ≈ ${fmt(rnd(100 * pa, 1))}%`, `B: ${frS(b[0], b[0] + b[1])} × 100 ≈ ${fmt(rnd(100 * pb, 1))}%`, `Más concentrada: ${B(pa > pb ? 'la jarra A' : 'la jarra B')}`] });
  }
});

TOPICS.push({
  id: 'qu_ppm', eje: 'qmat', title: 'Partes por millón (ppm) y contaminantes',
  nem: 'Concentración en partes por millón para cuantificar contaminantes en agua, aire y suelo; toma de decisiones sobre su impacto en la salud y el ambiente.',
  formula: '1 ppm = 1 mg de soluto por cada kg de disolución (en agua, 1 mg por cada L). ppm = mg de soluto ÷ kg (o L) de disolución. 1% = 10 000 ppm.',
  lesson: `
<h4>Idea clave</h4>
<p>Cuando una sustancia está en cantidades muy pequeñas (plomo en el agua, ozono en el aire), el porcentaje da números incómodos como 0.0005%. Por eso se usan las <b>partes por millón</b>: cuántas partes de soluto hay por cada millón de partes de mezcla.</p>
<p>¿Por qué 1 mg/L es 1 ppm? Un litro de agua tiene una masa de 1 kg = 1 000 000 mg. Entonces 1 mg en 1 L es 1 parte en 1 000 000.</p>
<div class="ex"><b>Ejemplo:</b> En 5 L de agua hay 0.4 mg de flúor: ${frS('0.4 mg', '5 L')} = 0.08 mg/L = 0.08 ppm.</div>
<div class="warn"><b>Errores comunes</b><ul><li>Mezclar g y mg sin convertir: usa análisis dimensional (1 g = 1000 mg).</li><li>Pensar que una cantidad pequeña siempre es inofensiva: algunas sustancias dañan en ppm.</li></ul></div>
<div class="life"><b>¿Para qué sirve?</b> Las normas de calidad del agua y del aire fijan límites en ppm; con ellos se decide si el agua se puede beber o si hay contingencia ambiental.</div>`,
  gen(L) {
    if (L === 1) { const mg = R(1, 40) / 10, V = R(1, 10); return num(`En ${V} L de agua hay ${fmt(mg)} mg de un contaminante. ¿Cuál es su concentración en ppm? (en agua, 1 ppm = 1 mg/L)`, rnd(mg / V, 4), { unit: 'ppm', tol: 0.006, hint: 'ppm = mg de soluto ÷ L de agua.', sol: [`ppm = ${frS(fmt(mg) + ' mg', V + ' L')} = ${B(fmt(rnd(mg / V, 3)) + ' ppm')}`] }); }
    if (L === 2) { const c = pick([0.5, 1.5, 2, 4, 0.2]), V = R(2, 50); return num(`El agua de un pozo tiene ${fmt(c)} ppm de hierro. ¿Cuántos mg de hierro hay en ${V} L?`, rnd(c * V, 3), { unit: 'mg', tol: 0.011, hint: `${fmt(c)} ppm significa ${fmt(c)} mg por cada litro: úsalo como factor.`, sol: [`${V} L × ${frS(fmt(c) + ' mg', '1 L')} = ${B(fmt(rnd(c * V, 3)) + ' mg')}`] }); }
    if (L === 3) { const g = pick([0.002, 0.005, 0.01, 0.03]), kg = R(2, 10); return num(`Una muestra de ${kg} kg de suelo contiene ${fmt(g)} g de plomo. ¿Cuántas ppm (mg/kg) de plomo tiene?`, rnd(g * 1000 / kg, 4), { unit: 'ppm', tol: 0.006, hint: 'Convierte g a mg con análisis dimensional y divide entre los kg.', sol: [`${fmt(g)} g × ${frS('1000 mg', '1 g')} = ${fmt(g * 1000)} mg`, `ppm = ${frS(fmt(g * 1000) + ' mg', kg + ' kg')} = ${B(fmt(rnd(g * 1000 / kg, 3)) + ' ppm')}`] }); }
    if (L === 4) { const lim = pick([0.01, 0.05, 1.5, 0.3]), V = R(2, 10); const ok = Math.random() < 0.5; const mg = rnd(lim * V * (ok ? 0.6 : 1.6), 4); const c = mg / V;
      return mc(`Suponiendo un límite permitido de ${fmt(lim)} ppm para cierta sustancia, una muestra de ${V} L de agua contiene ${fmt(mg)} mg. ¿El agua cumple?`, ok ? 'Sí, su concentración está por debajo del límite' : 'No, su concentración rebasa el límite', ['Sí, su concentración está por debajo del límite', 'No, su concentración rebasa el límite', 'Sí, porque la cantidad en mg es muy pequeña', 'No se puede saber sin conocer el color del agua'], { hint: 'Calcula la concentración (mg ÷ L) y compárala con el límite.', sol: [`Concentración: ${frS(fmt(mg) + ' mg', V + ' L')} = ${fmt(rnd(c, 4))} ppm`, `Límite: ${fmt(lim)} ppm → ${ok ? 'cumple' : 'no cumple'}`] }); }
    const p = pick([0.5, 1, 2, 0.04, 0.1]); return num(`Una disolución tiene ${fmt(p)}% m/m de un soluto. ¿A cuántas ppm equivale?`, p * 10000, { unit: 'ppm', hint: '1% = 1 parte en 100 = 10 000 partes en 1 000 000.', sol: [`${frS(fmt(p) + ' partes', '100 partes')} × ${frS('10 000', '10 000')} = ${frS(fmt(p * 10000) + ' partes', '1 000 000 partes')}`, `= ${B(fmt(p * 10000) + ' ppm')}`] });
  }
});

bankTopic({ id: 'qu_tabla', eje: 'qato', m: 4, title: 'La tabla periódica: grupos, periodos y metales',

  formula: 'Elementos ordenados por número atómico (Z). Grupos (columnas): propiedades químicas parecidas. Periodos (filas): mismo número de capas electrónicas. Metales a la izquierda, no metales a la derecha (y el H), metaloides en la “escalera”.',
