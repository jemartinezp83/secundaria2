TOPICS.push({
  id: 'qu_atomo', eje: 'qato', title: 'El átomo: modelo de Bohr, protones, neutrones y electrones',
  nem: 'Modelos atómicos (Dalton, Thomson, Rutherford, Bohr); partículas subatómicas; número atómico y masa atómica; distribución de electrones por niveles.',
  formula: 'Z (número atómico) = protones. En un átomo neutro, electrones = protones. A (número de masa) = protones + neutrones → neutrones = A − Z. Capas de Bohr (primeros 20 elementos): 2, 8, 8, 2. Ion positivo: perdió electrones; negativo: ganó electrones.',
  lesson: `
<h4>Idea clave</h4>
<p>El átomo tiene un <b>núcleo</b> pequeñísimo con protones (+) y neutrones (sin carga), rodeado de electrones (−). El modelo cambió con los experimentos: Dalton (esfera indivisible) → Thomson (descubre el electrón: “pudín con pasas”) → Rutherford (bombardea una lámina de oro y descubre que casi toda la masa está en un núcleo diminuto) → Bohr (los electrones giran en niveles de energía definidos).</p>
<h4>¿Cómo se cuentan las partículas?</h4>
<p>El número atómico Z dice cuántos protones hay; eso define qué elemento es. Si el átomo es neutro, las cargas se equilibran: hay tantos electrones como protones. El número de masa A cuenta protones + neutrones (los electrones casi no pesan), así que neutrones = A − Z.</p>
<div class="ex"><b>Ejemplo:</b> Sodio, Z = 11, A = 23: 11 protones, 11 electrones y 23 − 11 = 12 neutrones. Capas de Bohr: 2, 8, 1 (un electrón en la última capa).</div>
<div class="warn"><b>Errores comunes</b><ul><li>Pensar que el número de masa es el número de neutrones.</li><li>En un ion Na⁺, olvidar que perdió un electrón: tiene 10, no 11.</li></ul></div>
<div class="life"><b>¿Para qué sirve?</b> Los electrones de la última capa deciden cómo reacciona un elemento: con ellos se explican los enlaces y la tabla periódica.</div>`,
  gen(L) {
    const e = pick(ELEM), [Z, s, n, A] = e;
    if (L === 1) return num(`El ${n} (${s}) tiene número atómico Z = ${Z}. ¿Cuántos electrones tiene un átomo neutro de ${n}?`, Z, { hint: 'Neutro: las cargas positivas y negativas se equilibran.', sol: [`Z = ${Z} → ${Z} protones`, `Neutro: electrones = protones = ${B(Z)}`] });
    if (L === 2) return num(`Un átomo de ${n} tiene Z = ${Z} y número de masa A = ${A}. ¿Cuántos neutrones tiene?`, A - Z, { hint: 'A cuenta protones + neutrones.', errs: [{ v: A, m: 'A es protones + neutrones; resta los protones.' }], sol: [`A = protones + neutrones → ${A} = ${Z} + n`, `Restamos ${Z} en ambos lados: n = ${A} − ${Z} = ${B(A - Z)}`] });
    if (L === 3) { const sh = shells(Z); return num(`Según el modelo de Bohr, ¿cuántos electrones tiene el ${n} (Z = ${Z}) en su última capa?`, sh[sh.length - 1], { hint: 'Llena las capas en orden: 2, 8, 8, 2.', sol: [`${Z} electrones repartidos: ${sh.join(', ')}`, `Última capa: ${B(sh[sh.length - 1])}`] }); }
    if (L === 4) { const io = pick([['Na', 11, 1, 'sodio'], ['Mg', 12, 2, 'magnesio'], ['Al', 13, 3, 'aluminio'], ['Ca', 20, 2, 'calcio'], ['K', 19, 1, 'potasio'], ['Cl', 17, -1, 'cloro'], ['O', 8, -2, 'oxígeno'], ['S', 16, -2, 'azufre'], ['F', 9, -1, 'flúor']]); const q = io[2], lab = io[0] + '<sup>' + (Math.abs(q) > 1 ? Math.abs(q) : '') + (q > 0 ? '+' : '−') + '</sup>';
      return num(`¿Cuántos electrones tiene el ion ${lab} (Z = ${io[1]})?`, io[1] - q, { hint: 'Una carga positiva indica que perdió electrones; una negativa, que ganó.', sol: [`Átomo neutro: ${io[1]} electrones`, q > 0 ? `Carga +${q}: perdió ${q} electrón(es) → ${io[1]} − ${q} = ${B(io[1] - q)}` : `Carga −${-q}: ganó ${-q} electrón(es) → ${io[1]} + ${-q} = ${B(io[1] - q)}`] }); }
    return cpt(pick([
      ['¿Qué descubrió Rutherford con su experimento de la lámina de oro?', 'Que casi toda la masa está en un núcleo diminuto', ['Que el átomo es una esfera maciza indivisible', 'Que los electrones están pegados al núcleo', 'Que el átomo no tiene carga eléctrica'], 'La mayoría de las partículas atravesaban la lámina y unas pocas rebotaban: el núcleo es muy pequeño y denso.'],
      ['El carbono-12 y el carbono-14 son isótopos. ¿En qué se diferencian?', 'En el número de neutrones', ['En el número de protones', 'En el número de electrones', 'En el elemento que forman'], 'Los dos tienen 6 protones; uno tiene 6 neutrones y el otro 8.'],
      ['Un átomo tiene 8 protones, 8 neutrones y 8 electrones. ¿Qué elemento es?', 'Oxígeno', ['Carbono', 'Nitrógeno', 'Neón'], 'El número de protones (Z = 8) define al elemento.'],
      ['¿Qué aportó el modelo de Bohr?', 'Electrones en niveles de energía definidos', ['El descubrimiento del núcleo atómico', 'La idea de átomos indivisibles', 'El descubrimiento del protón y el neutrón'], 'Explica por qué los átomos emiten luz de colores específicos.']]));
  }
});

TOPICS.push({
  id: 'qu_lewis', eje: 'qato', title: 'Electrones de valencia y estructuras de Lewis',
  nem: 'Electrones de valencia y su representación con estructuras de Lewis; regla del octeto.',
  formula: 'Electrones de valencia = electrones de la última capa = (grupos 1 y 2) número del grupo; (grupos 13 a 18) número del grupo − 10. Regla del octeto: los átomos tienden a ganar, perder o compartir electrones para tener 8 en su última capa (2 el hidrógeno).',
  lesson: `
<h4>Idea clave</h4>
<p>Solo los electrones de la última capa participan en las reacciones: son los <b>electrones de valencia</b>. En la estructura de Lewis se dibuja el símbolo del elemento rodeado de un punto por cada electrón de valencia.</p>
<p>Los gases nobles casi no reaccionan y tienen 8 electrones en su última capa. Los demás átomos tienden a llegar a esa situación estable: la <b>regla del octeto</b>. El sodio (1 de valencia) prefiere perder 1; el cloro (7) prefiere ganar 1.</p>
<div class="ex"><b>Ejemplo:</b> En el agua, el oxígeno (6 de valencia) comparte un par con cada hidrógeno: queda con 8 alrededor y cada H con 2.</div>
<div class="warn"><b>Errores comunes</b><ul><li>Dibujar todos los electrones del átomo en lugar de solo los de valencia.</li><li>Pensar que el número del grupo 16 son 16 electrones de valencia: son 6.</li></ul></div>`,
  gen(L) {
    const pool = ELEM.filter(x => x[0] > 2 && x[0] <= 20), e = pick(pool), [Z, s, n, , g] = e, v = valence(g);
    if (L === 1) return num(`El ${n} (${s}) está en el grupo ${g}. ¿Cuántos electrones de valencia tiene?`, v, { hint: 'Grupos 1 y 2: el número del grupo. Grupos 13 a 18: el número del grupo menos 10.', sol: [g <= 2 ? `Grupo ${g} → ${v}` : `Grupo ${g} → ${g} − 10 = ${v}`, `Puntos en su estructura de Lewis: ${B(v)}`] });
    if (L === 2) { const sh = shells(Z); return num(`Con Z = ${Z}, ¿cuántos puntos lleva la estructura de Lewis del ${n}?`, sh[sh.length - 1], { hint: 'Reparte los electrones en capas 2, 8, 8 y cuenta los de la última.', sol: [`Capas: ${sh.join(', ')}`, `Puntos de Lewis = electrones de la última capa = ${B(sh[sh.length - 1])}`] }); }
    if (L === 3) { const m = pick(ELEM.filter(x => [1, 2, 13].includes(x[4]) && x[0] > 2)); const vv = valence(m[4]); return num(`Para cumplir la regla del octeto, ¿cuántos electrones tiende a perder el ${m[2]} (grupo ${m[4]})?`, vv, { hint: 'Le es más fácil perder sus pocos electrones de valencia que ganar muchos.', sol: [`Tiene ${vv} de valencia; al perderlos queda con la capa anterior completa.`, `Pierde ${B(vv)}`] }); }
    if (L === 4) { const m = pick(ELEM.filter(x => [15, 16, 17].includes(x[4]) && x[0] > 2)); const vv = valence(m[4]); return num(`Para completar el octeto, ¿cuántos electrones tiende a ganar el ${m[2]} (grupo ${m[4]})?`, 8 - vv, { hint: 'Cuántos le faltan para 8.', sol: [`Tiene ${vv} de valencia`, `8 − ${vv} = ${B(8 - vv)}`] }); }
    const mo = pick([['H2O', 'O', 2, 2], ['NH3', 'N', 3, 1], ['CH4', 'C', 4, 0], ['HCl', 'Cl', 1, 3], ['CO2', 'C', 4, 0]]);
    return num(`En la estructura de Lewis de ${F(mo[0])}, ¿cuántos pares de electrones <b>no compartidos</b> quedan alrededor del ${mo[1]}?`, mo[3], { hint: 'Cuenta los electrones de valencia del átomo central y réstale los que usa en enlaces.', sol: [`El ${mo[1]} forma ${mo[2]} enlace(s)${mo[0] === 'CO2' ? ' dobles (4 pares compartidos en total)' : ''}`, `Con el octeto completo, le quedan ${B(mo[3])} par(es) libre(s)`] });
  }
});

TOPICS.push({

<p>Los alimentos liberan energía cuando el cuerpo los “quema” (los oxida) en las células. Cada gramo aporta una cantidad fija según su tipo: 4 kcal los carbohidratos y las proteínas, 9 kcal las grasas. Esos números son <b>factores de conversión</b>: ${frS('9 kcal', '1 g de grasa')}.</p>
<div class="ex"><b>Ejemplo:</b> Una porción de galletas tiene 20 g de carbohidratos, 2 g de proteínas y 5 g de grasas.<ol class="steps"><li>20 g × ${frS('4 kcal', '1 g')} = 80 kcal</li><li>2 g × ${frS('4 kcal', '1 g')} = 8 kcal</li><li>5 g × ${frS('9 kcal', '1 g')} = 45 kcal</li><li>Total: 133 kcal.</li></ol></div>
<p>Si la etiqueta da los datos “por porción de 30 g” y comes 75 g, usa también un factor: ${frS('133 kcal', '30 g')}.</p>

  gen(L) {

    const c = R(10, 60), p = R(1, 15), f = R(1, 20), T = 4 * c + 4 * p + 9 * f;
    if (L === 2) return num(`Una porción tiene ${c} g de carbohidratos, ${p} g de proteínas y ${f} g de grasas. ¿Cuántas kcal aporta?`, T, { unit: 'kcal', hint: 'Convierte cada nutriente con su factor y suma.', sol: [`Carbohidratos: ${c} × 4 = ${4 * c} kcal`, `Proteínas: ${p} × 4 = ${4 * p} kcal`, `Grasas: ${f} × 9 = ${9 * f} kcal`, `Total: ${B(T + ' kcal')}`] });
    if (L === 3) { const por = pick([25, 30, 40, 50]), eat = por * pick([1.5, 2, 2.5, 3]), kc = R(10, 30) * 10; return num(`La etiqueta dice ${kc} kcal por porción de ${por} g. Si comes ${fmt(eat)} g, ¿cuántas kcal consumes?`, kc * eat / por, { unit: 'kcal', hint: 'Usa la información de la etiqueta como factor de conversión.', sol: [`${fmt(eat)} g × ${frS(kc + ' kcal', por + ' g')} = ${B(fmt(kc * eat / por) + ' kcal')}`, 'Se cancelan los gramos.'] }); }

    const act = pick([['caminar', 4], ['andar en bicicleta', 7], ['correr', 10], ['nadar', 8]]), kc = R(10, 50) * 10;

TOPICS.push({

  lesson: `
<h4>Idea clave</h4>
<p>En una reacción química los enlaces se rompen y se forman otros: los átomos se <b>reacomodan</b> para formar sustancias nuevas, pero no aparecen ni desaparecen. Por eso la masa total se conserva (Lavoisier) y una ecuación química debe tener los mismos átomos de cada elemento en los dos lados.</p>
<p><b>Evidencias de cambio químico:</b> burbujas de gas, cambio de color, formación de un sólido, liberación o absorción de calor o luz, olor nuevo.</p>
<div class="ex"><b>Ejemplo:</b> 2H₂ + O₂ → 2H₂O. Izquierda: H = 2 × 2 = 4; O = 2. Derecha: H = 2 × 2 = 4; O = 2 × 1 = 2. ✔ Balanceada.</div>
<p>Para balancear se cambian los <b>coeficientes</b>, nunca los subíndices: cambiar H₂O por H₂O₂ cambiaría la sustancia (agua oxigenada).</p>
<div class="warn"><b>Errores comunes</b><ul><li>Olvidar multiplicar el coeficiente por el subíndice.</li><li>Pensar que al quemar algo la masa “se pierde”: se va en forma de gases.</li></ul></div>
<div class="life"><b>¿Para qué sirve?</b> Para calcular cuánto combustible y oxígeno se necesitan, cuánto CO₂ se emite y para entender cocina, digestión y oxidación.</div>`,
  gen(L) {
    const r = pick(RX);
    if (L === 1) return cpt(pick([
      ['¿Cuál de estos es un cambio químico?', 'Quemar un papel', ['Romper un vaso', 'Derretir hielo', 'Disolver azúcar'], 'Se forman sustancias nuevas (CO₂, agua, cenizas).'],
      ['¿Cuál es una evidencia de que ocurrió una reacción química?', 'Se desprenden burbujas de un gas nuevo', ['El material cambia de forma', 'El agua se evapora al calentarla', 'El hielo se derrite al sol'], 'Un gas nuevo indica una sustancia nueva.'],
      ['En la ecuación A + B → C, ¿qué son A y B?', 'Los reactivos', ['Los productos', 'Los catalizadores', 'Los coeficientes'], 'Están antes de la flecha.']]));
    if (L === 2) { const els = Object.keys(r.a), el = pick(els), sd = pick(['a', 'b']); const n = cnt(r[sd][el]);
      return num(`En la reacción ${rxStr(r)}, ¿cuántos átomos de ${el} hay en ${sd === 'a' ? 'los reactivos' : 'los productos'}?`, n, { hint: 'Multiplica el coeficiente por el subíndice de cada sustancia que tenga ese elemento y suma.', sol: [`${r[sd][el].map(([c, k]) => `${c} × ${k}`).join(' + ')} = ${B(n)}`, `En el otro lado también hay ${n}: los átomos se conservan.`] }); }
    if (L === 3) { const mA = R(5, 50), mB = R(5, 50); return num(`En un recipiente cerrado reaccionan ${mA} g de una sustancia con ${mB} g de otra. ¿Cuál es la masa total de los productos?`, mA + mB, { unit: 'g', hint: 'Ley de conservación de la masa.', sol: [`Masa de reactivos = masa de productos`, `${mA} g + ${mB} g = ${B(mA + mB + ' g')}`] }); }
    if (L === 4) { const sd = pick(['t', 'p']), arr = r[sd]; const i = R(0, arr.length - 1); if (arr[i][0] === 1 && Math.random() < 0.6) return this.gen(4);
      return num(`¿Qué coeficiente va en el lugar de “?” para que la ecuación quede balanceada? ${rxStr(r, sd, i)}`, arr[i][0], { hint: 'Cuenta un elemento que aparezca en esa sustancia en ambos lados y busca el número que iguala.', sol: [`Ecuación balanceada: ${rxStr(r)}`, `Coeficiente: ${B(arr[i][0])}`, 'Comprueba: cada elemento tiene el mismo número de átomos en ambos lados.'] }); }
    const m1 = R(10, 60), m2 = R(5, m1 - 2); return num(`Al calentar ${m1} g de carbonato de calcio en un recipiente abierto quedan ${m2} g de óxido de calcio. ¿Cuántos gramos de dióxido de carbono escaparon al aire?`, m1 - m2, { unit: 'g', hint: 'La masa no se pierde: lo que falta se fue como gas.', sol: [`CaCO<sub>3</sub> → CaO + CO<sub>2</sub>`, `${m1} g = ${m2} g + m<sub>CO₂</sub>; restamos ${m2} g en ambos lados: m<sub>CO₂</sub> = ${B(m1 - m2 + ' g')}`] });
  }
});

TOPICS.push({

  formula: 'pH < 7 ácido · pH = 7 neutro · pH > 7 básico (alcalino). Cada unidad de pH es 10 veces: pH 3 es 10 veces más ácido que pH 4. Neutralización: ácido + base → sal + agua (HCl + NaOH → NaCl + H₂O).',
  lesson: `
<h4>Idea clave</h4>
<p>Según Arrhenius, un <b>ácido</b> libera iones H⁺ en agua y una <b>base</b> libera iones OH⁻. La escala de pH mide qué tan ácida o básica es una disolución, de 0 a 14.</p>
<p>La escala es <b>logarítmica</b>: bajar 1 unidad de pH significa 10 veces más concentración de H⁺. Por eso pH 2 es 10 × 10 = 100 veces más ácido que pH 4.</p>
<p>Al mezclar un ácido con una base, el H⁺ y el OH⁻ forman agua (H⁺ + OH⁻ → H₂O) y se “anulan”: es la <b>neutralización</b>. Así actúan los antiácidos en el estómago.</p>
<div class="ex"><b>Indicador casero:</b> el agua de col morada se pone roja o rosa con ácidos (limón, vinagre), morada en neutro y verde o amarilla con bases (bicarbonato, jabón).</div>
<div class="warn"><b>Errores comunes</b><ul><li>Pensar que pH 2 es “el doble” de ácido que pH 4.</li><li>Creer que todas las bases son inofensivas: la sosa cáustica quema como un ácido fuerte.</li></ul></div>`,
  gen(L) {
    if (L === 1) { const it = pick([['jugo de limón', 2], ['vinagre', 3], ['refresco de cola', 2.5], ['agua pura', 7], ['leche', 6.5], ['bicarbonato en agua', 8.5], ['jabón', 10], ['limpiador con amoniaco', 11.5], ['sangre', 7.4], ['jugo gástrico', 1.5]]);
      const ans = it[1] < 7 ? 'Ácido' : it[1] === 7 ? 'Neutro' : 'Básico'; return mc(`El ${it[0]} tiene pH ≈ ${fmt(it[1])}. ¿Cómo se clasifica?`, ans, ['Ácido', 'Neutro', 'Básico'], { hint: 'Menor que 7: ácido; 7: neutro; mayor que 7: básico.', sol: [`pH ${fmt(it[1])} ${it[1] < 7 ? '< 7' : it[1] === 7 ? '= 7' : '> 7'} → ${B(ans)}`] }); }
    if (L === 2) { const a = R(1, 6), b = R(a + 1, 7); return mc(`Una disolución tiene pH ${a} y otra pH ${b}. ¿Cuál es más ácida?`, `La de pH ${a}`, [`La de pH ${a}`, `La de pH ${b}`, 'Las dos son igual de ácidas', 'Ninguna, las dos son básicas'], { hint: 'Mientras menor es el pH, más ácida.', sol: [`${a} < ${b} → más ácida la de pH ${B(a)}`] }); }
    if (L === 3) { const a = R(1, 5), d = R(1, 3), b = a + d; return num(`¿Cuántas veces más ácida es una disolución de pH ${a} que una de pH ${b}?`, 10 ** d, { hint: 'Cada unidad de pH equivale a 10 veces.', errs: [{ v: b / a, m: 'La escala no es proporcional: cada unidad es un factor de 10.' }, { v: d, m: 'Cada unidad no suma 1: multiplica por 10.' }], sol: [`Diferencia: ${b} − ${a} = ${d} unidades`, `${Array(d).fill('10').join(' × ')} = ${B(fmt(10 ** d))} veces`] }); }

      ['¿Qué ion libera un ácido en agua, según Arrhenius?', 'H⁺', ['OH⁻', 'Na⁺', 'Cl⁻'], 'Las bases liberan OH⁻.']]));

      ['Al agregar bicarbonato al agua de col morada, el color cambia a:', 'Verde o azul verdoso', ['Rojo intenso', 'Rosa', 'Se queda transparente'], 'Las bases tornan verde el indicador.']]));
  }
});

bankTopic({ id: 'in_pastnarr', eje: 'ingr', m: 1, title: 'Narrating the past: past simple and past continuous',
  nem: 'Narrate historical events and personal stories using past simple and past continuous (Projects and Readings 3: historical event narratives).',
  formula: 'Past simple: finished actions (I visited, she went). Past continuous: action in progress in the past (was/were + -ing). “While I was reading, the phone rang.” Irregular verbs: go→went, see→saw, make→made, take→took, write→wrote.',
  lesson: lesson({ k: 'To tell stories in English we combine two tenses: the past simple for completed actions and the past continuous for the background (what was happening).',
    p: ['<b>Past simple:</b> regular verbs add -ed (worked, played); irregular verbs change (went, saw, built).', '<b>Questions and negatives:</b> use did + base form: “Did you see it?”, “He didn’t go.”', '<b>Past continuous:</b> was/were + verb-ing: “They were playing.”', '<b>When / while:</b> “I was walking home when it started to rain.”'],
    ex: 'In 1969, while millions of people were watching TV, Neil Armstrong walked on the Moon.',
    er: ['“Did you went?” ✗ → “Did you go?” ✓ (after did, use the base form).', '“They was playing” ✗ → “They were playing” ✓.'],
    v: 'To tell stories, describe historical events and talk about your experiences.' }),
  qs: [
    [1, 'Choose the past of “go”:', 'went', ['goed', 'gone', 'going']],
    [1, 'Choose the correct form: “She ___ a letter yesterday.”', 'wrote', ['write', 'writes', 'writing']],
    [2, 'Complete: “They ___ playing soccer when it started to rain.”', 'were', ['was', 'did', 'are']],
    [2, 'Choose the correct question:', 'Did you see the movie?', ['Did you saw the movie?', 'Do you saw the movie?', 'You did see the movie?']],
    [3, 'Complete: “While I ___ dinner, the lights went out.”', 'was cooking', ['cooked', 'am cooking', 'cook']],
    [3, 'Choose the correct negative:', 'He didn’t go to school.', ['He didn’t went to school.', 'He not went to school.', 'He doesn’t went to school.']],
    [4, 'In “I was reading when the phone rang”, which action interrupted the other?', 'The phone rang', ['I was reading', 'Both at the same time', 'Neither action']],
    [4, 'Complete: “In 1969, Neil Armstrong ___ on the Moon.”', 'walked', ['was walking always', 'walks', 'has walked']],
    [5, 'Which sentence describes background in a story?', 'The sun was shining and birds were singing.', ['Then he opened the door.', 'Finally, they arrived.', 'She called the police.']],
    [5, 'Choose the correct past continuous question:', 'What were you doing at 8 p.m.?', ['What did you doing at 8 p.m.?', 'What was you doing at 8 p.m.?', 'What you were doing at 8 p.m.?']]
  ] });

bankTopic({ id: 'in_perfect', eje: 'ingr', m: 2, title: 'Present perfect: experiences and changes',

  lesson: lesson({ k: 'The present perfect connects the past with the present: experiences in your life, changes, or actions that started in the past and continue now.',
    p: ['<b>Form:</b> I/you/we/they have + participle; he/she/it has + participle.', '<b>Participles:</b> regular = -ed (visited); irregular: be→been, see→seen, eat→eaten, do→done, write→written.', '<b>Ever / never:</b> “Have you ever eaten pozol?” “I have never been to Canada.”', '<b>For / since:</b> “I have lived here for five years / since 2021.”'],

    [1, 'Complete: “She ___ visited Puebla.”', 'has', ['have', 'is', 'did']],
    [1, 'Choose the participle of “see”:', 'seen', ['saw', 'seed', 'seeing']],
    [2, 'Complete: “I have lived here ___ 2019.”', 'since', ['for', 'ago', 'during']],
    [2, 'Complete: “We have studied English ___ three years.”', 'for', ['since', 'ago', 'from']],
    [3, 'Choose the correct question:', 'Have you ever been to Cancún?', ['Did you ever been to Cancún?', 'Have you ever went to Cancún?', 'Has you ever been to Cancún?']],
    [3, 'Complete: “I haven’t finished my homework ___.”', 'yet', ['already', 'ever', 'since']],
    [4, 'Which sentence describes a life experience?', 'I have never seen snow.', ['I saw snow last December.', 'I am seeing snow now.', 'I will see snow tomorrow.']],
    [4, 'Complete: “He has ___ his project.” (write)', 'written', ['wrote', 'writed', 'writing']],
    [5, 'Choose the correct sentence with “already”:', 'They have already eaten.', ['They have eaten already yet.', 'They already have ate.', 'They has already eaten.']],
    [5, 'What is the difference between “I lived in Villahermosa” and “I have lived in Villahermosa”?', 'The second suggests I still live there', ['There is no difference at all', 'The first is in the future', 'The second is a mistake']]
  ] });

bankTopic({ id: 'in_assertive', eje: 'inco', m: 4, title: 'Assertive communication and violence prevention',

bankTopic({ id: 'in_campaigns', eje: 'inco', m: 5, title: 'Campaigns: modals and imperatives for advice',

const RAZ = {}, RAZD = {}, RAZA = {};
RAZ.prodnot = { origen: `<p>Dibuja un cuadrado de lado (x + 3). Divídelo con una línea vertical y una horizontal a 3 unidades del borde: quedan un cuadrado de x por x (área x²), un cuadrado de 3 por 3 (área 9) y <b>dos</b> rectángulos de x por 3 (área 3x cada uno). Juntando: (x + 3)² = x² + 6x + 9. El término del medio aparece dos veces porque hay dos rectángulos: de ahí el “doble del producto”.</p>
<p>En (x + 5)(x − 5) los productos cruzados son +5x y −5x: se cancelan y queda una diferencia de cuadrados.</p>`,
  qs: [
    [2, '¿Por qué (x + 4)² tiene un término 8x?', 'Porque hay dos rectángulos de x por 4', ['Porque 4 por 2 siempre da 8 en las potencias', 'Porque el exponente 2 se multiplica por el 4', 'Porque se suma x + 4 dos veces seguidas']],
    [3, 'Con x = 1, (x + 3)² = 16 pero x² + 9 = 10. ¿Qué demuestra?', 'Que (x + 3)² no es igual a x² + 9', ['Que con x = 1 la fórmula no se puede usar', 'Que hay que sumar 6 al resultado siempre', 'Que el binomio al cuadrado no tiene regla']],

RAZ.factorizacion = { origen: `<p>Factorizar es multiplicar “al revés”. Sabemos que (x + p)(x + q) = x² + (p + q)x + pq: al multiplicar, los números p y q se <b>suman</b> para formar el término con x y se <b>multiplican</b> para formar el término sin x. Por eso, para factorizar x² + 7x + 12, buscamos dos números que sumen 7 y multipliquen 12: 3 y 4.</p>
<p>Siempre se puede comprobar: multiplica los factores y debe salir la expresión original.</p>`,
  qs: [
    [2, '¿Por qué en x² + 7x + 12 buscamos números que sumen 7 y multipliquen 12?', 'Porque así se forman al multiplicar (x + p)(x + q)', ['Porque 7 + 12 = 19 y se reparte entre los dos', 'Porque es una regla que se cumple en cualquier suma', 'Porque el 7 y el 12 son los factores primos']],
    [3, '¿Cómo compruebas que factorizaste bien?', 'Multiplicando los factores para obtener lo original', ['Sumando los números que pusiste en los paréntesis', 'Viendo que los factores tengan los mismos signos', 'Sustituyendo x = 0 solo en uno de los factores']],
    [4, 'Lupita escribió x² + 16 = (x + 4)(x − 4). ¿Qué error cometió?', 'Ese producto da x² − 16, no x² + 16', ['Ninguno, la factorización es correcta', 'Debía escribir (x + 8)(x − 8)', 'Debía escribir (x + 4)(x + 4)']],
    [5, '¿Para qué sirve factorizar al resolver x² − 5x + 6 = 0?', 'Para usar que un producto es cero solo si un factor es cero', ['Para que la ecuación tenga menos términos', 'Para poder dividir entre x en ambos lados', 'Para cambiar el signo de todos los términos']]] };
RAZ.cuadfact = { origen: `<p>Si dos números multiplicados dan 0, uno de ellos tiene que ser 0: no hay otra forma de obtener cero en una multiplicación. Por eso, en (x − 2)(x + 5) = 0, o bien x − 2 = 0, o bien x + 5 = 0.</p>
<p>Esto <b>solo</b> funciona con cero. Si (x − 1)(x − 2) = 6, no se puede decir que x − 1 = 6: podría ser 2 × 3, 1 × 6, 0.5 × 12…</p>
<p>¿Por qué hay dos soluciones? Porque un número y su opuesto tienen el mismo cuadrado: 3² = 9 y (−3)² = 9.</p>`,
  qs: [
    [2, '¿Por qué x² = 25 tiene dos soluciones?', 'Porque 5 y −5 al cuadrado dan 25', ['Porque toda ecuación tiene dos soluciones', 'Porque 25 es un número que se divide en dos', 'Porque el exponente 2 indica dos respuestas']],

RAZ.formulagen = { origen: `<p>La fórmula general sale de <b>completar el cuadrado</b>. En x² + 6x = 7 sumamos 9 en ambos lados para formar un binomio al cuadrado: x² + 6x + 9 = 16 → (x + 3)² = 16 → x + 3 = ±4 → x = 1 o x = −7. Si se hace lo mismo con letras (ax² + bx + c = 0), se obtiene x = (−b ± √(b² − 4ac)) ÷ 2a.</p>
<p>El discriminante b² − 4ac es lo que queda dentro de la raíz: si es negativo no hay número real cuya raíz se pueda sacar, y no hay soluciones reales.</p>`,
  qs: [

RAZ.probcuad = { origen: `<p>Un problema se vuelve cuadrático cuando la incógnita aparece <b>multiplicada por sí misma</b>: el área de un terreno (ancho × largo, y el largo depende del ancho), el producto de dos números consecutivos, o la altura de un objeto que cae (la gravedad hace que la distancia dependa de t²).</p>

RAZ.variacion = { origen: `<p>En y = 3x + 2, cada vez que x aumenta 1, y aumenta 3 (la pendiente): las diferencias son constantes. En y = x², al pasar de x a x + 1, y cambia en (x + 1)² − x² = 2x + 1, que crece con x: 1, 3, 5, 7… Esas diferencias aumentan siempre 2: la <b>segunda diferencia</b> es constante.</p>

RAZ.funcuad = { origen: `<p>En y = (x − 3)² + 2, el cuadrado (x − 3)² nunca es negativo: lo más pequeño que puede valer es 0, y eso ocurre solo cuando x = 3. Ahí y vale 2 y en cualquier otro punto vale más. Por eso el vértice (punto más bajo) es (3, 2).</p>
<p>La parábola es simétrica: sus dos cruces con el eje x están a la misma distancia del vértice. Por eso la x del vértice está justo a la mitad de las raíces; con la fórmula general, la mitad entre (−b + √Δ)/2a y (−b − √Δ)/2a es −b/2a.</p>`,
  qs: [

RAZ.algareas = { origen: `<p>Una fórmula relaciona cantidades que dependen unas de otras: si cambia una, cambian las demás. En V = l · a · h, si conoces V, l y a, la h es lo único que falta: queda una ecuación de una incógnita. Despejarla es resolver esa ecuación aplicando operaciones contrarias en ambos lados.</p>

RAZ.reparto3 = { origen: `<p>Un reparto proporcional es justo porque a cada unidad aportada (peso, hora, kilo) le toca lo mismo. Por eso primero se calcula la <b>constante</b>: total ÷ suma de las aportaciones, con unidades de “pesos por cada unidad aportada”. Luego cada quien recibe constante × lo que aportó: es el mismo análisis dimensional de las conversiones.</p>

RAZ.congsem = { origen: `<p>Con tres lados fijos, un triángulo solo se puede armar de una forma: es <b>rígido</b>. Por eso LLL basta para la congruencia. Con tres ángulos, en cambio, se fija la forma pero no el tamaño: hay triángulos grandes y pequeños con los mismos ángulos; por eso AAA es criterio de <b>semejanza</b>, no de congruencia.</p>

  qs: [
    [2, '¿Por qué AAA no basta para que dos triángulos sean congruentes?', 'Porque fija la forma pero no el tamaño', ['Porque los ángulos no se pueden medir bien', 'Porque sí basta, es criterio de congruencia', 'Porque se necesitan cuatro ángulos']],

RAZ.tales = { origen: `<p>A la misma hora, los rayos del sol llegan paralelos y con la misma inclinación. El poste, su sombra y el rayo forman un triángulo rectángulo con los mismos ángulos que el que forman tú, tu sombra y el rayo. Triángulos con los mismos ángulos son semejantes, así que sus lados son proporcionales: la razón altura ÷ sombra es igual en los dos.</p>

RAZ.pitagoras = { origen: `<p>Toma un cuadrado de lado a + b y coloca dentro cuatro copias del triángulo rectángulo de catetos a y b. Queda en medio un cuadrado inclinado de lado c. El área del cuadrado grande se puede contar de dos formas: (a + b)² = 4 · (ab/2) + c². Desarrollando: a² + 2ab + b² = 2ab + c², y restando 2ab en ambos lados: <b>a² + b² = c²</b>.</p>

RAZ.trigo = { origen: `<p>Todos los triángulos rectángulos que tienen un ángulo de 30° son semejantes (sus ángulos son 30°, 60° y 90°). Por eso, en todos, el cateto opuesto al ángulo de 30° mide <b>exactamente la mitad</b> de la hipotenusa, sin importar el tamaño. Esa razón fija, 0.5, es el seno de 30°.</p>

RAZ.volprismas = { origen: `<p>Un prisma se llena por capas iguales a la base: con h capas de altura 1, el volumen es (área de la base) × h. Para la pirámide, el experimento lo muestra: una pirámide llena de arena cabe exactamente 3 veces en el prisma con la misma base y altura. Lo mismo pasa entre el cono y el cilindro. Por eso pirámide y cono llevan ÷ 3.</p>
<p>Las unidades confirman: cm² de la base × cm de altura = cm³.</p>`,
  qs: [
    [2, '¿Por qué el volumen de un prisma es área de la base × altura?', 'Porque se apilan capas iguales a la base', ['Porque se suman todas las caras del prisma', 'Porque el prisma tiene cuatro lados', 'Porque así se calcula el perímetro']],
    [3, '¿De dónde sale el ÷ 3 del cono?', 'Un cono cabe 3 veces en su cilindro', ['El cono tiene 3 partes: base, lado y punta', 'Se divide entre 3 porque π ≈ 3', 'Es un ajuste para redondear el resultado']],
    [4, 'Al calcular el volumen de un cono, Ana usó la generatriz (lado inclinado) como altura. ¿Qué pasa?', 'Obtiene más volumen del real', ['Obtiene exactamente el mismo volumen', 'Obtiene la mitad del volumen real', 'Obtiene el área en lugar del volumen']],
    [5, 'Si duplicas el radio de un cilindro y mantienes la altura, su volumen:', 'Se multiplica por 4', ['Se duplica', 'Se multiplica por 8', 'No cambia']]] };
RAZ.esfera = { origen: `<p>Arquímedes comparó tres cuerpos con el mismo radio r y altura 2r: un cono, una esfera y un cilindro. Encontró que sus volúmenes están en razón 1 : 2 : 3. El cilindro mide π r² · 2r = 2π r³; la esfera son 2/3 de eso: (4/3) π r³.</p>
<p>El volumen lleva r³ porque es un espacio de tres dimensiones: si duplicas el radio, el volumen se multiplica por 2 × 2 × 2 = 8. El área lleva r² (dos dimensiones): se multiplica por 4.</p>`,
  qs: [
    [2, '¿Por qué el volumen de la esfera lleva r³ y no r²?', 'Porque mide un espacio de tres dimensiones', ['Porque la esfera tiene tres capas', 'Porque se divide entre 3', 'Porque π tiene tres cifras']],
    [3, 'Si el radio de una pelota se duplica, su volumen:', 'Se multiplica por 8', ['Se duplica', 'Se multiplica por 4', 'Se multiplica por 6']],
    [4, 'Una esfera cabe justo en un cilindro de 300 cm³. ¿Cuánto mide la esfera y por qué?', '200 cm³: es 2/3 del cilindro', ['100 cm³: es 1/3 del cilindro', '300 cm³: ocupa todo el cilindro', '150 cm³: es la mitad del cilindro']],
    [5, 'Un alumno obtuvo que una canica de 1 cm de radio tiene 4 189 cm³. ¿Qué concluyes?', 'Hay un error: debería tener unos 4.19 cm³', ['Que la canica es de un material denso', 'Que el resultado es correcto', 'Que la canica está hueca']]] };
RAZ.solidos = { origen: `<p>Al girar una figura alrededor de un eje, cada punto describe un círculo. Por eso un rectángulo que gira sobre un lado genera un cilindro (todos sus puntos están a la misma distancia del eje) y un triángulo rectángulo genera un cono (la distancia al eje se reduce hasta cero en la punta).</p>
<p>Para hacer la etiqueta de una lata, el rectángulo debe dar la vuelta completa: su largo es la circunferencia, 2πr. Por eso el área lateral es 2πr × h.</p>`,
  qs: [
    [2, '¿Por qué un rectángulo que gira sobre un lado genera un cilindro?', 'Porque sus puntos giran a la misma distancia del eje', ['Porque el rectángulo tiene cuatro lados iguales', 'Porque al girar se convierte en un círculo plano', 'Porque los cilindros siempre tienen esquinas']],
    [3, '¿Por qué el rectángulo del desarrollo del cilindro mide 2πr de largo?', 'Porque debe rodear toda la circunferencia', ['Porque es el doble del diámetro', 'Porque es el área de la tapa', 'Porque π es el largo de cualquier lata']],
    [4, 'Un poliedro con 6 caras y 8 vértices, ¿cuántas aristas tiene según Euler?', '12, porque 6 + 8 − 12 = 2', ['14, porque se suman caras y vértices', '10, porque se restan 4', '24, porque se multiplican']],

RAZ.graficas3 = { origen: `<p>Una gráfica traduce números a tamaños: el ojo compara alturas, ángulos o pendientes. Por eso la escala importa tanto: si el eje vertical empieza en 95 en lugar de 0, una diferencia de 4 unidades se ve como si una barra fuera el doble de la otra.</p>
<p>En una gráfica circular el círculo completo es el 100% (360°), así que cada 1% ocupa 3.6°: el tamaño de cada rebanada es proporcional a su porcentaje.</p>`,
  qs: [
    [2, '¿Por qué una gráfica de barras debe empezar su eje vertical en cero?', 'Para que la altura sea proporcional a la cantidad', ['Para que las barras se vean más altas', 'Porque las cantidades siempre son positivas', 'Para que quepan todas las categorías']],
    [3, 'En una gráfica circular, ¿cuántos grados ocupa el 25%?', '90°, porque es la cuarta parte de 360°', ['25°, el mismo número del porcentaje', '45°, la mitad del ángulo recto', '180°, la mitad del círculo']],
    [4, 'Una gráfica circular muestra porcentajes que suman 110%. ¿Qué concluyes?', 'Está mal hecha: deben sumar 100%', ['Que hubo más personas de las esperadas', 'Que una categoría se repite dos veces', 'Que está bien si se redondeó']],

RAZ.dispersion = { origen: `<p>La media dice dónde está el “centro”, pero no qué tan parecidos son los datos entre sí. La desviación media lo mide: promedia qué tan lejos está cada dato de la media. Se toman las distancias sin signo porque, si se dejaran los signos, los de arriba y los de abajo se cancelarían y siempre daría 0 (la media es justamente el punto de equilibrio).</p>`,
  qs: [
    [2, '¿Por qué dos grupos con la misma media pueden ser muy distintos?', 'Porque sus datos pueden estar más o menos dispersos', ['Porque la media se calcula de forma distinta', 'Porque tienen distinto número de datos', 'No pueden: misma media, mismos datos']],
    [3, '¿Por qué en la desviación media se usan distancias sin signo?', 'Porque con signo se cancelan y siempre da 0', ['Porque los números negativos no existen en estadística', 'Para que el resultado sea un número entero', 'Porque así se obtiene la mediana']],
    [4, 'Para elegir al jugador más constante, ¿qué medida conviene comparar?', 'La desviación media', ['La media', 'La moda', 'El dato mayor']],
    [5, 'En los sueldos 8, 9, 9, 10 y 60 mil, ¿qué describe mejor el sueldo típico?', 'La mediana, porque el 60 no la afecta', ['La media, porque usa todos los datos', 'El rango, porque es el más grande', 'La suma, porque incluye a todos']]] };
RAZ.conteo = { origen: `<p>Con 3 camisas y 4 pantalones, para <b>cada</b> camisa hay 4 opciones de pantalón: 4 + 4 + 4 = 3 × 4 = 12 combinaciones. Por eso las opciones de etapas sucesivas se multiplican (principio multiplicativo). Un diagrama de árbol lo muestra: cada rama se abre en tantas como opciones tiene la siguiente etapa.</p>
<p>La probabilidad clásica (favorables ÷ posibles) solo vale si todos los resultados son igual de probables; por eso con dos dados se cuentan 36 parejas ordenadas y no 11 sumas.</p>`,
  qs: [
    [2, '¿Por qué con 3 camisas y 4 pantalones hay 12 combinaciones y no 7?', 'Porque cada camisa se combina con los 4 pantalones', ['Porque se suman las prendas y se agregan 5', 'Porque 12 es el doble de 3 + 4 − 1', 'Porque cada pantalón solo va con una camisa']],
    [3, 'Al lanzar dos dados, ¿por qué no todas las sumas son igual de probables?', 'Porque cada suma se forma con distinto número de parejas', ['Porque los dados están cargados siempre', 'Porque las sumas grandes salen menos por peso', 'Sí son igual de probables todas']],
    [4, 'Un alumno dice que P(suma 2) = 1/11 porque hay 11 sumas posibles. ¿Qué error comete?', 'Las 11 sumas no son igual de probables', ['Ninguno, hay 11 sumas posibles', 'Debió decir 1/12, por los dos dados', 'Debió decir 2/11, por los dos unos']],
    [5, '¿Qué crece más rápido: agregar una letra o un dígito a una contraseña?', 'Una letra: multiplica por 26 y no por 10', ['Un dígito: los números son más seguros', 'Igual: los dos agregan una posición', 'Un dígito: multiplica por 26']]] };
RAZ.reglasuma = { origen: `<p>Si dos eventos no pueden ocurrir a la vez, sus casos favorables son grupos separados: contar los de uno y luego los del otro no repite ninguno, así que las probabilidades se suman. Si sí pueden ocurrir juntos, los casos comunes se cuentan dos veces y hay que restarlos una vez.</p>
<p>Un evento y su complemento cubren todos los casos sin repetir: P(A) + P(no A) = 1.</p>`,
  qs: [
    [2, '¿Por qué P(A) + P(no A) = 1?', 'Porque juntos cubren todos los casos sin repetir', ['Porque toda probabilidad vale un medio', 'Porque A siempre ocurre una vez', 'Porque la suma de probabilidades es 100']],
    [3, '¿Por qué hay que restar P(A y B) cuando los eventos se traslapan?', 'Porque los casos comunes se contaron dos veces', ['Porque así el resultado queda más pequeño', 'Porque los eventos son independientes', 'No hay que restar nada nunca']],
    [4, 'Un alumno obtuvo P(A o B) = 1.2. ¿Qué concluyes?', 'Hay un error: ninguna probabilidad pasa de 1', ['Que A y B son muy probables', 'Que los eventos son excluyentes', 'Que hay que dividir entre 2']],
    [5, 'Sacar par y sacar 4 en un dado, ¿son mutuamente excluyentes?', 'No: el 4 cumple las dos cosas', ['Sí: son eventos distintos', 'Sí: tienen distinta probabilidad', 'No: porque 4 es mayor que 3']]] };
RAZ.reglaproducto = { origen: `<p>Con una moneda y un dado hay 2 × 6 = 12 resultados igual de probables. Solo uno es (sol, 6), así que P = 1/12 = 1/2 × 1/6. La regla del producto es el principio multiplicativo aplicado a probabilidades.</p>
<p>Si el primer evento cambia lo que queda (sacar sin regresar), la segunda probabilidad se calcula con lo que queda: con 3 rojas de 5, después de sacar una roja quedan 2 rojas de 4.</p>`,
  qs: [
    [2, '¿Por qué P(sol y 6) = 1/2 × 1/6?', 'Porque de 12 resultados iguales solo 1 cumple', ['Porque siempre se multiplican las probabilidades', 'Porque 1/2 + 1/6 es demasiado', 'Porque la moneda y el dado se suman']],
    [3, '¿Qué cambia si sacas dos canicas sin regresar la primera?', 'La segunda probabilidad, porque quedan menos', ['Nada, las probabilidades son las mismas', 'Solo cambia el color de la canica', 'La primera probabilidad se duplica']],

RAZ.juegojusto = { origen: `<p>Un juego es justo si, jugando muchas veces, ningún jugador gana más que otro en promedio. Si las probabilidades son iguales, basta que los premios sean iguales. Si no, el premio debe compensar: lo que espera ganar cada jugador es (probabilidad × premio), y esas cantidades deben ser iguales.</p>`,

    [2, 'Ana gana si sale 1 o 2 en un dado; Beto si sale 3, 4, 5 o 6. ¿Por qué no es justo?', 'Porque Beto tiene 4 casos y Ana solo 2', ['Porque Ana eligió los números menores', 'Porque el dado favorece a los pares', 'Sí es justo: cada quien tiene números']],

RAZ.qu_propiedades = { origen: `<p>Si cortas un trozo de aluminio a la mitad, cada mitad tiene la mitad de la masa y la mitad del volumen; el cociente masa ÷ volumen no cambia. Por eso la densidad es intensiva: describe al <b>material</b>, no al objeto. Un objeto flota cuando su densidad es menor que la del líquido porque, a igual volumen, pesa menos que el líquido que desplaza.</p>`,
  qs: [
    [2, '¿Por qué un clavo se hunde y un barco de hierro flota?', 'El barco encierra aire: su densidad promedio es menor', ['El barco es más grande y por eso flota', 'El hierro del barco es de otra clase', 'El agua de mar empuja solo a los barcos']],
    [3, 'Si partes un trozo de madera a la mitad, su densidad:', 'No cambia, porque masa y volumen bajan igual', ['Se reduce a la mitad junto con la masa', 'Se duplica porque el volumen es menor', 'Depende de qué mitad se mida primero']],
    [4, 'Un alumno calculó ρ = V ÷ m y obtuvo mL/g. ¿Qué indica la unidad?', 'Que invirtió la fórmula: deben ser g/mL', ['Que el resultado es correcto así', 'Que debe multiplicar por 1000', 'Que la sustancia es un gas']],
    [5, 'El hielo flota en agua. ¿Qué dice eso de su densidad?', 'Es menor que la del agua líquida', ['Es mayor que la del agua líquida', 'Es exactamente igual a la del agua', 'No tiene relación con flotar']]] };
RAZ.qu_concentracion = { origen: `<p>Un porcentaje es una razón “por cada 100”. Decir que el alcohol para heridas está al 70% v/v significa que cada 100 mL de la botella tienen 70 mL de alcohol. Esa frase completa se escribe como factor de conversión ${frS('70 mL de alcohol', '100 mL de disolución')}, y con ella se resuelve cualquier cantidad por análisis dimensional.</p>
<p>Se divide entre la <b>disolución</b> (soluto + disolvente) porque el porcentaje describe la mezcla completa que tienes en la mano.</p>`,
  qs: [
    [2, '¿Qué significa “vinagre al 5% v/v”?', '5 mL de ácido en cada 100 mL de vinagre', ['5 mL de ácido en cada 100 mL de agua', '5 g de ácido en cada litro de vinagre', '5 partes de vinagre y 95 de agua']],
    [3, '¿Por qué se divide entre la masa de la disolución y no del disolvente?', 'Porque el porcentaje describe toda la mezcla', ['Porque el disolvente no tiene masa', 'Porque así el resultado sale más grande', 'Porque el soluto ya no está en el agua']],
    [4, 'Si duplicas el agua sin agregar soluto, la concentración:', 'Disminuye, aunque el soluto sea el mismo', ['Se duplica junto con el agua', 'No cambia porque el soluto es igual', 'Aumenta porque hay más disolución']],
    [5, 'Juan dice que 2 L de refresco al 10% de azúcar tienen el doble de concentración que 1 L. ¿Es cierto?', 'No: tienen el doble de azúcar, pero igual concentración', ['Sí: más volumen significa más concentración', 'Sí: el porcentaje se suma al juntar litros', 'No: tienen la mitad de concentración']]] };
RAZ.qu_ppm = { origen: `<p>Un litro de agua tiene 1 kg de masa, es decir 1 000 000 mg. Si en ese litro hay 1 mg de una sustancia, hay 1 parte en un millón: 1 ppm. Por eso, en agua, ppm y mg/L son lo mismo.</p>
<p>Las ppm se usan porque los contaminantes pueden dañar en cantidades muy pequeñas; escribirlos como porcentaje daría números con muchos ceros.</p>`,

    [2, '¿Por qué en agua 1 ppm equivale a 1 mg/L?', 'Porque 1 L de agua pesa un millón de mg', ['Porque los mg y los L son la misma unidad', 'Porque el agua no tiene masa', 'Porque así lo indica la etiqueta']],

RAZ.qu_atomo = { origen: `<p>El número de protones define al elemento: todo átomo con 6 protones es carbono. Un átomo neutro tiene tantos electrones como protones porque las cargas (+) y (−) se equilibran. Los electrones casi no tienen masa (unas 1 800 veces menos que un protón); por eso el número de masa solo cuenta protones y neutrones, y neutrones = A − Z.</p>`,

    [2, '¿Por qué el número de masa no incluye los electrones?', 'Porque su masa es casi nula frente a los protones', ['Porque los electrones no existen en el núcleo', 'Porque los electrones tienen carga negativa', 'Porque se cuentan aparte en el número atómico']],

RAZ.qu_lewis = { origen: `<p>Los electrones internos están protegidos cerca del núcleo; los de la última capa son los que “ven” otros átomos. Por eso solo ellos participan en enlaces y se dibujan en Lewis. Los gases nobles, con 8 en la última capa, casi no reaccionan: esa configuración es muy estable, y los demás átomos tienden a alcanzarla ganando, perdiendo o compartiendo electrones.</p>`,
  qs: [
    [2, '¿Por qué en Lewis solo se dibujan los electrones de valencia?', 'Porque solo esos participan en los enlaces', ['Porque los demás no tienen carga', 'Porque así cabe el dibujo en la hoja', 'Porque los internos están en el núcleo']],
    [3, '¿Por qué el sodio pierde un electrón en lugar de ganar siete?', 'Le cuesta mucho menos energía perder uno', ['Porque el sodio no puede ganar electrones', 'Porque los metales no tienen valencia', 'Porque siete electrones no caben en el átomo']],

RAZ.qu_alimentos = { origen: `<p>Los valores 4, 4 y 9 kcal/g se midieron quemando alimentos en un calorímetro (un recipiente con agua cuyo calentamiento se mide). Las grasas aportan más del doble que los carbohidratos porque sus moléculas tienen más enlaces C–H, que liberan mucha energía al oxidarse. Como cada valor es “kcal por cada gramo”, funciona como factor de conversión.</p>`,
  qs: [
    [2, '¿Por qué los factores 4, 4 y 9 kcal/g sirven como factores de conversión?', 'Expresan energía por cada gramo de nutriente', ['Son números de la suerte de los nutriólogos', 'Indican los gramos que tiene cada porción', 'Son el porcentaje de cada nutriente']],
    [3, '¿Por qué hay que revisar el tamaño de la porción de la etiqueta?', 'Porque los datos son por porción, no por paquete', ['Porque la porción es siempre de 100 g', 'Porque el paquete no tiene energía', 'Porque las porciones no tienen calorías']],
    [4, '10 g de grasa y 20 g de azúcar, ¿cuál aporta más energía?', 'Son casi iguales: 90 contra 80 kcal', ['El azúcar, porque es el doble de gramos', 'La grasa, porque aporta 10 veces más', 'Ninguno aporta energía']],
    [5, 'Si comes más energía de la que gastas de forma constante, el cuerpo:', 'La guarda, sobre todo como grasa', ['La elimina por completo al dormir', 'La convierte en agua y la desecha', 'La transforma en proteínas siempre']]] };
RAZ.qu_reaccion = { origen: `<p>En una reacción solo se rompen y forman enlaces: los núcleos de los átomos no cambian. Por eso entran y salen los mismos átomos, y la masa total se conserva. Cuando parece que la masa “desaparece” (al quemar madera), es porque los productos son gases que escapan; en un recipiente cerrado la balanza no cambia.</p>
<p>Al balancear solo se cambian coeficientes (cuántas moléculas), porque cambiar un subíndice cambia la sustancia.</p>`,
  qs: [
    [2, '¿Por qué la masa se conserva en una reacción química?', 'Los átomos solo se reacomodan', ['Los átomos se destruyen y se crean igual', 'La energía se convierte en masa', 'Solo se conserva en reacciones lentas']],
    [3, 'Al quemar un papel, la ceniza pesa menos. ¿Se violó la ley?', 'No: parte de la masa se fue en gases', ['Sí: la masa se destruyó con el fuego', 'Sí: el fuego no tiene masa', 'No: la ceniza pesa igual que el papel']],
    [4, 'Para balancear H₂ + O₂ → H₂O, un alumno escribió H₂O₂. ¿Qué error cometió?', 'Cambió el subíndice y con ello la sustancia', ['Ninguno, así queda balanceada', 'Debió escribir H₄O₂ en el producto', 'Debió quitar el oxígeno de la reacción']],

RAZ.qu_acidobase = { origen: `<p>El pH cuenta cuántas veces se divide la concentración de H⁺ entre 10: pH 1 es una décima, pH 2 una centésima, pH 3 una milésima… Por eso cada unidad de pH es un factor de 10, no una suma. Al mezclar un ácido con una base, sus H⁺ y OH⁻ se unen en agua y las propiedades de ambos desaparecen: neutralización.</p>`,

function viewGuide() {

<li><b>Equivocarte es parte del método.</b> Cuando falles, lee la solución paso a paso y marca dónde estuvo el error. Después pide “uno parecido”.</li>
<li><b>Pide ayuda en orden:</b> primero la pista, luego el primer paso, y solo si sigues atorado, “Tengo duda”.</li>

<li><b>Entiende de dónde sale cada regla.</b> Lee “¿De dónde sale?” en cada lección y explícalo en tu cuaderno. Las preguntas con 🧠 no se resuelven con fórmula: hay que razonar.</li>
<li><b>Antes de calcular, predice:</b> ¿el resultado debe ser mayor o menor? ¿en qué unidades? Al terminar, revisa si es razonable (un ciclista no va a 450 m/s).</li>

<div class="card"><h2>Para mamá, papá o tutor</h2><ul class="guide"><li>Revisen juntos la pantalla <b>Progreso</b> una vez por semana. Lo importante no es solo el porcentaje de aciertos, sino que el nivel avance y que los temas dominados se mantengan en los repasos.</li><li><b>Señales de alerta:</b> temas en “Refuerza”, muchas ayudas sin mejora, o “Seguro” con bajo acierto (cree que sabe, pero no).</li><li>Si se atora, pídanle que les explique el ejemplo guiado en voz alta en lugar de darle la respuesta.</li><li>Feliciten el esfuerzo y la constancia (racha de días), no solo los resultados.</li><li>Pueden imprimir el reporte de progreso para llevarlo a la escuela.</li></ul></div>
<div class="card"><h2>Fundamentos pedagógicos de la app</h2><ul class="guide">
<li><b>Aprendizaje para el dominio</b> (Bloom): no se avanza de nivel hasta mostrar dominio consistente.</li>
<li><b>Zona de desarrollo próximo y andamiaje</b> (Vygotsky): la dificultad se ajusta para que el reto sea alcanzable; las pistas y la explicación guiada sostienen sin resolver por el alumno.</li>
<li><b>Ejemplos resueltos y desvanecimiento:</b> primero se observan soluciones paso a paso, luego se practica con apoyo y al final sin él.</li>
<li><b>Comprensión antes que receta:</b> cada regla y fórmula se construye desde su significado (“¿De dónde sale?”), y 30% de las preguntas piden razonar: por qué funciona, encontrar el error, estimar si el resultado es razonable o predecir.</li>
<li><b>Autoexplicación:</b> antes de practicar se pide explicar la idea con palabras propias; explicar obliga a entender.</li>
<li><b>Práctica de recuperación:</b> responder sin mirar fortalece la memoria más que releer.</li>
<li><b>Corrección del error con reintento diferido:</b> la pregunta fallada vuelve tres preguntas después para confirmar que se corrigió el concepto.</li>
<li><b>Evaluación con criterio:</b> nivelado = nivel 4 con 80% de aciertos; calificación estimada y simulacros sin pistas alineados a la meta de 9.</li>
<li><b>Reactivos sin pistas de forma:</b> distractores plausibles y de longitud similar a la respuesta, y variantes de verdadero/falso para que no se acierte por descarte superficial.</li>
<li><b>Repaso espaciado</b> (curva del olvido): los temas dominados regresan a intervalos crecientes.</li>

  let done = false;

  /* iPad/iPhone como app instalada (pantalla de inicio): la hoja para compartir permite “Guardar en Archivos”. */
  if (!done && navigator.canShare && (navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches))) {
    try { const file = new File([data], fn, { type: 'application/json' }); if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Avance Secundaria 3.°' }); done = true; } } catch (e) { done = e && e.name === 'AbortError' ? 'cancel' : false; }
    if (done === 'cancel') return;

  modal(`<h2>💾 Avance guardado</h2><p>Archivo: <b>${esc(fn)}</b></p><p class="small">Incluye el avance de todas las materias. En iPad, si aparece el aviso, toca <b>Descargar</b>: queda en Archivos › Descargas. Para seguir en otro dispositivo: envía el archivo y en esa app usa <b>Ajustes → Cargar avance desde archivo</b>.</p><p class="small mut">Si no apareció ninguna descarga, usa “Ver texto del respaldo” en Ajustes.</p><div class="acts"><button class="btn pri" data-close>Listo</button></div>`);

/* ---- Calificación estimada (escala SEP 5-10) y meta de 9 ----
   Por tema: 10 × aciertos recientes × factor de dificultad del nivel (N1 0.6 · N2 0.7 · N3 0.8 · N4 0.95 · N5 1.0).
   Un 9 exige nivel 4 o más con ≥95% de aciertos, o nivel 5 con ≥90%. Si hay simulacro en los últimos 30 días, pesa 50%. */
const META = 9, LVF = [0.6, 0.7, 0.8, 0.95, 1];
function topicGrade(s) { if (!s || s.att < 3) return null; let g = 10 * acc(s, 10) * LVF[s.lvl - 1]; if (s.mastered) g = Math.max(g, 9); return Math.max(5, Math.round(g * 10) / 10); }
function lastBim(sid) { const e = (prof().exams || []).filter(x => x.bim === sid).slice(-1)[0]; return e || null; }
function subjGrade(sid) {
  const seen = seenTopics(sid); if (!seen.length) return null;
  const gs = seen.map(t => topicGrade(peek(t.id))); const known = gs.filter(g => g !== null);
  const lb = lastBim(sid), recentBim = lb && Date.now() - lb.d < 30 * DAY ? lb.g : null;
  if (!known.length && recentBim === null) return { g: null, cov: 0, n: seen.length, bim: lb };
  const tAvg = known.length ? known.reduce((a, b) => a + b, 0) / known.length : null;
  const g = tAvg === null ? recentBim : recentBim === null ? tAvg : (tAvg + recentBim) / 2;
  return { g: Math.round(g * 10) / 10, cov: known.length / seen.length, n: seen.length, bim: lb, weak: seen.filter(t => { const x = topicGrade(peek(t.id)); return x === null || x < META; }) };
}
const gradeCls = g => g === null ? '' : g >= META ? 'ok' : g >= 8 ? 'rev' : 'bad';
function gradeChip(sid) { const G = subjGrade(sid); if (!G || G.g === null) return '<span class="st">Calificación: sin datos</span>'; return `<span class="st ${gradeCls(G.g)}" title="Calificación estimada">${G.g >= META ? '🎯' : '📈'} ${fmt(G.g, 1)}${G.cov < 1 ? ` · ${Math.round(G.cov * 100)}% evaluado` : ''}</span>`; }
function gradeBox(sid) {
  const G = subjGrade(sid); if (!G) return '';
  if (G.g === null) return `<div class="card gradebox"><b>Calificación estimada: sin datos todavía.</b> <span class="small mut">Se calcula con tu práctica de los temas vistos en clase y con los simulacros de examen. Meta: ${META} o más.</span></div>`;
  const w = (G.weak || []).slice(0, 4);
  return `<div class="card gradebox ${gradeCls(G.g)}"><div class="row"><div class="gnum">${fmt(G.g, 1)}</div><div style="flex:1"><b>Calificación estimada</b> · meta ${META} o más<br><span class="small mut">${G.cov < 1 ? `Basada en ${Math.round(G.cov * 100)}% de los temas vistos (los temas sin práctica no cuentan todavía). ` : ''}${G.bim ? `Último simulacro: ${fmt(G.bim.g, 1)} (${new Date(G.bim.d).toLocaleDateString('es-MX')}).` : 'Aún no haces un simulacro de examen.'}</span>${G.g < META && w.length ? `<br><span class="small">Para subir: ${w.map(t => `<a href="#/tema/${t.id}/practica">${t.title}</a>`).join(' · ')}</span>` : ''}</div></div></div>`;
}

function phash(str, salt) { let h1 = 0xdeadbeef ^ 7, h2 = 0x41c6ce57 ^ 7; const s = salt + '|' + str; for (let i = 0; i < s.length; i++) { const ch = s.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909); return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36); }

function subjStats(sid) {

function habits() {

let MAIL_SIG = '', MAIL_BUSY = false;
async function postJSON(url, body) {
  try { const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body, redirect: 'follow' }); const t = await r.text(); let j = {}; try { j = JSON.parse(t); } catch (e) { } return j.ok ? { ok: true, j } : { ok: false, err: j.error || 'respuesta inesperada del servicio' }; }
  catch (e) { // algunos navegadores (o la app abierta como archivo) no permiten leer la respuesta: se envía sin confirmación
    try { await fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body }); return { ok: true, unconfirmed: true }; }
    catch (e2) { return { ok: false, err: 'sin conexión a internet' }; } }
}
async function mailSend(force, action) {
  const url = mailURL(), c = mailCfg(); if (!url) return { ok: false, err: 'falta la dirección del servicio' };
  if (MAIL_BUSY || !Object.keys(DB.profiles).length) return { ok: false, err: 'no hay alumnos registrados' };
  if (!c.on && !force) return { ok: false };
  if (!force && typeof navigator !== 'undefined' && navigator.onLine === false) return { ok: false };
  const body = JSON.stringify(mailPayload(action)), sig = body.replace(/"sent":"[^"]*"/, '');
  if (!force && sig === MAIL_SIG && Date.now() - (c.ok || 0) < 30 * 60000) return { ok: true };
  MAIL_BUSY = true;
  try { const r = await postJSON(url, body); if (r.ok) { c.ok = Date.now(); c.err = ''; c.unconfirmed = !!r.unconfirmed; MAIL_SIG = sig; if (r.j && r.j.estado) c.srv = r.j.estado; } else c.err = r.err; save(); return r; }
  finally { MAIL_BUSY = false; }
}
function mailBeacon() { const url = mailURL(), c = mailCfg(); if (!url || !c.on || typeof navigator === 'undefined' || !navigator.sendBeacon || !Object.keys(DB.profiles).length) return; try { navigator.sendBeacon(url, new Blob([JSON.stringify(mailPayload())], { type: 'text/plain;charset=utf-8' })); } catch (e) { } }
if (typeof window !== 'undefined' && typeof document !== 'undefined') {
  setTimeout(() => mailSend(), 5000);
  setInterval(() => mailSend(), 10 * 60000);
  window.addEventListener('online', () => mailSend());
  window.addEventListener('hashchange', () => setTimeout(() => mailSend(), 1500));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') mailBeacon(); else mailSend(); });
}

/* ---- Configuración en la sección de padres ---- */
function mailCard() {
  const c = mailCfg(), fx = t => t ? new Date(t).toLocaleString('es-MX', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : 'todavía no';
  const rb = (v, l) => `<label class="chk"><input type="radio" name="mfreq" value="${v}" ${c.freq === v ? 'checked' : ''}> ${l}</label>`;
  const dsel = [1, 2, 3, 4, 5, 6, 0].map(d => `<label class="small" style="margin-right:10px"><input type="checkbox" data-mday="${d}" ${(c.days || []).includes(d) ? 'checked' : ''}> ${DOW[d].slice(0, 3)}</label>`).join('');
  const hours = Array.from({ length: 18 }, (_, i) => i + 6).map(h => `<option value="${h}" ${c.hour === h ? 'selected' : ''}>${h}:00 h</option>`).join('');
  return `<div class="card"><h2>📧 Reporte de avance por correo</h2>
<p>Si lo activas, recibirás en tu correo un resumen de lo que practicó cada alumno: tiempo, preguntas, aciertos por materia, temas en los que subió de nivel, simulacros y calificación estimada. Funciona en iPad, iPhone, celular Android o PC: actívalo en <b>cada equipo</b> donde el alumno estudie y el correo sumará lo de todos. El equipo solo necesita internet de vez en cuando (al abrir la app, al terminar o al cerrarla).</p>
<label class="chk" style="font-size:1.05rem"><input type="checkbox" id="mailon" ${c.on ? 'checked' : ''}> <b>Quiero recibir el reporte por correo</b></label>
<div class="grid g2" style="margin-top:10px">
<div><h4>¿Cada cuándo?</h4>${rb('diario', 'Todos los días')}${rb('habiles', 'De lunes a viernes')}${rb('dias', 'Solo estos días:')}<div style="margin:4px 0 8px 28px">${dsel}</div>${rb('semanal', 'Una vez por semana (resumen de 7 días), el')}<div style="margin:4px 0 8px 28px"><select id="mwday" class="inp">${[1, 2, 3, 4, 5, 6, 0].map(d => `<option value="${d}" ${c.wday === d ? 'selected' : ''}>${DOW[d]}</option>`).join('')}</select></div></div>
<div><h4>¿A qué hora?</h4><select id="mhour" class="inp">${hours}</select><p class="small mut">El correo llega a esa hora o unos minutos después (el servicio revisa cada 15 minutos).</p>
<label class="chk"><input type="checkbox" id="mempty" ${c.empty ? 'checked' : ''}> Avisarme también cuando no haya practicado</label>
<h4>Nombre de este equipo</h4><input id="mdev" class="inp" style="width:100%" value="${esc(c.devName)}" maxlength="30"><p class="small mut">Aparece en el correo para saber desde dónde estudió.</p></div></div>
<h4>Dirección del servicio</h4><input id="mailurl" class="inp" style="width:100%" value="${esc(mailURL())}" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" autocapitalize="off" spellcheck="false">
<p class="small mut">Se obtiene una sola vez al instalar el servicio en tu cuenta de Google (ver el instructivo “Reporte por correo”). Es la misma dirección en todos los equipos.</p>
<div class="acts"><button class="btn pri" data-act="mailsave">Guardar configuración</button><button class="btn" data-act="mailtest">Enviar un correo de prueba ahora</button></div>
${c.srv ? `<p class="small" style="padding:8px;border-radius:8px;background:${c.srv.disparador && !c.srv.error ? '#F0FDF4' : '#FEF2F2'}">Servicio en Google: ${c.srv.disparador ? '✅ revisión automática activa' + (c.srv.ultimaRevision ? ` (última revisión ${esc(c.srv.ultimaRevision)})` : ' (todavía no se ha ejecutado)') : '⚠️ <b>la revisión automática NO está activa</b>: en el editor del script ejecuta la función <code>instalar</code>'}${c.srv.ultimoCorreo ? ` · último correo programado: ${esc(c.srv.ultimoCorreo)}` : ''}${c.srv.error ? ` · <b>error:</b> ${esc(c.srv.error)}` : ''}</p>` : ''}<p class="small">Estado: <b>${c.on ? `activado · ${freqText(c)} · próximo correo ${nextSendText(c)}` : 'desactivado'}</b><br><span class="mut">Última sincronización de este equipo: ${fx(c.ok)}${c.err ? ` · último intento con problema: ${esc(c.err)}` : ''}${c.unconfirmed && !c.err ? ' (el navegador no permitió confirmar la respuesta)' : ''}</span></p></div>`;
}
function readMailForm() {
  const c = mailCfg(), f = ($('input[name=mfreq]:checked') || {}).value || c.freq;
  const u = (($('#mailurl') || {}).value || '').trim();
  if (u && !/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) { toast('La dirección debe empezar con https://script.google.com/ y terminar en /exec.', 4000); return null; }
  const days = [...document.querySelectorAll('[data-mday]')].filter(x => x.checked).map(x => +x.dataset.mday);
  const on = !!($('#mailon') || {}).checked;
  if (on && !u && !MAIL_DEFAULT_URL) { toast('Para activar el reporte, captura la dirección del servicio.', 4000); return null; }
  if (on && f === 'dias' && !days.length) { toast('Elige al menos un día.', 3000); return null; }
  Object.assign(c, { on, url: u, freq: f, days, wday: +(($('#mwday') || {}).value || 0), hour: +(($('#mhour') || {}).value || 21), empty: !!($('#mempty') || {}).checked, devName: ((($('#mdev') || {}).value || '').trim() || guessDevice()).slice(0, 30), at: Date.now() });
  save(); return c;
}
Object.assign(ACT, {
  mailsave: async () => {
    if (!parentOpen()) return toast('Solo desde la sección de padres.');
    const c = readMailForm(); if (!c) return;
    if (!mailURL()) { render(); return toast('Configuración guardada.'); }
    toast('Guardando y sincronizando…'); const r = await mailSend(true); render();
    toast(r.ok ? (c.on ? `✅ Listo. Próximo correo: ${nextSendText(c)}.` : '✅ Reporte por correo desactivado.') : `⚠️ Se guardó en este equipo, pero no se pudo avisar al servicio (${r.err}). Se reintentará solo.`, 5000);
  },
  mailtest: async () => {
    if (!parentOpen()) return toast('Solo desde la sección de padres.');
    const c = readMailForm(); if (!c) return; if (!mailURL()) return toast('Primero captura la dirección del servicio.');
    if (!c.on) return toast('Activa primero la casilla “Quiero recibir el reporte por correo”.', 3500);
    toast('Enviando correo de prueba…'); const r = await mailSend(true, 'test'); render();
    toast(r.ok ? (r.unconfirmed ? '📨 Solicitud enviada. Revisa tu correo en un minuto.' : '📨 Correo de prueba enviado. Revisa tu bandeja (y la de spam).') : `⚠️ No se pudo: ${r.err}.`, 5000);
  }
});
{ const _pc = parentConfig; parentConfig = function () { return _pc() + mailCard(); }; }
