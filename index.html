TOPICS.push({
  id: 'tendencia', eje: 'dat', title: 'Medidas de tendencia central y dispersión',
  nem: 'Medidas de tendencia central (media, mediana, moda) y de dispersión (rango y desviación media).',
  formula: 'Media = suma ÷ cantidad de datos · Mediana = dato central (ordenados) · Moda = dato más frecuente · Rango = máximo − mínimo · Desviación media = Σ|xᵢ − media| ÷ n',
  lesson: `
<h4>Medidas de tendencia central</h4>
<p>Describen un “valor típico” del conjunto de datos. Ejemplo con las calificaciones 6, 8, 9, 8, 10, 7, 8:</p>
<ul><li><b>Media</b> (promedio): suma ÷ número de datos = 56 ÷ 7 = 8.</li>
<li><b>Mediana</b>: ordena (6, 7, 8, 8, 8, 9, 10) y toma el de en medio → 8. Si hay un número par de datos, es el promedio de los dos centrales.</li>
<li><b>Moda</b>: el que más se repite → 8. Puede haber más de una o ninguna.</li></ul>
<h4>Medidas de dispersión</h4>
<p>Dicen qué tan separados están los datos.</p>
<ul><li><b>Rango</b> = mayor − menor = 10 − 6 = 4.</li>
<li><b>Desviación media</b>: el promedio de las distancias de cada dato a la media.</li></ul>
<div class="ex"><b>Ejemplo de desviación media:</b> datos 4, 6, 8, 10, 12 (media 8).
<ol><li>Distancias a la media: |4−8| = 4, |6−8| = 2, 0, 2, 4.</li><li>Suma: 12. Divide entre 5: DM = 2.4.</li></ol>
En promedio, los datos se alejan 2.4 unidades de la media.</div>
<h4>¿Cuál usar?</h4>
<p>Si hay un dato muy extremo (un sueldo enorme, una calificación de 0), la media se distorsiona y la <b>mediana</b> representa mejor al grupo. Dos grupos pueden tener la misma media y ser muy distintos: la dispersión lo revela.</p>
<div class="warn"><b>Errores comunes</b><ul><li>Calcular la mediana sin ordenar los datos.</li><li>Confundir la moda con el dato más grande.</li><li>En la desviación media, sumar distancias con signo (se cancelan y dan 0).</li></ul></div>
<div class="life"><b>¿Para qué sirve?</b> Promedios escolares, comparar rendimiento de equipos, salarios, control de calidad en la industria.</div>`,
  gen(L) {
    if (L === 1) { const n = R(5, 7), m = R(5, 40); let a; do { a = Array.from({ length: n - 1 }, () => R(Math.max(1, m - 10), m + 10)); a.push(n * m - a.reduce((s, x) => s + x, 0)); } while (a[n - 1] < 1); a = shuffle(a);
      return num(`Calcula la media de: ${listStr(a)}`, m, { hint: 'Suma todos los datos y divide entre cuántos son.', sol: [`Suma: ${a.join(' + ')} = ${n * m}`, `${n * m} ÷ ${n} = ${B(m)}`] }); }
    if (L === 2) { const n = pick([5, 6, 7, 8, 9]); const a = Array.from({ length: n }, () => R(1, 50)); const s = a.slice().sort((x, y) => x - y); const med = n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2;
      return num(`Calcula la mediana de: ${listStr(a)}`, med, { hint: 'Ordena de menor a mayor y busca el centro. Si hay dos centrales, promédialos.', errs: [{ v: a[Math.floor(n / 2)], m: 'Tomaste el dato del centro sin ordenar primero.' }], sol: [`Ordenados: ${listStr(s)}`, n % 2 ? `Dato central (posición ${(n + 1) / 2}): ${B(fmt(med))}` : `Centrales: ${s[n / 2 - 1]} y ${s[n / 2]} → (${s[n / 2 - 1]} + ${s[n / 2]}) ÷ 2 = ${B(fmt(med))}`] }); }
    if (L === 3) { const mo = R(5, 30); let a = Array.from({ length: 6 }, () => R(1, 40)).filter(x => x !== mo); a = a.concat([mo, mo, mo]); const cnt = {}; a.forEach(x => cnt[x] = (cnt[x] || 0) + 1); if (Object.values(cnt).filter(c => c >= 3).length > 1) return this.gen(3); a = shuffle(a);
      if (Math.random() < 0.5) return num(`¿Cuál es la moda de: ${listStr(a)}?`, mo, { hint: 'Busca el dato que más se repite.', sol: [`${mo} aparece ${cnt[mo]} veces, más que cualquier otro.`, `Moda: ${B(mo)}`] });
      const mx = Math.max(...a), mn = Math.min(...a); return num(`¿Cuál es el rango de: ${listStr(a)}?`, mx - mn, { hint: 'Rango = dato mayor − dato menor.', sol: [`Mayor: ${mx}; menor: ${mn}`, `${mx} − ${mn} = ${B(mx - mn)}`] }); }
    if (L === 4) { const n = R(4, 6), m = R(5, 20); let a; do { a = Array.from({ length: n - 1 }, () => R(m - 8, m + 8)); a.push(n * m - a.reduce((s, x) => s + x, 0)); } while (a[n - 1] < 0 || Math.abs(a[n - 1] - m) > 10); a = shuffle(a);
      const ds = a.map(x => Math.abs(x - m)); const S = ds.reduce((s, x) => s + x, 0); const dm = rnd(S / n, 2);
      return num(`Calcula la desviación media de: ${listStr(a)} (redondea a centésimos).`, dm, { tol: 0.011, hint: 'Paso 1: la media. Paso 2: la distancia de cada dato a la media (sin signo). Paso 3: el promedio de esas distancias.', errs: [{ v: 0, m: 'Si sumas las diferencias con signo se cancelan. Usa el valor absoluto (distancias).' }], sol: [`Media: ${a.reduce((s, x) => s + x, 0)} ÷ ${n} = ${m}`, `Distancias: ${a.map(x => `|${x}−${m}| = ${Math.abs(x - m)}`).join('; ')}`, `Suma: ${S}; ${S} ÷ ${n} = ${B(fmt(dm))}`] }); }
    if (Math.random() < 0.55) { const n = R(4, 6), target = R(7, 9); const a = Array.from({ length: n - 1 }, () => R(6, 10)); const need = n * target - a.reduce((s, x) => s + x, 0); if (need < 5 || need > 10) return this.gen(5);
      return num(`Las calificaciones de Paola son ${listStr(a)}. Falta un examen. ¿Qué calificación necesita para que su promedio final de los ${n} exámenes sea ${target}?`, need, { hint: `El total de puntos debe ser ${n} × ${target}.`, sol: [`Total necesario: ${n} × ${target} = ${n * target}`, `Lleva: ${a.reduce((s, x) => s + x, 0)}`, `Necesita: ${n * target} − ${a.reduce((s, x) => s + x, 0)} = ${B(need)}`] }); }
    const m = R(6, 9); const A = [m - 1, m, m, m + 1, m]; const Bg = [m - 3, m + 3, m - 2, m + 2, m];
    return mc(`Dos equipos tienen las mismas medias (${m} goles). Equipo A: ${listStr(A)}. Equipo B: ${listStr(Bg)}. ¿Qué afirmación es correcta?`, 'El equipo A es más regular (menor dispersión)', ['El equipo B es más regular (menor dispersión)', 'Ambos son igual de regulares porque tienen la misma media', 'No se puede comparar'], { hint: 'Compara el rango o la desviación media de cada equipo.', sol: [`Rango A: ${m + 1} − ${m - 1} = 2; rango B: ${m + 3} − ${m - 3} = 6`, `DM A = ${fmt(A.reduce((s, x) => s + Math.abs(x - m), 0) / 5)}; DM B = ${fmt(Bg.reduce((s, x) => s + Math.abs(x - m), 0) / 5)}`, B('A está menos disperso → más regular.')] });
  }
});

TOPICS.push({
  id: 'graficas', eje: 'dat', title: 'Tablas de frecuencia, histogramas y polígonos',
  nem: 'Organización de datos en tablas de frecuencias absolutas y relativas; histogramas, polígonos de frecuencia y gráficas de línea.',
  formula: 'Frecuencia relativa = frecuencia ÷ total · Porcentaje = fr × 100 · Marca de clase = (límite inferior + límite superior) ÷ 2 · Media agrupada = Σ(f · marca) ÷ n',
  lesson: `
<h4>Datos agrupados</h4>
<p>Cuando hay muchos datos se agrupan en <b>intervalos (clases)</b> del mismo ancho. Ejemplo: estaturas en cm en clases [140, 150), [150, 160), … El corchete “[” incluye el valor; el paréntesis “)” no lo incluye.</p>
<table class="tb"><tr><th>Clase</th><th>Frecuencia (f)</th><th>Frecuencia relativa</th><th>Marca de clase</th></tr><tr><td>[140, 150)</td><td>4</td><td>4/20 = 0.20 (20%)</td><td>145</td></tr><tr><td>[150, 160)</td><td>9</td><td>0.45 (45%)</td><td>155</td></tr><tr><td>[160, 170)</td><td>7</td><td>0.35 (35%)</td><td>165</td></tr><tr><td>Total</td><td>20</td><td>1 (100%)</td><td></td></tr></table>
<h4>Histograma y polígono de frecuencias</h4>
<p>El <b>histograma</b> dibuja una barra por clase, <b>sin espacios</b> entre ellas porque los intervalos son continuos. El <b>polígono de frecuencias</b> une con líneas los puntos medios de la parte superior de las barras (las marcas de clase).</p>
${barsSVG({ labels: ['140–150', '150–160', '160–170'], values: [4, 9, 7], poly: true, title: 'Estatura (cm)' })}
<h4>Media de datos agrupados</h4>
<p>Se usa la marca de clase como representante: (4·145 + 9·155 + 7·165) ÷ 20 = 3 130 ÷ 20 = 156.5 cm.</p>
<div class="warn"><b>Errores comunes</b><ul><li>Dejar huecos entre barras de un histograma.</li><li>Calcular la frecuencia relativa dividiendo entre el número de clases en lugar del total de datos.</li><li>Olvidar que las frecuencias relativas deben sumar 1 (100%).</li></ul></div>
<div class="life"><b>¿Para qué sirve?</b> Encuestas, resultados de exámenes, estudios de salud y de población (INEGI), control de producción.</div>`,
  gen(L) {
    const k = R(4, 6), w = pick([5, 10, 2, 20]), s = pick([0, 10, 20, 140, 40, 50]).valueOf(); const f = Array.from({ length: k }, () => R(1, 12));
    const ctx = pick([['Estatura (cm)', 'alumnos', 'Cuántos'], ['Minutos de traslado', 'alumnos', 'Cuántos'], ['Edad (años)', 'personas', 'Cuántas'], ['Puntos en un examen', 'alumnos', 'Cuántos']]);
    const lab = f.map((_, i) => `${s + i * w}–${s + (i + 1) * w}`); const n = f.reduce((a, b) => a + b, 0);
    const fig = barsSVG({ labels: lab, values: f, poly: L >= 3 && Math.random() < 0.5, title: ctx[0] });
    const i = R(0, k - 1); const cls = `[${s + i * w}, ${s + (i + 1) * w})`;
    if (L === 1) return num(`Observa el histograma. ¿${ctx[2]} ${ctx[1]} hay en la clase ${cls}?`, f[i], { fig, hint: 'Busca la barra de esa clase y lee su altura en el eje vertical.', sol: [`La barra ${cls} llega a ${f[i]}.`, `Respuesta: ${B(f[i])}`] });
    if (L === 2) return num(`Observa el histograma. ¿${ctx[2]} ${ctx[1]} se registraron en total?`, n, { fig, hint: 'Suma las frecuencias de todas las barras.', sol: [`${f.join(' + ')} = ${B(n)}`] });
    if (L === 3) { const p = rnd(f[i] / n * 100, 1); return num(`Observa la gráfica. ¿Qué porcentaje de ${ctx[1]} está en la clase ${cls}? (redondea a un decimal)`, p, { fig, unit: '%', tol: 0.051, hint: 'Frecuencia de la clase ÷ total × 100.', errs: [{ v: rnd(f[i] / k * 100, 1), m: 'Dividiste entre el número de clases; hay que dividir entre el total de datos.' }], sol: [`Total: ${n}`, `${f[i]} ÷ ${n} × 100 = ${B(fmt(p) + '%')}`] }); }
    if (L === 4) { if (Math.random() < 0.5) return num(`¿Cuál es la marca de clase del intervalo ${cls}?`, s + i * w + w / 2, { fig, hint: 'Promedio de los límites del intervalo.', sol: [`(${s + i * w} + ${s + (i + 1) * w}) ÷ 2 = ${B(fmt(s + i * w + w / 2))}`] });
      let acc = 0, mi = 0; for (let j = 0; j < k; j++) { acc += f[j]; if (acc >= n / 2) { mi = j; break; } }
      const allC = f.map((_, j) => `[${s + j * w}, ${s + (j + 1) * w})`);
      return mc(`Observa el histograma. ¿En qué clase se encuentra la mediana?`, allC[mi], allC.filter((_, j) => j !== mi), { fig, hint: `Hay ${n} datos. Acumula las frecuencias hasta llegar a la mitad (${fmt(n / 2)}).`, sol: [`Frecuencias acumuladas: ${f.map((_, j) => f.slice(0, j + 1).reduce((a, b) => a + b, 0)).join(', ')}`, `La mitad (${fmt(n / 2)}) se alcanza en ${B(allC[mi])}`] }); }
    const marks = f.map((_, j) => s + j * w + w / 2); const S = f.reduce((a, fj, j) => a + fj * marks[j], 0); const m = rnd(S / n, 1);
    const tbl = `<table class="tb sm"><tr><th>Clase</th>${f.map((_, j) => `<td>[${s + j * w}, ${s + (j + 1) * w})</td>`).join('')}</tr><tr><th>f</th>${f.map(x => `<td>${x}</td>`).join('')}</tr></table>`;
    return num(`Calcula la media de los datos agrupados (redondea a un decimal):${tbl}`, m, { tol: 0.051, hint: 'Multiplica cada frecuencia por su marca de clase, suma todo y divide entre el total.', sol: [`Marcas: ${marks.map(v => fmt(v)).join(', ')}`, `Σ f·marca = ${f.map((x, j) => `${x}·${fmt(marks[j])}`).join(' + ')} = ${fmt(S)}`, `${fmt(S)} ÷ ${n} = ${B(fmt(m))}`] });
  }
});

TOPICS.push({
  id: 'probabilidad', eje: 'dat', title: 'Probabilidad',
  nem: 'Probabilidad clásica y frecuencial; eventos complementarios y mutuamente excluyentes.',
  formula: 'P(A) = casos favorables ÷ casos posibles · 0 ≤ P(A) ≤ 1 · P(no A) = 1 − P(A) · Excluyentes: P(A o B) = P(A) + P(B) · Frecuencial = veces que ocurrió ÷ total de intentos',
  lesson: `
<h4>Probabilidad clásica (teórica)</h4>
<p>Si todos los resultados son igual de probables:</p>
<p class="c"><b>P(evento) = casos favorables ÷ casos posibles</b></p>
<div class="ex"><b>Ejemplo:</b> al lanzar un dado, P(número par) = 3/6 = 1/2 (favorables: 2, 4, 6).</div>
<p>La probabilidad va de 0 (evento <b>imposible</b>) a 1 (evento <b>seguro</b>). Se puede escribir como fracción, decimal o porcentaje: 1/4 = 0.25 = 25%.</p>
<h4>Complemento</h4>
<p>P(que <b>no</b> ocurra A) = 1 − P(A). Si P(llover) = 0.3, P(no llover) = 0.7.</p>
<h4>Eventos mutuamente excluyentes</h4>
<p>No pueden ocurrir a la vez (sacar 2 y sacar 5 en un mismo dado). Entonces P(A o B) = P(A) + P(B) = 1/6 + 1/6 = 1/3.</p>
<h4>Dos dados o dos monedas</h4>
<p>Haz una tabla o un diagrama de árbol. Con dos dados hay 6 × 6 = 36 resultados. La suma 7 sale de 6 formas: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1) → P = 6/36 = 1/6.</p>
<h4>Probabilidad frecuencial</h4>
<p>Es la que se obtiene experimentando: veces que ocurrió ÷ número de intentos. Si lanzas una moneda 200 veces y salen 108 águilas, la probabilidad frecuencial es 108/200 = 0.54. <b>Mientras más repeticiones, más se acerca a la teórica</b> (0.5).</p>
<div class="warn"><b>Errores comunes</b><ul><li>Pensar que después de 5 soles “ya toca” águila: cada lanzamiento es independiente.</li><li>Olvidar contar (2,5) y (5,2) como resultados distintos.</li><li>Dar probabilidades mayores que 1.</li></ul></div>
<div class="life"><b>¿Para qué sirve?</b> Pronóstico del clima, seguros, juegos, decisiones con riesgo, control de calidad.</div>`,
  gen(L) {
    if (L === 1) { const ev = pick([['un número par', [2, 4, 6]], ['un número impar', [1, 3, 5]], ['un número mayor que 4', [5, 6]], ['un número menor que 3', [1, 2]], ['un múltiplo de 3', [3, 6]], ['un número primo', [2, 3, 5]], ['un número mayor que 1', [2, 3, 4, 5, 6]], ['el número 4', [4]]]);
      return num(`Al lanzar un dado normal, ¿cuál es la probabilidad de obtener ${ev[0]}? (Escribe una fracción, por ejemplo 1/6)`, ev[1].length / 6, { tol: 0.002, hint: 'Cuenta los resultados favorables y divide entre 6.', sol: [`Favorables: ${ev[1].join(', ')} → ${ev[1].length}`, `P = ${frRaw(ev[1].length, 6)} = ${B(fr(ev[1].length, 6))}`] }); }
    const r = R(1, 9), a = R(1, 9), v = R(1, 9), T = r + a + v; const cols = [['roja', r], ['azul', a], ['verde', v]];
    const urn = `Una bolsa tiene ${r} canicas rojas, ${a} azules y ${v} verdes. Se saca una al azar.`;
    if (L === 2) { const c = pick(cols); return num(`${urn} ¿Cuál es la probabilidad de que sea ${c[0]}?`, c[1] / T, { tol: 0.002, hint: 'Favorables: las canicas de ese color. Posibles: todas las canicas.', errs: [{ v: c[1] / (T - c[1]), m: 'El denominador es el total de canicas, incluyendo las de ese color.' }], sol: [`Total: ${r} + ${a} + ${v} = ${T}`, `P = ${frRaw(c[1], T)} = ${B(fr(c[1], T))}`] }); }
    if (L === 3) { if (Math.random() < 0.5) { const c = pick(cols); return num(`${urn} ¿Cuál es la probabilidad de que <b>no</b> sea ${c[0]}?`, (T - c[1]) / T, { tol: 0.002, hint: 'P(no A) = 1 − P(A).', sol: [`P(${c[0]}) = ${fr(c[1], T)}`, `P(no ${c[0]}) = 1 − ${fr(c[1], T)} = ${B(fr(T - c[1], T))}`] }); }
      const [c1, c2] = shuffle(cols); return num(`${urn} ¿Cuál es la probabilidad de que sea ${c1[0]} <b>o</b> ${c2[0]}?`, (c1[1] + c2[1]) / T, { tol: 0.002, hint: 'Son eventos mutuamente excluyentes: suma sus probabilidades.', sol: [`P(${c1[0]}) + P(${c2[0]}) = ${frRaw(c1[1], T)} + ${frRaw(c2[1], T)}`, `= ${B(fr(c1[1] + c2[1], T))}`] }); }
    if (L === 4) { if (Math.random() < 0.65) { const s = R(2, 12); const ways = []; for (let i = 1; i <= 6; i++) for (let j = 1; j <= 6; j++) if (i + j === s) ways.push(`(${i},${j})`);
        return num(`Se lanzan dos dados. ¿Cuál es la probabilidad de que la suma sea ${s}?`, ways.length / 36, { tol: 0.002, hint: 'Hay 36 resultados posibles. Cuenta las parejas ordenadas que suman ese número.', errs: [{ v: 1 / 11, m: 'Las 11 sumas posibles no son igual de probables. Cuenta parejas ordenadas de 36.' }], sol: [`Parejas: ${ways.join(', ')} → ${ways.length}`, `P = ${frRaw(ways.length, 36)} = ${B(fr(ways.length, 36))}`] }); }
      const e = pick([['dos águilas', 1], ['un águila y un sol (en cualquier orden)', 2], ['al menos un águila', 3]]); return num(`Se lanzan dos monedas. ¿Cuál es la probabilidad de obtener ${e[0]}?`, e[1] / 4, { tol: 0.002, hint: 'Resultados posibles: AA, AS, SA, SS.', sol: ['Espacio muestral: AA, AS, SA, SS (4 resultados)', `Favorables: ${e[1]}`, `P = ${B(fr(e[1], 4))}`] }); }
    const t = R(0, 2);
    if (t === 0) { const N = pick([100, 200, 250, 400, 500]); const k = Math.round(N * (0.4 + Math.random() * 0.2)); return num(`Se lanzó una moneda ${N} veces y cayó águila ${k} veces. ¿Cuál es la probabilidad frecuencial de águila? (en decimal)`, k / N, { tol: 0.002, hint: 'Veces que ocurrió ÷ total de lanzamientos.', sol: [`${k} ÷ ${N} = ${B(fmt(k / N))}`, `La teórica es 0.5; con más lanzamientos la frecuencial se acercaría a ella.`] }); }
    if (t === 1) { const N = pick([60, 120, 300, 600, 900]); const ev = pick([['un 6', 1], ['un número par', 3], ['un múltiplo de 3', 2]]); return num(`Si lanzas un dado ${N} veces, ¿cuántas veces esperas obtener ${ev[0]}?`, N * ev[1] / 6, { hint: 'Multiplica el número de lanzamientos por la probabilidad teórica.', sol: [`P = ${fr(ev[1], 6)}`, `${N} × ${fr(ev[1], 6)} = ${B(fmt(N * ev[1] / 6))} veces (aproximadamente)`] }); }
    const k = R(3, 6); return mc(`Una moneda cayó sol ${k} veces seguidas. En el siguiente lanzamiento:`, 'La probabilidad de águila sigue siendo 1/2', ['Es más probable que caiga águila', 'Es más probable que vuelva a caer sol', 'La probabilidad de águila es 1'], { hint: '¿La moneda “recuerda” lo que pasó antes?', sol: ['Cada lanzamiento es independiente: la moneda no tiene memoria.', B('P(águila) = 1/2') + ' en cada lanzamiento. Creer lo contrario se llama “falacia del jugador”.'] });
  }
});

bankTopic({ id: 'hi_conquista', eje: 'hcol', m: 1, title: 'La caída de México-Tenochtitlan',

  lesson: lesson({ k: 'La caída de México-Tenochtitlan en 1521 no fue obra solo de unos cientos de españoles: fue posible por las alianzas con pueblos indígenas sometidos por los mexicas, las epidemias y la tecnología militar.',

    er: ['Pensar que los españoles vencieron solos: miles de guerreros indígenas fueron decisivos.', 'Ignorar el papel de las epidemias.'],
    v: 'Para comprender el origen del México mestizo y pluricultural.' }),
  qs: [
    [1, '¿En qué año cayó México-Tenochtitlan?', '1521', ['1492', '1519', '1810'], 'El 13 de agosto de 1521.'],
    [1, '¿Quién encabezó la expedición española que llegó a Tenochtitlan?', 'Hernán Cortés', ['Cristóbal Colón', 'Francisco Pizarro', 'Miguel Hidalgo'], 'Cortés desembarcó en Veracruz en 1519.'],
    [2, '¿Qué pueblo fue el principal aliado de los españoles contra los mexicas?', 'Los tlaxcaltecas', ['Los mayas', 'Los purépechas', 'Los incas'], 'Tlaxcala era enemiga de los mexicas.'],
    [2, '¿Quién fue el último tlatoani mexica que defendió Tenochtitlan?', 'Cuauhtémoc', ['Moctezuma Xocoyotzin', 'Netzahualcóyotl', 'Tláloc'], 'Resistió el sitio hasta su captura en 1521.'],
    [3, 'Malintzin (la Malinche) tuvo un papel importante porque:', 'Fue intérprete y mediadora entre españoles e indígenas', ['Gobernó Tlaxcala', 'Dirigió el ejército mexica', 'Escribió el Tratado de Tordesillas'], 'Hablaba náhuatl y maya, y aprendió español.'],
    [3, 'La “Noche Triste” se refiere a:', 'La huida de los españoles de Tenochtitlan en 1520', ['La caída de Tenochtitlan', 'La muerte de Cuauhtémoc', 'La llegada de Colón'], 'Los españoles sufrieron una dura derrota al escapar.'],
    [4, '¿Por qué la viruela fue decisiva en la conquista?', 'Los indígenas no tenían defensas contra esa enfermedad y murieron masivamente', ['Solo afectó a los españoles', 'Curaba heridas', 'Se usó como arma química a propósito por Moctezuma'], 'La epidemia debilitó a la población y a sus líderes.'],
    [4, '¿Por qué muchos pueblos se aliaron con Cortés?', 'Estaban sometidos a pagar tributo a los mexicas y buscaban liberarse', ['Porque eran españoles', 'Porque Cortés les pagaba en oro', 'Porque querían ser cristianos'], 'Vieron una oportunidad de terminar el dominio mexica.'],
    [5, '¿Qué combinación de factores explica mejor la caída de Tenochtitlan?', 'Alianzas indígenas, epidemias y tecnología militar europea', ['Solo la valentía de Cortés', 'Solo las armas de fuego', 'Un acuerdo pacífico con Moctezuma'], 'Fue un proceso con múltiples causas.'],
    [5, 'Hablar de “encuentro entre culturas” en lugar de solo “conquista” busca:', 'Reconocer que hubo intercambios y también violencia entre pueblos distintos', ['Negar que hubo guerra', 'Ignorar a los indígenas', 'Celebrar la viruela'], 'Es una forma de analizar el proceso con sus distintas dimensiones.']
  ] });

bankTopic({ id: 'hi_nuevaespana', eje: 'hcol', m: 2, title: 'La Nueva España: gobierno, economía y sociedad',

    er: ['Pensar que todos los habitantes tenían los mismos derechos: la sociedad de castas era muy desigual.', 'Olvidar la presencia africana en la historia de México.'],

    [1, '¿Cuál fue la principal riqueza que España obtuvo de la Nueva España?', 'La plata', ['El petróleo', 'El café', 'El hierro'], 'Zacatecas y Guanajuato eran grandes centros mineros.'],
    [2, 'Los criollos eran:', 'Hijos de españoles nacidos en América', ['Españoles nacidos en España', 'Indígenas', 'Personas africanas'], 'No tenían acceso a los cargos más altos, reservados a los peninsulares.'],

    [3, '¿Qué fue la “conquista espiritual”?', 'La evangelización de los pueblos indígenas por órdenes religiosas', ['Una guerra contra Portugal', 'La independencia de México', 'Una rebelión de los criollos'], 'Franciscanos, dominicos y agustinos difundieron el cristianismo.'],
    [4, 'Gaspar Yanga es recordado por:', 'Encabezar una rebelión de esclavizados africanos y fundar un pueblo libre', ['Ser virrey de la Nueva España', 'Descubrir minas de plata', 'Escribir la Constitución de 1824'], 'Su lucha logró reconocimiento para su comunidad a inicios del siglo XVII.'],

function lineSVG({ pts, xmax, ymax, xlab, ylab, xstep = 1, ystep, fill = false }) {
  const W = 340, H = 230, L = 46, Bm = 38, T = 12; ystep = ystep || Math.max(1, Math.round(ymax / 5));
  const X = x => L + (W - L - 14) * x / xmax, Y = y => T + (H - T - Bm) * (1 - y / ymax);
  let g = `<svg viewBox="0 0 ${W} ${H}" class="fig" role="img">`;
  for (let x = 0; x <= xmax + 1e-9; x += xstep) g += `<line x1="${X(x)}" x2="${X(x)}" y1="${Y(0)}" y2="${Y(ymax)}" class="gl"/><text x="${X(x)}" y="${Y(0) + 14}" class="tk">${fmt(x)}</text>`;
  for (let y = 0; y <= ymax + 1e-9; y += ystep) g += `<line x1="${X(0)}" x2="${X(xmax)}" y1="${Y(y)}" y2="${Y(y)}" class="gl"/><text x="${X(0) - 6}" y="${Y(y) + 4}" class="tk r">${fmt(y)}</text>`;
  if (fill) g += `<polygon points="${X(pts[0][0])},${Y(0)} ${pts.map(p => `${X(p[0])},${Y(p[1])}`).join(' ')} ${X(pts[pts.length - 1][0])},${Y(0)}" style="fill:#FCE7F3;stroke:none"/>`;
  g += `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(xmax)}" y2="${Y(0)}" class="ax"/><line x1="${X(0)}" y1="${Y(0)}" x2="${X(0)}" y2="${Y(ymax)}" class="ax"/>`;
  g += `<polyline points="${pts.map(p => `${X(p[0])},${Y(p[1])}`).join(' ')}" class="pl" style="stroke:#2563EB"/>` + pts.map(p => `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3.5" class="pt"/>`).join('');
  pts.forEach((p, i) => { if (i < pts.length - 1) g += `<text x="${(X(p[0]) + X(pts[i + 1][0])) / 2}" y="${Math.min(Y(p[1]), Y(pts[i + 1][1])) - 8}" class="tk b" style="fill:#EA580C">${String.fromCharCode(65 + i)}</text>`; });
  g += `<text x="${(W + L) / 2}" y="${H - 4}" class="tk">${xlab}</text><text x="11" y="${(H - Bm) / 2}" class="tk" transform="rotate(-90 11 ${(H - Bm) / 2})">${ylab}</text>`;
  return g + '</svg>';
}

  formula: 'SI: longitud m · masa kg · tiempo s · temperatura K · corriente A. Prefijos: k = 10³, c = 10⁻², m = 10⁻³, μ = 10⁻⁶. Conversiones con análisis dimensional (factores de conversión; 1 km = 1 000 m, 1 h = 3 600 s). Error porcentual = |medido − real| ÷ real × 100',
  lesson: `
<h4>Idea clave</h4>
<p>Una <b>magnitud</b> es todo lo que se puede medir: longitud, masa, tiempo, temperatura, rapidez. Medir es comparar contra una <b>unidad</b> acordada. Para que todos los científicos se entiendan se usa el <b>Sistema Internacional (SI)</b>.</p>
<table class="tb"><tr><th>Magnitud</th><th>Unidad SI</th><th>Instrumento</th></tr><tr><td>Longitud</td><td>metro (m)</td><td>regla, flexómetro, vernier</td></tr><tr><td>Masa</td><td>kilogramo (kg)</td><td>balanza</td></tr><tr><td>Tiempo</td><td>segundo (s)</td><td>cronómetro</td></tr><tr><td>Temperatura</td><td>kelvin (K)</td><td>termómetro</td></tr><tr><td>Corriente eléctrica</td><td>ampere (A)</td><td>amperímetro</td></tr></table>
<h4>Prefijos</h4>
<p>kilo (k) = 1 000 · centi (c) = 1/100 · mili (m) = 1/1 000 · micro (μ) = 1/1 000 000. Así, 2.5 km = 2 500 m; 350 g = 0.35 kg; 120 ms = 0.12 s.</p>
<h4>Escalares y vectores</h4>
<p>Algunas magnitudes solo necesitan un número y una unidad (<b>escalares</b>: masa, tiempo, temperatura). Otras necesitan además una <b>dirección</b> (<b>vectoriales</b>: velocidad, fuerza, desplazamiento).</p>
<h4>Toda medición tiene incertidumbre</h4>
<p>Si mides varias veces obtienes valores un poco distintos. El valor más confiable es el <b>promedio</b>. El <b>error porcentual</b> compara tu medición con el valor aceptado: |medido − real| ÷ real × 100.</p>
<h4>Conversión de unidades: análisis dimensional</h4>
<p>Para cambiar de unidad no se memorizan atajos: se multiplica el dato por <b>factores de conversión</b>. Un factor de conversión es una fracción formada con una equivalencia, por ejemplo ${frS('1 000 m', '1 km')}. Como 1 000 m y 1 km son la misma longitud, la fracción vale 1, y multiplicar por 1 no cambia la cantidad: solo cambia la unidad en que está escrita.</p>
<p>La regla para acomodar cada factor: la unidad que quieres <b>eliminar</b> debe quedar en el lado <b>contrario</b> al que está en el dato. Si km está arriba en el dato, en el factor km va abajo. Así las unidades iguales arriba y abajo se cancelan, igual que un número entre sí mismo da 1.</p>
<div class="ex"><b>Ejemplo resuelto:</b> un auto va a 72 km/h. ¿Cuántos m/s son?${daBlock({ v: 72, n: ['km'], d: ['h'] }, [{ n: [1000, 'm'], d: [1, 'km'] }, { n: [1, 'h'], d: [3600, 's'] }])}</div>
<div class="ex"><b>Otro ejemplo:</b> 7.6 g a kg.${daBlock({ v: 7.6, n: ['g'] }, [{ n: [1, 'kg'], d: [1000, 'g'] }])}</div>
<div class="warn"><b>Errores comunes</b><ul><li>Mezclar unidades en una misma fórmula (km con s, g con kg).</li><li>Pensar que el gramo es la unidad base de masa: es el kilogramo.</li><li>Escribir resultados sin unidad: “20” no dice nada; “20 m/s” sí.</li></ul></div>
${lab('Mide 5 veces el largo de tu mesa con una regla. ¿Salen exactamente iguales? Calcula el promedio y la diferencia entre la medida mayor y la menor.')}`,
  gen(L) {
    if (L === 1) return cq([
      ['¿Cuál es la unidad de <b>masa</b> en el Sistema Internacional?', 'kilogramo (kg)', ['gramo (g)', 'newton (N)', 'libra (lb)'], 'La unidad base de masa en el SI es el kilogramo. El newton mide fuerza.'],
      ['¿Cuál de estas magnitudes es <b>vectorial</b>?', 'Fuerza', ['Masa', 'Temperatura', 'Tiempo'], 'La fuerza necesita dirección y sentido para quedar descrita; masa, temperatura y tiempo solo un número.'],
      ['¿Qué instrumento mide la masa?', 'Balanza', ['Dinamómetro', 'Termómetro', 'Cronómetro'], 'La balanza compara masas. El dinamómetro mide fuerzas (por ejemplo, el peso).'],
      ['¿Cuál es la unidad SI de la temperatura?', 'kelvin (K)', ['grado Celsius (°C)', 'grado Fahrenheit (°F)', 'caloría (cal)'], 'En el SI la temperatura se mide en kelvin; el °C se usa mucho en la vida diaria.'],
      ['¿Cuál de estas magnitudes es <b>escalar</b>?', 'Temperatura', ['Velocidad', 'Fuerza', 'Desplazamiento'], 'La temperatura queda descrita solo con un número y su unidad.'],
      ['¿Qué significa el prefijo “mili” (m)?', 'Una milésima (1/1 000)', ['Mil veces', 'Un millón de veces', 'Una centésima'], 'mili = 10⁻³: 1 mm = 0.001 m.']]);
    if (L === 2) {
      const c = pick([['km', 'm', 1000], ['g', 'kg', 0.001], ['ms', 's', 0.001], ['cm', 'm', 0.01], ['mm', 'm', 0.001], ['h', 's', 3600], ['min', 's', 60], ['mg', 'g', 0.001]]); const v = ['h', 'min'].includes(c[0]) ? R(2, 12) : pick([R(2, 95), R(11, 99) / 10, R(100, 900)]); const r = rnd(v * c[2], 6);
      const da = dimAnalysis({ v, n: [c[0]] }, [daF(c[0], c[1], c[2])]);
      return num(`Convierte ${fmt(v)} ${c[0]} a ${c[1]}.`, r, { unit: c[1], hint: `${DA_HINT} Equivalencia: ${c[2] >= 1 ? `1 ${c[0]} = ${fmt(c[2])} ${c[1]}` : `1 ${c[1]} = ${fmt(rnd(1 / c[2], 9))} ${c[0]}`}.`, sol: da.steps });
    }
    if (L === 3) {
      if (Math.random() < 0.5) { const ms = R(2, 40); const kmh = rnd(ms * 3.6, 2); return num(`Un tren va a ${fmt(kmh)} km/h. ¿Cuál es su rapidez en m/s?`, ms, { unit: 'm/s', tol: 0.011, hint: `${DA_HINT} Equivalencias: 1 km = 1 000 m y 1 h = 3 600 s.`, sol: dimAnalysis({ v: kmh, n: ['km'], d: ['h'] }, [{ n: [1000, 'm'], d: [1, 'km'] }, { n: [1, 'h'], d: [3600, 's'] }]).steps }); }
      const ms = R(2, 40); return num(`Un ciclista va a ${ms} m/s. ¿Cuál es su rapidez en km/h?`, rnd(ms * 3.6, 2), { unit: 'km/h', tol: 0.011, hint: `${DA_HINT} Equivalencias: 1 km = 1 000 m y 1 h = 3 600 s.`, sol: dimAnalysis({ v: ms, n: ['m'], d: ['s'] }, [{ n: [1, 'km'], d: [1000, 'm'] }, { n: [3600, 's'], d: [1, 'h'] }]).steps });
    }
    if (L === 4) {
      const d = pick([0.8, 1, 2.7, 7.9, 8.9, 11.3, 13.6, 19.3, 0.92, 1.03]); const r = rnd(d * 1000, 4);
      return num(`La densidad de un material es ${fmt(d)} g/cm³. ¿Cuánto es en kg/m³?`, r, { unit: 'kg/m³', hint: `${DA_HINT} Equivalencias: 1 kg = 1 000 g y 1 m³ = 1 000 000 cm³.`, sol: dimAnalysis({ v: d, n: ['g'], d: ['cm³'] }, [{ n: [1, 'kg'], d: [1000, 'g'] }, { n: [1000000, 'cm³'], d: [1, 'm³'] }]).steps });
    }
    if (Math.random() < 0.5) { const real = pick([9.8, 343, 100, 1000, 3.14]); const e = pick([1, 2, 4, 5, 8, 10]) * (Math.random() < 0.5 ? 1 : -1); const med = rnd(real * (1 + e / 100), 3);
      return num(`En un experimento obtuviste ${fmt(med)} para una magnitud cuyo valor aceptado es ${fmt(real)}. ¿Cuál es el error porcentual?`, Math.abs(e), { unit: '%', tol: 0.06, hint: 'Error % = |medido − real| ÷ real × 100.', sol: [`|${fmt(med)} − ${fmt(real)}| = ${fmt(Math.abs(med - real), 4)}`, `${fmt(Math.abs(med - real), 4)} ÷ ${fmt(real)} × 100 = ${B(Math.abs(e) + '%')}`] }); }
    const base = R(150, 300) / 10; const ms = [0, 0, 0, 0].map(() => rnd(base + R(-4, 4) / 10, 1)); const avg = rnd(ms.reduce((a, b) => a + b, 0) / 4, 3);
    return num(`Cuatro alumnos midieron el largo de un libro: ${ms.map(v => fmt(v)).join(' cm, ')} cm. ¿Cuál es el valor más probable (promedio)? (redondea a centésimos)`, rnd(avg, 2), { unit: 'cm', tol: 0.011, hint: 'Suma las cuatro medidas y divide entre 4.', sol: [`Suma: ${fmt(ms.reduce((a, b) => a + b, 0), 2)} cm`, `÷ 4 = ${B(fmt(rnd(avg, 2)) + ' cm')}`] });
  }
});

TOPICS.push({
  id: 'densidad', eje: 'mat', title: 'Masa, volumen y densidad',
  nem: 'Estructura, propiedades y características de la materia: masa, volumen y densidad.',
  formula: 'ρ = m / V · m = ρ·V · V = m / ρ · Agua: 1 g/cm³ = 1 000 kg/m³ · 1 mL = 1 cm³ · 1 L = 1 000 cm³',
  lesson: `
<h4>Idea clave</h4>
<p>La <b>masa</b> es la cantidad de materia de un objeto (kg o g). El <b>volumen</b> es el espacio que ocupa (m³, cm³, L). La <b>densidad</b> dice cuánta masa hay en cada unidad de volumen:</p>
<p class="c"><b>ρ = m ÷ V</b></p>
<p>Un kilo de algodón y un kilo de plomo tienen la misma masa, pero el plomo ocupa mucho menos volumen: es más denso.</p>
<table class="tb"><tr><th>Material</th><th>Densidad (g/cm³)</th></tr><tr><td>Aceite</td><td>0.92</td></tr><tr><td>Hielo</td><td>0.92</td></tr><tr><td>Agua</td><td>1.00</td></tr><tr><td>Aluminio</td><td>2.7</td></tr><tr><td>Hierro</td><td>7.9</td></tr><tr><td>Cobre</td><td>8.9</td></tr><tr><td>Plomo</td><td>11.3</td></tr><tr><td>Oro</td><td>19.3</td></tr></table>
<h4>¿Flota o se hunde?</h4>
<p>Un objeto sólido <b>flota</b> en un líquido si su densidad es <b>menor</b> que la del líquido, y se hunde si es mayor. Por eso el hielo flota en el agua y una moneda se hunde.</p>
<div class="ex"><b>Ejemplo:</b> un cubo de 50 cm³ tiene 135 g de masa. ρ = 135 ÷ 50 = 2.7 g/cm³ → es aluminio, y se hunde en agua.</div>
<div class="warn"><b>Errores comunes</b><ul><li>Creer que los objetos grandes o pesados siempre se hunden. Un barco de acero flota porque su volumen total (con el aire de adentro) hace que su densidad promedio sea menor que la del agua.</li><li>Confundir masa con volumen.</li><li>Olvidar que la densidad de un material no depende del tamaño de la muestra.</li></ul></div>
${lab('Llena un vaso con agua y otro con agua y mucha sal disuelta. Pon un huevo crudo en cada uno. Antes de hacerlo, predice qué pasará. ¿Por qué cambia el resultado?')}`,
  gen(L) {
    const mats = [['aluminio', 2.7], ['hierro', 7.9], ['cobre', 8.9], ['plomo', 11.3], ['madera de pino', 0.5], ['corcho', 0.25], ['vidrio', 2.5], ['hielo', 0.92]];
    if (L === 1) { const m = pick(mats); const V = R(2, 40) * 5; const M = rnd(m[1] * V, 3); return num(`Un bloque tiene una masa de ${fmt(M)} g y un volumen de ${V} cm³. ¿Cuál es su densidad?`, m[1], { unit: 'g/cm³', tol: 0.011, hint: 'ρ = m ÷ V.', errs: [{ v: rnd(V / M, 4), m: 'Invertiste la fórmula: densidad es masa entre volumen.' }], sol: [`ρ = ${fmt(M)} g ÷ ${V} cm³`, `ρ = ${B(fmt(m[1]) + ' g/cm³')} (es ${m[0]})`] }); }
    if (L === 2) { const m = pick(mats); const V = R(2, 30) * 10; const M = rnd(m[1] * V, 3); return num(`¿Qué masa tiene una pieza de ${m[0]} (ρ = ${fmt(m[1])} g/cm³) de ${V} cm³?`, M, { unit: 'g', tol: tl(M), hint: 'En ρ = m ÷ V, la masa está dividida entre V: multiplica ambos lados por V para dejarla sola.', sol: despNum('ρ', 'm', 'V').concat([sust('m', `${fmt(m[1])} ${frS('g', 'cm³')} × ${V} cm³ (los cm³ se cancelan)`, B(fmt(M) + ' g'))]) }); }
    if (L === 3) { const m = pick(mats); const V = R(2, 30) * 10; const M = rnd(m[1] * V, 3); return num(`Una pieza de ${m[0]} (ρ = ${fmt(m[1])} g/cm³) tiene una masa de ${fmt(M)} g. ¿Cuál es su volumen?`, V, { unit: 'cm³', tol: tl(V), hint: 'En ρ = m ÷ V, el volumen está abajo: multiplica ambos lados por V y después divide ambos lados entre ρ.', errs: [{ v: rnd(M * m[1], 3), m: 'Multiplicaste; al despejar V queda la masa entre la densidad.' }], sol: despDen('ρ', 'm', 'V').concat([sust('V', `${frS(fmt(M) + ' g', fmt(m[1]) + ' g/cm³')} (g entre g se cancela; queda cm³)`, B(V + ' cm³'))]) }); }
    if (L === 4) {
      if (Math.random() < 0.5) { const Lt = R(2, 20); const d = pick([0.92, 1.03, 0.79, 1.26, 13.6]); const kg = rnd(Lt * d, 4); const n = { 0.92: 'aceite', 1.03: 'leche', 0.79: 'alcohol', 1.26: 'glicerina', 13.6: 'mercurio' }[d];
        return num(`${Lt} L de ${n} tienen una masa de ${fmt(kg)} kg. ¿Cuál es su densidad en g/cm³?`, d, { unit: 'g/cm³', tol: 0.011, hint: `Convierte con análisis dimensional (1 kg = 1 000 g; 1 L = 1 000 cm³) y luego usa ρ = m ÷ V.`, sol: [`Masa en gramos: ${daInline(kg, 'kg', 1000, 'g', 1)}`, `Volumen en cm³: ${daInline(Lt, 'L', 1000, 'cm³', 1)}`, `ρ = ${frS('m', 'V')} = ${frS(fmt(kg * 1000) + ' g', fmt(Lt * 1000) + ' cm³')} = ${B(fmt(d) + ' g/cm³')}`] }); }
      const a = R(2, 6), b = R(2, 6), c = R(2, 6); const m = pick(mats); const M = rnd(a * b * c * m[1], 3);
      return num(`Un bloque rectangular mide ${a} cm × ${b} cm × ${c} cm y su masa es ${fmt(M)} g. ¿Cuál es su densidad?`, m[1], { unit: 'g/cm³', tol: 0.011, hint: 'Primero calcula el volumen (largo × ancho × alto).', sol: [`V = ${a} × ${b} × ${c} = ${a * b * c} cm³`, `ρ = ${fmt(M)} ÷ ${a * b * c} = ${B(fmt(m[1]) + ' g/cm³')}`] });
    }
    const liq = pick([['agua', 1], ['aceite', 0.92], ['mercurio', 13.6], ['agua de mar', 1.03]]); const m = pick(mats); const fl = m[1] < liq[1];
    return mc(`Un objeto de ${m[0]} (ρ = ${fmt(m[1])} g/cm³) se coloca en ${liq[0]} (ρ = ${fmt(liq[1])} g/cm³). ¿Qué ocurre?`, fl ? 'Flota' : 'Se hunde', [fl ? 'Se hunde' : 'Flota', 'Depende del tamaño del objeto', 'Queda a la mitad, siempre'], { hint: 'Compara la densidad del objeto con la del líquido.', sol: [`${fmt(m[1])} ${fl ? '<' : '>'} ${fmt(liq[1])}: el objeto es ${fl ? 'menos' : 'más'} denso que el líquido.`, B(fl ? 'Flota' : 'Se hunde') + '. El tamaño no importa, porque la densidad del material es la misma.'] });
  }
});

TOPICS.push({
  id: 'particulas', eje: 'mat', title: 'Modelo de partículas y estados de agregación',
  nem: 'Estados de agregación de la materia y modelo cinético de partículas; cambios de estado.',
  formula: 'Sólido: partículas juntas y vibrando en su lugar · Líquido: juntas pero se deslizan · Gas: separadas y en movimiento rápido. Más temperatura = más energía cinética promedio de las partículas.',

<h4>El modelo cinético de partículas</h4>
<ol><li>La materia está formada por partículas muy pequeñas.</li><li>Entre las partículas hay espacio vacío.</li><li>Las partículas están en <b>movimiento constante</b>.</li><li>A mayor temperatura, mayor es la rapidez promedio de las partículas (mayor energía cinética).</li><li>Entre las partículas hay fuerzas de atracción.</li></ol>
<table class="tb"><tr><th></th><th>Sólido</th><th>Líquido</th><th>Gas</th></tr><tr><td>Forma</td><td>propia</td><td>la del recipiente</td><td>la del recipiente</td></tr><tr><td>Volumen</td><td>propio</td><td>propio</td><td>ocupa todo el recipiente</td></tr><tr><td>Partículas</td><td>muy juntas, vibran en su lugar</td><td>juntas, se deslizan</td><td>muy separadas, se mueven libremente</td></tr><tr><td>¿Se comprime?</td><td>casi nada</td><td>casi nada</td><td>sí, mucho</td></tr></table>

<p>Para fundir o evaporar se <b>absorbe</b> calor; para solidificar o condensar se <b>libera</b>. Durante el cambio de estado la temperatura se mantiene constante (el hielo que se derrite está a 0 °C hasta fundirse por completo).</p>

${lab('Pon una gota de colorante en un vaso con agua fría y otra en uno con agua caliente (con ayuda de un adulto). ¿En cuál se mezcla más rápido? Explícalo con el movimiento de las partículas.')}`,

      ['¿Qué estado tiene forma y volumen propios?', 'Sólido', ['Líquido', 'Gaseoso', 'Ninguno'], 'En el sólido las partículas mantienen posiciones fijas (vibran en su lugar).'],
      ['El paso de líquido a gas se llama:', 'Evaporación', ['Condensación', 'Fusión', 'Solidificación'], 'Líquido → gas es evaporación (o ebullición si ocurre en todo el líquido).'],
      ['El paso de sólido a líquido se llama:', 'Fusión', ['Solidificación', 'Sublimación', 'Condensación'], 'Sólido → líquido es fusión, como el hielo que se derrite.'],
      ['¿Qué ocurre con las partículas de un cuerpo cuando aumenta su temperatura?', 'Se mueven más rápido', ['Se hacen más grandes', 'Se detienen', 'Desaparecen'], 'La temperatura está relacionada con la energía cinética promedio de las partículas.'],
      ['¿Cuál de estos se puede comprimir con facilidad?', 'Un gas', ['Un sólido', 'Un líquido', 'Ninguno'], 'Entre las partículas de un gas hay mucho espacio vacío, por eso se comprime.'],

      ['La naftalina (bolitas contra polillas) se hace pequeña sin dejar líquido. Esto es:', 'Sublimación', ['Fusión', 'Evaporación', 'Condensación'], 'Pasa directamente de sólido a gas: sublimación.'],
      ['Mientras el hielo se derrite a 0 °C, si sigues calentando, su temperatura:', 'Se mantiene en 0 °C hasta que se funde todo', ['Sube de inmediato', 'Baja', 'Sube y baja'], 'La energía se usa para romper la estructura del sólido, no para subir la temperatura.'],
      ['Un perfume se huele en toda la habitación porque:', 'Sus partículas se mueven y se difunden en el aire', ['El aire empuja el olor en línea recta', 'Las partículas crecen', 'El olor no es materia'], 'Las partículas del perfume (gas) están en movimiento constante y se mezclan con el aire: difusión.'],

    return cq([
      ['Durante la ebullición del agua, la energía que recibe se usa principalmente para:', 'Separar las partículas (vencer las fuerzas de atracción)', ['Hacer más grandes las partículas', 'Subir la temperatura por encima de 100 °C', 'Crear partículas nuevas'], 'En el cambio de estado la temperatura se mantiene constante; la energía separa las partículas.'],
      ['¿Por qué una jeringa tapada con aire se puede comprimir pero con agua casi no?', 'En el gas hay mucho espacio entre partículas; en el líquido muy poco', ['El agua es más pesada', 'El aire no tiene masa', 'El agua está más caliente'], 'La compresibilidad depende del espacio vacío entre partículas.'],

TOPICS.push({
  id: 'presion', eje: 'mat', title: 'Presión en sólidos y fluidos',
  nem: 'Presión: relación fuerza-área, presión hidrostática y presión atmosférica.',
  formula: 'P = F / A (Pa = N/m²) · Presión hidrostática: P = ρ·g·h · 1 cm² = 0.0001 m² · Presión atmosférica al nivel del mar ≈ 101 325 Pa',
  lesson: `
<h4>Idea clave</h4>
<p>La <b>presión</b> mide qué tan concentrada está una fuerza sobre una superficie:</p>
<p class="c"><b>P = F ÷ A</b> &nbsp; (pascal: 1 Pa = 1 N/m²)</p>
<p>Con la misma fuerza, <b>menos área → más presión</b>. Por eso un cuchillo afilado corta mejor, y unas raquetas para nieve evitan que te hundas.</p>
<div class="ex"><b>Ejemplo:</b> una caja de 600 N apoyada en 0.5 m²: P = 600 ÷ 0.5 = 1 200 Pa. Si la apoyas en 0.2 m²: P = 3 000 Pa.</div>
<h4>Presión en los líquidos (hidrostática)</h4>
<p>Un líquido en reposo empuja en todas direcciones, y la presión aumenta con la profundidad:</p>
<p class="c"><b>P = ρ · g · h</b></p>
<p>En agua (ρ = 1 000 kg/m³), cada 10 m de profundidad la presión aumenta unos 98 000 Pa, casi lo mismo que toda la atmósfera. Por eso los buzos sienten presión en los oídos.</p>
<h4>Presión atmosférica</h4>
<p>El aire también tiene peso y nos empuja: al nivel del mar, unos 101 325 Pa. En lugares altos (Ciudad de México, 2 240 m) es menor, porque hay menos aire encima.</p>
<div class="warn"><b>Errores comunes</b><ul><li>Olvidar pasar cm² a m² (1 cm² = 0.0001 m²).</li><li>Confundir presión con fuerza: un elefante ejerce más fuerza que una persona en tacones, pero el tacón puede ejercer más presión.</li></ul></div>
${lab('Llena una botella de plástico con agua y hazle tres agujeros a distintas alturas (con ayuda de un adulto). Predice: ¿de cuál saldrá el chorro más lejos?')}`,
  gen(L) {
    if (L === 1) { const A = pick([0.1, 0.2, 0.25, 0.5, 1, 2, 0.05]); const P0 = R(2, 60) * 100; const F = rnd(P0 * A, 4); return num(`Una caja con un peso de ${fmt(F)} N se apoya sobre una superficie de ${fmt(A)} m². ¿Qué presión ejerce?`, P0, { unit: 'Pa', tol: tl(P0), hint: 'P = F ÷ A.', errs: [{ v: rnd(F * A, 4), m: 'Multiplicaste. La presión es fuerza entre área.' }], sol: [`P = ${fmt(F)} ÷ ${fmt(A)}`, `P = ${B(fmt(P0) + ' Pa')}`] }); }
    if (L === 2) { const A = pick([0.02, 0.05, 0.1, 0.3, 0.5]); const P0 = R(5, 90) * 100; const F = rnd(P0 * A, 4); return num(`Sobre una superficie de ${fmt(A)} m² actúa una presión de ${fmt(P0)} Pa. ¿Cuál es la fuerza?`, F, { unit: 'N', tol: tl(F), hint: 'En P = F ÷ A, la fuerza está dividida entre A: multiplica ambos lados por A.', sol: despNum('P', 'F', 'A').concat([sust('F', `${fmt(P0)} ${frS('N', 'm²')} × ${fmt(A)} m² (los m² se cancelan; 1 Pa = 1 N/m²)`, B(fmt(F) + ' N'))]) }); }
    if (L === 3) { const cm = pick([1, 2, 4, 5, 10, 20, 50]); const F = R(1, 50) * 10; const P0 = rnd(F / (cm / 10000), 4);
      return num(`Una persona aplica ${F} N con una punta de ${cm} cm² de área. ¿Qué presión ejerce, en pascales?`, P0, { unit: 'Pa', tol: tl(P0), hint: 'Convierte el área a m² con análisis dimensional: 1 m² = 10 000 cm² (porque 1 m = 100 cm y 100 × 100 = 10 000).', errs: [{ v: F / cm, m: 'Te faltó convertir los cm² a m².' }], sol: [`Área en m²: ${daInline(cm, 'cm²', 1, 'm²', 10000)}`, `P = ${frS('F', 'A')} = ${frS(F + ' N', fmt(cm / 10000) + ' m²')} = ${B(fmt(P0) + ' Pa')}`] }); }
    if (L === 4) { const h = pick([2, 3, 5, 8, 10, 12, 20, 0.5, 1.5]); const liq = pick([['agua', 1000], ['agua de mar', 1030], ['aceite', 920]]); const P0 = rnd(liq[1] * G9 * h, 4);
      return num(`¿Qué presión hidrostática hay a ${fmt(h)} m de profundidad en ${liq[0]} (ρ = ${fmt(liq[1])} kg/m³)? Usa g = 9.8 m/s².`, P0, { unit: 'Pa', tol: tl(P0), hint: 'P = ρ · g · h.', sol: [`P = ${fmt(liq[1])} × 9.8 × ${fmt(h)}`, `P = ${B(fmt(P0) + ' Pa')}`] }); }
    if (Math.random() < 0.5) { const h1 = R(1, 10), k = pick([2, 3, 4]); return mc(`En una alberca, un buzo baja de ${h1} m a ${h1 * k} m de profundidad. La presión del agua sobre él:`, `Se multiplica por ${k}`, [`Se divide entre ${k}`, 'No cambia', `Aumenta solo ${k} Pa`], { hint: 'En P = ρgh, la presión es directamente proporcional a la profundidad.', sol: ['P = ρgh: si h se multiplica, P se multiplica por lo mismo.', B(`Se multiplica por ${k}`) + ' (la presión hidrostática; la atmosférica se suma aparte).'] }); }
    return cq([
      ['¿Por qué es más fácil clavar un clavo por la punta que por la cabeza?', 'La punta tiene menos área y genera más presión', ['La punta pesa más', 'La cabeza tiene menos área', 'La fuerza es mayor en la punta'], 'Con la misma fuerza, menor área implica mayor presión.'],
      ['¿Dónde es menor la presión atmosférica?', 'En la cima de una montaña', ['En la playa', 'Bajo el mar', 'Es igual en todas partes'], 'A mayor altitud hay menos aire encima, y la presión atmosférica disminuye.'],
      ['Las presas son más anchas en la base que arriba porque:', 'La presión del agua aumenta con la profundidad', ['El agua de abajo está más fría', 'Así se ven mejor', 'Arriba el agua pesa más'], 'P = ρgh: en el fondo la presión es mayor y el muro debe resistir más.'],
      ['Al sorber con un popote, el líquido sube porque:', 'La presión atmosférica empuja el líquido hacia la zona de menor presión', ['La boca jala el líquido', 'El líquido pierde peso', 'El popote crea gravedad'], 'Al sacar aire del popote baja la presión dentro, y la atmósfera empuja el líquido hacia arriba.']]);
  }
});

TOPICS.push({
  id: 'fluidos', eje: 'mat', title: 'Principios de Pascal y de Arquímedes',
  nem: 'Principio de Pascal (prensa hidráulica) y principio de Arquímedes (flotación y empuje).',
  formula: 'Pascal: F₁/A₁ = F₂/A₂ · Arquímedes: Empuje E = ρ_fluido · g · V_sumergido · Peso aparente = Peso − E',
  lesson: `
<h4>Principio de Pascal</h4>
<p>La presión que se aplica a un líquido encerrado se transmite <b>igual</b> a todos sus puntos. En una <b>prensa hidráulica</b>, una fuerza pequeña sobre un émbolo chico produce una fuerza grande en un émbolo grande:</p>
<p class="c"><b>F₁ ÷ A₁ = F₂ ÷ A₂</b></p>
<div class="ex"><b>Ejemplo:</b> émbolo chico de 10 cm², émbolo grande de 500 cm². Si empujas con 100 N: F₂ = 100 × 500 ÷ 10 = 5 000 N. ¡Puedes levantar un auto! (Pero el émbolo grande sube mucho menos de lo que baja el chico.)</div>
<p>Así funcionan los gatos hidráulicos, los frenos de los autos y las sillas de dentista.</p>
<h4>Principio de Arquímedes</h4>
<p>Todo cuerpo sumergido en un fluido recibe un <b>empuje hacia arriba</b> igual al <b>peso del fluido que desaloja</b>:</p>
<p class="c"><b>E = ρ<sub>fluido</sub> · g · V<sub>sumergido</sub></b></p>
<ul><li>Si el peso es mayor que el empuje máximo → se hunde.</li><li>Si el peso es igual al empuje → flota (o queda suspendido).</li><li>Dentro del agua los objetos parecen pesar menos: <b>peso aparente = peso − empuje</b>.</li></ul>
<div class="ex"><b>Ejemplo:</b> una piedra de 0.002 m³ totalmente sumergida en agua: E = 1 000 × 9.8 × 0.002 = 19.6 N.</div>
<div class="warn"><b>Errores comunes</b><ul><li>Creer que la prensa hidráulica “crea” energía: multiplica la fuerza, pero el recorrido se reduce en la misma proporción.</li><li>Pensar que el empuje depende del material del objeto: depende del volumen sumergido y del fluido.</li></ul></div>
${lab('Cuelga una piedra de una liga y mide cuánto se estira. Luego sumerge la piedra en agua sin soltarla. ¿Qué le pasa a la liga? ¿Qué fuerza apareció?')}`,
  gen(L) {
    if (L === 1) return cq([
      ['El principio de Pascal dice que la presión en un líquido encerrado:', 'Se transmite igual a todos sus puntos', ['Solo actúa hacia abajo', 'Desaparece al moverse', 'Depende del color del líquido'], 'Es la base de la prensa hidráulica y los frenos.'],
      ['El empuje que recibe un objeto sumergido es igual a:', 'El peso del fluido que desaloja', ['Su propio peso siempre', 'Su masa', 'La presión atmosférica'], 'Ese es el principio de Arquímedes.'],
      ['¿Qué aparato funciona con el principio de Pascal?', 'El gato hidráulico', ['El termómetro', 'La brújula', 'El foco'], 'El gato hidráulico multiplica la fuerza transmitiendo la presión en un líquido.'],
      ['Un barco de acero flota porque:', 'Desaloja un peso de agua igual a su propio peso', ['El acero flota', 'El agua de mar no tiene peso', 'El aire lo jala hacia arriba'], 'Su forma hueca le permite desalojar mucha agua y recibir un empuje igual a su peso.']]);
    const A1 = pick([2, 4, 5, 10, 20]), k = pick([10, 20, 25, 40, 50, 100]), A2 = A1 * k, F1 = R(2, 30) * 10;
    if (L === 2) return num(`En una prensa hidráulica, el émbolo chico mide ${A1} cm² y el grande ${A2} cm². Si aplicas ${F1} N al chico, ¿qué fuerza se obtiene en el grande?`, F1 * k, { unit: 'N', hint: 'Principio de Pascal: la presión es igual en los dos émbolos, F₁ ÷ A₁ = F₂ ÷ A₂. F₂ está dividida entre A₂: multiplica ambos lados por A₂.', errs: [{ v: F1 / k, m: 'Lo dividiste: el émbolo grande produce más fuerza, no menos.' }], sol: [`Principio de Pascal: ${frS('F₁', 'A₁')} = ${frS('F₂', 'A₂')}. Queremos dejar sola a F₂.`, `F₂ está dividida entre A₂. Multiplicamos <b>ambos lados</b> por A₂ para mantener el balance: ${frS('F₁', 'A₁')} · A₂ = ${frS('F₂', 'A₂')} · A₂. A₂ entre A₂ es 1, así que <b>F₂ = ${frS('F₁ · A₂', 'A₁')}</b>`, sust('F₂', frS(`${F1} N × ${A2} cm²`, `${A1} cm²`) + ' (cm² entre cm² se cancela)', B(fmt(F1 * k) + ' N'))] });
    if (L === 3) { const F1b = R(5, 30) * 10, kb = pick([20, 25, 40, 50, 100]), A2b = A1 * kb; const W = F1b * kb; return num(`Un gato hidráulico tiene émbolos de ${A1} cm² y ${A2b} cm². ¿Qué fuerza hay que aplicar en el chico para levantar un auto de ${fmt(W)} N?`, F1b, { unit: 'N', hint: 'De F₁ ÷ A₁ = F₂ ÷ A₂: F₁ está dividida entre A₁, así que multiplica ambos lados por A₁.', sol: [`Principio de Pascal: ${frS('F₁', 'A₁')} = ${frS('F₂', 'A₂')}. Queremos dejar sola a F₁.`, `F₁ está dividida entre A₁. Multiplicamos <b>ambos lados</b> por A₁: ${frS('F₁', 'A₁')} · A₁ = ${frS('F₂', 'A₂')} · A₁. A₁ entre A₁ es 1: <b>F₁ = ${frS('F₂ · A₁', 'A₂')}</b>`, sust('F₁', frS(`${fmt(W)} N × ${A1} cm²`, `${A2b} cm²`), B(F1b + ' N'))] }); }
    if (L === 4) { const V = pick([0.001, 0.002, 0.005, 0.0005, 0.01, 0.003]); const liq = pick([['agua', 1000], ['agua de mar', 1030], ['alcohol', 790]]); const E = rnd(liq[1] * G9 * V, 4);
      return num(`Un objeto de ${fmt(V)} m³ se sumerge por completo en ${liq[0]} (ρ = ${liq[1]} kg/m³). ¿Qué empuje recibe? (g = 9.8 m/s²)`, E, { unit: 'N', tol: tl(E), hint: 'E = ρ · g · V.', sol: [`E = ${liq[1]} × 9.8 × ${fmt(V)}`, `E = ${B(fmt(E) + ' N')}`] }); }
    if (Math.random() < 0.5) { const V = pick([0.001, 0.002, 0.0005, 0.004]); const rho = pick([2700, 7900, 2500, 8900]); const W = rnd(rho * G9 * V, 4), E = rnd(1000 * G9 * V, 4), Wa = rnd(W - E, 4);
      return num(`Una pieza metálica pesa ${fmt(W)} N en el aire y tiene un volumen de ${fmt(V)} m³. ¿Cuánto pesa sumergida en agua (peso aparente)?`, Wa, { unit: 'N', tol: tl(Wa), hint: 'Peso aparente = peso − empuje. Empuje = 1 000 × 9.8 × V.', sol: [`E = 1 000 × 9.8 × ${fmt(V)} = ${fmt(E)} N`, `Peso aparente = ${fmt(W)} − ${fmt(E)} = ${B(fmt(Wa) + ' N')}`] }); }
    const m = pick([['madera de pino', 500], ['hielo', 920], ['corcho', 250], ['plástico', 900], ['madera de roble', 750]]); const p = rnd(m[1] / 1000 * 100, 2);
    return num(`Un bloque de ${m[0]} (ρ = ${m[1]} kg/m³) flota en agua dulce. ¿Qué porcentaje de su volumen queda sumergido?`, p, { unit: '%', tol: 0.051, hint: 'Al flotar, peso = empuje, por lo que fracción sumergida = ρ objeto ÷ ρ agua.', sol: ['Peso = empuje → ρ<sub>obj</sub> · V · g = ρ<sub>agua</sub> · V<sub>sum</sub> · g', `V<sub>sum</sub> ÷ V = ${m[1]} ÷ 1 000 = ${fmt(m[1] / 1000)}`, `${B(fmt(p) + '%')} sumergido`] });
  }
});

TOPICS.push({
  id: 'rapidez', eje: 'mov', title: 'Rapidez, velocidad y movimiento uniforme',
  nem: 'Interacciones en fenómenos relacionados con la fuerza y el movimiento: rapidez, velocidad, desplazamiento y movimiento rectilíneo uniforme.',
  formula: 'v = d / t · d = v·t · t = d / v · Rapidez media = distancia total ÷ tiempo total · Encuentro: t = d ÷ (v₁ + v₂)',
  lesson: `
<h4>Idea clave</h4>
<p>La <b>rapidez</b> indica qué tan rápido cambia de posición un objeto: distancia recorrida ÷ tiempo. La <b>velocidad</b> además indica la dirección (es un vector).</p>
<p class="c"><b>v = d ÷ t</b> &nbsp; (m/s o km/h)</p>
<h4>Distancia y desplazamiento</h4>
<p>Si das una vuelta completa a una pista de 400 m, recorriste 400 m (distancia), pero tu <b>desplazamiento</b> es 0, porque terminaste donde empezaste. Tu rapidez media fue distinta de cero, pero tu velocidad media fue cero.</p>
<h4>Movimiento rectilíneo uniforme (MRU)</h4>
<p>Es el movimiento en línea recta con velocidad constante: recorre distancias iguales en tiempos iguales.</p>
<div class="ex"><b>Ejemplo:</b> un autobús va a 80 km/h durante 2.5 h: d = 80 × 2.5 = 200 km.</div>
<h4>Rapidez media de un viaje</h4>
<p>Es la <b>distancia total entre el tiempo total</b>, no el promedio de las rapideces. Si vas 60 km a 60 km/h (1 h) y regresas 60 km a 30 km/h (2 h): 120 km ÷ 3 h = 40 km/h, no 45.</p>
<div class="warn"><b>Errores comunes</b><ul><li>Mezclar minutos con horas: convierte con el factor ${frS('1 h', '60 min')}; por ejemplo, 30 min × (1 h / 60 min) = 0.5 h.</li><li>Promediar rapideces en lugar de dividir distancia total entre tiempo total.</li><li>Confundir rapidez con velocidad.</li></ul></div>
${lab('Mide 10 m en un pasillo o patio. Cronometra cuánto tardas caminando y corriendo. Calcula tu rapidez en m/s y en km/h.')}`,
  gen(L) {
    if (L === 1) { const v = R(2, 30), t = R(2, 60); return num(`Un corredor recorre ${v * t} m en ${t} s a rapidez constante. ¿Cuál es su rapidez?`, v, { unit: 'm/s', hint: 'v = d ÷ t.', errs: [{ v: rnd(t / (v * t), 6), m: 'Invertiste: es distancia entre tiempo.' }], sol: [`v = ${v * t} m ÷ ${t} s`, `v = ${B(v + ' m/s')}`] }); }
    if (L === 2) { const v = R(4, 12) * 10, t = pick([0.5, 1.5, 2, 2.5, 3, 4, 1.25]); return num(`Un auto viaja a ${v} km/h durante ${fmt(t)} h. ¿Qué distancia recorre?`, v * t, { unit: 'km', hint: 'En v = d ÷ t la distancia está dividida entre t: multiplica ambos lados por t para dejarla sola.', sol: despNum('v', 'd', 't').concat([sust('d', `${v} ${frS('km', UCX('h'))} × ${fmt(t)} ${UCX('h')} (las horas se cancelan)`, B(fmt(v * t) + ' km'))]) }); }
    if (L === 3) { const v = R(4, 12) * 10, mi = pick([15, 30, 45, 90, 120, 150, 20, 40]); const d = rnd(v * mi / 60, 4);
      return num(`Un autobús va a ${v} km/h. ¿Cuántos <b>minutos</b> tarda en recorrer ${fmt(d)} km?`, mi, { unit: 'min', tol: 0.05, hint: 'Despeja t de v = d ÷ t (multiplica ambos lados por t y luego divide ambos lados entre v). El resultado sale en horas; conviértelo a minutos con el factor 60 min / 1 h.', errs: [{ v: rnd(d / v, 4), m: 'Ese resultado está en horas. Conviértelo a minutos con análisis dimensional.' }], sol: despDen('v', 'd', 't').concat([sust('t', `${frS(fmt(d) + ' ' + UCX('km'), v + ' ' + UCX('km') + '/h')} (km entre km se cancela; queda h)`, fmt(rnd(d / v, 4)) + ' h'), `Convertimos a minutos con análisis dimensional: ${daInline(rnd(d / v, 6), 'h', 60, 'min', 1)} ≈ ${B(mi + ' min')}`]) }); }
    if (L === 4) { const d = pick([60, 120, 90, 180, 240]); let v1, v2; do { v1 = pick([30, 40, 45, 60, 90, 120]); v2 = pick([30, 40, 45, 60, 90, 120]); } while (v1 === v2); const T = d / v1 + d / v2; const vm = rnd(2 * d / T, 2);
      return num(`Viajas ${d} km de ida a ${v1} km/h y regresas por el mismo camino a ${v2} km/h. ¿Cuál fue tu rapidez media en todo el viaje? (redondea a centésimos)`, vm, { unit: 'km/h', tol: 0.011, hint: 'Rapidez media = distancia total ÷ tiempo total. No promedies las dos rapideces.', errs: [{ v: (v1 + v2) / 2, m: 'Promediaste las rapideces. Divide la distancia total entre el tiempo total.' }], sol: [`Tiempo ida: ${d} ÷ ${v1} = ${fmt(d / v1, 3)} h; regreso: ${d} ÷ ${v2} = ${fmt(d / v2, 3)} h`, `Total: ${2 * d} km en ${fmt(T, 3)} h`, `v media = ${2 * d} ÷ ${fmt(T, 3)} = ${B(fmt(vm) + ' km/h')}`] }); }
    if (Math.random() < 0.6) { const v1 = R(4, 10) * 10, v2 = R(4, 10) * 10, t = pick([0.5, 1, 1.5, 2]); const d = (v1 + v2) * t;
      return num(`Dos ciudades están a ${fmt(d)} km. Un auto sale de cada una al mismo tiempo, uno hacia el otro, a ${v1} km/h y ${v2} km/h. ¿En cuántas horas se encuentran?`, t, { unit: 'h', tol: 0.011, hint: 'Se acercan con una rapidez combinada de v₁ + v₂.', sol: [`Rapidez de acercamiento: ${v1} + ${v2} = ${v1 + v2} km/h`, `t = ${fmt(d)} ÷ ${v1 + v2} = ${B(fmt(t) + ' h')}`] }); }
    const n = R(1, 4); return mc(`Una atleta da ${n} vuelta${n > 1 ? 's' : ''} completa${n > 1 ? 's' : ''} a una pista de 400 m y termina donde empezó. ¿Cuál es su desplazamiento?`, '0 m', [`${400 * n} m`, '400 m', '200 m'], { hint: 'El desplazamiento compara la posición final con la inicial.', sol: [`Distancia recorrida: ${400 * n} m.`, `Desplazamiento: posición final − inicial = ${B('0 m')}.`] });
  }
});

TOPICS.push({
  id: 'graficasmov', eje: 'mov', title: 'Gráficas de movimiento',
  nem: 'Representación del movimiento con tablas y gráficas posición-tiempo y velocidad-tiempo.',
  formula: 'Gráfica posición-tiempo: pendiente = velocidad; tramo horizontal = reposo. Gráfica velocidad-tiempo: pendiente = aceleración; área bajo la curva = distancia.',
  lesson: `
<h4>Gráfica posición-tiempo (d-t)</h4>
<ul><li>Una <b>recta inclinada</b> significa velocidad constante. Entre más inclinada, más rápido.</li><li>Un tramo <b>horizontal</b> significa que el objeto está detenido.</li><li>Si la recta baja, el objeto regresa hacia el origen.</li></ul>
<p>La velocidad en un tramo es su <b>pendiente</b>: cambio de posición ÷ cambio de tiempo.</p>
${lineSVG({ pts: [[0, 0], [2, 20], [4, 20], [6, 0]], xmax: 6, ymax: 25, ystep: 5, xlab: 'Tiempo (s)', ylab: 'Posición (m)' })}
<p class="small">Tramo A: avanza 20 m en 2 s → 10 m/s. Tramo B: detenido. Tramo C: regresa 20 m en 2 s (−10 m/s).</p>
<h4>Gráfica velocidad-tiempo (v-t)</h4>
<ul><li>Recta horizontal: velocidad constante (sin aceleración).</li><li>Recta que sube: acelera. Recta que baja: frena.</li><li>La <b>pendiente</b> es la aceleración.</li><li>El <b>área bajo la gráfica</b> es la distancia recorrida.</li></ul>
<div class="ex"><b>Ejemplo:</b> un auto pasa de 0 a 20 m/s en 4 s. Área del triángulo = 4 × 20 ÷ 2 = 40 m recorridos. Aceleración = 20 ÷ 4 = 5 m/s².</div>
<div class="warn"><b>Errores comunes</b><ul><li>Leer una gráfica posición-tiempo como si fuera el camino que sigue el objeto.</li><li>Pensar que un tramo horizontal en d-t significa “se mueve a velocidad constante”: significa que está quieto.</li></ul></div>
${lab('Camina frente a una pared contando pasos y segundos: 5 s caminando, 3 s quieto, 5 s regresando. Dibuja la gráfica posición-tiempo de lo que hiciste.')}`,
  gen(L) {
    const mk = () => { const pts = [[0, 0]]; let t = 0, d = 0; for (let i = 0; i < 3; i++) { const dt = R(1, 3); let dd = pick([0, R(1, 4) * 5, -R(1, 3) * 5]); if (i === 0 && dd <= 0) dd = R(2, 4) * 5; if (d + dd < 0) dd = 0; t += dt; d += dd; pts.push([t, d]); } return pts; };
    if (L <= 3) {
      let pts; do { pts = mk(); } while (Math.max(...pts.map(p => p[1])) === 0);

      const segs = [0, 1, 2].map(i => ({ n: String.fromCharCode(65 + i), v: (pts[i + 1][1] - pts[i][1]) / (pts[i + 1][0] - pts[i][0]) }));

        return mc('Observa la gráfica. ¿En qué tramo se mueve más rápido el objeto?', 'Tramo ' + ok[0].n, segs.filter(s => s !== ok[0]).map(s => 'Tramo ' + s.n).concat(['En todos igual']), { fig, hint: 'El tramo más inclinado (subiendo o bajando) es el más rápido.', sol: [segs.map(s => `${s.n}: ${fmt(Math.abs(s.v), 2)} m/s`).join(' · '), B('Tramo ' + ok[0].n)] }); }

/* ===== EJE: FUERZAS ===== */
function forceSVG(fs) { // fs: [{v, dir:'r'|'l'|'u'|'d', label}]
  const W = 300, H = 200, cx = 150, cy = 100; let g = `<svg viewBox="0 0 ${W} ${H}" class="fig" role="img"><defs><marker id="ah${++_svgId}" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16A34A"/></marker></defs><rect x="${cx - 22}" y="${cy - 22}" width="44" height="44" rx="6" class="fillB"/>`;
  const mx = Math.max(...fs.map(f => f.v)); const id = 'ah' + _svgId;
  for (const f of fs) { const len = 30 + 70 * f.v / mx; const [dx, dy] = { r: [1, 0], l: [-1, 0], u: [0, -1], d: [0, 1] }[f.dir]; const x1 = cx + dx * 22, y1 = cy + dy * 22, x2 = x1 + dx * len, y2 = y1 + dy * len;
    g += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:#16A34A;stroke-width:3" marker-end="url(#${id})"/><text x="${x2 + dx * 6 + (dy ? 26 : 0)}" y="${y2 + dy * 10 + (dx ? -8 : 4)}" class="tk b">${f.label}</text>`; }
  return g + '</svg>';
}

TOPICS.push({
  id: 'fuerzas', eje: 'fue', title: 'Fuerzas: fuerza resultante y equilibrio',
  nem: 'Las fuerzas como interacciones; suma de fuerzas, fuerza resultante y equilibrio.',
  formula: 'Misma dirección y sentido: se suman · Sentidos opuestos: se restan (gana la mayor) · Perpendiculares: R = √(F₁² + F₂²) · Equilibrio: fuerza resultante = 0 · Unidad: newton (N)',
  lesson: `
<h4>Idea clave</h4>
<p>Una <b>fuerza</b> es una interacción entre dos cuerpos que puede cambiar su movimiento o deformarlos. Se mide en <b>newtons (N)</b> con un dinamómetro. Es un <b>vector</b>: tiene magnitud, dirección y sentido. Puede ser por contacto (empujar, fricción) o a distancia (gravedad, magnetismo, electricidad).</p>
<h4>Fuerza resultante</h4>
<p>Cuando varias fuerzas actúan sobre un objeto, su efecto total es la <b>fuerza resultante</b> (o fuerza neta):</p>
<ul><li><b>Mismo sentido:</b> se suman. 30 N + 20 N hacia la derecha = 50 N a la derecha.</li><li><b>Sentidos opuestos:</b> se restan, y la resultante va hacia el lado de la mayor. 30 N a la derecha y 20 N a la izquierda = 10 N a la derecha.</li><li><b>Perpendiculares:</b> se usa el teorema de Pitágoras. 30 N al este y 40 N al norte = √(900 + 1 600) = 50 N.</li></ul>
<p>Truco: toma la derecha (o arriba) como positiva y la izquierda (o abajo) como negativa, y suma con signos.</p>
<h4>Equilibrio</h4>
<p>Si la fuerza resultante es <b>cero</b>, las fuerzas están equilibradas: el objeto sigue en reposo o se mueve a velocidad constante. En un “jalón de cuerda” empatado, ambos equipos jalan con la misma fuerza.</p>
<div class="warn"><b>Errores comunes</b><ul><li>Sumar fuerzas opuestas en lugar de restarlas.</li><li>Sumar directamente fuerzas perpendiculares (30 + 40 = 70 N es incorrecto; da 50 N).</li><li>Creer que si un objeto se mueve debe haber una fuerza resultante empujándolo: a velocidad constante la resultante es cero.</li></ul></div>
${lab('Amarra dos ligas iguales a un objeto y jálalo con cada una en la misma dirección, luego en direcciones opuestas y luego en ángulo recto. Observa cuánto se estiran.')}`,
  gen(L) {
    if (L === 1) { const a = R(2, 30) * 5, b = R(2, 30) * 5; return num(`Dos personas empujan un mueble en la misma dirección y sentido, con ${a} N y ${b} N. ¿Cuál es la fuerza resultante?`, a + b, { unit: 'N', hint: 'Fuerzas en el mismo sentido se suman.', sol: [`R = ${a} + ${b} = ${B(a + b + ' N')} en el mismo sentido`] }); }

TOPICS.push({

  lesson: `
<h4>Primera ley: inercia</h4>
<p>Un objeto en reposo sigue en reposo, y uno en movimiento sigue moviéndose en línea recta a velocidad constante, <b>a menos que una fuerza resultante actúe sobre él</b>. Por eso, cuando un camión frena de golpe, los pasajeros se van hacia adelante: sus cuerpos “quieren” seguir moviéndose. El cinturón de seguridad aplica la fuerza que los detiene.</p>
<h4>Segunda ley: F = m · a</h4>
<p>La aceleración es proporcional a la fuerza resultante e inversamente proporcional a la masa:</p>
<p class="c"><b>F = m · a</b> &nbsp; → &nbsp; a = F ÷ m &nbsp; · &nbsp; m = F ÷ a</p>
<div class="ex"><b>Ejemplo:</b> empujas un carrito de 20 kg con una fuerza neta de 50 N: a = 50 ÷ 20 = 2.5 m/s². Con el doble de masa, la aceleración sería la mitad.</div>
<p>Si hay fricción, primero calcula la fuerza neta: F<sub>neta</sub> = F<sub>aplicada</sub> − F<sub>fricción</sub>.</p>
<h4>Tercera ley: acción y reacción</h4>
<p>Si A empuja a B, B empuja a A con una fuerza <b>igual y de sentido contrario</b>. Las dos fuerzas actúan sobre <b>cuerpos distintos</b>, por eso no se cancelan. Ejemplos: un cohete empuja los gases hacia abajo y los gases lo empujan hacia arriba; al nadar empujas el agua hacia atrás y el agua te empuja hacia adelante.</p>
<div class="warn"><b>Errores comunes</b><ul><li>Creer que para que algo se mueva se necesita una fuerza constante (solo se necesita para cambiar su velocidad).</li><li>Pensar que acción y reacción se anulan: actúan sobre cuerpos diferentes.</li><li>Pensar que en un choque entre un camión y un auto, el camión ejerce más fuerza: las fuerzas son iguales; el auto acelera más porque tiene menos masa.</li></ul></div>
${lab('Pon una moneda sobre una tarjeta encima de un vaso. Da un golpe rápido y horizontal a la tarjeta. Predice: ¿a dónde irá la moneda? ¿Qué ley explica lo que pasa?')}`,

    if (L === 1) return cq([
      ['Cuando un autobús frena de golpe, los pasajeros se van hacia adelante. ¿Qué ley lo explica?', 'Primera ley (inercia)', ['Segunda ley (F = ma)', 'Tercera ley (acción-reacción)', 'Ley de la gravitación'], 'Los cuerpos tienden a conservar su estado de movimiento.'],
      ['Un cohete sube porque expulsa gases hacia abajo. ¿Qué ley lo explica?', 'Tercera ley (acción-reacción)', ['Primera ley (inercia)', 'Segunda ley (F = ma)', 'Principio de Pascal'], 'El cohete empuja los gases y los gases empujan al cohete en sentido contrario.'],
      ['Con la misma fuerza, un carrito vacío acelera más que uno lleno. ¿Qué ley lo explica?', 'Segunda ley (F = ma)', ['Primera ley (inercia)', 'Tercera ley (acción-reacción)', 'Principio de Arquímedes'], 'a = F/m: menos masa, más aceleración.'],
      ['¿Qué mide la inercia de un cuerpo?', 'Su masa', ['Su volumen', 'Su velocidad', 'Su temperatura'], 'A mayor masa, más difícil es cambiar su estado de movimiento.']]);
    if (L === 2) { const m = R(2, 60), a = pick([0.5, 1, 1.5, 2, 2.5, 3, 4, 5]); const F = rnd(m * a, 4); return num(`¿Qué fuerza neta se necesita para que un objeto de ${m} kg acelere a ${fmt(a)} m/s²?`, F, { unit: 'N', tol: tl(F), hint: 'F = m · a.', sol: [`F = ${m} × ${fmt(a)}`, `F = ${B(fmt(F) + ' N')}`] }); }
    if (L === 3) { const m = R(2, 50), a = pick([0.5, 1, 2, 2.5, 3, 4, 0.2]); const F = rnd(m * a, 4); const askM = Math.random() < 0.4;
      if (askM) return num(`Una fuerza neta de ${fmt(F)} N produce una aceleración de ${fmt(a)} m/s². ¿Cuál es la masa del objeto?`, m, { unit: 'kg', tol: 0.011, hint: 'En F = m · a, la masa está multiplicada por a: divide ambos lados entre a.', sol: despMul('F', ['m', 'a'], 'm').concat([sust('m', frS(fmt(F) + ' N', fmt(a) + ' m/s²') + ' (1 N = 1 kg·m/s², así que queda kg)', B(m + ' kg'))]) });
      return num(`Aplicas una fuerza neta de ${fmt(F)} N a un objeto de ${m} kg. ¿Qué aceleración adquiere?`, a, { unit: 'm/s²', tol: 0.011, hint: 'En F = m · a, la aceleración está multiplicada por m: divide ambos lados entre m.', errs: [{ v: F * m, m: 'Multiplicaste; al despejar, la aceleración queda fuerza entre masa.' }], sol: despMul('F', ['m', 'a'], 'a').concat([sust('a', frS(fmt(F) + ' N', m + ' kg'), B(fmt(a) + ' m/s²'))]) }); }
    if (L === 4) { const m = R(5, 40), a = pick([0.5, 1, 1.5, 2, 3]); const f = R(2, 20) * 5; const F = rnd(m * a + f, 4);

    if (Math.random() < 0.5) { const k = pick([2, 3, 4]); const what = pick(['f', 'm']); return mc(what === 'f' ? `Si sobre un objeto la fuerza neta se multiplica por ${k} y su masa no cambia, su aceleración:` : `Si la misma fuerza neta se aplica a un objeto con ${k} veces más masa, su aceleración:`, what === 'f' ? `Se multiplica por ${k}` : `Se divide entre ${k}`, what === 'f' ? [`Se divide entre ${k}`, 'No cambia', `Se multiplica por ${k * k}`] : [`Se multiplica por ${k}`, 'No cambia', `Se divide entre ${k * k}`], { hint: 'a = F ÷ m.', sol: ['a = F ÷ m: es directamente proporcional a F e inversamente proporcional a m.', B(what === 'f' ? `Se multiplica por ${k}` : `Se divide entre ${k}`)] }); }

  }

TOPICS.push({
  id: 'gravedad', eje: 'fue', title: 'Peso, masa y gravitación universal',

  formula: 'Peso: P = m·g (g Tierra = 9.8 m/s², Luna = 1.6, Marte = 3.7, Júpiter = 24.8) · F = G·m₁·m₂ / d² con G = 6.67 × 10⁻¹¹ N·m²/kg² · Si d se multiplica por k, F se divide entre k²',
  lesson: `
<h4>Masa y peso no son lo mismo</h4>
<ul><li><b>Masa:</b> cantidad de materia. Se mide en kg y es la misma en cualquier lugar.</li><li><b>Peso:</b> fuerza con que un planeta atrae al objeto. Se mide en newtons y depende de la gravedad del lugar: <b>P = m · g</b>.</li></ul>
<div class="ex"><b>Ejemplo:</b> una persona de 50 kg pesa 50 × 9.8 = 490 N en la Tierra y 50 × 1.6 = 80 N en la Luna. Su masa sigue siendo 50 kg.</div>
<h4>Ley de la gravitación universal (Newton)</h4>
<p>Todos los cuerpos con masa se atraen. La fuerza es proporcional al producto de las masas e inversamente proporcional al <b>cuadrado</b> de la distancia:</p>
<p class="c"><b>F = G · m₁ · m₂ ÷ d²</b>, &nbsp; G = 6.67 × 10<sup>−11</sup> N·m²/kg²</p>
<ul><li>Si una masa se duplica, la fuerza se duplica.</li><li>Si la distancia se duplica, la fuerza se divide entre 4 (2²). Si se triplica, entre 9.</li></ul>
<p>Esta misma fuerza mantiene a la Luna girando alrededor de la Tierra y a los planetas alrededor del Sol, y causa las mareas.</p>
<div class="warn"><b>Errores comunes</b><ul><li>Decir “peso 50 kilos”: en física eso es tu masa; tu peso son unos 490 N.</li><li>Creer que en el espacio no hay gravedad: los astronautas en órbita están en caída libre continua.</li><li>Olvidar elevar la distancia al cuadrado.</li></ul></div>
${lab('Cuelga diferentes objetos de una liga o un resorte y mide cuánto se estira. ¿Qué medirías en la Luna con ese mismo resorte: masa o peso?')}`,
  gen(L) {
    if (L === 1) { const m = R(2, 90); const P0 = rnd(m * G9, 4); return num(`¿Cuál es el peso, en la Tierra, de un objeto de ${m} kg? (g = 9.8 m/s²)`, P0, { unit: 'N', tol: 0.011, hint: 'P = m · g.', sol: [`P = ${m} × 9.8`, `P = ${B(fmt(P0) + ' N')}`] }); }
    if (L === 2) { const m = R(2, 90); const P0 = rnd(m * G9, 4); return num(`Un objeto pesa ${fmt(P0)} N en la Tierra. ¿Cuál es su masa?`, m, { unit: 'kg', tol: 0.011, hint: 'En P = m · g, la masa está multiplicada por g: divide ambos lados entre g.', errs: [{ v: rnd(P0 * G9, 4), m: 'Multiplicaste; al despejar, la masa queda peso entre g.' }], sol: despMul('P', ['m', 'g'], 'm').concat([sust('m', frS(fmt(P0) + ' N', '9.8 m/s²'), B(m + ' kg'))]) }); }
    if (L === 3) { const pl = pick([['la Luna', 1.6], ['Marte', 3.7], ['Júpiter', 24.8], ['Venus', 8.9]]); const m = R(20, 90); const P0 = rnd(m * pl[1], 4);
      if (Math.random() < 0.5) return mc(`Un astronauta tiene una masa de ${m} kg en la Tierra. ¿Cuál es su masa en ${pl[0]}?`, `${m} kg`, [`${fmt(rnd(m * pl[1] / G9, 1))} kg`, `${fmt(P0)} kg`, '0 kg'], { hint: 'La masa es la cantidad de materia; no depende del lugar.', sol: ['La masa no cambia de un lugar a otro; lo que cambia es el peso.', B(`${m} kg`)] });
      return num(`¿Cuánto pesa en ${pl[0]} (g = ${fmt(pl[1])} m/s²) un astronauta de ${m} kg?`, P0, { unit: 'N', tol: 0.011, hint: 'P = m · g del lugar.', sol: [`P = ${m} × ${fmt(pl[1])}`, `P = ${B(fmt(P0) + ' N')}`] }); }
    if (L === 4) { const a = pick([2, 3, 4]), b = pick([1, 2, 3]), k = pick([2, 3, 4, 0.5]); const f = a * b / (k * k); const [n, d] = simp(Math.round(a * b * 4), Math.round(k * k * 4));
      return num(`Dos cuerpos se atraen gravitacionalmente. Si la masa de uno se multiplica por ${a}, ${b === 1 ? 'la del otro no cambia' : 'la del otro se multiplica por ' + b} y la distancia entre ellos se multiplica por ${fmt(k)}, ¿por cuánto se multiplica la fuerza? (puedes responder con fracción)`, f, { tol: 1e-6, hint: 'F es proporcional a m₁·m₂ e inversamente proporcional a d².', errs: [{ v: a * b / k, m: 'No elevaste la distancia al cuadrado.' }], sol: [`Factor de masas: ${a} × ${b} = ${a * b}`, `Factor de distancia: ${fmt(k)}² = ${fmt(k * k)} (divide)`, `${a * b} ÷ ${fmt(k * k)} = ${B(fr(n, d))}`] }); }
    const m1 = R(2, 9) * 10, m2 = R(2, 9) * 10, d = pick([1, 2, 5, 10]); const F = 6.67e-11 * m1 * m2 / (d * d); const e = Math.floor(Math.log10(F)); const mant = rnd(F / Math.pow(10, e), 2);
    return mc(`Dos esferas de ${m1} kg y ${m2} kg están separadas ${d} m. ¿Con qué fuerza se atraen? (G = 6.67 × 10<sup>−11</sup> N·m²/kg²)`, sci(mant, e) + ' N', [sci(mant, e + 1) + ' N', sci(rnd(mant * d, 2), e) + ' N', sci(mant, e - 2) + ' N', sci(rnd(6.67 * m1 * m2 / 1000, 2), -8) + ' N'], { hint: 'F = G · m₁ · m₂ ÷ d². Multiplica los números y suma exponentes.', sol: [`F = 6.67 × 10<sup>−11</sup> × ${m1} × ${m2} ÷ ${d * d}`, `F = ${B(sci(mant, e) + ' N')}. ¡Muy pequeña! Por eso no notamos la atracción entre objetos cotidianos.`] });
  }

TOPICS.push({

<h4>Trabajo mecánico</h4>
<p>En física, se hace <b>trabajo</b> cuando una fuerza mueve un objeto en la dirección de la fuerza:</p>

<h4>Potencia</h4>
<p>La <b>potencia</b> mide qué tan rápido se hace el trabajo:</p>
<p class="c"><b>P = W ÷ t</b> &nbsp; (1 watt = 1 J/s)</p>

<p>Los motores se comparan por potencia: 1 caballo de fuerza (hp) ≈ 746 W.</p>

${lab('Sube una escalera caminando y luego corriendo (con cuidado), midiendo el tiempo. Con tu masa y la altura de la escalera, calcula el trabajo y la potencia en cada caso.')}`,

    if (L === 3) { const W = R(2, 60) * 100, t = pick([2, 4, 5, 10, 20, 25, 50]); const Pw = rnd(W / t, 4); return num(`Un motor realiza ${fmt(W)} J de trabajo en ${t} s. ¿Cuál es su potencia?`, Pw, { unit: 'W', tol: tl(Pw), hint: 'P = W ÷ t.', sol: [`P = ${fmt(W)} ÷ ${t}`, `P = ${B(fmt(Pw) + ' W')}`] }); }
    if (L === 4) { if (Math.random() < 0.5) { const hp = pick([0.5, 1, 2, 5, 10]); const Wt = rnd(hp * 746, 4); return num(`Una bomba de agua tiene ${fmt(hp)} hp. ¿Cuántos watts son? (1 hp = 746 W)`, Wt, { unit: 'W', hint: `${DA_HINT} Equivalencia: 1 hp = 746 W.`, sol: dimAnalysis({ v: hp, n: ['hp'] }, [{ n: [746, 'W'], d: [1, 'hp'] }]).steps }); }
      const m = R(40, 80), h = pick([3, 4, 6, 9, 12]), t = R(4, 15); const Pw = rnd(m * G9 * h / t, 2);
      return num(`Una persona de ${m} kg sube corriendo una escalera de ${h} m de altura en ${t} s. ¿Qué potencia desarrolla? (redondea a centésimos)`, Pw, { unit: 'W', tol: tl(Pw), hint: 'Primero el trabajo (m·g·h), luego divídelo entre el tiempo.', sol: [`W = ${m} × 9.8 × ${h} = ${fmt(m * G9 * h)} J`, `P = ${fmt(m * G9 * h)} ÷ ${t} = ${B(fmt(Pw) + ' W')}`] }); }
    return cq([
