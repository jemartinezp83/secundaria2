<script>
"use strict";
/* ===== Utilidades matemáticas y de formato ===== */
const R = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const RNZ = (a, b) => { let x; do { x = R(a, b); } while (x === 0); return x; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; };
const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);
const rnd = (x, d = 10) => { const p = Math.pow(10, d); return Math.round(x * p) / p; };
const MINUS = '−';
const PI = 3.14;

function fmt(x, dec) {
  if (dec !== undefined) x = rnd(x, dec);
  x = rnd(x, 9);
  if (Object.is(x, -0)) x = 0;
  const neg = x < 0;
  let s = Math.abs(x).toString();
  if (s.includes('e')) s = Math.abs(x).toFixed(12).replace(/0+$/, '').replace(/\.$/, '');
  let [i, d] = s.split('.');
  if (i.length > 4) i = i.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? MINUS : '') + i + (d ? '.' + d : '');
}
const P = x => (x < 0 ? `(${fmt(x)})` : fmt(x));
const money = x => { const s = fmt(x, 2); return '$' + (/\.\d$/.test(s) ? s + '0' : s); };
const sgn = x => (x < 0 ? '(−)' : '(+)');
function simp(n, d) { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return [n / g, d / g]; }
function frRaw(n, d) { const neg = (n < 0) !== (d < 0) && n !== 0; return `${neg ? MINUS : ''}<span class="fr"><span>${Math.abs(n)}</span><span>${Math.abs(d)}</span></span>`; }
function rf(maxD = 9, minD = 2) { let n, d; do { d = R(minD, maxD); n = R(1, d - 1); } while (gcd(n, d) !== 1); return [n, d]; }
function frS(t, b) { return `<span class="fr"><span>${t}</span><span>${b}</span></span>`; }
function fr(n, d) { [n, d] = simp(n, d); if (d === 1) return fmt(n); return frRaw(n, d); }
function mixed(n, d) { [n, d] = simp(n, d); const w = Math.trunc(n / d), r = Math.abs(n % d); if (r === 0) return fmt(w); return (w ? fmt(w) + ' ' : (n < 0 ? MINUS : '')) + frRaw(r, d); }
function frP(n, d) { [n, d] = simp(n, d); return n < 0 ? `(${fr(n, d)})` : fr(n, d); }
const pw = (b, e) => `${b}<sup>${typeof e === 'number' ? fmt(e) : e}</sup>`;
const sci = (m, e) => `${fmt(m)} × 10<sup>${fmt(e)}</sup>`;
const B = s => `<b>${s}</b>`;

/* Polinomios: terms = [[coef, 'x'], [coef, '']] */
function poly(terms) {
  let s = '', first = true;
  for (const [c, v] of terms) {
    if (c === 0) continue;
    const a = Math.abs(c);
    const body = v ? (a === 1 ? v : fmt(a) + v) : fmt(a);
    if (first) s += (c < 0 ? MINUS : '') + body;
    else s += (c < 0 ? ` ${MINUS} ` : ' + ') + body;
    first = false;
  }
  return s || '0';
}
const X2 = 'x<sup>2</sup>';

/* Constructores de preguntas */
function num(q, ans, extra = {}) { return Object.assign({ q, type: 'num', ans }, extra); }
function pair(q, x, y, extra = {}) { return Object.assign({ q, type: 'pair', ans: [x, y] }, extra); }
function mc(q, correct, distract, extra = {}) {
  const seen = new Set([String(correct)]); const opts = [correct];
  for (const d of distract) { if (opts.length >= 4) break; const k = String(d); if (!seen.has(k)) { seen.add(k); opts.push(d); } }
  const order = shuffle(opts.map((o, i) => i));
  return Object.assign({ q, type: 'mc', opts: order.map(i => opts[i]), ans: order.indexOf(0) }, extra);
}

/* Lectura de respuestas: enteros, decimales, fracciones, mixtos, signo unicode */
function parseAnswer(str) {
  if (str == null) return NaN;
  let s = String(str).trim().replace(/[−–—]/g, '-').replace(/[$%°]/g, '').replace(/[a-zA-Záéíóúñ²³]+\.?$/g, '').trim();

  if (m) { const d = parseFloat(m[2]); return d === 0 ? NaN : parseFloat(m[1]) / d; }

  return NaN;

let _svgId = 0;
function gridSVG({ lines = [], points = [], range = 6, labels = true } = {}) {

  }
  g += `<line x1="0" y1="${c}" x2="${S}" y2="${c}" class="ax"/><line x1="${c}" y1="0" x2="${c}" y2="${S}" class="ax"/>`;
  if (labels) for (let i = -r; i <= r; i += 2) { if (i === 0) continue; g += `<text x="${X(i)}" y="${c + 13}" class="tk">${i}</text><text x="${c - 9}" y="${Y(i) + 4}" class="tk">${i}</text>`; }
  g += `<text x="${S + 4}" y="${c - 4}" class="tk b">x</text><text x="${c + 6}" y="-2" class="tk b">y</text>`;
  g += `<g clip-path="url(#${id})">`;
  for (const L of lines) { g += `<line x1="${X(-r - 1)}" y1="${Y(L.m * (-r - 1) + L.b)}" x2="${X(r + 1)}" y2="${Y(L.m * (r + 1) + L.b)}" class="ln" style="stroke:${L.color || '#2563EB'}"/>`; }
  g += `</g>`;
  for (const p of points) { g += `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4.5" class="pt"/>${p[2] ? `<text x="${X(p[0]) + 7}" y="${Y(p[1]) - 7}" class="tk b">${p[2]}</text>` : ''}`; }
  return g + '</svg>';
}

function barsSVG({ labels, values, poly = false, title = '', ylab = 'Frecuencia', adjacent = true }) {
  const W = 340, H = 220, L = 38, Bm = 34, T = 14, n = values.length;
  const max = Math.max(1, ...values); const step = [1, 2, 5, 10, 20, 25, 50, 100].find(s => max / s <= 6) || 200; const top = Math.ceil((max + 0.5) / step) * step;
  const bw = (W - L - 10) / n; const Y = v => T + (H - T - Bm) * (1 - v / top);
  let g = `<svg viewBox="0 0 ${W} ${H}" class="fig bars" role="img">`;
  for (let v = 0; v <= top; v += step) { g += `<line x1="${L}" x2="${W - 8}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${L - 6}" y="${Y(v) + 4}" class="tk r">${v}</text>`; }
  values.forEach((v, i) => {
    const x = L + i * bw + (adjacent ? 0 : bw * 0.15), w = adjacent ? bw : bw * 0.7;
    g += `<rect x="${x}" y="${Y(v)}" width="${w}" height="${Y(0) - Y(v)}" class="hb"/>`;
    g += `<text x="${L + i * bw + bw / 2}" y="${H - Bm + 15}" class="tk">${labels[i]}</text>`;
  });
  if (poly) { const pts = values.map((v, i) => `${L + i * bw + bw / 2},${Y(v)}`).join(' '); g += `<polyline points="${pts}" class="pl"/>` + values.map((v, i) => `<circle cx="${L + i * bw + bw / 2}" cy="${Y(v)}" r="3.5" class="pt"/>`).join(''); }
  g += `<line x1="${L}" y1="${Y(0)}" x2="${W - 8}" y2="${Y(0)}" class="ax"/><line x1="${L}" y1="${T}" x2="${L}" y2="${Y(0)}" class="ax"/>`;
  g += `<text x="10" y="${(H - Bm) / 2}" class="tk" transform="rotate(-90 10 ${(H - Bm) / 2})">${ylab}</text>`;
  if (title) g += `<text x="${(W + L) / 2}" y="${H - 3}" class="tk">${title}</text>`;
  return g + '</svg>';
}

/* ===== Análisis dimensional (factores de conversión) =====
   Criterio pedagógico: no se usan atajos (“÷ 3.6”, “de grande a chica multiplica”) ni regla de tres.
   Toda conversión se resuelve multiplicando por factores de conversión que valen 1 y cancelando unidades.
   start: { v, n: [unidades arriba], d: [unidades abajo] }  ·  factors: [{ n: [número, unidad], d: [número, unidad] }]
   Devuelve { steps: [...], value, unit }. */
const UXS = u => `<span class="ux">${u}</span>`, UCX = u => `<span class="uc">${u}</span>`;
function dimAnalysis(start, factors, o = {}) {
  const num = [{ v: start.v, u: start.n || [] }].concat(factors.map(f => ({ v: f.n[0], u: [f.n[1]] })));
  const den = [{ v: 1, u: start.d || [] }].concat(factors.map(f => ({ v: f.d[0], u: [f.d[1]] })));
  const nU = num.flatMap((t, i) => t.u.map((u, j) => ({ u, i, j, c: false }))), dU = den.flatMap((t, i) => t.u.map((u, j) => ({ u, i, j, c: false })));
  for (const a of nU) { const b = dU.find(x => !x.c && x.u === a.u); if (b) { a.c = true; b.c = true; } }
  const isC = (L, i, j) => (L.find(x => x.i === i && x.j === j) || {}).c;
  const term = (t, i, L) => `${fmt(t.v)}${t.u.length ? ' ' : ''}${t.u.map((u, j) => isC(L, i, j) ? UCX(u) : UXS(u)).join('·')}`;
  const fracs = num.map((t, i) => `(${frS(term(t, i, nU), term(den[i], i, dU))})`).join(' × ');
  const cancelled = [...new Set(nU.filter(x => x.c).map(x => x.u))];
  const remN = nU.filter(x => !x.c).map(x => x.u), remD = dU.filter(x => !x.c).map(x => x.u);
  const unit = remN.join('·') + (remD.length ? '/' + remD.join('·') : '');
  const pn = num.reduce((a, t) => a * t.v, 1), pd = den.reduce((a, t) => a * t.v, 1); const value = rnd(pn / pd, 9);
  const startTxt = (start.d && start.d.length) ? `${fmt(start.v)} ${start.n.join('·')}/${start.d.join('·')}` : `${fmt(start.v)} ${start.n.join('·')}`;
  const steps = [
    `<b>Dato y unidad que buscamos:</b> tenemos ${startTxt} y queremos el resultado en ${o.target || unit}.${(start.d && start.d.length) ? ` Escribimos la cantidad como fracción: ${frS(fmt(start.v) + ' ' + start.n.join('·'), '1 ' + start.d.join('·'))}.` : ` Escribimos la cantidad como fracción sobre 1: ${frS(fmt(start.v) + ' ' + start.n.join('·'), '1')}.`}`,
    `<b>Equivalencias:</b> ${factors.map(f => f.eq || (f.n[0] === 1 && f.d[0] !== 1 ? `1 ${f.n[1]} = ${fmt(f.d[0])} ${f.d[1]}` : `${fmt(f.d[0])} ${f.d[1]} = ${fmt(f.n[0])} ${f.n[1]}`)).join(' · ')}.`,
    `<b>Factores de conversión:</b> con cada equivalencia formamos una fracción que vale 1, porque arriba y abajo está la misma cantidad escrita en distinta unidad; multiplicar por 1 no cambia la cantidad, solo su unidad. Acomodamos cada fracción para que la unidad que queremos eliminar quede <b>en el lado contrario</b> al que está en el dato (si está arriba, en el factor va abajo).`,
    `<b>Multiplicamos y cancelamos:</b> ${fracs}`,
    `${cancelled.length ? `Se cancelan ${cancelled.map(u => UCX(u)).join(' y ')}: la misma unidad arriba y abajo se divide entre sí y da 1. ` : ''}Quedan ${remN.length ? remN.join('·') : 'números'} arriba${remD.length ? ` y ${remD.join('·')} abajo` : ''}, que es la unidad buscada.`,
    `<b>Operamos los números:</b> arriba ${num.map(t => fmt(t.v)).join(' × ')} = ${fmt(pn)}; abajo ${den.map(t => fmt(t.v)).join(' × ')} = ${fmt(pd)}. ${pd === 1 ? `Resultado: ${B(fmt(rnd(value, o.dec ?? 9)) + ' ' + (o.target || unit))}` : `${frS(fmt(pn) + ' ' + (remN.join('·') || ''), fmt(pd) + (remD.length ? ' ' + remD.join('·') : ''))} = ${B(fmt(rnd(value, o.dec ?? 9)) + ' ' + (o.target || unit))}`}`];
  return { steps, value, unit };
}
const DA_HINT = 'Usa análisis dimensional: multiplica el dato por factores de conversión (fracciones que valen 1) acomodados para que se cancele la unidad que no quieres.';

/* ===== Despejes por balance de la igualdad =====
   Criterio pedagógico: no se usa “pasa restando / pasa dividiendo”. Una igualdad es una balanza: cualquier operación
   se hace en AMBOS lados para que siga en equilibrio. Para “quitar” algo de un lado se aplica su operación contraria. */
const BAL = 'Para que la igualdad siga balanceada, la misma operación se hace en <b>ambos lados</b>.';
/* Y = f1·f2·… → despejar T */
function despMul(Y, fs, T) {
  const o = fs.filter(f => f !== T), oS = o.join(' · ');
  return [`Partimos de la fórmula <b>${Y} = ${fs.join(' · ')}</b> y queremos dejar sola a <b>${T}</b>.`,
    `${T} está <b>multiplicada</b> por ${oS}. La operación contraria de multiplicar es dividir, así que dividimos ambos lados entre ${oS}. ${BAL}<br>${frS(Y, oS)} = ${frS(fs.join(' · '), oS)}`,
    `En el lado derecho, ${oS} entre ${oS} es igual a 1, así que ${T} queda sola: <b>${T} = ${frS(Y, oS)}</b>`];
}
/* Y = X / Z → despejar el numerador X */
function despNum(Y, X, Z) {
  return [`Partimos de la fórmula <b>${Y} = ${frS(X, Z)}</b> y queremos dejar sola a <b>${X}</b>.`,
    `${X} está <b>dividida</b> entre ${Z}. La operación contraria de dividir es multiplicar, así que multiplicamos ambos lados por ${Z}. ${BAL}<br>${Y} · ${Z} = ${frS(X, Z)} · ${Z}`,
    `En el lado derecho, ${Z} entre ${Z} es igual a 1, así que ${X} queda sola: <b>${X} = ${Y} · ${Z}</b>`];
}
/* Y = X / Z → despejar el denominador Z */
function despDen(Y, X, Z) {
  return [`Partimos de la fórmula <b>${Y} = ${frS(X, Z)}</b> y queremos dejar sola a <b>${Z}</b>, que está abajo (en el denominador).`,
    `Primero multiplicamos ambos lados por ${Z} para sacarla del denominador. ${BAL}<br>${Y} · ${Z} = ${frS(X, Z)} · ${Z} &nbsp;→&nbsp; ${Y} · ${Z} = ${X}`,
    `Ahora ${Z} está <b>multiplicada</b> por ${Y}. La operación contraria es dividir: dividimos ambos lados entre ${Y}.<br>${frS(Y + ' · ' + Z, Y)} = ${frS(X, Y)}`,
    `${Y} entre ${Y} es igual a 1, así que: <b>${Z} = ${frS(X, Y)}</b>`];
}
/* Paso de sustitución con unidades */
const sust = (lhs, expr, res) => `Sustituimos los datos con sus unidades: ${lhs} = ${expr} = ${res}`;

/* Ecuación lineal A·v + Bc = C·v + D → pasos de balance (v = nombre de la incógnita) */
function eqSteps(A, Bc, C, D, v = 'x', o = {}) {
  const t = (c, s) => poly([[c, s]]); const side = (a, b) => poly([[a, v], [b, '']]);
  const st = [];
  if (!o.noStart) st.push(`Ecuación: <b>${side(A, Bc)} = ${side(C, D)}</b>. Queremos dejar sola a ${v}. ${BAL}`);
  let a = A, b = Bc, c = C, d = D;
  if (c !== 0) {
    const op = c > 0 ? 'restamos' : 'sumamos', T = t(Math.abs(c), v);
    st.push(`Hay términos con ${v} en los dos lados. Para quitar ${t(c, v)} del lado derecho aplicamos su operación contraria: <b>${op} ${T} en ambos lados</b>.<br>${side(a, b)} ${c > 0 ? '−' : '+'} ${T} = ${side(c, d)} ${c > 0 ? '−' : '+'} ${T} &nbsp;→&nbsp; ${side(a - c, b)} = ${fmt(d)}`);
    a -= c; c = 0;
  }
  if (b !== 0) {
    const op = b > 0 ? 'restamos' : 'sumamos', N = fmt(Math.abs(b));
    st.push(`Al término ${t(a, v)} se le ${b > 0 ? 'suma' : 'resta'} ${N}. La operación contraria de ${b > 0 ? 'sumar' : 'restar'} es ${b > 0 ? 'restar' : 'sumar'}: <b>${op} ${N} en ambos lados</b>.<br>${side(a, b)} ${b > 0 ? '−' : '+'} ${N} = ${fmt(d)} ${b > 0 ? '−' : '+'} ${N} &nbsp;→&nbsp; ${t(a, v)} = ${fmt(d - b)}`);
    d -= b; b = 0;
  }
  if (a !== 1) {
    if (a === -1) st.push(`Tenemos −${v} = ${fmt(d)}. Multiplicamos ambos lados por −1 para cambiar el signo: <b>${v} = ${fmt(-d)}</b>`);
    else st.push(`${v} está <b>multiplicada</b> por ${fmt(a)}. La operación contraria de multiplicar es dividir: <b>dividimos ambos lados entre ${P(a)}</b>.<br>${frS(t(a, v), P(a))} = ${frS(fmt(d), P(a))} &nbsp;→&nbsp; <b>${v} = ${fmt(rnd(d / a, 9))}</b>`);
  } else st.push(`${v} ya quedó sola: <b>${v} = ${fmt(d)}</b>`);
  return st;
}
/* Conversión en una línea (para pasos intermedios): v from × (n to / d from) = r to, con la unidad cancelada */
function daInline(v, from, n, to, d) { const r = rnd(v * n / d, 9); return `${fmt(v)} ${UCX(from)} × ${frS(fmt(n) + ' ' + to, fmt(d) + ' ' + UCX(from))} = ${frS(fmt(rnd(v * n, 9)) + ' ' + to, fmt(d))} = ${fmt(r)} ${to}`; }
const daRes = (v, n, d) => rnd(v * n / d, 9);
/* Bloque de lección con análisis dimensional completo */
const daBlock = (start, factors, o) => `<ol class="steps">${dimAnalysis(start, factors, o).steps.map(x => `<li>${x}</li>`).join('')}</ol>`;
/* Factor de conversión simple a partir de "1 from = k to" */
const daF = (from, to, k) => k >= 1 ? { n: [k, to], d: [1, from] } : { n: [1, to], d: [rnd(1 / k, 9), from] };

/* ===== Registro de materias =====
   Cada materia se agrega con registerSubject(config, ejes) y sus temas con TOPICS.push({...}) o bankTopic({...}).
   - Temas con ejercicios generados (Matemáticas, Física): objeto con gen(nivel) que devuelve una pregunta.
   - Temas de contenido (Español, Historia, etc.): bankTopic() con un banco de preguntas por nivel 1 a 5.
   El campo cal (o m en bankTopic) indica el mes del ciclo en que se ve el tema: 1 = septiembre … 10 = junio. */
const SUBJECTS = {}, EJES = {}, TOPICS = [], CAL = {}, DPATCH = [], DPATCH_USED = new Set();
const ERRT_DEF = [['concepto', 'No entendí el concepto'], ['lectura', 'Leí mal la pregunta'], ['memoria', 'No lo recordaba'], ['nose', 'No sé']];
function registerSubject(cfg, ejes = {}) {
  SUBJECTS[cfg.id] = Object.assign({ errT: ERRT_DEF, errTip: '', temario: '', extraPeda: '', cal: {}, campo: '' }, cfg);
  for (const [k, e] of Object.entries(ejes)) EJES[k] = Object.assign({ subj: cfg.id }, e);
  Object.assign(CAL, cfg.cal || {});
}
/* Pregunta de opción múltiple a partir de un banco: [pregunta, correcta, [distractores], explicación, pista?] */
function cq(bank, hint) { const it = pick(bank); return mc(it[0], it[1], it[2], { hint: it[4] || hint || 'Recuerda la idea clave de la lección y descarta las opciones que no tienen sentido.', sol: [it[3], 'Respuesta: ' + B(it[1])] }); }
/* Variante verdadero/falso de un reactivo del banco: elimina pistas por longitud de las opciones y obliga a juzgar cada afirmación. */
let GEN_VF = false;
function vfQ(it) {
  const showOk = Math.random() < 0.5, shown = showOk ? it[1] : pick(it[2]);
  return mc(`<span class="small mut">¿Verdadero o falso?</span><br>${it[0]}<br><b>→ ${shown}</b>`, showOk ? 'Verdadero' : 'Falso', [showOk ? 'Falso' : 'Verdadero'], { vf: true, hint: 'Piensa si la respuesta propuesta corresponde exactamente a lo que se pregunta.', sol: [showOk ? 'La respuesta propuesta es correcta.' : `La respuesta propuesta no es correcta. La correcta es: <b>${it[1]}</b>.`, it[3]] });
}
/* Lección estructurada para materias de contenido */
function lesson(o) {
  const ul = a => `<ul>${a.map(x => `<li>${x}</li>`).join('')}</ul>`;
  return `<h4>Idea clave</h4><p>${o.k}</p>${o.p ? `<h4>Lo que debes saber</h4>${ul(o.p)}` : ''}${o.t || ''}${o.ex ? `<div class="ex"><b>Ejemplo:</b> ${o.ex}</div>` : ''}${o.er ? `<div class="warn"><b>Errores comunes</b>${ul(o.er)}</div>` : ''}${o.v ? `<div class="life"><b>¿Para qué sirve?</b> ${o.v}</div>` : ''}${o.lab ? `<div class="lab"><b>🧭 Actividad para aplicar:</b> ${o.lab}</div>` : ''}${o.q ? `<div class="think"><b>Piensa antes de seguir:</b> ${o.q[0]}<details><summary>Ver respuesta</summary>${o.q[1]}</details></div>` : ''}`;
}
/* Tema de contenido con banco de preguntas por nivel.
   def: { id, eje, title, nem, m (mes 1-10), formula (resumen), lesson, qs: [[nivel, pregunta, correcta, [distractores], explicación], …] } */
function bankTopic(def) {
  if (def.m) CAL[def.id] = def.m;
  const bank = {}; (def.qs || []).forEach(([l, q, a, d, e]) => { const pt = DPATCH.find(x => q.startsWith(x[0])); if (pt) { d = pt[1]; DPATCH_USED.add(pt[0]); } (bank[l] = bank[l] || []).push([q, a, d, e]); });
  TOPICS.push(Object.assign({}, def, {
    bank,
    gen(L) {
      /* Banco por nivel: se usa el nivel pedido y los vecinos; se evitan las preguntas vistas recientemente
         (memoria de las últimas ~2/3 del grupo) para que el alumno no avance por memorizar respuestas. */
      const lv = [L, L - 1, L + 1, L - 2, L + 2, 1, 2, 3, 4, 5].find(x => bank[x] && bank[x].length);
      let pool = bank[lv].slice(); if (lv === L) { if (bank[L - 1]) pool = pool.concat(bank[L - 1]); if (bank[L + 1] && L >= 3) pool = pool.concat(bank[L + 1]); }
      this._recent = this._recent || [];
      const keep = Math.max(1, Math.floor(pool.length * 2 / 3)); const fresh = pool.filter(it => !this._recent.slice(-keep).includes(it[0]));
      const it = pick(fresh.length ? fresh : pool); this._recent.push(it[0]); if (this._recent.length > 12) this._recent.shift();
      if (L <= 3 && typeof GEN_VF !== 'undefined' && GEN_VF && Math.random() < 0.25) return vfQ(it);
      return cq([it]);
    }
  }));
}

TOPICS.push({
  id: 'signos', eje: 'num', title: 'Multiplicación y división con signo',
  nem: 'Multiplicación y división de números enteros, fracciones y decimales positivos y negativos.',
  formula: '(+)(+) = + · (−)(−) = + · (+)(−) = − · (−)(+) = −. La misma regla vale para la división.',
  lesson: `
<h4>Idea clave</h4>
<p>Cuando multiplicas o divides números con signo haces dos cosas por separado: <b>decides el signo</b> y <b>operas los números sin signo</b> (sus valores absolutos).</p>
<table class="tb"><tr><th>Signos</th><th>Resultado</th><th>Ejemplo</th></tr>
<tr><td>(+) × (+)</td><td>+</td><td>4 × 3 = 12</td></tr>
<tr><td>(−) × (−)</td><td>+</td><td>(−4)(−3) = 12</td></tr>
<tr><td>(+) × (−)</td><td>−</td><td>4 × (−3) = −12</td></tr>
<tr><td>(−) × (+)</td><td>−</td><td>(−4)(3) = −12</td></tr></table>
<p><b>Signos iguales dan positivo; signos diferentes dan negativo.</b> En la división pasa exactamente lo mismo: (−20) ÷ (−5) = 4 y 20 ÷ (−5) = −4.</p>
<h4>¿Y si hay más de dos factores?</h4>
<p>Cuenta los factores negativos. Si son <b>par</b> (2, 4, 6…) el resultado es positivo; si son <b>impar</b> (1, 3, 5…) es negativo. Ejemplo: (−2)(−3)(−1) tiene 3 negativos → resultado negativo: −6.</p>
<h4>Fracciones y decimales</h4>
<p>La regla no cambia. (−2/3) × (3/5): signos diferentes → negativo; 2×3 = 6 y 3×5 = 15 → −6/15 = −2/5.</p>
<div class="ex"><b>Ejemplo resuelto:</b> (−48) ÷ 6
<ol><li>Signos: (−) ÷ (+) → diferentes → resultado negativo.</li><li>Valores absolutos: 48 ÷ 6 = 8.</li><li>Resultado: −8.</li></ol></div>
<div class="warn"><b>Errores comunes</b><ul>
<li>Confundir la regla de la suma con la de la multiplicación: −3 − 5 = −8 (suma), pero (−3)(−5) = +15 (producto).</li>
<li>Olvidar el signo cuando hay tres o más factores negativos.</li></ul></div>
<div class="life"><b>¿Para qué sirve?</b> Si una temperatura baja 3 °C cada hora, después de 4 horas cambió 4 × (−3) = −12 °C. Si hace 4 horas (−4) bajaba 3 °C por hora (−3), entonces hace 4 horas hacía 12 °C <i>más</i>: (−4)(−3) = +12.</div>
<div class="think"><b>Piensa antes de seguir:</b> ¿De qué signo es (−1) multiplicado por sí mismo 7 veces?<details><summary>Ver respuesta</summary>Negativo: hay 7 factores negativos (impar). (−1)<sup>7</sup> = −1.</details></div>`,
  gen(L) {
    if (L === 1) {
      const a = RNZ(-10, 10), b = RNZ(-10, 10), r = a * b;
      return num(`Calcula: ${P(a)} × ${P(b)}`, r, { hint: 'Primero el signo: ¿los dos signos son iguales o diferentes? Luego multiplica sin signos.',
        sol: [`Ley de los signos: ${sgn(a)} × ${sgn(b)} = ${sgn(r)}`, `Valores absolutos: ${Math.abs(a)} × ${Math.abs(b)} = ${Math.abs(r)}`, `Resultado: ${B(fmt(r))}`] });
    }
    if (L === 2) {
      const b = RNZ(-12, 12), r = RNZ(-12, 12), a = b * r;
      return num(`Calcula: ${P(a)} ÷ ${P(b)}`, r, { hint: 'En la división se usa la misma ley de los signos que en la multiplicación.',
        sol: [`Signos: ${sgn(a)} ÷ ${sgn(b)} = ${sgn(r)}`, `Valores absolutos: ${Math.abs(a)} ÷ ${Math.abs(b)} = ${Math.abs(r)}`, `Comprueba: ${P(r)} × ${P(b)} = ${fmt(a)} ✔`, `Resultado: ${B(fmt(r))}`] });
    }
    if (L === 3) {
      const f = [RNZ(-6, 6), RNZ(-6, 6), RNZ(-5, 5)]; const d = RNZ(-3, 3); let prod = f[0] * f[1] * f[2];
      if (prod % d !== 0) f[2] = f[2] * d, prod = f[0] * f[1] * f[2];
      const r = prod / d; const neg = f.filter(x => x < 0).length + (d < 0 ? 1 : 0);
      return num(`Calcula: ${P(f[0])} × ${P(f[1])} × ${P(f[2])} ÷ ${P(d)}`, r, { hint: 'Cuenta cuántos números negativos hay. Par → positivo; impar → negativo.',
        sol: [`Hay ${neg} número(s) negativo(s): ${neg % 2 === 0 ? 'par → resultado positivo' : 'impar → resultado negativo'}.`, `Sin signos: ${Math.abs(f[0])} × ${Math.abs(f[1])} × ${Math.abs(f[2])} = ${Math.abs(prod)}; luego ${Math.abs(prod)} ÷ ${Math.abs(d)} = ${Math.abs(r)}`, `Resultado: ${B(fmt(r))}`] });
    }
    if (L === 4) {
      let [a, b] = rf(9), [c, d] = rf(9); if (Math.random() < 0.6) a = -a; if (Math.random() < 0.6) c = -c; if (a > 0 && c > 0) c = -c; const div = Math.random() < 0.5;
      if (!div) {
        const n = a * c, m = b * d;
        return num(`Calcula y simplifica: ${frP(a, b)} × ${frP(c, d)}`, n / m, { hint: 'Signo primero. Luego numerador por numerador y denominador por denominador. Puedes escribir la respuesta como fracción, por ejemplo -3/4.',
          sol: [`Signo: ${sgn(a)} × ${sgn(c)} = ${sgn(n)}`, `Numeradores: ${Math.abs(a)} × ${Math.abs(c)} = ${Math.abs(n)}; denominadores: ${b} × ${d} = ${m}`, `Resultado: ${frRaw(n, m)} = ${B(fr(n, m))}`] });
      }
      const n = a * d, m = b * c;
      return num(`Calcula y simplifica: ${frP(a, b)} ÷ ${frP(c, d)}`, n / m, { hint: 'Dividir entre una fracción es multiplicar por su recíproca (la fracción “volteada”).',
        sol: [`Cambia la división por multiplicación con la recíproca: ${frP(a, b)} × ${frP(d, c)}`, `Signo: ${sgn(a)} × ${sgn(c)} = ${sgn(n * m)}`, `Multiplica: ${Math.abs(a)}×${d} = ${Math.abs(n)}; ${b}×${Math.abs(c)} = ${Math.abs(m)}`, `Resultado: ${B(fr(n, m))}`] });
    }
    const ai = RNZ(-45, 45), bi = RNZ(-12, 12); if (ai % 10 === 0) return this.gen(5);
    const a = ai / 10, b = bi / 2; const r = rnd(a * b, 4);
    return num(`Calcula: ${P(a)} × ${P(b)}`, r, { hint: 'Multiplica como si no hubiera punto decimal y al final cuenta las cifras decimales. No olvides el signo.',
      sol: [`Signo: ${sgn(a)} × ${sgn(b)} = ${sgn(r)}`, `Sin signos: ${fmt(Math.abs(a))} × ${fmt(Math.abs(b))} = ${fmt(Math.abs(r))}`, `Resultado: ${B(fmt(r))}`] });
  }
});

TOPICS.push({
  id: 'jerarquia', eje: 'num', title: 'Operaciones combinadas con signo',
  nem: 'Jerarquía de operaciones y uso de paréntesis con números con signo.',
  formula: 'Orden: 1) paréntesis ( ) [ ] 2) potencias y raíces 3) multiplicaciones y divisiones (izquierda a derecha) 4) sumas y restas (izquierda a derecha).',
  lesson: `
<h4>Idea clave</h4>
<p>Cuando una expresión tiene varias operaciones, no se resuelve de izquierda a derecha sin más. Hay un orden acordado para que todos lleguemos al mismo resultado:</p>
<ol><li><b>Paréntesis</b> y corchetes, de adentro hacia afuera.</li><li><b>Potencias</b> y raíces.</li><li><b>Multiplicaciones y divisiones</b>, de izquierda a derecha.</li><li><b>Sumas y restas</b>, de izquierda a derecha.</li></ol>
<div class="ex"><b>Ejemplo resuelto:</b> −8 + 3 × (−4)
<ol><li>Primero la multiplicación: 3 × (−4) = −12.</li><li>Queda: −8 + (−12) = −8 − 12.</li><li>Resultado: −20.</li></ol>
Si hubieras sumado primero: (−8 + 3) × (−4) = (−5)(−4) = 20. ¡Otro resultado! Por eso importa el orden.</div>
<div class="ex"><b>Otro ejemplo:</b> (6 − 10) × 2 − 18 ÷ (−3)
<ol><li>Paréntesis: 6 − 10 = −4.</li><li>Multiplicación y división: (−4)×2 = −8; 18 ÷ (−3) = −6.</li><li>Queda: −8 − (−6) = −8 + 6 = −2.</li></ol></div>
<h4>Recordatorio de suma y resta con signo</h4>
<ul><li>Restar un negativo es sumar: 5 − (−3) = 5 + 3 = 8.</li><li>Signos iguales en la suma: se suman y se conserva el signo (−4 − 6 = −10).</li><li>Signos diferentes: se restan y queda el signo del que tiene mayor valor absoluto (−9 + 4 = −5).</li></ul>
<div class="warn"><b>Errores comunes</b><ul><li>Sumar antes de multiplicar.</li><li>Tratar −(−6) como −6. Dos signos menos seguidos se convierten en más.</li><li>Confundir −3² (= −9, el exponente solo afecta al 3) con (−3)² (= 9).</li></ul></div>
<div class="life"><b>¿Para qué sirve?</b> Las calculadoras científicas, las hojas de cálculo y los lenguajes de programación usan exactamente esta jerarquía.</div>`,
  gen(L) {
    if (L === 1) {
      const a = RNZ(-15, 15), b = RNZ(-9, 9), c = RNZ(-9, 9), r = a + b * c;
      return num(`Calcula: ${fmt(a)} + ${P(b)} × ${P(c)}`, r, { hint: 'La multiplicación va antes que la suma.', errs: [{ v: (a + b) * c, m: 'Parece que sumaste antes de multiplicar. Primero va la multiplicación.' }],
        sol: [`Primero la multiplicación: ${P(b)} × ${P(c)} = ${fmt(b * c)}`, `Después la suma: ${fmt(a)} + ${P(b * c)} = ${B(fmt(r))}`] });
    }
    if (L === 2) {
      const a = RNZ(-10, 10), b = RNZ(-10, 10), c = RNZ(-6, 6), d = RNZ(-12, 12), r = (a - b) * c + d;
      return num(`Calcula: (${fmt(a)} − ${P(b)}) × ${P(c)} + ${P(d)}`, r, { hint: 'Empieza por el paréntesis. Recuerda que restar un negativo es sumar.',
        sol: [`Paréntesis: ${fmt(a)} − ${P(b)} = ${fmt(a - b)}`, `Multiplicación: ${P(a - b)} × ${P(c)} = ${fmt((a - b) * c)}`, `Suma: ${fmt((a - b) * c)} + ${P(d)} = ${B(fmt(r))}`] });
    }
    if (L === 3) {
      const b = RNZ(-6, 6), q = RNZ(-9, 9), a = b * q, c = RNZ(-8, 8), d = RNZ(-7, 7), r = q - c * d;
      return num(`Calcula: ${fmt(a)} ÷ ${P(b)} − ${P(c)} × ${P(d)}`, r, { hint: 'Resuelve la división y la multiplicación antes de restar.',
        sol: [`División: ${fmt(a)} ÷ ${P(b)} = ${fmt(q)}`, `Multiplicación: ${P(c)} × ${P(d)} = ${fmt(c * d)}`, `Resta: ${fmt(q)} − ${P(c * d)} = ${B(fmt(r))}`] });
    }
    if (L === 4) {
      const a = RNZ(-10, 10), b = RNZ(-4, 4), c = RNZ(-4, 4), d = R(2, 5), s = b + c, r = a - d * s * s;
      return num(`Calcula: ${fmt(a)} − ${d} × (${fmt(b)} + ${P(c)})<sup>2</sup>`, r, { hint: 'Orden: paréntesis, después la potencia, después la multiplicación y al final la resta.',
        errs: [{ v: (a - d) * s * s, m: 'Restaste antes de multiplicar. La resta va al final.' }],
        sol: [`Paréntesis: ${fmt(b)} + ${P(c)} = ${fmt(s)}`, `Potencia: ${P(s)}<sup>2</sup> = ${fmt(s * s)}`, `Multiplicación: ${d} × ${fmt(s * s)} = ${fmt(d * s * s)}`, `Resta: ${fmt(a)} − ${fmt(d * s * s)} = ${B(fmt(r))}`] });
    }
    const a = RNZ(-5, 5), b = pick([2, 3, 4, 5, 6]), c = RNZ(-5, 5), d = pick([2, 3, 4]), e = RNZ(-3, 3);
    // a/b + c/d × e
    const n2 = c * e, d2 = d; const N = a * d2 + n2 * b, D = b * d2;
    return num(`Calcula y simplifica: ${fr(a, b)} + ${frP(c, d)} × ${P(e)}`, N / D, { hint: 'Primero la multiplicación de la fracción por el entero; luego suma fracciones con común denominador.',
      sol: [`Multiplicación: ${frP(c, d)} × ${P(e)} = ${fr(n2, d2)}`, `Suma con denominador común ${D}: ${frRaw(a * d2, D)} + ${n2 * b < 0 ? '(' + frRaw(n2 * b, D) + ')' : frRaw(n2 * b, D)}`, `= ${frRaw(N, D)} = ${B(fr(N, D))}`] });
  }

TOPICS.push({

<p><b>¿Por qué a⁰ = 1?</b> Porque ${pw(5, 3)} ÷ ${pw(5, 3)} = 1 y, por la ley del cociente, también es ${pw(5, 0)}.</p>

<h4>Cuidado con el signo</h4>
<p>(−3)<sup>2</sup> = (−3)(−3) = 9, pero −3<sup>2</sup> = −(3·3) = −9. Una base negativa con exponente par da positivo; con exponente impar, negativo.</p>
<div class="warn"><b>Errores comunes</b><ul><li>Multiplicar base por exponente: ${pw(3, 4)} no es 12, es 81.</li><li>Multiplicar los exponentes en un producto (${pw('x', 3)}·${pw('x', 4)} no es ${pw('x', 12)}).</li><li>Creer que ${pw(2, -3)} es negativo. El exponente negativo no cambia el signo, cambia de lugar la potencia.</li></ul></div>

<div class="life"><b>¿Para qué sirve?</b> Calcular el lado de un terreno cuadrado a partir de su área, el teorema de Pitágoras (3.º grado), distancias en mapas.</div>`,

    if (L === 2) {

    }
    if (L === 4) {
      const s = pick([1.2, 1.5, 2.5, 0.8, 0.9, 1.1, 1.3, 3.5, 0.6, 0.7]); const A = rnd(s * s, 4); const u = pick(['m', 'cm']);
      return num(`Un cuadrado tiene un área de ${fmt(A)} ${u}². ¿Cuánto mide su lado?`, s, { unit: u, hint: 'El lado es la raíz cuadrada del área. Piensa sin punto decimal y luego acomoda.', sol: [`lado = √${fmt(A)}`, `${fmt(s)} × ${fmt(s)} = ${fmt(A)}`, `Lado: ${B(fmt(s) + ' ' + u)}`] });
    }
    const a = R(1, 12), b = R(2, 13); if (a === b) return this.gen(5);
    return num(`Calcula: √(${frRaw(a * a, b * b)}) (responde como fracción)`, a / b, { hint: 'Saca la raíz del numerador y del denominador por separado.', sol: [`√${a * a} = ${a} y √${b * b} = ${b}`, `Resultado: ${B(fr(a, b))}`] });
  }
});

TOPICS.push({

  nem: 'Proporcionalidad directa: valor faltante, constante de proporcionalidad, escalas y porcentajes.',

  lesson: `
<h4>Idea clave</h4>
<p>Dos cantidades son <b>directamente proporcionales</b> cuando, si una se multiplica por un número, la otra se multiplica por el mismo número. Si 1 kg cuesta $30, 2 kg cuestan $60 y 3 kg $90. El cociente y/x siempre es el mismo: es la <b>constante de proporcionalidad</b> k (aquí k = 30).</p>
<h4>Tres formas de resolver un valor faltante</h4>
<p><i>Problema: 4 cuadernos cuestan $60. ¿Cuánto cuestan 7?</i></p>
<ol><li><b>Valor unitario:</b> 1 cuaderno = 60 ÷ 4 = $15 → 7 cuadernos = 7 × 15 = $105.</li>
<li><b>Constante:</b> k = 60/4 = 15, y = 15·x → y = 15·7 = 105.</li>
<li><b>Regla de tres:</b> 4 → 60, 7 → x; x = 7·60/4 = 105.</li></ol>
<h4>¿Cómo sé si una tabla es proporcional?</h4>
<p>Divide cada y entre su x. Si todos los cocientes son iguales, es proporcional directa. Su gráfica es una recta que <b>pasa por el origen</b> (0, 0).</p>
<h4>Porcentajes y escalas</h4>
<p>El porcentaje es proporcionalidad con base 100: el 15% de 240 es 240 × 15/100 = 36. Una escala 1:50 000 significa que 1 cm del mapa son 50 000 cm reales (0.5 km).</p>
<div class="warn"><b>Errores comunes</b><ul><li>Sumar en lugar de multiplicar: si 2 → 6, entonces 4 → 12, no 8.</li><li>Pensar que toda relación que crece es proporcional. “Una llamada cuesta $5 de conexión más $2 por minuto” crece, pero no es proporcional: no pasa por el origen.</li></ul></div>
<div class="life"><b>¿Para qué sirve?</b> Precios por unidad, recetas, consumo de gasolina, planos y mapas, conversión de monedas.</div>`,
  gen(L) {
    const items = [['cuadernos', 'cuestan'], ['kg de tortilla', 'cuestan'], ['litros de gasolina', 'cuestan'], ['boletos', 'cuestan']];
    if (L === 1) {
      const it = pick(items), u = R(3, 30), a = R(2, 9); let b; do { b = R(2, 15); } while (b === a);
      return num(`Si ${a} ${it[0]} ${it[1]} ${money(a * u)}, ¿cuánto ${it[1]} ${b}?`, b * u, { unit: 'pesos', hint: 'Calcula primero cuánto cuesta 1 (valor unitario).', errs: [{ v: a * u + (b - a), m: 'Sumaste la diferencia. En la proporcionalidad se multiplica, no se suma.' }], sol: [`Valor unitario: ${money(a * u)} ÷ ${a} = ${money(u)}`, `${b} × ${money(u)} = ${B(money(b * u))}`] });
    }
    if (L === 2) {
      const k = pick([1.5, 2.5, 3, 4, 6, 0.5, 12, 7]); const xs = shuffle([1, 2, 3, 4, 5, 6, 8, 10]).slice(0, 4).sort((a, b) => a - b);
      const tbl = `<table class="tb sm"><tr><th>x</th>${xs.map(x => `<td>${x}</td>`).join('')}</tr><tr><th>y</th>${xs.map(x => `<td>${fmt(k * x)}</td>`).join('')}</tr></table>`;
      return num(`La tabla muestra una relación de proporcionalidad directa. ¿Cuál es la constante de proporcionalidad k?${tbl}`, k, { hint: 'k = y ÷ x. Toma cualquier pareja de la tabla.', sol: [`k = ${fmt(k * xs[1])} ÷ ${xs[1]} = ${fmt(k)}`, `Compruébalo con otra pareja: ${fmt(k * xs[3])} ÷ ${xs[3]} = ${fmt(k)}`, `k = ${B(fmt(k))}`] });
    }
    if (L === 3) {
      const p = pick([5, 10, 12, 15, 20, 25, 30, 35, 40, 75, 8, 16]); const N = R(4, 60) * 20; const r = N * p / 100;
      if (Math.random() < 0.5) return num(`¿Cuánto es el ${p}% de ${fmt(N)}?`, r, { hint: `Multiplica por ${p} y divide entre 100 (o multiplica por ${fmt(p / 100)}).`, sol: [`${fmt(N)} × ${p} ÷ 100 = ${B(fmt(r))}`] });
      return num(`En una escuela de ${fmt(N)} alumnos, ${fmt(r)} usan lentes. ¿Qué porcentaje usa lentes?`, p, { unit: '%', hint: 'Porcentaje = parte ÷ total × 100.', sol: [`${fmt(r)} ÷ ${fmt(N)} = ${fmt(p / 100)}`, `${fmt(p / 100)} × 100 = ${B(p + '%')}`] });
    }
    if (L === 4) {
      const esc = pick([25000, 50000, 100000, 200000, 20000]); const cm = R(2, 18) / 2; const km = rnd(cm * esc / 100000, 4);

    }
    const k = R(2, 9); const xs = [1, 2, 3, 4]; const prop = Math.random() < 0.5; const bb = R(1, 6);
    const ys = xs.map(x => prop ? k * x : k * x + bb);

    return mc(`¿La relación de la tabla es de proporcionalidad directa?${tbl}`, prop ? 'Sí, porque el cociente costo/horas es siempre el mismo' : 'No, porque el cociente costo/horas cambia', prop ? ['No, porque el cociente costo/horas cambia', 'No, porque los números no son múltiplos de 10', 'Sí, porque ambos aumentan'] : ['Sí, porque el cociente costo/horas es siempre el mismo', 'Sí, porque ambos aumentan', 'No se puede saber'],

  }
});

TOPICS.push({
  id: 'propinversa', eje: 'prop', title: 'Proporcionalidad inversa',
  nem: 'Proporcionalidad inversa: situaciones, tablas, constante y gráfica.',
  formula: 'x·y = k (constante) → y = k/x. Si x se duplica, y se reduce a la mitad.',
  lesson: `
<h4>Idea clave</h4>
<p>Dos cantidades son <b>inversamente proporcionales</b> cuando, si una se multiplica por un número, la otra se <b>divide</b> entre ese mismo número. Si 6 pintores tardan 10 días, 12 pintores (el doble) tardan 5 días (la mitad).</p>
<p>Lo que se mantiene constante es el <b>producto</b>: x · y = k. En el ejemplo, 6 × 10 = 12 × 5 = 60 (son 60 “días-pintor” de trabajo).</p>
<h4>Cómo resolver</h4>
<ol><li>Calcula la constante k multiplicando los valores conocidos.</li><li>Divide k entre el nuevo valor.</li></ol>
<div class="ex"><b>Ejemplo resuelto:</b> A 60 km/h un viaje dura 4 h. ¿Cuánto dura a 80 km/h?
<ol><li>k = 60 × 4 = 240 (son los km del viaje).</li><li>tiempo = 240 ÷ 80 = 3 h.</li></ol></div>
<h4>Gráfica</h4>
<p>La gráfica de y = k/x es una curva llamada <b>hipérbola</b>: baja rápido al principio y luego cada vez más lento. Nunca toca los ejes.</p>
<h4>Directa, inversa o ninguna</h4>
<ul><li>Si y/x es constante → directa.</li><li>Si x·y es constante → inversa.</li><li>Si ninguno de los dos → no hay proporcionalidad.</li></ul>
<div class="warn"><b>Errores comunes</b><ul><li>Tratar un problema inverso como directo: más trabajadores no significa más días.</li><li>Pensar que “una sube y la otra baja” basta para que sea inversa. Tiene que conservarse el producto.</li></ul></div>
<div class="life"><b>¿Para qué sirve?</b> Repartir trabajo entre personas, velocidad y tiempo, número de llaves llenando un tinaco, cuántas porciones salen según el tamaño.</div>`,
  gen(L) {
    if (L === 1) {
      const t = pick([6, 8, 10, 12, 24, 30, 36]); const a = pick([2, 3, 4, 6]); let b; const k = t * a; const ds = []; for (let d = 2; d <= 24; d++) if (k % d === 0 && d !== a) ds.push(d); b = pick(ds);
      return num(`${a} trabajadores construyen una barda en ${t} días. Trabajando al mismo ritmo, ¿cuántos días tardarían ${b} trabajadores?`, k / b, { unit: 'días', hint: 'Más trabajadores → menos días. Multiplica trabajadores × días para conocer el trabajo total.', errs: [{ v: t * b / a, m: 'Usaste proporcionalidad directa. Si hay más trabajadores, tardan menos.' }], sol: [`Trabajo total: ${a} × ${t} = ${k} días-trabajador`, `${k} ÷ ${b} = ${B(fmt(k / b) + ' días')}`] });
    }
    if (L === 2) {
      const v = pick([40, 50, 60, 80, 90, 100, 120]), h = pick([2, 3, 4, 5, 6]); const d = v * h; const vs = [40, 50, 60, 75, 80, 90, 100, 120].filter(x => x !== v && d % x === 0);
      if (!vs.length) return this.gen(2); const v2 = pick(vs);
      return num(`Un autobús tarda ${h} h en hacer un viaje a ${v} km/h. ¿Cuántas horas tardaría a ${v2} km/h?`, d / v2, { unit: 'h', hint: 'velocidad × tiempo = distancia, y la distancia no cambia.', sol: [`Distancia: ${v} × ${h} = ${d} km`, `Tiempo: ${d} ÷ ${v2} = ${B(fmt(d / v2) + ' h')}`] });
    }
    if (L === 3) {
      const k = pick([24, 36, 48, 60, 72, 120]); const ds = []; for (let d = 1; d <= k; d++) if (k % d === 0) ds.push(d);
      const xs = shuffle(ds.filter(d => d <= 12)).slice(0, 4).sort((a, b) => a - b); const miss = R(1, 3);
      const tbl = `<table class="tb sm"><tr><th>x</th>${xs.map(x => `<td>${x}</td>`).join('')}</tr><tr><th>y</th>${xs.map((x, i) => `<td>${i === miss ? '?' : k / x}</td>`).join('')}</tr></table>`;
      return num(`La tabla es de proporcionalidad inversa. ¿Qué valor va en el lugar de “?”${tbl}`, k / xs[miss], { hint: 'En la proporcionalidad inversa el producto x·y es constante.', sol: [`k = ${xs[0]} × ${k / xs[0]} = ${k}`, `? = ${k} ÷ ${xs[miss]} = ${B(k / xs[miss])}`] });
    }
    if (L === 4) {
      const type = pick(['d', 'i', 'n']); const xs = [1, 2, 3, 4, 6]; const k = pick([12, 24, 36]); const m = R(2, 5), b = R(1, 5);
      const ys = xs.map(x => type === 'd' ? m * x : type === 'i' ? k / x : m * x + b);
      const tbl = `<table class="tb sm"><tr><th>x</th>${xs.map(x => `<td>${x}</td>`).join('')}</tr><tr><th>y</th>${ys.map(y => `<td>${fmt(y)}</td>`).join('')}</tr></table>`;
      const names = { d: 'Proporcionalidad directa', i: 'Proporcionalidad inversa', n: 'Ninguna de las dos' };
      return mc(`¿Qué tipo de relación muestra la tabla?${tbl}`, names[type], Object.values(names).filter(n => n !== names[type]).concat(['Las dos a la vez']), { hint: 'Revisa si y/x es constante (directa) o si x·y es constante (inversa).', sol: [`y/x: ${xs.slice(0, 3).map((x, i) => fmt(ys[i] / x, 2)).join(', ')}…`, `x·y: ${xs.slice(0, 3).map((x, i) => fmt(ys[i] * x, 2)).join(', ')}…`, `Conclusión: ${B(names[type])}`] });
    }
    const n = pick([2, 3, 4]), h = pick([6, 8, 9, 12]); const k = n * h; const add = pick([1, 2, 3, 4, 5].filter(a => k % (n + a) === 0));

  }
});

TOPICS.push({

<p>Un descuento del 20% significa que pagas el 80%: precio × 0.80. Un aumento del 16% (como el IVA) significa pagar el 116%: precio × 1.16. Es más rápido multiplicar por el factor que calcular el porcentaje y luego restarlo.</p>

<h4>Precio antes del IVA</h4>
<p>Si un artículo cuesta $580 con IVA incluido, el precio sin IVA es 580 ÷ 1.16 = $500. (Ojo: no es 580 − 16% de 580.)</p>
<h4>Interés simple</h4>
<p>El interés se calcula siempre sobre el capital inicial: <b>I = C × r × t</b> (r como decimal, t en años). Monto final: M = C + I.</p>
<div class="ex"><b>Ejemplo:</b> $5 000 al 8% anual durante 3 años: I = 5 000 × 0.08 × 3 = $1 200; M = $6 200.</div>
<h4>Interés compuesto</h4>
<p>Cada periodo el interés se suma al capital y el siguiente interés se calcula sobre el nuevo total: <b>M = C(1 + r)<sup>t</sup></b>. Así funcionan las tarjetas de crédito (en tu contra) y muchas inversiones (a tu favor).</p>
<div class="ex"><b>Ejemplo:</b> $5 000 al 8% anual compuesto, 3 años: 5 000 × 1.08<sup>3</sup> = 5 000 × 1.259712 = $6 298.56.</div>
<div class="warn"><b>Errores comunes</b><ul><li>Aplicar dos descuentos sumándolos: 20% y luego 10% no es 30%; es 0.80 × 0.90 = 0.72 → 28%.</li><li>Quitar el IVA restando el 16% del precio con IVA.</li><li>Olvidar convertir el porcentaje a decimal: 8% = 0.08.</li></ul></div>
<div class="life"><b>¿Para qué sirve?</b> Comparar ofertas, entender cuánto cuesta realmente un crédito, ahorrar con inteligencia.</div>`,
  gen(L) {
    if (L === 1) {
      const P0 = R(5, 80) * 50, d = pick([10, 15, 20, 25, 30, 40, 50]); const r = P0 * (100 - d) / 100;
      return num(`Una chamarra cuesta ${money(P0)} y tiene ${d}% de descuento. ¿Cuánto pagas?`, r, { unit: 'pesos', hint: `Con ${d}% de descuento pagas el ${100 - d}% del precio.`, errs: [{ v: P0 * d / 100, m: 'Ese es el descuento, no lo que pagas. Réstalo del precio.' }], sol: [`Pagas el ${100 - d}%: ${fmt(P0)} × ${fmt((100 - d) / 100)} = ${B(money(r))}`] });

    if (L === 2) {
      if (Math.random() < 0.5) { const P0 = R(2, 60) * 25; const r = rnd(P0 * 1.16, 2); return num(`Un artículo cuesta ${money(P0)} más IVA (16%). ¿Cuál es el precio final?`, r, { unit: 'pesos', tol: 0.011, hint: 'Multiplica por 1.16.', sol: [`${fmt(P0)} × 1.16 = ${B(money(r))}`] }); }
      const P0 = R(2, 60) * 25; const C = rnd(P0 * 1.16, 2);

    if (L === 3) {

  lesson: `
<h4>Idea clave</h4>
<p>En una sucesión aritmética cada término se obtiene sumando siempre la misma cantidad, llamada <b>diferencia</b> (d). En 3, 7, 11, 15, … la diferencia es 4. En 10, 7, 4, 1, −2, … la diferencia es −3.</p>
<h4>Cómo encontrar la regla general</h4>

<div class="ex"><b>Ejemplo:</b> 3, 7, 11, 15, …

<div class="ex"><b>Con diferencia negativa:</b> 10, 7, 4, 1, … → d = −3 → −3n + b; −3·1 + b = 10 → b = 13 → <b>−3n + 13</b>.</div>
<h4>¿Qué lugar ocupa un número?</h4>
<p>Iguala la regla al número y resuelve: ¿en qué lugar está 199 en 4n − 1? 4n − 1 = 199 → 4n = 200 → n = 50.</p>
<div class="warn"><b>Errores comunes</b><ul><li>Tomar el primer término como la b: en 3, 7, 11, … la regla no es 4n + 3.</li><li>Para el término 50, sumar la diferencia 50 veces al primero (son 49 saltos, no 50).</li></ul></div>

TOPICS.push({

  lesson: `
<h4>Valor numérico</h4>
<p>Sustituye cada letra por su valor (usa paréntesis con los negativos) y respeta la jerarquía. Si x = −2 y y = 3: 3x − 2y = 3(−2) − 2(3) = −6 − 6 = −12.</p>
<h4>Términos semejantes</h4>
<p>Son términos con la <b>misma parte literal</b> (misma letra y mismo exponente). Solo esos se pueden sumar: 5x + 3y − 2x + y = (5 − 2)x + (3 + 1)y = 3x + 4y. En cambio, 3x + 4y ya no se puede reducir, y 2x² + 3x tampoco.</p>
<h4>Propiedad distributiva</h4>
<p>El número de afuera multiplica a <b>cada</b> término del paréntesis, con su signo: −3(2x − 5) = −6x + 15.</p>
<div class="ex"><b>Ejemplo:</b> −3(2x − 5) + 4x
<ol><li>Distribuye: −6x + 15 + 4x.</li><li>Agrupa semejantes: (−6 + 4)x + 15.</li><li>Resultado: −2x + 15.</li></ol></div>
<h4>Resta de polinomios</h4>
<p>Un signo menos delante de un paréntesis cambia el signo de todos los términos de adentro: (2x² + 3x − 1) − (x² − 4x + 5) = 2x² + 3x − 1 − x² + 4x − 5 = x² + 7x − 6.</p>
<h4>Expresiones equivalentes</h4>
<p>Dos expresiones son equivalentes si dan el mismo valor para <b>cualquier</b> valor de la letra. Ejemplo: el perímetro de un cuadrado de lado x puede escribirse x + x + x + x o 4x.</p>
<div class="warn"><b>Errores comunes</b><ul><li>Sumar términos no semejantes: 3x + 2y ≠ 5xy.</li><li>Distribuir solo al primer término: 3(x + 4) ≠ 3x + 4.</li><li>Olvidar cambiar todos los signos al restar un paréntesis.</li><li>x² + x² = 2x², no x⁴.</li></ul></div>
<div class="life"><b>¿Para qué sirve?</b> Escribir fórmulas (perímetros, costos), simplificar cálculos y preparar ecuaciones.</div>`,

      return mc(`Reduce los términos semejantes: ${exp}`, ok, [poly([[a - c, 'x'], [b - d, 'y'], [e, '']]), poly([[X, 'x'], [-Y, 'y'], [e, '']]), poly([[X + Y, 'xy'], [e, '']]), poly([[X, 'x'], [Y, 'y'], [-e, '']])], { hint: 'Agrupa los términos con x y los términos con y por separado, respetando cada signo.', sol: [`Términos con x: ${poly([[a, 'x']])} y ${poly([[c, 'x']])} → ${fmt(a)} ${c < 0 ? '−' : '+'} ${fmt(Math.abs(c))} = ${fmt(X)}`, `Términos con y: ${fmt(b)} ${d < 0 ? '−' : '+'} ${fmt(Math.abs(d))} = ${fmt(Y)}`, `Resultado: ${B(ok)}`] });
    }

        [poly([[k * p + m, 'x'], [q, '']]), poly([[k * p + m, 'x'], [-k * q, '']]), poly([[k * p - m, 'x'], [k * q, '']]), poly([[k * p, 'x'], [k * q + m, '']])],
        { hint: `Multiplica ${fmt(k)} por cada término del paréntesis (cuida los signos) y luego reduce.`, sol: [`Distributiva: ${fmt(k)}·${poly([[p, 'x']])} = ${poly([[k * p, 'x']])}; ${fmt(k)}·${P(q)} = ${fmt(k * q)}`, `${poly([[k * p, 'x'], [k * q, ''], [m, 'x']])}`, `Reduce: ${B(ok)}`] });

      return mc(`Los lados de un triángulo miden ${s.map(t => poly([[t[0], 'x'], [t[1], '']])).join(', ')}. ¿Cuál es su perímetro?`, ok, [poly([[X, 'x'], [-Y, '']]), poly([[X + Y, 'x']]), poly([[X, X2], [Y, '']]), poly([[X - 1, 'x'], [Y + 1, '']])], { hint: 'Suma los tres lados y reduce términos semejantes.', sol: [`x: ${s.map(t => t[0]).join(' + ')} = ${X}`, `Números: ${s.map(t => P(t[1])).join(' + ')} = ${fmt(Y)}`, `Perímetro: ${B(ok)}`] });

    const A = [RNZ(-5, 6), RNZ(-7, 7), R(-9, 9)], Bp = [RNZ(-5, 5), RNZ(-7, 7), R(-9, 9)]; const D = A.map((v, i) => v - Bp[i]);

TOPICS.push({
  id: 'ecuaciones', eje: 'alg', title: 'Ecuaciones lineales',
  nem: 'Ecuaciones lineales de la forma ax + b = cx + d, con paréntesis y fracciones; planteamiento de problemas.',
  formula: 'La ecuación es una balanza: toda operación se hace en AMBOS lados. Para quitar algo de un lado se aplica su operación contraria (suma ↔ resta, multiplicación ↔ división) en los dos lados.',
  lesson: `
<h4>Idea clave: la balanza</h4>
<p>Una ecuación es una balanza en equilibrio. Puedes hacer cualquier operación siempre que la hagas <b>en los dos lados</b>. El objetivo es dejar sola a la x.</p>
<h4>Pasos</h4>
<p>La regla de oro: para “quitar” un número o un término de un lado, se aplica su <b>operación contraria</b>, y se hace <b>en los dos lados</b> para que la balanza no se desequilibre.</p>
<table class="tb"><tr><th>Si en el lado de x hay…</th><th>Operación contraria (en ambos lados)</th></tr><tr><td>una suma (+ 7)</td><td>restar 7</td></tr><tr><td>una resta (− 7)</td><td>sumar 7</td></tr><tr><td>una multiplicación (3x)</td><td>dividir entre 3</td></tr><tr><td>una división (x/4)</td><td>multiplicar por 4</td></tr></table>
<ol><li>Quita paréntesis con la propiedad distributiva.</li><li>Reúne los términos con x en un lado: aplica la operación contraria del término que quieres quitar, en ambos lados.</li><li>Quita el número que suma o resta al término con x, con la operación contraria en ambos lados.</li><li>Quita el número que multiplica a x dividiendo ambos lados entre él.</li><li><b>Comprueba</b> sustituyendo en la ecuación original.</li></ol>
<div class="ex"><b>Ejemplo:</b><ol class="steps">${eqSteps(5, -7, 2, 8).map(x => `<li>${x}</li>`).join('')}<li>Comprobación: 5(5) − 7 = 18 y 2(5) + 8 = 18 ✔</li></ol></div>
<div class="ex"><b>Con paréntesis:</b> 3(x − 4) = x + 6. Primero la distributiva: 3x − 12 = x + 6.<ol class="steps">${eqSteps(3, -12, 1, 6, 'x', { noStart: true }).map(x => `<li>${x}</li>`).join('')}</ol></div>
<div class="ex"><b>Con fracciones:</b> ${frS('x', '4')} + 3 = 7<ol class="steps"><li>Al término ${frS('x', '4')} se le suma 3: <b>restamos 3 en ambos lados</b> → ${frS('x', '4')} + 3 − 3 = 7 − 3 → ${frS('x', '4')} = 4</li><li>x está <b>dividida</b> entre 4; la operación contraria es multiplicar: <b>multiplicamos ambos lados por 4</b> → ${frS('x', '4')} · 4 = 4 · 4 → <b>x = 16</b></li></ol></div>
<h4>Plantear problemas</h4>
<p>Traduce el texto: “el doble de un número” = 2x; “un número aumentado en 5” = x + 5; “tres números consecutivos” = x, x + 1, x + 2.</p>
<div class="warn"><b>Errores comunes</b><ul><li>Hacer la operación contraria solo en un lado: la balanza se desequilibra y el resultado sale mal.</li><li>En −2x = 10, dividir entre 2 en lugar de −2 (x = −5).</li><li>Hacer una operación solo en un lado.</li><li>No comprobar.</li></ul></div>
<div class="life"><b>¿Para qué sirve?</b> Encontrar un valor desconocido: cuánto cuesta cada artículo, cuántas horas trabajar para juntar una cantidad, la edad de alguien.</div>`,

TOPICS.push({
  id: 'sistemas', eje: 'alg', title: 'Sistemas de ecuaciones 2×2',

  formula: 'Suma y resta (reducción): multiplica para igualar coeficientes y elimina una variable. Sustitución: deja sola una variable en una ecuación (balanceando ambos lados) y sustitúyela en la otra. Gráfico: la solución es el punto donde se cruzan las rectas.',

<h4>Método de suma y resta (reducción)</h4>
<div class="ex">x + y = 10 &nbsp;(1)<br>x − y = 4 &nbsp;&nbsp;(2)
<ol><li>Suma (1) + (2): 2x = 14. Como x está multiplicada por 2, dividimos ambos lados entre 2: x = 7.</li><li>Sustituye en (1): 7 + y = 10. A y se le suma 7: restamos 7 en ambos lados → y = 3.</li><li>Comprueba en (2): 7 − 3 = 4 ✔ → Solución (7, 3).</li></ol></div>
<p>Si los coeficientes no se eliminan directo, multiplica una o ambas ecuaciones para que una variable tenga coeficientes opuestos.</p>
<div class="ex">2x + 3y = 12 &nbsp;(1)<br>3x − y = 7 &nbsp;&nbsp;(2)
<ol><li>Multiplica <b>los dos lados</b> de (2) por 3: 9x − 3y = 21.</li><li>Suma con (1): 11x = 33. Dividimos ambos lados entre 11: x = 3.</li><li>En (2): 9 − y = 7. Restamos 9 en ambos lados: −y = −2; multiplicamos ambos lados por −1: y = 2.</li></ol></div>
<h4>Método de sustitución</h4>
<p>Deja sola una variable en una de las ecuaciones aplicando operaciones contrarias en ambos lados (por ejemplo, en x + y = 10 se resta y en ambos lados: x = 10 − y) y sustitúyela en la otra. Útil cuando alguna variable tiene coeficiente 1.</p>
<h4>¿Cuántas soluciones?</h4>

      const A1 = a1 * m1, A2 = a2 * m2, C1 = c1 * m1, C2 = c2 * m2;

        `${same ? 'Resta' : 'Suma'} las ecuaciones (sumar o restar cantidades iguales en ambos lados mantiene el balance): ${poly([[A, 'x']])} = ${fmt(C)}`].concat(eqSteps(A, 0, 0, C, 'x', { noStart: true }),

    };
    if (L === 1) return pair(`Resuelve el sistema:<div class="sys">x + y = ${fmt(x + y)}<br>x − y = ${fmt(x - y)}</div>`, x, y, { hint: 'Suma las dos ecuaciones: la y se elimina.', sol: [`Sumamos las dos ecuaciones lado a lado (la y se elimina porque +y − y = 0): 2x = ${fmt(2 * x)}`].concat(eqSteps(2, 0, 0, 2 * x, 'x', { noStart: true }), [`En la primera: ${fmt(x)} + y = ${fmt(x + y)}`], eqSteps(1, x, 0, x + y, 'y', { noStart: true }), [`Solución: ${B(`(${fmt(x)}, ${fmt(y)})`)}`]) });
    if (L === 2 || L === 3) {

      const c1 = a1 * x + b1 * y, c2 = a2 * x + b2 * y;

    let m2; do { m2 = RNZ(-3, 3); } while (m2 === m); const xx = R(-3, 3), yy = m * xx + b, b2 = yy - m2 * xx; if (Math.abs(yy) > 6 || Math.abs(b2) > 6) return this.gen(5);

TOPICS.push({

<h4>Pendiente a partir de dos puntos</h4>

<div class="ex"><b>Ejemplo:</b> puntos (1, 3) y (4, 9): m = (9 − 3)/(4 − 1) = 6/3 = 2. Para b: 3 = 2(1) + b → 3 = 2 + b; restamos 2 en ambos lados → b = 1. La recta es y = 2x + 1.</div>
<h4>Leer una gráfica</h4>

<h4>En la vida real</h4>
<p>Un taxi cobra $13 de banderazo más $6 por km: costo = 6x + 13. La pendiente (6) es el costo por km y la ordenada (13) es el cargo fijo. Como b ≠ 0, <b>no</b> es proporcional: viajar el doble no cuesta el doble.</p>

      return num(`¿Cuál es la pendiente de la recta que pasa por (${fmt(x1)}, ${fmt(y1)}) y (${fmt(x2)}, ${fmt(y2)})?`, mm, { hint: 'm = (y₂ − y₁) ÷ (x₂ − x₁).', errs: [{ v: 1 / mm, m: 'Invertiste el cociente: es cambio en y entre cambio en x.' }], sol: [`m = (${fmt(y2)} − ${P(y1)}) ÷ (${fmt(x2)} − ${P(x1)})`, `m = ${fmt(y2 - y1)} ÷ ${fmt(x2 - x1)} = ${B(fmt(mm))}`] }); }

function angRelation(i, j) {
  const ti = i <= 4, tj = j <= 4, pi = (i - 1) % 4, pj = (j - 1) % 4;

<p>Perímetro: <b>P = n × l</b> (número de lados por lo que mide un lado).</p>
<p>Área: <b>A = (P × a) ÷ 2</b>, donde la <b>apotema</b> (a) es el segmento que va del centro al punto medio de un lado. ¿Por qué? El polígono se divide en n triángulos iguales de base l y altura a: n × (l × a ÷ 2) = P × a ÷ 2.</p>
<div class="ex"><b>Ejemplo:</b> hexágono regular de lado 8 cm y apotema 6.9 cm: P = 6 × 8 = 48 cm; A = 48 × 6.9 ÷ 2 = 165.6 cm².</div>
<h4>Circunferencia y círculo</h4>
<p>La circunferencia es la orilla; el círculo es toda la superficie. El número <b>π ≈ 3.14</b> es cuántas veces cabe el diámetro en la circunferencia.</p>
<ul><li>Longitud de la circunferencia: <b>C = π × d = 2 × π × r</b></li><li>Área del círculo: <b>A = π × r²</b></li></ul>
<div class="ex"><b>Ejemplo:</b> r = 5 cm → C = 2 × 3.14 × 5 = 31.4 cm; A = 3.14 × 25 = 78.5 cm².</div>
<h4>Áreas sombreadas</h4>
<p>Resta el área de lo que <b>no</b> está sombreado al área total. Ejemplo: cuadrado de 10 cm con un círculo inscrito: 100 − 78.5 = 21.5 cm².</p>
<div class="warn"><b>Errores comunes</b><ul><li>Usar el diámetro en lugar del radio en A = πr².</li><li>Calcular r² como r × 2.</li><li>Olvidar que las unidades de área van al cuadrado (cm²).</li></ul></div>
<div class="life"><b>¿Para qué sirve?</b> Calcular pintura para una pared, pasto para un jardín redondo, la vuelta de una llanta de bicicleta.</div>`,
  gen(L) {
    const pol = { 5: 'pentágono', 6: 'hexágono', 8: 'octágono', 10: 'decágono', 3: 'triángulo equilátero', 4: 'cuadrado', 12: 'dodecágono' };
    if (L === 1) { const n = pick([3, 5, 6, 8, 10, 12]), l = R(3, 25) / (Math.random() < 0.3 ? 2 : 1); return num(`¿Cuál es el perímetro de un ${pol[n]} regular de ${fmt(l)} cm de lado?`, n * l, { unit: 'cm', hint: 'P = número de lados × lado.', sol: [`P = ${n} × ${fmt(l)} = ${B(fmt(n * l) + ' cm')}`] }); }
    if (L === 2) { const n = pick([5, 6, 8]), l = R(4, 20); const ap = { 5: 0.688, 6: 0.866, 8: 1.207 }[n]; const a = rnd(l * ap, 1); const A = rnd(n * l * a / 2, 4);
      return num(`Un ${pol[n]} regular mide ${l} cm de lado y su apotema mide ${fmt(a)} cm. ¿Cuál es su área?`, A, { unit: 'cm²', tol: 0.051, hint: 'A = (perímetro × apotema) ÷ 2.', errs: [{ v: n * l * a, m: 'Falta dividir entre 2.' }], sol: [`P = ${n} × ${l} = ${n * l} cm`, `A = ${n * l} × ${fmt(a)} ÷ 2 = ${B(fmt(A) + ' cm²')}`] }); }
    if (L === 3) { const r = R(2, 30); const useD = Math.random() < 0.5; const C = rnd(2 * PI * r, 4);
      return num(`¿Cuánto mide la circunferencia de un círculo con ${useD ? `diámetro de ${2 * r}` : `radio de ${r}`} cm? (π = 3.14)`, C, { unit: 'cm', tol: 0.011, hint: 'C = π × d = 2 × π × r.', errs: [{ v: rnd(PI * r, 4), m: 'Usaste el radio como si fuera el diámetro. C = π × d = 2πr.' }], fig: circSVG(r, useD ? '' : 'r = ' + r), sol: [`d = ${2 * r} cm`, `C = 3.14 × ${2 * r} = ${B(fmt(C) + ' cm')}`] }); }
    if (L === 4) { const r = R(2, 20); const useD = Math.random() < 0.4; const A = rnd(PI * r * r, 4);
      return num(`¿Cuál es el área de un círculo de ${useD ? `${2 * r} cm de diámetro` : `${r} cm de radio`}? (π = 3.14)`, A, { unit: 'cm²', tol: 0.011, hint: useD ? 'Primero obtén el radio (mitad del diámetro). A = π × r².' : 'A = π × r².', errs: [{ v: rnd(PI * 4 * r * r, 4), m: 'Usaste el diámetro en lugar del radio.' }, { v: rnd(PI * 2 * r, 4), m: 'Calculaste r × 2 en vez de r × r.' }], fig: circSVG(r, useD ? 'd/2' : 'r = ' + r), sol: [`r = ${r} cm → r² = ${r * r}`, `A = 3.14 × ${r * r} = ${B(fmt(A) + ' cm²')}`] }); }
    const t = R(0, 2);
    if (t === 0) { const r = R(2, 15); const A = rnd(4 * r * r - PI * r * r, 4); return num(`Un círculo está inscrito en un cuadrado de ${2 * r} cm de lado. ¿Cuál es el área de la región sombreada (dentro del cuadrado, fuera del círculo)? (π = 3.14)`, A, { unit: 'cm²', tol: 0.011, fig: circSVG(r, 'r', 'sq'), hint: 'Área del cuadrado menos área del círculo. El radio es la mitad del lado.', sol: [`Cuadrado: ${2 * r}² = ${4 * r * r} cm²`, `Círculo: r = ${r} → 3.14 × ${r * r} = ${fmt(PI * r * r)} cm²`, `Sombreada: ${4 * r * r} − ${fmt(PI * r * r)} = ${B(fmt(A) + ' cm²')}`] }); }
    if (t === 1) { const R2 = R(6, 20), r = R(2, R2 - 2); const A = rnd(PI * (R2 * R2 - r * r), 4); return num(`Una corona circular (anillo) tiene radio exterior de ${R2} cm y radio interior de ${r} cm. ¿Cuál es su área? (π = 3.14)`, A, { unit: 'cm²', tol: 0.011, fig: circSVG(R2, 'R', 'ring'), hint: 'Área del círculo grande menos área del círculo chico.', sol: [`Grande: 3.14 × ${R2 * R2} = ${fmt(PI * R2 * R2)}`, `Chico: 3.14 × ${r * r} = ${fmt(PI * r * r)}`, `Corona: ${B(fmt(A) + ' cm²')}`] }); }
    const r = R(3, 40); const C = rnd(2 * PI * r, 4); return num(`Una rueda tiene una circunferencia de ${fmt(C)} cm. ¿Cuánto mide su radio? (π = 3.14)`, r, { unit: 'cm', tol: 0.05, hint: 'C = 2πr. El radio está multiplicado por 2π: divide ambos lados entre 2π.', sol: despMul('C', ['2', 'π', 'r'], 'r').concat([sust('r', frS(fmt(C) + ' cm', '2 × 3.14') + ' = ' + frS(fmt(C) + ' cm', '6.28'), B(r + ' cm'))]) });
  }
});

function boxSVG(l, a, h) {
  return `<svg viewBox="0 0 230 170" class="fig" role="img"><polygon points="30,60 150,60 150,150 30,150" class="fillB"/><polygon points="30,60 70,25 190,25 150,60" class="fillA"/><polygon points="150,60 190,25 190,115 150,150" class="fillC"/><text x="90" y="165" class="tk b">${l}</text><text x="178" y="140" class="tk b">${a}</text><text x="12" y="108" class="tk b">${h}</text></svg>`;
}
function cylSVG(r, h) {
  return `<svg viewBox="0 0 200 180" class="fig" role="img"><rect x="50" y="35" width="100" height="110" class="fillB"/><ellipse cx="100" cy="145" rx="50" ry="14" class="fillB"/><ellipse cx="100" cy="35" rx="50" ry="14" class="fillA"/><line x1="100" y1="35" x2="150" y2="35" class="ln"/><text x="112" y="29" class="tk b">${r}</text><text x="160" y="95" class="tk b">${h}</text></svg>`;
}

TOPICS.push({
  id: 'volumen', eje: 'geo', title: 'Volumen de prismas y cilindros',

  lesson: `
<h4>Idea clave</h4>
<p>El volumen mide cuánto espacio ocupa un cuerpo, en unidades cúbicas (cm³, m³). En prismas y cilindros se cumple siempre:</p>
<p class="c"><b>Volumen = área de la base × altura</b></p>
<p>Imagina que apilas capas iguales a la base, una sobre otra, hasta llegar a la altura.</p>
<table class="tb"><tr><th>Cuerpo</th><th>Base</th><th>Volumen</th></tr>
<tr><td>Prisma rectangular</td><td>l × a</td><td>l × a × h</td></tr>
<tr><td>Prisma triangular</td><td>b × h<sub>t</sub> ÷ 2</td><td>(b × h<sub>t</sub> ÷ 2) × H</td></tr>
<tr><td>Prisma hexagonal regular</td><td>P × a ÷ 2</td><td>(P × a ÷ 2) × H</td></tr>
<tr><td>Cilindro</td><td>π r²</td><td>π r² × h</td></tr></table>
<h4>Volumen y capacidad</h4>
<p><b>1 dm³ = 1 litro</b>, &nbsp; <b>1 cm³ = 1 mL</b>, &nbsp; <b>1 m³ = 1 000 L</b>. Un cubo de 10 cm por lado contiene 1 000 cm³ = 1 L.</p>
<div class="ex"><b>Ejemplo:</b> Un tinaco cilíndrico de 50 cm de radio y 120 cm de altura: V = 3.14 × 2 500 × 120 = 942 000 cm³ = 942 L.</div>
<div class="warn"><b>Errores comunes</b><ul><li>Confundir la altura del triángulo de la base con la altura del prisma.</li><li>Mezclar unidades (metros con centímetros) sin convertir.</li><li>Pensar que 1 m³ = 100 L (son 1 000 L).</li></ul></div>
<div class="life"><b>¿Para qué sirve?</b> Capacidad de tinacos, cisternas y albercas; concreto para una losa; cajas de empaque.</div>`,
  gen(L) {
    if (L === 1) { const l = R(2, 15), a = R(2, 12), h = R(2, 10); return num(`Una caja mide ${l} cm de largo, ${a} cm de ancho y ${h} cm de alto. ¿Cuál es su volumen?`, l * a * h, { unit: 'cm³', fig: boxSVG(l + ' cm', a + ' cm', h + ' cm'), hint: 'V = largo × ancho × alto.', sol: [`Base: ${l} × ${a} = ${l * a} cm²`, `V = ${l * a} × ${h} = ${B(l * a * h + ' cm³')}`] }); }
    if (L === 2) { const b = R(2, 12), ht = R(2, 10), H = R(3, 20); const V = b * ht / 2 * H; return num(`Un prisma triangular tiene como base un triángulo de ${b} cm de base y ${ht} cm de altura. La altura del prisma es ${H} cm. ¿Cuál es su volumen?`, V, { unit: 'cm³', hint: 'Primero el área del triángulo de la base (b × h ÷ 2); luego por la altura del prisma.', errs: [{ v: b * ht * H, m: 'Falta dividir entre 2 el área del triángulo.' }], sol: [`Área de la base: ${b} × ${ht} ÷ 2 = ${fmt(b * ht / 2)} cm²`, `V = ${fmt(b * ht / 2)} × ${H} = ${B(fmt(V) + ' cm³')}`] }); }
    if (L === 3) { const r = R(1, 10), h = R(2, 25); const V = rnd(PI * r * r * h, 4); return num(`¿Cuál es el volumen de un cilindro de ${r} cm de radio y ${h} cm de altura? (π = 3.14)`, V, { unit: 'cm³', tol: 0.011, fig: cylSVG('r = ' + r, 'h = ' + h), hint: 'V = π × r² × h.', sol: [`Base: 3.14 × ${r}² = ${fmt(PI * r * r)} cm²`, `V = ${fmt(PI * r * r)} × ${h} = ${B(fmt(V) + ' cm³')}`] }); }
    if (L === 4) { const l = R(4, 12), a = rnd(l * 0.866, 1), H = R(5, 20); const Ab = rnd(6 * l * a / 2, 4), V = rnd(Ab * H, 4); return num(`Un prisma hexagonal regular tiene lado de la base de ${l} cm, apotema de ${fmt(a)} cm y altura de ${H} cm. ¿Cuál es su volumen?`, V, { unit: 'cm³', tol: 0.051, hint: 'Área de la base = (P × a) ÷ 2; luego multiplica por la altura.', sol: [`P = 6 × ${l} = ${6 * l} cm`, `Base: ${6 * l} × ${fmt(a)} ÷ 2 = ${fmt(Ab)} cm²`, `V = ${fmt(Ab)} × ${H} = ${B(fmt(V) + ' cm³')}`] }); }
    const t = R(0, 2);
    if (t === 0) { const l = R(2, 10) * 10, a = R(2, 8) * 10, h = R(2, 10) * 10; const Lt = l * a * h / 1000; return num(`Una pecera mide ${l} cm × ${a} cm × ${h} cm. ¿Cuántos litros de agua le caben?`, Lt, { unit: 'L', fig: boxSVG(l + ' cm', a + ' cm', h + ' cm'), hint: 'Calcula el volumen en cm³ y conviértelo a litros con análisis dimensional (1 L = 1 000 cm³).', sol: [`V = ${l} cm × ${a} cm × ${h} cm = ${fmt(l * a * h)} cm³`, `En litros: ${daInline(l * a * h, 'cm³', 1, 'L', 1000).replace(/= ([^=]*)$/, '= ' + B(fmt(Lt) + ' L'))}`] }); }
    if (t === 1) { const r = R(3, 8) * 10, h = R(8, 15) * 10; const V = PI * r * r * h; const Lt = rnd(V / 1000, 3); return num(`Un tinaco cilíndrico mide ${r} cm de radio y ${h} cm de altura. ¿Cuántos litros le caben? (π = 3.14)`, Lt, { unit: 'L', tol: 0.011, fig: cylSVG('r = ' + r, 'h = ' + h), hint: 'V = π r² h en cm³; conviértelo a litros con análisis dimensional (1 L = 1 000 cm³).', sol: [`V = 3.14 × ${r * r} cm² × ${h} cm = ${fmt(V)} cm³`, `En litros: ${daInline(V, 'cm³', 1, 'L', 1000)} ≈ ${B(fmt(Lt) + ' L')}`] }); }
    const l = R(2, 12), a = R(2, 12), h = R(2, 15); const V = l * a * h; return num(`Un prisma rectangular tiene un volumen de ${V} cm³. Su base mide ${l} cm × ${a} cm. ¿Cuál es su altura?`, h, { unit: 'cm', hint: 'V = (área de la base) · h. La altura está multiplicada por el área de la base: divide ambos lados entre ella.', sol: [`Área de la base: ${l} cm × ${a} cm = ${l * a} cm²`].concat(despMul('V', ['A<sub>base</sub>', 'h'], 'h'), [sust('h', frS(V + ' cm³', (l * a) + ' cm²'), B(h + ' cm'))]) });
  }
});

TOPICS.push({
  id: 'conversiones', eje: 'geo', title: 'Conversión de unidades (SI e inglés)',
  nem: 'Unidades del Sistema Internacional y del sistema inglés; conversiones de longitud, masa, capacidad, área y volumen.',
  formula: 'Toda conversión se hace con análisis dimensional: dato × factores de conversión (fracciones que valen 1). Equivalencias: 1 km = 1 000 m · 1 m = 100 cm · 1 kg = 1 000 g · 1 L = 1 000 mL · 1 m² = 10 000 cm² · 1 m³ = 1 000 L · 1 in = 2.54 cm · 1 ft = 0.3048 m · 1 mi = 1.609 km · 1 lb = 0.454 kg · 1 gal = 3.785 L · 1 h = 3 600 s',
  lesson: `
<h4>Idea clave: el análisis dimensional</h4>
<p>Para cambiar una cantidad de unidad se multiplica por <b>factores de conversión</b>. Un factor de conversión es una fracción hecha con una equivalencia, por ejemplo ${frS('1 000 m', '1 km')}. Como arriba y abajo está la misma longitud, la fracción <b>vale 1</b>; multiplicar por 1 no cambia la cantidad, solo la unidad en que está escrita.</p>
<p><b>Cómo acomodar el factor:</b> la unidad que quieres <b>eliminar</b> va en el lado <b>contrario</b> al que tiene en el dato. Si el dato tiene km arriba, el factor lleva km abajo. Entonces km arriba entre km abajo se cancela (igual que 5 ÷ 5 = 1) y queda la unidad que buscas.</p>
<div class="ex"><b>Ejemplo 1:</b> 7.6 g a kg.${daBlock({ v: 7.6, n: ['g'] }, [{ n: [1, 'kg'], d: [1000, 'g'] }])}</div>
<div class="ex"><b>Ejemplo 2:</b> 72 km/h a m/s (dos factores: uno para los km y otro para las horas).${daBlock({ v: 72, n: ['km'], d: ['h'] }, [{ n: [1000, 'm'], d: [1, 'km'] }, { n: [1, 'h'], d: [3600, 's'] }])}</div>
<h4>Área y volumen: ¡cuidado!</h4>
<p>1 m = 100 cm, pero <b>1 m² = 100 cm × 100 cm = 10 000 cm²</b> y <b>1 m³ = 100 × 100 × 100 = 1 000 000 cm³</b>. Además, 1 m³ = 1 000 L. Usa directamente estas equivalencias en el factor.</p>
<h4>Sistema inglés (equivalencias más usadas)</h4>
<table class="tb"><tr><th>Unidad</th><th>Equivale a</th></tr><tr><td>1 pulgada (in)</td><td>2.54 cm</td></tr><tr><td>1 pie (ft) = 12 in</td><td>30.48 cm</td></tr><tr><td>1 yarda (yd) = 3 ft</td><td>0.9144 m</td></tr><tr><td>1 milla (mi)</td><td>1.609 km</td></tr><tr><td>1 libra (lb)</td><td>0.454 kg</td></tr><tr><td>1 galón (gal)</td><td>3.785 L</td></tr></table>
<div class="ex"><b>Ejemplo 3:</b> 20 km a millas.${daBlock({ v: 20, n: ['km'] }, [{ n: [1, 'mi'], d: [1.609, 'km'] }], { dec: 2 })}</div>
<div class="warn"><b>Errores comunes</b><ul><li>Acomodar el factor al revés: si la unidad que querías eliminar no se cancela (queda km·km o km arriba y abajo sin tacharse), voltea el factor.</li><li>Convertir m² a cm² con el factor de 100: en área el factor es 10 000 (y en volumen 1 000 000).</li><li>Escribir el resultado sin unidad.</li></ul></div>
<div class="life"><b>¿Para qué sirve?</b> Tamaño de pantallas y llantas (pulgadas), recetas de otros países, velocidad en carreteras de EE. UU., compras por libra, y en Física para usar m, kg y s en todas las fórmulas.</div>`,
  gen(L) {
    const tl = v => Math.max(0.011, Math.abs(v) * 0.002);
    if (L === 1) {
      const c = pick([['km', 'm', 1000], ['m', 'cm', 100], ['kg', 'g', 1000], ['L', 'mL', 1000], ['m', 'mm', 1000], ['cm', 'mm', 10]]); const big = Math.random() < 0.5;
      const v = big ? R(2, 95) / (Math.random() < 0.5 ? 10 : 1) : R(5, 9000);
      const r = big ? v * c[2] : v / c[2]; const from = big ? c[0] : c[1], to = big ? c[1] : c[0];
      const f = big ? { n: [c[2], c[1]], d: [1, c[0]] } : { n: [1, c[0]], d: [c[2], c[1]] };
      return num(`Convierte ${fmt(v)} ${from} a ${to}.`, r, { unit: to, hint: `${DA_HINT} Equivalencia: 1 ${c[0]} = ${fmt(c[2])} ${c[1]}.`, errs: [{ v: big ? v / c[2] : v * c[2], m: `El factor quedó al revés: la unidad ${from} debe quedar abajo en el factor para que se cancele.` }], sol: dimAnalysis({ v, n: [from] }, [f]).steps });
    }
    if (L === 2) { const c = pick([['m²', 'cm²', 10000], ['m³', 'L', 1000], ['dm³', 'L', 1], ['cm³', 'mL', 1], ['m³', 'dm³', 1000], ['km²', 'm²', 1000000]]); const v = R(2, 50) / (Math.random() < 0.4 ? 10 : 1); const r = v * c[2];
      return num(`Convierte ${fmt(v)} ${c[0]} a ${c[1]}.`, r, { unit: c[1], hint: `${DA_HINT} En área el factor de longitud se eleva al cuadrado y en volumen al cubo. Equivalencia: 1 ${c[0]} = ${fmt(c[2])} ${c[1]}.`, errs: [{ v: v * Math.sqrt(c[2]), m: 'En unidades cuadradas el factor también se eleva al cuadrado.' }], sol: dimAnalysis({ v, n: [c[0]] }, [{ n: [c[2], c[1]], d: [1, c[0]] }]).steps }); }
    const ing = [['pulgadas', 'cm', 2.54, 'pulgada', 'in'], ['pies', 'm', 0.3048, 'pie', 'ft'], ['millas', 'km', 1.609, 'milla', 'mi'], ['libras', 'kg', 0.454, 'libra', 'lb'], ['galones', 'L', 3.785, 'galón', 'gal'], ['yardas', 'm', 0.9144, 'yarda', 'yd']];
    if (L === 3) { const c = pick(ing); const v = R(2, 60); const r = rnd(v * c[2], 2); return num(`Convierte ${v} ${c[0]} a ${c[1]} (redondea a centésimos).`, r, { unit: c[1], tol: tl(r), hint: `${DA_HINT} Equivalencia: 1 ${c[3]} = ${fmt(c[2])} ${c[1]}.`, sol: dimAnalysis({ v, n: [c[4]] }, [{ n: [c[2], c[1]], d: [1, c[4]] }], { dec: 2 }).steps }); }
    if (L === 4) { const c = pick(ing); const v = R(5, 200); const r = rnd(v / c[2], 2); return num(`Convierte ${v} ${c[1]} a ${c[0]} (redondea a centésimos).`, r, { unit: c[0], tol: tl(r), hint: `${DA_HINT} Equivalencia: 1 ${c[3]} = ${fmt(c[2])} ${c[1]}; aquí ${c[1]} debe quedar abajo en el factor.`, errs: [{ v: rnd(v * c[2], 2), m: `El factor quedó al revés: ${c[1]} debe ir abajo para que se cancele.` }], sol: dimAnalysis({ v, n: [c[1]] }, [{ n: [1, c[4]], d: [c[2], c[1]] }], { dec: 2 }).steps }); }
    if (Math.random() < 0.5) { const ms = R(5, 40); const kmh = rnd(ms * 3.6, 2); const toMs = Math.random() < 0.5;
      const da = toMs ? dimAnalysis({ v: kmh, n: ['km'], d: ['h'] }, [{ n: [1000, 'm'], d: [1, 'km'] }, { n: [1, 'h'], d: [3600, 's'] }]) : dimAnalysis({ v: ms, n: ['m'], d: ['s'] }, [{ n: [1, 'km'], d: [1000, 'm'] }, { n: [3600, 's'], d: [1, 'h'] }]);
      return num(toMs ? `Un auto va a ${fmt(kmh)} km/h. ¿Cuántos metros recorre por segundo?` : `Un ciclista va a ${ms} m/s. ¿Cuál es su velocidad en km/h?`, toMs ? ms : kmh, { unit: toMs ? 'm/s' : 'km/h', tol: 0.011, hint: `${DA_HINT} Necesitas dos factores: 1 km = 1 000 m y 1 h = 3 600 s.`, sol: da.steps }); }
    const mph = pick([45, 55, 60, 65, 70, 75]); const kmh = rnd(mph * 1.609, 2); return num(`En una carretera de EE. UU. el límite es ${mph} millas por hora. ¿Cuántos km/h son? (1 mi = 1.609 km, redondea a centésimos)`, kmh, { unit: 'km/h', tol: tl(kmh), hint: `${DA_HINT} Equivalencia: 1 mi = 1.609 km.`, sol: dimAnalysis({ v: mph, n: ['mi'], d: ['h'] }, [{ n: [1.609, 'km'], d: [1, 'mi'] }], { dec: 2 }).steps });
  }
});
