TOPICS.push({
  id: 'energia', eje: 'ene', title: 'Energía cinética, potencial y su conservación',
  nem: 'Energía mecánica: cinética y potencial; transformaciones y conservación de la energía.',
  formula: 'Ec = ½·m·v² · Ep = m·g·h · Em = Ec + Ep (se conserva si no hay fricción) · Desde el reposo: v = √(2·g·h) · h = v² / (2g)',
  lesson: `
<h4>Formas de energía mecánica</h4>
<ul><li><b>Energía cinética</b> (de movimiento): <b>Ec = ½·m·v²</b>. Depende del cuadrado de la rapidez: al duplicar la rapidez, la energía se multiplica por 4. Por eso los choques a alta velocidad son tan peligrosos.</li><li><b>Energía potencial gravitacional</b> (por la altura): <b>Ep = m·g·h</b>.</li></ul>
<h4>Conservación de la energía</h4>
<p>La energía no se crea ni se destruye, solo se transforma. Sin fricción, la energía mecánica total (Ec + Ep) se mantiene constante: lo que se pierde de potencial se gana en cinética.</p>
<div class="ex"><b>Ejemplo:</b> una pelota de 0.5 kg cae desde 5 m. Arriba: Ep = 0.5 × 9.8 × 5 = 24.5 J y Ec = 0. Justo antes de tocar el suelo toda esa energía es cinética: ½ × 0.5 × v² = 24.5 → v = √98 ≈ 9.9 m/s.</div>
<p>Atajo: la rapidez al caer desde una altura h es v = √(2gh), sin importar la masa.</p>
<h4>¿Y la fricción?</h4>
<p>Con fricción, parte de la energía mecánica se convierte en <b>energía térmica</b> (calor) y sonido. La energía total sigue conservándose, pero ya no es toda “útil”.</p>
<div class="warn"><b>Errores comunes</b><ul><li>Olvidar elevar la rapidez al cuadrado.</li><li>Pensar que la energía “se pierde”: se transforma en otras formas.</li></ul></div>
${lab('Deja caer una pelota desde 1 m y mide hasta dónde rebota. ¿Por qué no regresa a 1 m? ¿A dónde se fue esa energía?')}`,
  gen(L) {
    if (L === 1) { const m = pick([0.5, 1, 2, 4, 10, 60, 1000]), v = R(2, 30); const E = rnd(0.5 * m * v * v, 4); return num(`¿Cuál es la energía cinética de un objeto de ${fmt(m)} kg que se mueve a ${v} m/s?`, E, { unit: 'J', tol: tl(E), hint: 'Ec = ½ · m · v².', errs: [{ v: rnd(0.5 * m * v, 4), m: 'Olvidaste elevar la rapidez al cuadrado.' }, { v: rnd(m * v * v, 4), m: 'Olvidaste el ½.' }], sol: [`Ec = ½ × ${fmt(m)} × ${v}²`, `Ec = ½ × ${fmt(m)} × ${v * v} = ${B(fmt(E) + ' J')}`] }); }
    if (L === 2) { const m = pick([0.2, 0.5, 1, 2, 5, 50]), h = pick([1, 2, 3, 5, 10, 20, 1.5]); const E = rnd(m * G9 * h, 4); return num(`¿Qué energía potencial tiene una maceta de ${fmt(m)} kg colocada a ${fmt(h)} m de altura? (g = 9.8 m/s²)`, E, { unit: 'J', tol: tl(E), hint: 'Ep = m · g · h.', sol: [`Ep = ${fmt(m)} × 9.8 × ${fmt(h)}`, `Ep = ${B(fmt(E) + ' J')}`] }); }
    if (L === 3) { const h = pick([1, 2, 5, 10, 15, 20, 45]); const v = rnd(Math.sqrt(2 * G9 * h), 2); return num(`Una pelota se deja caer desde ${h} m de altura. Sin fricción, ¿con qué rapidez llega al suelo? (redondea a centésimos)`, v, { unit: 'm/s', tol: 0.011, hint: 'Toda la Ep se convierte en Ec: m·g·h = ½·m·v². Deja sola a v balanceando la igualdad.', sol: [`Conservación de la energía: <b>m · g · h = ½ · m · v²</b>. Queremos v sola.`, `La masa multiplica en los dos lados: <b>dividimos ambos lados entre m</b> → g · h = ½ · v²`, `v² está multiplicada por ½: <b>multiplicamos ambos lados por 2</b> → 2 · g · h = v²`, `v está al cuadrado: <b>sacamos raíz cuadrada en ambos lados</b> → v = √(2 · g · h)`, sust('v', `√(2 × 9.8 m/s² × ${h} m) = √${fmt(2 * G9 * h)} m²/s²`, B('≈ ' + fmt(v) + ' m/s'))] }); }
    if (L === 4) { if (Math.random() < 0.5) { const v = pick([4.9, 7, 9.8, 14, 19.6, 3.5]); const h = rnd(v * v / (2 * G9), 4); return num(`Un patinador llega a la base de una rampa a ${fmt(v)} m/s. Sin fricción, ¿qué altura máxima alcanza?`, h, { unit: 'm', tol: tl(h), hint: 'Ec abajo = Ep arriba: ½·m·v² = m·g·h. Deja sola a h balanceando la igualdad.', sol: [`Conservación de la energía: <b>½ · m · v² = m · g · h</b>. Queremos h sola.`, `<b>Dividimos ambos lados entre m</b> → ½ · v² = g · h`, `h está multiplicada por g: <b>dividimos ambos lados entre g</b> → h = ${frS('½ · v²', 'g')} = ${frS('v²', '2g')}`, sust('h', frS(`(${fmt(v)} m/s)²`, '2 × 9.8 m/s²') + ' = ' + frS(`${fmt(v * v, 4)} m²/s²`, '19.6 m/s²'), B(fmt(h) + ' m'))] }); }
      const m = pick([1, 2, 5]), h = pick([2, 5, 10]), v = R(2, 8); const Em = rnd(m * G9 * h + 0.5 * m * v * v, 4);
      return num(`Un objeto de ${m} kg está a ${h} m de altura y se mueve a ${v} m/s. ¿Cuál es su energía mecánica total?`, Em, { unit: 'J', tol: tl(Em), hint: 'Em = Ec + Ep.', sol: [`Ep = ${m} × 9.8 × ${h} = ${fmt(m * G9 * h)} J`, `Ec = ½ × ${m} × ${v}² = ${fmt(0.5 * m * v * v)} J`, `Em = ${B(fmt(Em) + ' J')}`] }); }
    if (Math.random() < 0.5) { const k = pick([2, 3, 4]); return mc(`Si un auto aumenta su rapidez ${k} veces (mismo auto), su energía cinética:`, `Se multiplica por ${k * k}`, [`Se multiplica por ${k}`, `Se multiplica por ${2 * k}`, 'No cambia'], { hint: 'Ec depende de v².', sol: [`Ec = ½mv²: si v se multiplica por ${k}, v² se multiplica por ${k * k}.`, B(`Se multiplica por ${k * k}`)] }); }
    const m = pick([2, 5, 10, 20]), h = pick([5, 10, 20]); const Ep = m * G9 * h; const v = R(Math.floor(Math.sqrt(2 * G9 * h) * 0.4), Math.floor(Math.sqrt(2 * G9 * h) * 0.9)); const Ec = 0.5 * m * v * v; const lost = rnd(Ep - Ec, 4);
    return num(`Un trineo de ${m} kg baja desde el reposo por una ladera de ${h} m de altura y llega abajo a ${v} m/s. ¿Cuánta energía se transformó en calor por la fricción?`, lost, { unit: 'J', tol: tl(lost), hint: 'Energía perdida = Ep inicial − Ec final.', sol: [`Ep arriba = ${m} × 9.8 × ${h} = ${fmt(Ep)} J`, `Ec abajo = ½ × ${m} × ${v}² = ${fmt(Ec)} J`, `Calor por fricción = ${fmt(Ep)} − ${fmt(Ec)} = ${B(fmt(lost) + ' J')}`] });
  }
});

TOPICS.push({
  id: 'calor', eje: 'ene', title: 'Calor y temperatura',
  nem: 'Fenómenos térmicos: temperatura, calor, escalas termométricas, calor específico y formas de propagación del calor.',
  formula: 'K = °C + 273 · °F = 1.8·°C + 32 · °C = (°F − 32) ÷ 1.8 · Q = m·c·ΔT · c agua = 1 cal/g·°C (4 186 J/kg·°C) · Mezcla de agua: T_f = (m₁T₁ + m₂T₂) ÷ (m₁ + m₂)',
  lesson: `
<h4>Calor y temperatura no son lo mismo</h4>
<ul><li><b>Temperatura:</b> qué tan caliente o frío está algo; se relaciona con la energía cinética promedio de sus partículas. Se mide con termómetro (°C, K, °F).</li><li><b>Calor:</b> energía que <b>se transfiere</b> de un cuerpo de mayor temperatura a otro de menor temperatura. Se mide en joules o calorías (1 cal = 4.186 J).</li></ul>
<p>Un cerillo encendido tiene más temperatura que una alberca templada, pero la alberca tiene muchísima más energía térmica.</p>
<h4>Escalas</h4>
<table class="tb"><tr><th></th><th>°C</th><th>K</th><th>°F</th></tr><tr><td>Congela el agua</td><td>0</td><td>273</td><td>32</td></tr><tr><td>Hierve el agua (nivel del mar)</td><td>100</td><td>373</td><td>212</td></tr></table>
<p>K = °C + 273 &nbsp; · &nbsp; °F = 1.8 × °C + 32</p>
<h4>Calor específico</h4>
<p class="c"><b>Q = m · c · ΔT</b></p>
<p>El calor específico (c) dice cuánta energía necesita 1 g de un material para subir 1 °C. El agua tiene un c muy alto (1 cal/g·°C): tarda en calentarse y en enfriarse, por eso regula el clima de las costas.</p>
<h4>Propagación del calor</h4>
<ul><li><b>Conducción:</b> por contacto directo (una cuchara metálica en la sopa).</li><li><b>Convección:</b> por movimiento de fluidos (el agua que circula al hervir, el aire caliente que sube).</li><li><b>Radiación:</b> por ondas electromagnéticas, sin necesidad de materia (el calor del Sol).</li></ul>
<p>Dos cuerpos en contacto intercambian calor hasta llegar a la misma temperatura: <b>equilibrio térmico</b>.</p>
<div class="warn"><b>Errores comunes</b><ul><li>Decir que el suéter “da calor”: es un aislante que evita que tu cuerpo lo pierda.</li><li>Creer que el metal está más frío que la madera a la misma temperatura: el metal conduce mejor y se lleva el calor de tu mano más rápido.</li><li>Sumar 273 al convertir de K a °C (hay que restar).</li></ul></div>
${lab('Toca al mismo tiempo una cuchara de metal y una de madera que estén en la misma habitación. ¿Cuál se siente más fría? Ambas están a la misma temperatura: explica por qué se sienten distintas.')}`,
  gen(L) {
    if (L === 1) { if (Math.random() < 0.5) { const c = R(-40, 120); return num(`Convierte ${fmt(c)} °C a kelvin.`, c + 273, { unit: 'K', hint: 'K = °C + 273.', sol: [`${fmt(c)} + 273 = ${B(c + 273 + ' K')}`] }); } const k = R(200, 400); return num(`Convierte ${k} K a grados Celsius.`, k - 273, { unit: '°C', hint: 'Parte de K = °C + 273 y deja sola a °C: resta 273 en ambos lados.', errs: [{ v: k + 273, m: 'Sumaste 273. Al despejar °C de K = °C + 273 se resta 273 en ambos lados.' }], sol: [`Partimos de <b>K = °C + 273</b> y queremos dejar sola a °C.`, `A °C se le suma 273; la operación contraria es restar: <b>restamos 273 en ambos lados</b> → K − 273 = °C + 273 − 273 → <b>°C = K − 273</b>`, sust('°C', `${k} − 273`, B(fmt(k - 273) + ' °C'))] }); }
    if (L === 2) { if (Math.random() < 0.5) { const c = R(-8, 20) * 5; const f = rnd(1.8 * c + 32, 4); return num(`Convierte ${c} °C a grados Fahrenheit.`, f, { unit: '°F', tol: 0.011, hint: '°F = 1.8 × °C + 32.', sol: [`1.8 × ${P(c)} + 32 = ${B(fmt(f) + ' °F')}`] }); }
      const c = R(-4, 20) * 5; const f = rnd(1.8 * c + 32, 4); return num(`En una ciudad de EE. UU. el termómetro marca ${fmt(f)} °F. ¿Cuántos °C son?`, c, { unit: '°C', tol: 0.011, hint: 'Parte de °F = 1.8 · °C + 32: resta 32 en ambos lados y después divide ambos lados entre 1.8.', sol: [`Partimos de <b>°F = 1.8 · °C + 32</b> y queremos dejar sola a °C.`, `Al término 1.8 · °C se le suma 32; la operación contraria es restar: <b>restamos 32 en ambos lados</b> → °F − 32 = 1.8 · °C`, `°C está multiplicado por 1.8: <b>dividimos ambos lados entre 1.8</b> → <b>°C = ${frS('°F − 32', '1.8')}</b>`, sust('°C', frS(`${fmt(f)} − 32`, '1.8') + ' = ' + frS(fmt(rnd(f - 32, 4)), '1.8'), B(fmt(c) + ' °C'))] }); }
    const mats = [['agua', 1], ['aluminio', 0.22], ['hierro', 0.11], ['cobre', 0.093], ['vidrio', 0.2]];
    if (L === 3) { const m = pick(mats); const g = R(1, 20) * 50, dT = R(2, 16) * 5; const Q = rnd(g * m[1] * dT, 4);
      return num(`¿Cuántas calorías se necesitan para calentar ${g} g de ${m[0]} (c = ${fmt(m[1])} cal/g·°C) de 20 °C a ${20 + dT} °C?`, Q, { unit: 'cal', tol: tl(Q), hint: 'Q = m · c · ΔT, con ΔT = temperatura final − inicial.', errs: [{ v: rnd(g * m[1] * (20 + dT), 4), m: 'Usaste la temperatura final en lugar del cambio de temperatura.' }], sol: [`ΔT = ${20 + dT} − 20 = ${dT} °C`, `Q = ${g} × ${fmt(m[1])} × ${dT} = ${B(fmt(Q) + ' cal')}`] }); }
    if (L === 4) { const g = R(2, 20) * 50, dT = R(2, 12) * 5, Ti = R(10, 30); const Q = g * dT;
      return num(`A ${g} g de agua a ${Ti} °C se le suministran ${fmt(Q)} cal. ¿Cuál es su temperatura final? (c = 1 cal/g·°C)`, Ti + dT, { unit: '°C', tol: 0.011, hint: 'En Q = m · c · ΔT, ΔT está multiplicada por m · c: divide ambos lados entre m · c. Luego suma ese cambio a la temperatura inicial.', errs: [{ v: dT, m: 'Ese es el cambio de temperatura; súmale la temperatura inicial.' }], sol: despMul('Q', ['m', 'c', 'ΔT'], 'ΔT').concat([sust('ΔT', frS(fmt(Q) + ' cal', `${g} g × 1 cal/(g·°C)`) + ' (cal y g se cancelan; queda °C)', dT + ' °C'), `La temperatura final es la inicial más el cambio: T<sub>f</sub> = ${Ti} °C + ${dT} °C = ${B(Ti + dT + ' °C')}`]) }); }
    if (Math.random() < 0.5) { const m1 = R(1, 8) * 50, m2 = R(1, 8) * 50, T1 = R(5, 30), T2 = R(50, 95); const Tf = rnd((m1 * T1 + m2 * T2) / (m1 + m2), 2);
      return num(`Mezclas ${m1} g de agua a ${T1} °C con ${m2} g de agua a ${T2} °C. Sin pérdidas de calor, ¿cuál es la temperatura final? (redondea a centésimos)`, Tf, { unit: '°C', tol: 0.011, hint: 'El calor que cede el agua caliente lo gana la fría: T<sub>f</sub> = (m₁T₁ + m₂T₂) ÷ (m₁ + m₂).', errs: [{ v: (T1 + T2) / 2, m: 'Promediaste las temperaturas sin tomar en cuenta las masas.' }], sol: [`T<sub>f</sub> = (${m1}·${T1} + ${m2}·${T2}) ÷ (${m1} + ${m2})`, `= ${m1 * T1 + m2 * T2} ÷ ${m1 + m2} = ${B(fmt(Tf) + ' °C')}`] }); }
    return cq([
      ['El calor del Sol llega a la Tierra a través del espacio vacío por:', 'Radiación', ['Conducción', 'Convección', 'Evaporación'], 'La radiación viaja como ondas electromagnéticas y no necesita materia.'],
      ['El mango metálico de una olla se calienta aunque no toque la flama. Esto es:', 'Conducción', ['Radiación', 'Convección', 'Condensación'], 'El calor pasa de partícula en partícula a lo largo del metal.'],
      ['El aire caliente de un calefactor sube y el frío baja, formando corrientes. Esto es:', 'Convección', ['Conducción', 'Radiación', 'Fusión'], 'En los fluidos, el material caliente (menos denso) sube y el frío baja.'],
      ['Un suéter de lana te mantiene caliente porque:', 'Es aislante y reduce la pérdida de calor de tu cuerpo', ['Produce calor', 'Atrae el calor del ambiente', 'Tiene temperatura alta'], 'La lana atrapa aire y conduce mal el calor.'],
      ['¿Qué tiene más energía térmica: una taza de café a 80 °C o una alberca a 25 °C?', 'La alberca', ['La taza de café', 'Tienen la misma', 'Ninguna tiene'], 'La energía térmica depende también de la cantidad de materia; la alberca tiene muchísima más.']]);
  }
});

TOPICS.push({

  nem: 'Saberes y prácticas para el aprovechamiento de energías y la sustentabilidad: fuentes renovables y no renovables, transformaciones y eficiencia.',
  formula: 'Eficiencia (%) = energía útil ÷ energía total × 100 · Energía desperdiciada = total − útil · Ahorro (kWh) = (P₁ − P₂) en kW × horas de uso',
  lesson: `
<h4>Fuentes de energía</h4>
<table class="tb"><tr><th>Renovables (se regeneran)</th><th>No renovables (se agotan)</th></tr><tr><td>Solar, eólica, hidráulica, geotérmica, biomasa, mareomotriz</td><td>Petróleo, gas natural, carbón, uranio (nuclear)</td></tr></table>
<p>Los combustibles fósiles liberan CO₂, que intensifica el efecto invernadero y el cambio climático. México tiene gran potencial solar (noroeste), eólico (Istmo de Tehuantepec) y geotérmico (Cerro Prieto, Los Azufres).</p>
<h4>Transformaciones de energía</h4>
<ul><li>Hidroeléctrica: potencial del agua → cinética → eléctrica.</li><li>Termoeléctrica: química del combustible → térmica → cinética (vapor y turbina) → eléctrica.</li><li>Panel solar: luminosa → eléctrica.</li><li>Foco: eléctrica → luminosa y térmica.</li></ul>
<h4>Eficiencia</h4>
<p>Ninguna máquina convierte toda la energía en energía útil: parte se “desperdicia” como calor. La eficiencia es:</p>
<p class="c"><b>η = energía útil ÷ energía total × 100%</b></p>
<div class="ex"><b>Ejemplo:</b> un foco incandescente de 60 W da unos 3 W de luz → eficiencia 5%. Un LED de 9 W da la misma luz con mucho menos energía.</div>
<h4>Uso responsable</h4>
<p>Apagar lo que no se usa, cambiar a focos LED, aprovechar la luz natural y elegir aparatos eficientes reduce el gasto y las emisiones.</p>
<div class="warn"><b>Errores comunes</b><ul><li>Creer que una máquina puede tener eficiencia mayor a 100%.</li><li>Pensar que la energía “se gasta” y desaparece: se transforma, muchas veces en calor que ya no podemos aprovechar.</li></ul></div>
${lab('Toca (con cuidado) un foco incandescente o halógeno y un foco LED encendidos durante unos minutos. ¿Cuál se calienta más? ¿Cuál es más eficiente?')}`,
  gen(L) {
    if (L === 1) return cq([
      ['¿Cuál es una fuente de energía renovable?', 'Eólica', ['Petróleo', 'Carbón', 'Gas natural'], 'El viento se regenera de forma natural.'],
      ['¿Cuál es una fuente de energía NO renovable?', 'Gas natural', ['Solar', 'Geotérmica', 'Hidráulica'], 'El gas natural es un combustible fósil que tardó millones de años en formarse.'],
      ['¿Qué gas, producido al quemar combustibles fósiles, contribuye más al cambio climático?', 'Dióxido de carbono (CO₂)', ['Oxígeno (O₂)', 'Nitrógeno (N₂)', 'Helio (He)'], 'El CO₂ intensifica el efecto invernadero.'],
      ['La energía geotérmica aprovecha:', 'El calor del interior de la Tierra', ['El viento', 'Las mareas', 'La luz del Sol'], 'En México hay plantas geotérmicas como Cerro Prieto (Baja California).']]);
    if (L === 2) { const tot = R(2, 20) * 100; const e = pick([5, 10, 15, 20, 25, 30, 35, 40, 60, 80, 90]); const u = tot * e / 100;
      return num(`Un motor recibe ${fmt(tot)} J de energía eléctrica y entrega ${fmt(u)} J de energía mecánica útil. ¿Cuál es su eficiencia?`, e, { unit: '%', tol: 0.011, hint: 'Eficiencia = útil ÷ total × 100.', errs: [{ v: rnd(tot / u * 100, 4), m: 'Invertiste el cociente: va energía útil entre energía total.' }], sol: [`${fmt(u)} ÷ ${fmt(tot)} = ${fmt(e / 100)}`, `× 100 = ${B(e + '%')}`] }); }
    if (L === 3) return cq([
      ['En una central hidroeléctrica la secuencia de transformaciones es:', 'Potencial → cinética → eléctrica', ['Química → térmica → eléctrica', 'Luminosa → eléctrica', 'Nuclear → luminosa'], 'El agua almacenada (potencial) cae, mueve turbinas (cinética) y un generador produce electricidad.'],
      ['En un panel solar fotovoltaico la energía se transforma de:', 'Luminosa a eléctrica', ['Térmica a mecánica', 'Química a luminosa', 'Eléctrica a luminosa'], 'Las celdas fotovoltaicas convierten la luz directamente en electricidad.'],
      ['Al usar una licuadora, la energía eléctrica se transforma principalmente en:', 'Energía cinética (y algo de calor y sonido)', ['Energía potencial', 'Energía química', 'Energía nuclear'], 'El motor convierte la energía eléctrica en movimiento; una parte se disipa como calor y sonido.'],
      ['En una termoeléctrica que quema combustóleo, la energía inicial es:', 'Química', ['Eólica', 'Luminosa', 'Mecánica'], 'La energía está almacenada en los enlaces químicos del combustible.'],
      ['¿Qué parte de la energía de un foco incandescente se desperdicia sobre todo?', 'La que se convierte en calor', ['La que se convierte en luz', 'La que se convierte en sonido', 'Ninguna'], 'Cerca del 95% se va como calor.']]);
    if (L === 4) { const tot = R(2, 50) * 100; const e = pick([20, 25, 30, 35, 40, 45]); const w = tot * (100 - e) / 100;
      return num(`Una máquina con eficiencia de ${e}% recibe ${fmt(tot)} J. ¿Cuánta energía se desperdicia (por ejemplo, como calor)?`, w, { unit: 'J', hint: 'Primero la energía útil (total × eficiencia); lo demás es desperdicio.', errs: [{ v: tot * e / 100, m: 'Esa es la energía útil; el desperdicio es el resto.' }], sol: [`Útil: ${fmt(tot)} × ${fmt(e / 100)} = ${fmt(tot * e / 100)} J`, `Desperdiciada: ${fmt(tot)} − ${fmt(tot * e / 100)} = ${B(fmt(w) + ' J')}`] }); }
    const n = R(3, 10), h = R(3, 8), d = 60; const Pi = pick([60, 75, 100]), Pl = pick([7, 9, 12]); const kwh = rnd(n * (Pi - Pl) / 1000 * h * d, 4);
    return num(`Una familia cambia ${n} focos de ${Pi} W por focos LED de ${Pl} W. Si cada foco se usa ${h} h al día, ¿cuántos kWh ahorran en un bimestre (60 días)?`, kwh, { unit: 'kWh', tol: tl(kwh), hint: 'Ahorro por foco = diferencia de potencia (en kW) × horas. Multiplica por focos y días.', sol: [`Diferencia por foco: ${Pi} − ${Pl} = ${Pi - Pl} W = ${fmt((Pi - Pl) / 1000)} kW`, `${n} focos × ${fmt((Pi - Pl) / 1000)} kW × ${h} h × 60 días`, `= ${B(fmt(kwh) + ' kWh')}`] });
  }
});

/* ===== EJE: ELECTRICIDAD, MAGNETISMO Y ONDAS ===== */
function circuitSVG(rs, par) {
  const W = 320, H = 170; let g = `<svg viewBox="0 0 ${W} ${H}" class="fig" role="img">`;
  g += `<line x1="30" y1="40" x2="30" y2="130" class="ln2"/><line x1="18" y1="78" x2="42" y2="78" style="stroke:#111827;stroke-width:3"/><line x1="24" y1="90" x2="36" y2="90" style="stroke:#111827;stroke-width:3"/><text x="8" y="72" class="tk b">+</text>`;
  const res = (x, y, lab, vert) => vert ? `<rect x="${x - 9}" y="${y - 22}" width="18" height="44" rx="3" style="fill:#EDE9FE;stroke:#7C3AED;stroke-width:2"/><text x="${x + 32}" y="${y + 4}" class="tk b">${lab}</text>` : `<rect x="${x - 22}" y="${y - 9}" width="44" height="18" rx="3" style="fill:#EDE9FE;stroke:#7C3AED;stroke-width:2"/><text x="${x}" y="${y - 14}" class="tk b">${lab}</text>`;
  if (!par) { g += `<polyline points="30,40 30,25 290,25 290,145 30,145 30,130" style="fill:none;stroke:#111827;stroke-width:2"/>`; const step = 260 / (rs.length + 1); rs.forEach((r, i) => g += `<rect x="${30 + step * (i + 1) - 24}" y="16" width="48" height="18" style="fill:#fff"/>` + res(30 + step * (i + 1), 25, r)); }
  else { const step = 200 / rs.length, xe = 110 + step * (rs.length - 1); g += `<polyline points="30,40 30,25 ${xe},25" style="fill:none;stroke:#111827;stroke-width:2"/><polyline points="30,130 30,145 ${xe},145" style="fill:none;stroke:#111827;stroke-width:2"/>`; rs.forEach((r, i) => { const x = 110 + step * i; g += `<line x1="${x}" y1="25" x2="${x}" y2="145" class="ln2"/><rect x="${x - 10}" y="62" width="20" height="46" style="fill:#fff"/>` + res(x, 85, r, true); }); }
  return g + '</svg>';
}

TOPICS.push({
  id: 'electrostatica', eje: 'ele', title: 'Carga eléctrica y electrostática',
  nem: 'Interacciones de la electricidad: carga eléctrica, formas de electrización, conductores y aislantes, ley de Coulomb.',
  formula: 'Cargas iguales se repelen, opuestas se atraen · F = k·q₁·q₂ / d² con k = 9 × 10⁹ N·m²/C² · 1 μC = 10⁻⁶ C · Si d se multiplica por n, F se divide entre n²',
  lesson: `
<h4>Idea clave</h4>
<p>La materia tiene partículas con <b>carga eléctrica</b>: los protones (+) y los electrones (−). Un objeto normalmente es neutro (igual número de cada uno). Se “carga” cuando gana electrones (queda negativo) o los pierde (queda positivo).</p>
<p class="c"><b>Cargas iguales se repelen; cargas opuestas se atraen.</b></p>
<h4>Formas de electrizar un objeto</h4>
<ul><li><b>Frotamiento:</b> un globo frotado en el cabello le quita electrones.</li><li><b>Contacto:</b> un objeto cargado toca a uno neutro y le comparte carga.</li><li><b>Inducción:</b> un objeto cargado se acerca (sin tocar) y reacomoda las cargas del otro; por eso el globo cargado atrae papelitos.</li></ul>
<h4>Conductores y aislantes</h4>
<p>Los <b>conductores</b> (metales, agua con sales, el cuerpo humano) dejan moverse las cargas; los <b>aislantes</b> (plástico, vidrio, hule, madera seca) no. Los cables tienen cobre por dentro y plástico por fuera.</p>
<h4>Ley de Coulomb</h4>
<p class="c"><b>F = k · q₁ · q₂ ÷ d²</b>, &nbsp; k = 9 × 10⁹ N·m²/C²</p>
<p>Se parece a la gravitación: si la distancia se duplica, la fuerza se divide entre 4. Diferencia: la eléctrica puede atraer o repeler; la gravedad solo atrae.</p>
<div class="ex"><b>Ejemplo:</b> q₁ = 2 μC, q₂ = 3 μC, d = 0.3 m: F = 9×10⁹ × 2×10⁻⁶ × 3×10⁻⁶ ÷ 0.09 = 0.6 N.</div>
<div class="warn"><b>Errores comunes</b><ul><li>Pensar que al frotar se “crean” cargas: solo se transfieren electrones.</li><li>Creer que un objeto neutro no tiene cargas: tiene la misma cantidad de positivas y negativas.</li></ul></div>
${lab('Frota un globo en tu cabello y acércalo (sin tocar) a un chorrito delgado de agua de la llave. Predice qué pasará antes de hacerlo.')}`,
  gen(L) {
    if (L === 1) return cq([
      ['Dos objetos con carga negativa se acercan. ¿Qué ocurre?', 'Se repelen', ['Se atraen', 'No interactúan', 'Se neutralizan siempre'], 'Cargas del mismo signo se repelen.'],
      ['¿Qué partícula se transfiere al frotar dos objetos?', 'Electrones', ['Protones', 'Neutrones', 'Átomos completos'], 'Los electrones, en la parte externa de los átomos, son los que pasan de un cuerpo a otro.'],
      ['Si un objeto neutro gana electrones, queda con carga:', 'Negativa', ['Positiva', 'Neutra', 'Magnética'], 'Tiene más cargas negativas que positivas.'],
      ['¿Cuál es un buen conductor eléctrico?', 'Cobre', ['Plástico', 'Vidrio', 'Hule'], 'Los metales tienen electrones libres que se mueven con facilidad.']]);
    if (L === 2) return cq([
      ['Un globo frotado se pega a la pared sin tocarla antes. La pared se electriza por:', 'Inducción', ['Frotamiento', 'Contacto', 'Radiación'], 'La carga del globo reacomoda las cargas de la pared, que queda atraída.'],
      ['Los cables eléctricos están recubiertos de plástico porque el plástico es:', 'Aislante', ['Conductor', 'Magnético', 'Radiactivo'], 'El plástico impide el paso de la corriente hacia afuera y nos protege.'],
      ['Al tocar la perilla de una puerta después de caminar sobre una alfombra, sientes un “toque”. Se debe a:', 'Una descarga de la carga acumulada por frotamiento', ['Electricidad de la casa', 'Magnetismo de la perilla', 'Calor de la mano'], 'Tu cuerpo se cargó por frotamiento con la alfombra y se descarga al tocar el metal.'],
      ['El pararrayos funciona porque:', 'Conduce la descarga a tierra por un camino seguro', ['Atrae nubes', 'Evita que llueva', 'Absorbe la carga y la guarda'], 'Es un conductor conectado a tierra que da a la descarga un camino controlado.']]);
    if (L === 3) { const n = pick([2, 3, 4, 0.5]); const f = 1 / (n * n); const [nn, dd] = simp(4, Math.round(n * n * 4));
      return num(`Dos cargas se repelen con cierta fuerza F. Si la distancia entre ellas se multiplica por ${fmt(n)}, ¿por cuánto se multiplica la fuerza? (responde con fracción si hace falta)`, f, { tol: 1e-6, hint: 'F es inversamente proporcional al cuadrado de la distancia.', errs: [{ v: 1 / n, m: 'No elevaste la distancia al cuadrado.' }], sol: [`F ∝ 1/d² → factor 1 ÷ ${fmt(n)}² = 1 ÷ ${fmt(n * n)}`, `= ${B(fr(nn, dd))}`] }); }
    if (L === 4) { const q1 = R(1, 9), q2 = R(1, 9), d = pick([0.1, 0.2, 0.3, 0.5, 1]); const F = rnd(0.009 * q1 * q2 / (d * d), 4);
      return num(`Dos cargas de ${q1} μC y ${q2} μC están separadas ${fmt(d)} m. ¿Qué fuerza eléctrica hay entre ellas? (k = 9 × 10⁹ N·m²/C², redondea a milésimos)`, rnd(F, 3), { unit: 'N', tol: Math.max(0.0011, F * 0.005), hint: 'Convierte μC a C con análisis dimensional (1 C = 1 000 000 μC) y usa F = k·q₁·q₂ ÷ d².', sol: [`Cargas en coulombs: ${daInline(q1, 'μC', 1, 'C', 1000000)} = ${q1}×10⁻⁶ C; ${daInline(q2, 'μC', 1, 'C', 1000000)} = ${q2}×10⁻⁶ C`, `F = 9×10⁹ × ${q1}×10⁻⁶ × ${q2}×10⁻⁶ ÷ ${fmt(d)}²`, `= 9×10⁹ × ${q1 * q2}×10⁻¹² ÷ ${fmt(d * d)} = ${fmt(0.009 * q1 * q2)} ÷ ${fmt(d * d)}`, `F ≈ ${B(fmt(rnd(F, 3)) + ' N')}`] }); }
    return cq([
      ['Un electroscopio neutro se toca con una barra cargada negativamente. Sus laminillas se separan porque:', 'Ambas quedan con carga negativa y se repelen', ['Ambas quedan positivas y se atraen', 'Se calientan', 'Se magnetizan'], 'Por contacto, el electroscopio recibe carga del mismo signo en las dos laminillas.'],
      ['¿En qué se parece la ley de Coulomb a la de la gravitación universal?', 'Ambas disminuyen con el cuadrado de la distancia', ['Ambas solo atraen', 'Ambas dependen de la masa', 'Ambas usan la misma constante'], 'Las dos fuerzas son proporcionales a 1/d²; la eléctrica puede atraer o repeler.'],
      ['Si se duplican las dos cargas y la distancia no cambia, la fuerza eléctrica:', 'Se multiplica por 4', ['Se duplica', 'No cambia', 'Se divide entre 4'], 'F ∝ q₁·q₂: 2 × 2 = 4.'],
      ['Durante una tormenta eléctrica, el lugar más seguro de los siguientes es:', 'Dentro de un auto con techo metálico y ventanas cerradas', ['Debajo de un árbol', 'En un campo abierto', 'Dentro de una alberca'], 'La carrocería metálica conduce la descarga por fuera (jaula de Faraday).']]);
  }
});

TOPICS.push({
  id: 'circuitos', eje: 'ele', title: 'Corriente, voltaje, resistencia y circuitos',
  nem: 'Electricidad: corriente, diferencia de potencial, resistencia, ley de Ohm y circuitos en serie y en paralelo.',
  formula: 'Ley de Ohm: V = I·R · I = V/R · R = V/I · Serie: R_eq = R₁ + R₂ + … · Paralelo (dos): R_eq = R₁·R₂ ÷ (R₁ + R₂) · Unidades: volt (V), ampere (A), ohm (Ω)',
  lesson: `
<h4>Tres magnitudes clave</h4>
<ul><li><b>Voltaje (V):</b> el “empuje” que da la pila o el contacto a los electrones. Se mide en volts. En México los contactos de casa dan 127 V.</li><li><b>Corriente (I):</b> cantidad de carga que pasa por segundo. Se mide en amperes (A).</li><li><b>Resistencia (R):</b> oposición al paso de la corriente. Se mide en ohms (Ω).</li></ul>
<p>Analogía: el voltaje es la presión del agua, la corriente es cuánta agua pasa y la resistencia es qué tan delgada está la manguera.</p>
<h4>Ley de Ohm</h4>
<p class="c"><b>V = I · R</b> &nbsp; → &nbsp; I = V ÷ R &nbsp; · &nbsp; R = V ÷ I</p>
<div class="ex"><b>Ejemplo:</b> una resistencia de 30 Ω conectada a 12 V: I = 12 ÷ 30 = 0.4 A.</div>
<h4>Circuitos en serie y en paralelo</h4>
<table class="tb"><tr><th></th><th>Serie</th><th>Paralelo</th></tr><tr><td>Caminos para la corriente</td><td>uno solo</td><td>varios</td></tr><tr><td>Resistencia equivalente</td><td>R₁ + R₂ + …</td><td>menor que la más pequeña: R₁·R₂ ÷ (R₁ + R₂)</td></tr><tr><td>Si un foco se funde</td><td>se apagan todos</td><td>los demás siguen encendidos</td></tr><tr><td>Ejemplo</td><td>series navideñas antiguas</td><td>instalación de una casa</td></tr></table>
<div class="warn"><b>Errores comunes</b><ul><li>Creer que la corriente “se gasta” en un foco: la misma corriente entra y sale.</li><li>Sumar resistencias en paralelo como si estuvieran en serie.</li><li>Tocar aparatos eléctricos con las manos mojadas: el agua con sales conduce y aumenta el riesgo de descarga.</li></ul></div>
${lab('Con una pila de 9 V, un foquito o LED y cables (con supervisión), arma un circuito. Luego agrega un segundo foco en serie y después en paralelo. ¿Cambia el brillo? ¿Qué pasa si quitas uno?')}`,
  gen(L) {
    if (L === 1) { const R0 = pick([5, 10, 20, 30, 40, 50, 60, 100]), I = pick([0.1, 0.2, 0.5, 1, 1.5, 2, 3]); const V = rnd(R0 * I, 4); return num(`Una resistencia de ${R0} Ω está conectada a ${fmt(V)} V. ¿Qué corriente circula?`, I, { unit: 'A', tol: 0.011, hint: 'Ley de Ohm: V = I · R. La corriente está multiplicada por R: divide ambos lados entre R.', errs: [{ v: V * R0, m: 'Multiplicaste; al despejar, la corriente queda voltaje entre resistencia.' }], sol: despMul('V', ['I', 'R'], 'I').concat([sust('I', frS(fmt(V) + ' V', R0 + ' Ω'), B(fmt(I) + ' A'))]) }); }
    if (L === 2) { const R0 = R(2, 60) * 5, I = pick([0.1, 0.2, 0.25, 0.5, 1, 2]); const V = rnd(R0 * I, 4); if (Math.random() < 0.5) return num(`Por una resistencia de ${R0} Ω circula una corriente de ${fmt(I)} A. ¿Qué voltaje tiene entre sus extremos?`, V, { unit: 'V', tol: 0.011, hint: 'V = I · R.', sol: [`V = ${fmt(I)} × ${R0} = ${B(fmt(V) + ' V')}`] });
      return num(`Un aparato conectado a ${fmt(V)} V consume ${fmt(I)} A. ¿Cuál es su resistencia?`, R0, { unit: 'Ω', tol: 0.011, hint: 'Ley de Ohm: V = I · R. La resistencia está multiplicada por I: divide ambos lados entre I.', sol: despMul('V', ['I', 'R'], 'R').concat([sust('R', frS(fmt(V) + ' V', fmt(I) + ' A'), B(R0 + ' Ω'))]) }); }
    if (L === 3) { const rs = [R(1, 10) * 10, R(1, 10) * 10, R(1, 6) * 5].slice(0, R(2, 3)); const Re = rs.reduce((a, b) => a + b, 0); const V = pick([6, 9, 12, 24, 120]); const I = rnd(V / Re, 4);
      if (Math.random() < 0.5) return num(`Se conectan en <b>serie</b> resistencias de ${rs.slice(0, -1).join(' Ω, ')} Ω y ${rs[rs.length - 1]} Ω. ¿Cuál es la resistencia equivalente?`, Re, { unit: 'Ω', fig: circuitSVG(rs.map(r => r + ' Ω')), hint: 'En serie las resistencias se suman.', sol: [`R<sub>eq</sub> = ${rs.join(' + ')} = ${B(Re + ' Ω')}`] });
      return num(`Resistencias de ${rs.slice(0, -1).join(' Ω, ')} Ω y ${rs[rs.length - 1]} Ω se conectan en serie a una fuente de ${V} V. ¿Qué corriente circula? (redondea a milésimos)`, rnd(I, 3), { unit: 'A', tol: 0.0011, fig: circuitSVG(rs.map(r => r + ' Ω')), hint: 'Suma las resistencias y aplica I = V ÷ R<sub>eq</sub>.', sol: [`R<sub>eq</sub> = ${rs.join(' + ')} = ${Re} Ω`, `I = ${V} ÷ ${Re} ≈ ${B(fmt(rnd(I, 3)) + ' A')}`] }); }
    if (L === 4) { const pr = pick([[6, 3], [10, 10], [12, 4], [20, 30], [60, 30], [40, 10], [12, 6], [30, 15], [20, 5]]); const Re = pr[0] * pr[1] / (pr[0] + pr[1]);
      return num(`Dos resistencias de ${pr[0]} Ω y ${pr[1]} Ω se conectan en <b>paralelo</b>. ¿Cuál es la resistencia equivalente?`, Re, { unit: 'Ω', tol: 0.011, fig: circuitSVG(pr.map(r => r + ' Ω'), true), hint: 'Para dos en paralelo: R<sub>eq</sub> = R₁·R₂ ÷ (R₁ + R₂). Debe salir menor que la más pequeña.', errs: [{ v: pr[0] + pr[1], m: 'Las sumaste como si estuvieran en serie.' }], sol: [`R<sub>eq</sub> = ${pr[0]}·${pr[1]} ÷ (${pr[0]} + ${pr[1]}) = ${pr[0] * pr[1]} ÷ ${pr[0] + pr[1]}`, `= ${B(fmt(Re) + ' Ω')}`] }); }
    if (Math.random() < 0.5) { const pr = pick([[6, 3], [12, 4], [60, 30], [40, 10], [12, 6], [30, 15], [20, 5]]); const V = pick([6, 12, 24, 120]); const I = rnd(V / pr[0] + V / pr[1], 4);
      return num(`Dos resistencias de ${pr[0]} Ω y ${pr[1]} Ω están en paralelo con una fuente de ${V} V. ¿Qué corriente total entrega la fuente?`, I, { unit: 'A', tol: 0.011, fig: circuitSVG(pr.map(r => r + ' Ω'), true), hint: 'En paralelo cada resistencia recibe el voltaje completo. Suma las corrientes de cada rama.', sol: [`I₁ = ${V} ÷ ${pr[0]} = ${fmt(V / pr[0])} A; I₂ = ${V} ÷ ${pr[1]} = ${fmt(V / pr[1])} A`, `I total = ${B(fmt(I) + ' A')}`] }); }
    return cq([
      ['En tu casa, si se funde un foco, los demás siguen encendidos. Eso indica que están conectados en:', 'Paralelo', ['Serie', 'Ninguna conexión', 'Corto circuito'], 'En paralelo cada aparato tiene su propio camino.'],
      ['Al agregar más focos en serie a una misma pila, el brillo de cada uno:', 'Disminuye', ['Aumenta', 'No cambia', 'Se apagan todos'], 'Aumenta la resistencia total y baja la corriente.'],
      ['Un “corto circuito” ocurre cuando:', 'La corriente encuentra un camino de resistencia casi cero', ['Se usa un cable muy largo', 'Se apaga el interruptor', 'Se usa un foco LED'], 'La corriente se dispara y puede calentar los cables; por eso existen fusibles y pastillas.'],
      ['¿Qué instrumento mide la corriente eléctrica?', 'Amperímetro', ['Voltímetro', 'Ohmímetro', 'Termómetro'], 'El amperímetro se conecta en serie para medir amperes.']]);
  }
});

TOPICS.push({
  id: 'potencia_el', eje: 'ele', title: 'Potencia eléctrica y consumo en casa',
  nem: 'Electricidad en la vida diaria: potencia eléctrica, consumo de energía (kWh) y costo.',
  formula: 'P = V·I (watts) · I = P/V · Energía: E = P·t · kWh: convierte W a kW con el factor 1 kW / 1 000 W y multiplica por las horas · Costo = kWh × tarifa · El recibo de CFE suele ser bimestral (≈ 60 días)',
  lesson: `
<h4>Potencia eléctrica</h4>
<p>Indica qué tan rápido un aparato usa energía eléctrica:</p>
<p class="c"><b>P = V · I</b> &nbsp; (watts)</p>
<div class="ex"><b>Ejemplo:</b> una plancha conectada a 127 V que toma 8 A: P = 127 × 8 = 1 016 W.</div>
<h4>Consumo de energía: el kilowatt-hora</h4>
<p>La energía que consume un aparato depende de su potencia y del tiempo que está encendido. El recibo de luz la cobra en <b>kilowatt-hora (kWh)</b>:</p>
<p class="c"><b>Energía (kWh) = potencia (kW) × tiempo (h)</b></p><p>Si la potencia está en watts, primero se convierte a kilowatts con el factor de conversión ${frS('1 kW', '1 000 W')}.</p>
<div class="ex"><b>Ejemplo:</b> un refrigerador de 200 W encendido 24 h al día, con el kWh a $1.10.<ol class="steps"><li>Potencia en kW: ${daInline(200, 'W', 1, 'kW', 1000)}</li><li>Energía por día: 0.2 kW × ${frS('24 h', '1 día')} = 4.8 kWh/día</li><li>Bimestre: ${frS('4.8 kWh', '1 ' + UCX('día'))} × 60 ${UCX('días')} = 288 kWh</li><li>Costo: 288 ${UCX('kWh')} × ${frS('$1.10', '1 ' + UCX('kWh'))} = $316.80</li></ol></div>
<h4>Seguridad</h4>
<p>Muchos aparatos de alta potencia en un mismo contacto hacen circular mucha corriente (I = P ÷ V) y pueden sobrecalentar el cable. Los <b>fusibles</b> y las <b>pastillas</b> cortan la corriente cuando supera un límite.</p>
<div class="warn"><b>Errores comunes</b><ul><li>Confundir watts (potencia) con kWh (energía).</li><li>Olvidar convertir W a kW con el factor 1 kW / 1 000 W.</li><li>Creer que un aparato apagado pero conectado no consume nada: muchos tienen consumo en espera (“vampiro”).</li></ul></div>
${lab('Busca en la etiqueta de 3 aparatos de tu casa su potencia en watts. Estima cuántas horas al día se usa cada uno y calcula cuántos kWh consumen en un bimestre.')}`,
  gen(L) {
    if (L === 1) { const V = pick([127, 120, 12, 9, 220]), I = pick([0.5, 1, 2, 3, 4, 5, 8, 10]); const Pw = rnd(V * I, 4); return num(`Un aparato conectado a ${V} V consume una corriente de ${fmt(I)} A. ¿Cuál es su potencia?`, Pw, { unit: 'W', tol: 0.011, hint: 'P = V · I.', sol: [`P = ${V} × ${fmt(I)} = ${B(fmt(Pw) + ' W')}`] }); }
    if (L === 2) { const ap = pick([['una plancha', 1270], ['un horno de microondas', 1016], ['una secadora de pelo', 1524], ['una televisión', 127], ['un ventilador', 63.5], ['un calentador eléctrico', 1905]]); const I = rnd(ap[1] / 127, 4);
      return num(`${ap[0][0].toUpperCase() + ap[0].slice(1)} de ${fmt(ap[1])} W se conecta a 127 V. ¿Qué corriente consume?`, I, { unit: 'A', tol: 0.011, hint: 'En P = V · I, la corriente está multiplicada por V: divide ambos lados entre V.', sol: despMul('P', ['V', 'I'], 'I').concat([sust('I', frS(fmt(ap[1]) + ' W', '127 V'), B(fmt(I) + ' A'))]) }); }
    if (L === 3) { const Pw = pick([9, 60, 100, 150, 200, 800, 1000, 1500, 2000]), h = pick([0.5, 1, 2, 3, 4, 5, 8, 24]); const kwh = rnd(Pw / 1000 * h, 4);
      return num(`Un aparato de ${Pw} W funciona ${fmt(h)} h. ¿Cuántos kWh consume?`, kwh, { unit: 'kWh', tol: Math.max(0.0011, kwh * 0.005), hint: 'Convierte watts a kilowatts con análisis dimensional (1 kW = 1 000 W) y multiplica por las horas.', errs: [{ v: Pw * h, m: 'Ese resultado está en Wh; conviértelo a kWh con el factor 1 kW / 1 000 W.' }], sol: [`Potencia en kW: ${daInline(Pw, 'W', 1, 'kW', 1000)}`, `Energía = potencia × tiempo = ${fmt(Pw / 1000)} kW × ${fmt(h)} h = ${B(fmt(kwh) + ' kWh')}`] }); }
    if (L === 4) { const ap = pick([['un refrigerador', 200, 24], ['una televisión', 120, 5], ['una lavadora', 500, 1], ['un ventilador', 70, 8], ['una computadora', 250, 6]]); const t = pick([0.9, 1.0, 1.1, 1.2, 3.1]); const kwh = ap[1] / 1000 * ap[2] * 60; const c = rnd(kwh * t, 2);
      return num(`${ap[0][0].toUpperCase() + ap[0].slice(1)} de ${ap[1]} W se usa ${ap[2]} h al día. Si el kWh cuesta ${money(t)}, ¿cuánto cuesta su consumo en un bimestre (60 días)?`, c, { unit: 'pesos', tol: 0.02, hint: 'kWh por día × 60 días × precio del kWh.', sol: [`Potencia en kW: ${daInline(ap[1], 'W', 1, 'kW', 1000)}`, `Por día: ${fmt(ap[1] / 1000)} kW × ${frS(ap[2] + ' h', '1 día')} = ${fmt(ap[1] / 1000 * ap[2])} kWh/día`, `Bimestre (análisis dimensional): ${frS(fmt(ap[1] / 1000 * ap[2]) + ' kWh', '1 ' + UCX('día'))} × 60 ${UCX('días')} = ${fmt(kwh)} kWh`, `Costo: ${fmt(kwh)} ${UCX('kWh')} × ${frS(money(t), '1 ' + UCX('kWh'))} = ${B(money(c))}`] }); }
    const aps = shuffle([['refrigerador', 200, 24], ['televisión', 100, 4], ['focos LED (5)', 45, 6], ['plancha', 1200, 0.5], ['licuadora', 400, 0.25], ['computadora', 150, 3]]).slice(0, 3); const kwh = rnd(aps.reduce((s, a) => s + a[1] * a[2], 0) / 1000, 4);
    return num(`En una casa se usan al día: ${aps.map(a => `${a[0]} de ${a[1]} W durante ${fmt(a[2])} h`).join('; ')}. ¿Cuántos kWh consumen en total al día?`, kwh, { unit: 'kWh', tol: Math.max(0.0011, kwh * 0.005), hint: 'Calcula los Wh de cada aparato (W × h), súmalos y convierte a kWh con el factor 1 kWh / 1 000 Wh.', sol: [aps.map(a => `${a[0]}: ${a[1]} W × ${fmt(a[2])} h = ${fmt(a[1] * a[2])} Wh`).join('; '), `Total: ${fmt(kwh * 1000)} Wh`, `En kWh (análisis dimensional): ${daInline(rnd(kwh * 1000, 6), 'Wh', 1, 'kWh', 1000).replace(/= ([^=]*)$/, '= ' + B(fmt(kwh) + ' kWh'))}`] });
  }
});

TOPICS.push({
  id: 'magnetismo', eje: 'ele', title: 'Magnetismo y electromagnetismo',
  nem: 'Interacciones del magnetismo: imanes, campo magnético, magnetismo terrestre, electroimanes, inducción electromagnética, motores y generadores.',
  formula: 'Polos iguales se repelen, opuestos se atraen · Corriente eléctrica → campo magnético (Oersted, electroimán) · Imán en movimiento → corriente (inducción, Faraday) · Motor: eléctrica → movimiento · Generador: movimiento → eléctrica',
  lesson: `
<h4>Imanes</h4>
<p>Todo imán tiene dos polos, <b>norte y sur</b>. Polos iguales se repelen y opuestos se atraen. Si partes un imán, obtienes dos imanes, cada uno con sus dos polos: no existen polos aislados. Los imanes atraen hierro, níquel y cobalto, pero no aluminio, cobre ni plástico.</p>
<p>Alrededor de un imán hay un <b>campo magnético</b>, que se puede “ver” con limaduras de hierro.</p>
<h4>La Tierra es un gran imán</h4>
<p>La brújula apunta al norte porque su aguja se alinea con el campo magnético terrestre. El polo norte geográfico está cerca de un polo <b>sur</b> magnético. El campo de la Tierra nos protege del viento solar; las auroras ocurren cuando esas partículas chocan con la atmósfera cerca de los polos.</p>
<h4>Electricidad y magnetismo están unidos</h4>
<ul><li><b>Oersted (1820):</b> una corriente eléctrica desvía una brújula: toda corriente crea un campo magnético. Un <b>electroimán</b> es un cable enrollado en un clavo de hierro; funciona solo mientras pasa corriente, y es más fuerte con más vueltas o más corriente.</li><li><b>Faraday (1831):</b> mover un imán cerca de una bobina produce corriente: <b>inducción electromagnética</b>.</li></ul>
<table class="tb"><tr><th>Aparato</th><th>Transformación</th></tr><tr><td>Motor eléctrico (licuadora, ventilador)</td><td>eléctrica → mecánica</td></tr><tr><td>Generador (centrales, dinamo de bici)</td><td>mecánica → eléctrica</td></tr><tr><td>Transformador</td><td>cambia el voltaje de la corriente alterna</td></tr></table>
<div class="warn"><b>Errores comunes</b><ul><li>Creer que los imanes atraen cualquier metal (no atraen aluminio ni cobre).</li><li>Pensar que si cortas un imán separas el norte del sur.</li></ul></div>
${lab('Enrolla unas 30 vueltas de alambre esmaltado en un clavo, lija las puntas y conéctalas a una pila (pocos segundos, se calienta). ¿Cuántos clips levanta? Prueba con más vueltas.')}`,
  gen(L) {
    const b1 = [
      ['Si acercas el polo norte de un imán al polo norte de otro, los imanes:', 'Se repelen', ['Se atraen', 'No pasa nada', 'Se desmagnetizan'], 'Polos iguales se repelen.'],
      ['¿Cuál de estos materiales es atraído por un imán?', 'Hierro', ['Aluminio', 'Cobre', 'Plástico'], 'El hierro, el níquel y el cobalto son ferromagnéticos.'],
      ['Si partes un imán por la mitad obtienes:', 'Dos imanes, cada uno con polo norte y sur', ['Un polo norte y un polo sur separados', 'Dos pedazos sin magnetismo', 'Un imán y un pedazo de hierro'], 'No existen polos magnéticos aislados.'],
      ['La aguja de una brújula se orienta porque:', 'Se alinea con el campo magnético de la Tierra', ['Apunta hacia el Sol', 'La atrae el polo norte geográfico por gravedad', 'Por el viento'], 'La Tierra se comporta como un gran imán.']];
    const b2 = [
      ['¿Qué descubrió Oersted?', 'Que una corriente eléctrica produce un campo magnético', ['Que los imanes producen luz', 'La ley de la gravitación', 'Que la Tierra gira'], 'Una corriente desvió la aguja de una brújula.'],
      ['¿Cómo puedes hacer más fuerte un electroimán?', 'Dando más vueltas al alambre o aumentando la corriente', ['Usando un núcleo de plástico', 'Quitando la pila', 'Usando alambre más corto'], 'El campo crece con el número de vueltas y la corriente; un núcleo de hierro lo refuerza.'],
      ['Un electroimán, a diferencia de un imán permanente:', 'Se puede encender y apagar', ['Nunca pierde su magnetismo', 'No tiene polos', 'Atrae aluminio'], 'Solo funciona mientras circula corriente.'],
      ['Las auroras boreales se relacionan con:', 'Partículas del Sol desviadas por el campo magnético terrestre', ['Reflejos del mar', 'Rayos de una tormenta', 'La luz de la Luna'], 'El campo magnético las guía hacia los polos, donde chocan con la atmósfera.']];
    const b3 = [
      ['¿Qué descubrió Faraday con la inducción electromagnética?', 'Que un imán en movimiento cerca de una bobina produce corriente', ['Que la corriente calienta los cables', 'Que la luz es una onda', 'Que los imanes atraen cobre'], 'Al cambiar el campo magnético dentro de una bobina se induce una corriente.'],
      ['Un generador de una central eléctrica transforma:', 'Energía mecánica en eléctrica', ['Energía eléctrica en mecánica', 'Energía luminosa en térmica', 'Energía química en nuclear'], 'Una turbina hace girar bobinas e imanes y se induce corriente.'],
      ['Un motor eléctrico transforma:', 'Energía eléctrica en mecánica', ['Energía mecánica en eléctrica', 'Calor en electricidad', 'Luz en movimiento'], 'La corriente en una bobina dentro de un imán produce fuerzas que la hacen girar.'],
      ['Si dejas un imán quieto dentro de una bobina conectada a un foquito:', 'No se produce corriente', ['El foco brilla siempre', 'El imán se calienta', 'La bobina se vuelve imán permanente'], 'La inducción requiere que el campo magnético cambie (movimiento).'],
      ['¿Para qué sirve un transformador en los postes de luz?', 'Para cambiar el voltaje de la corriente alterna', ['Para guardar electricidad', 'Para convertir corriente en luz', 'Para medir el consumo'], 'Eleva el voltaje para transportar la energía y lo reduce para usarla en casa.']];
    const b4 = [
      ['El polo norte geográfico de la Tierra está cerca de un polo magnético:', 'Sur', ['Norte', 'No hay polo magnético ahí', 'Ecuatorial'], 'El norte de la brújula es atraído por un polo sur magnético.'],
      ['Al mover un imán más rápido dentro de una bobina, la corriente inducida:', 'Aumenta', ['Disminuye', 'No cambia', 'Se hace cero'], 'A mayor rapidez de cambio del campo magnético, mayor corriente inducida.'],
      ['¿Qué tienen en común un motor y un generador?', 'Ambos usan bobinas e imanes; uno es el proceso inverso del otro', ['Ambos producen calor como fin', 'Ninguno usa imanes', 'Ambos solo funcionan con pilas'], 'El motor convierte electricidad en movimiento; el generador, movimiento en electricidad.'],
      ['Los trenes de levitación magnética (maglev) flotan gracias a:', 'Fuerzas de repulsión entre electroimanes', ['Aire comprimido', 'Baja gravedad', 'Imanes que atraen aluminio'], 'Electroimanes potentes repelen la vía y lo mantienen suspendido.']];
    return cq(L <= 1 ? b1 : L === 2 ? b2.concat(b1.slice(2)) : L === 3 ? b3 : L === 4 ? b3.concat(b4) : b4.concat(b2.slice(0, 2)));
  }
});

TOPICS.push({
  id: 'ondas', eje: 'ele', title: 'Ondas: sonido y luz',
  nem: 'Fenómenos ondulatorios: características de las ondas, sonido, luz y espectro electromagnético.',
  formula: 'v = λ·f · T = 1/f · Sonido en el aire ≈ 343 m/s · Eco: d = v·t ÷ 2 · Luz: c = 3 × 10⁸ m/s · Hz = ciclos por segundo',
  lesson: `
<h4>¿Qué es una onda?</h4>
<p>Una perturbación que transporta <b>energía</b> sin transportar materia. Las olas mueven un corcho hacia arriba y abajo, pero el corcho no viaja con la ola.</p>
<ul><li><b>Longitud de onda (λ):</b> distancia entre dos crestas (m).</li><li><b>Frecuencia (f):</b> ondas por segundo (hertz, Hz).</li><li><b>Periodo (T):</b> tiempo de una oscilación: T = 1 ÷ f.</li><li><b>Amplitud:</b> altura de la onda; relacionada con la energía (en el sonido, el volumen).</li></ul>
<p class="c"><b>v = λ · f</b></p>
<h4>Ondas mecánicas y electromagnéticas</h4>
<ul><li><b>Mecánicas</b> (sonido, olas, sismos): necesitan un medio. En el espacio no hay sonido.</li><li><b>Electromagnéticas</b> (luz, radio, microondas, rayos X): viajan incluso en el vacío, a 3 × 10⁸ m/s.</li></ul>
<h4>Sonido</h4>
<p>Viaja a unos 343 m/s en el aire (más rápido en agua y en sólidos). El <b>tono</b> depende de la frecuencia (agudo = alta frecuencia) y la <b>intensidad</b> de la amplitud. Los humanos oímos de 20 a 20 000 Hz. El <b>eco</b> es el sonido reflejado: si tarda t en volver, la pared está a d = 343 × t ÷ 2.</p>
<h4>Espectro electromagnético</h4>
<p>De menor a mayor frecuencia (y energía): ondas de radio → microondas → infrarrojo → <b>luz visible</b> (rojo … violeta) → ultravioleta → rayos X → rayos gamma.</p>
<div class="warn"><b>Errores comunes</b><ul><li>Olvidar dividir entre 2 en el eco (el sonido va y regresa).</li><li>Creer que el sonido viaja en el vacío.</li><li>Pensar que la onda arrastra la materia consigo.</li></ul></div>
${lab('Durante una tormenta, cuenta los segundos entre el relámpago y el trueno. Multiplica por 343: es la distancia aproximada a la que cayó el rayo, en metros.')}`,
  gen(L) {
    if (L === 1) return cq([
      ['¿Cuál de estas ondas puede viajar en el vacío?', 'La luz', ['El sonido', 'Las olas del mar', 'Las ondas sísmicas'], 'Las ondas electromagnéticas no necesitan medio.'],
      ['Un sonido agudo tiene:', 'Alta frecuencia', ['Baja frecuencia', 'Gran amplitud siempre', 'Velocidad mayor'], 'El tono depende de la frecuencia.'],
      ['Una onda transporta:', 'Energía, pero no materia', ['Materia, pero no energía', 'Materia y energía', 'Solo sonido'], 'El medio oscila en su lugar mientras la energía avanza.'],
      ['¿Por qué vemos el relámpago antes de oír el trueno?', 'La luz viaja mucho más rápido que el sonido', ['El trueno ocurre después', 'El sonido es más lento solo de noche', 'Los ojos son más sensibles'], 'La luz viaja a 300 000 km/s; el sonido a unos 343 m/s.'],
      ['¿Qué característica del sonido determina el volumen?', 'La amplitud', ['La frecuencia', 'La longitud de onda', 'El periodo'], 'Mayor amplitud = mayor intensidad (más fuerte).']]);
    if (L === 2) { const f = pick([2, 5, 10, 50, 100, 200, 440, 500]), lam = pick([0.5, 0.78, 1, 2, 0.25, 1.5, 3]); const v = rnd(f * lam, 4); return num(`Una onda tiene una frecuencia de ${f} Hz y una longitud de onda de ${fmt(lam)} m. ¿Cuál es su velocidad?`, v, { unit: 'm/s', tol: tl(v), hint: 'v = λ · f.', sol: [`v = ${fmt(lam)} × ${f} = ${B(fmt(v) + ' m/s')}`] }); }
    if (L === 3) { if (Math.random() < 0.5) { const f = pick([2, 4, 5, 10, 20, 50, 0.5, 0.25]); return num(`Una onda tiene una frecuencia de ${fmt(f)} Hz. ¿Cuál es su periodo?`, 1 / f, { unit: 's', tol: 0.0011, hint: 'La frecuencia es f = 1 ÷ T. Deja sola a T: multiplica ambos lados por T y después divide ambos lados entre f.', sol: despDen('f', '1', 'T').concat([sust('T', frS('1', fmt(f) + ' Hz') + ' (1 Hz = 1/s)', B(fmt(1 / f) + ' s'))]) }); }
      const f = pick([343, 686, 171.5, 1372, 100, 200]); const lam = rnd(343 / f, 4); return num(`Un sonido de ${fmt(f)} Hz viaja por el aire (343 m/s). ¿Cuál es su longitud de onda? (redondea a milésimos)`, rnd(lam, 3), { unit: 'm', tol: 0.0011, hint: 'En v = λ · f, la longitud de onda está multiplicada por f: divide ambos lados entre f.', sol: despMul('v', ['λ', 'f'], 'λ').concat([sust('λ', frS('343 m/' + UCX('s'), fmt(f) + ' 1/' + UCX('s')), B(fmt(rnd(lam, 3)) + ' m'))]) }); }
    if (L === 4) { const t = pick([0.5, 1, 1.2, 2, 3, 0.4, 0.8]); const d = rnd(343 * t / 2, 4); return num(`Gritas frente a un cerro y escuchas el eco ${fmt(t)} s después. ¿A qué distancia está el cerro? (sonido: 343 m/s)`, d, { unit: 'm', tol: tl(d), hint: 'El sonido va y regresa: d = v · t ÷ 2.', errs: [{ v: rnd(343 * t, 4), m: 'Olvidaste dividir entre 2: el sonido recorre la distancia de ida y de vuelta.' }], sol: [`Recorrido total: 343 × ${fmt(t)} = ${fmt(343 * t)} m`, `Distancia al cerro: ÷ 2 = ${B(fmt(d) + ' m')}`] }); }
    if (Math.random() < 0.5) { const t = R(2, 15); return num(`Ves un relámpago y escuchas el trueno ${t} s después. ¿A qué distancia cayó el rayo, aproximadamente? (sonido: 343 m/s)`, 343 * t, { unit: 'm', tol: tl(343 * t), hint: 'La luz llega casi al instante; el sonido tarda. d = v × t (aquí no hay ida y vuelta).', sol: [`d = 343 × ${t} = ${B(fmt(343 * t) + ' m')} (≈ ${fmt(343 * t / 1000, 1)} km)`] }); }
    return cq([
      ['Ordena de menor a mayor frecuencia:', 'Radio, microondas, luz visible, rayos X', ['Rayos X, luz visible, microondas, radio', 'Luz visible, radio, rayos X, microondas', 'Microondas, radio, rayos X, luz visible'], 'En el espectro electromagnético la frecuencia y la energía aumentan de radio a gamma.'],
      ['¿Qué tipo de radiación causa quemaduras en la piel y debe evitarse con bloqueador?', 'Ultravioleta', ['Infrarroja', 'Ondas de radio', 'Microondas'], 'La UV tiene suficiente energía para dañar las células de la piel.'],
      ['Los murciélagos y los sonares usan:', 'Ultrasonido (frecuencias mayores a 20 000 Hz)', ['Infrasonido', 'Luz visible', 'Rayos X'], 'Emiten sonidos muy agudos y escuchan el eco para ubicar objetos.'],
      ['¿En qué medio viaja más rápido el sonido?', 'En el acero', ['En el aire', 'En el vacío', 'En el agua, siempre más que en sólidos'], 'El sonido es más rápido en sólidos que en líquidos, y en líquidos que en gases; en el vacío no viaja.'],
      ['¿Qué color de la luz visible tiene la menor frecuencia?', 'Rojo', ['Violeta', 'Azul', 'Verde'], 'El rojo tiene la mayor longitud de onda y la menor frecuencia del espectro visible.']]);
  }
});

TOPICS.push({
  id: 'universo', eje: 'uni', title: 'El Sistema Solar y el Universo',
  nem: 'Composición del Universo y del Sistema Solar; modelos del Universo y escalas de distancia (unidad astronómica y año luz).',
  formula: '1 UA (unidad astronómica) ≈ 1.5 × 10⁸ km · 1 año luz ≈ 9.46 × 10¹² km · t = d ÷ c (c = 3 × 10⁵ km/s) · 3.ª ley de Kepler: T² = a³ (T en años, a en UA)',
  lesson: `
<h4>El Sistema Solar</h4>
<p>El Sol es una estrella que concentra más del 99% de la masa del Sistema Solar. A su alrededor giran 8 planetas, en orden: Mercurio, Venus, Tierra, Marte (rocosos), Júpiter, Saturno, Urano y Neptuno (gigantes gaseosos y helados). También hay planetas enanos (como Plutón), lunas, asteroides y cometas.</p>
<h4>De la Tierra al centro al Sol al centro</h4>
<ul><li><b>Modelo geocéntrico</b> (Ptolomeo): la Tierra en el centro.</li><li><b>Modelo heliocéntrico</b> (Copérnico, 1543): el Sol en el centro.</li><li><b>Galileo</b> apoyó a Copérnico con el telescopio: vio las lunas de Júpiter y las fases de Venus.</li><li><b>Kepler:</b> las órbitas son elipses; los planetas lejanos tardan más en dar la vuelta (T² = a³).</li><li><b>Newton:</b> la gravedad explica todas esas órbitas.</li></ul>
<h4>Distancias enormes</h4>
<ul><li><b>Unidad astronómica (UA):</b> distancia Tierra-Sol ≈ 150 millones de km.</li><li><b>Año luz:</b> distancia que recorre la luz en un año ≈ 9.46 × 10¹² km. Es una distancia, no un tiempo.</li></ul>
<div class="ex"><b>Ejemplo:</b> la luz del Sol tarda 1.5 × 10⁸ km ÷ 3 × 10⁵ km/s = 500 s ≈ 8.3 minutos en llegar. ¡Vemos al Sol como era hace 8 minutos!</div>
<h4>Más allá</h4>
<p>El Sol es una de unos cien mil millones de estrellas de nuestra galaxia, la <b>Vía Láctea</b>, y hay cientos de miles de millones de galaxias. Según el modelo del <b>Big Bang</b>, el Universo comenzó hace unos 13 800 millones de años y sigue expandiéndose.</p>
<div class="warn"><b>Errores comunes</b><ul><li>Creer que el año luz es una unidad de tiempo.</li><li>Pensar que las estaciones se deben a que la Tierra se acerca o se aleja del Sol: se deben a la inclinación del eje terrestre.</li></ul></div>
${lab('Haz un modelo a escala: si el Sol fuera una pelota de 20 cm, la Tierra sería una lenteja (2 mm) a 21 m de distancia. ¿A qué distancia pondrías Neptuno (30 UA)?')}`,
  gen(L) {
    if (L === 1) return cq([
      ['¿Cuál es el planeta más cercano al Sol?', 'Mercurio', ['Venus', 'Marte', 'Tierra'], 'Orden: Mercurio, Venus, Tierra, Marte, Júpiter, Saturno, Urano, Neptuno.'],
      ['¿Cuál es el planeta más grande del Sistema Solar?', 'Júpiter', ['Saturno', 'Neptuno', 'La Tierra'], 'Júpiter es un gigante gaseoso con más masa que todos los demás planetas juntos.'],
      ['El Sol es:', 'Una estrella', ['Un planeta', 'Una galaxia', 'Un satélite'], 'Es una estrella mediana que produce energía por fusión nuclear.'],
      ['¿Cómo se llama nuestra galaxia?', 'Vía Láctea', ['Andrómeda', 'Orión', 'Sistema Solar'], 'El Sistema Solar está dentro de la Vía Láctea.'],
      ['¿Cuántos planetas tiene el Sistema Solar?', '8', ['9', '7', '10'], 'Desde 2006 Plutón se clasifica como planeta enano.']]);
    if (L === 2) return cq([
      ['¿Quién propuso el modelo heliocéntrico en 1543?', 'Nicolás Copérnico', ['Claudio Ptolomeo', 'Isaac Newton', 'Aristóteles'], 'Copérnico colocó al Sol en el centro.'],
      ['¿Qué observó Galileo con su telescopio que apoyó al heliocentrismo?', 'Las lunas de Júpiter y las fases de Venus', ['Los anillos de Urano', 'La galaxia de Andrómeda', 'El Big Bang'], 'Mostró que no todo giraba alrededor de la Tierra.'],
      ['Según Kepler, las órbitas de los planetas son:', 'Elipses', ['Círculos perfectos', 'Líneas rectas', 'Espirales'], 'Primera ley de Kepler.'],
      ['¿Qué fuerza mantiene a los planetas en órbita alrededor del Sol?', 'La gravedad', ['El magnetismo', 'La fricción', 'La fuerza eléctrica'], 'Newton explicó las órbitas con la gravitación universal.'],
      ['Las estaciones del año se deben a:', 'La inclinación del eje de la Tierra', ['Que la Tierra se acerca y se aleja del Sol', 'Las fases de la Luna', 'La rotación de la Tierra'], 'La inclinación cambia el ángulo con que llegan los rayos del Sol.']]);
    if (L === 3) { const pl = pick([['Marte', 2.28e8], ['Júpiter', 7.78e8], ['Venus', 1.08e8], ['Saturno', 1.43e9], ['Mercurio', 5.8e7], ['la Tierra', 1.5e8]]); const t = rnd(pl[1] / 3e5 / 60, 1);
      return num(`${pl[0][0].toUpperCase() + pl[0].slice(1)} está a unos ${sci(rnd(pl[1] / Math.pow(10, Math.floor(Math.log10(pl[1]))), 2), Math.floor(Math.log10(pl[1])))} km del Sol. ¿Cuántos <b>minutos</b> tarda la luz del Sol en llegar? (c = 3 × 10⁵ km/s, redondea a décimos)`, t, { unit: 'min', tol: 0.051, hint: 'De c = d ÷ t, despeja t (multiplica ambos lados por t y divide ambos lados entre c). Sale en segundos: conviértelo a minutos con el factor 1 min / 60 s.', sol: despDen('c', 'd', 't').concat([sust('t', frS(fmt(pl[1]) + ' ' + UCX('km'), '300,000 ' + UCX('km') + '/s'), fmt(pl[1] / 3e5, 1) + ' s'), `En minutos (análisis dimensional): ${daInline(rnd(pl[1] / 3e5, 4), 's', 1, 'min', 60)} ≈ ${B(fmt(t) + ' min')}`]) }); }
    if (L === 4) { const n = pick([2, 4, 4.2, 8.6, 10, 25, 100]); const km = n * 9.46e12; const e = Math.floor(Math.log10(km)); const m = rnd(km / Math.pow(10, e), 2);

    const a = pick([1, 4, 9, 16, 0.25]); const T = Math.pow(a, 1.5);
    if (Math.random() < 0.6) return num(`Un asteroide orbita al Sol a ${fmt(a)} UA. Usando la tercera ley de Kepler (T² = a³, con T en años y a en UA), ¿cuántos años tarda en dar una vuelta?`, T, { unit: 'años', tol: 0.011, hint: 'Calcula a³ y luego saca la raíz cuadrada.', sol: [`a³ = ${fmt(a)}³ = ${fmt(a ** 3)}`, `T = √${fmt(a ** 3)} = ${B(fmt(T) + ' años')}`] });

  }

bankTopic({ id: 'in_present', eje: 'ingr', m: 1, title: 'Present simple and present continuous',
  nem: 'Comprende textos narrativos y biográficos en inglés sobre la vida cotidiana y formas de interacción de hablantes de distintas lenguas.',
  formula: 'Present simple: hábitos y rutinas (I play, she plays; do/does not). Present continuous: acciones en este momento (I am playing, she is playing). Palabras clave: always, usually, every day (simple) / now, right now, at the moment (continuous).',
  lesson: lesson({ k: 'El <b>presente simple</b> describe hábitos, rutinas y verdades generales. El <b>presente continuo</b> describe lo que está pasando en este momento.',
    p: ['<b>Present simple:</b> I/you/we/they <i>play</i>; he/she/it <i>plays</i> (agrega -s o -es: watches, goes).', 'Negativo: I <i>don’t</i> play / She <i>doesn’t</i> play. Pregunta: <i>Do</i> you play? <i>Does</i> she play?', '<b>Present continuous:</b> am/is/are + verbo-ing: I <i>am reading</i>, they <i>are playing</i>.', '<b>Pistas:</b> every day, usually, always, on Mondays → simple. Now, right now, at the moment, Look! → continuous.'],
    ex: '“Ana usually walks to school, but today she is taking the bus.”',
    er: ['Olvidar la -s en tercera persona: “She play” ✗ → “She plays” ✓.', 'Usar “doesn’t plays” ✗ → “doesn’t play” ✓.'],
    v: 'Para hablar de tu rutina y describir lo que sucede a tu alrededor.' }),
  qs: [
    [1, 'Choose the correct option: “She ___ soccer every Saturday.”', 'plays', ['play', 'playing', 'is play'], 'Tercera persona en presente simple lleva -s.'],
    [1, 'Choose the correct option: “Look! The baby ___.”', 'is sleeping', ['sleeps', 'sleep', 'sleeping'], '“Look!” indica que ocurre ahora: presente continuo.'],
    [2, 'Choose the negative: “He ___ like vegetables.”', 'doesn’t', ['don’t', 'isn’t', 'not'], 'Con he/she/it se usa doesn’t + verbo base.'],
    [2, 'Choose the correct question: “___ you speak English?”', 'Do', ['Does', 'Are', 'Is'], 'Con you se usa Do.'],
    [3, '“They ___ a movie right now.”', 'are watching', ['watch', 'watches', 'is watching'], '“Right now” + they → are + -ing.'],
    [3, '“My father ___ to work by bus.”', 'goes', ['go', 'gos', 'going'], 'Go → goes en tercera persona.'],
    [4, 'Which sentence is correct?', 'She doesn’t eat meat.', ['She don’t eat meat.', 'She doesn’t eats meat.', 'She not eat meat.'], 'doesn’t + verbo en forma base.'],
    [4, '“I usually ___ breakfast at 7, but today I ___ at 8.”', 'have / am having', ['am having / have', 'has / having', 'having / have'], 'Hábito (usually) → simple; hoy, en este momento → continuo.'],
    [5, 'Which sentence describes a routine?', 'We visit our grandparents every Sunday.', ['We are visiting our grandparents now.', 'We visiting grandparents.', 'We are visit grandparents.'], '“Every Sunday” indica rutina.'],
    [5, '“What ___ your sister doing at the moment?”', 'is', ['does', 'do', 'are'], 'Presente continuo: is + sujeto + -ing.']
  ] });

bankTopic({ id: 'in_past', eje: 'ingr', m: 1, title: 'Past simple: biographies and stories',
  nem: 'Comprende textos narrativos y biográficos en inglés sobre la vida de hablantes en el pasado; relata sucesos significativos.',
  formula: 'Regular verbs: + ed (play → played, study → studied). Irregular verbs: go → went, have → had, see → saw, make → made, be → was/were. Negative: didn’t + base verb. Question: Did + subject + base verb? Time words: yesterday, last year, in 1910, ago.',
  lesson: lesson({ k: 'El <b>pasado simple</b> se usa para hablar de acciones terminadas en el pasado, como en biografías o relatos.',
    p: ['<b>Verbos regulares:</b> agregan -ed: worked, played, lived, studied.', '<b>Verbos irregulares:</b> cambian: go → <i>went</i>, have → <i>had</i>, see → <i>saw</i>, write → <i>wrote</i>, be → <i>was/were</i>.', '<b>Negativo:</b> didn’t + verbo base (She didn’t go).', '<b>Pregunta:</b> Did + sujeto + verbo base? (Did you see it?)', '<b>Pistas de tiempo:</b> yesterday, last week, two years ago, in 1968.'],
    ex: '“Frida Kahlo was born in 1907. She painted many self-portraits.”',
    er: ['“She didn’t went” ✗ → “She didn’t go” ✓.', 'Olvidar que “be” tiene dos formas: I/he/she/it <i>was</i>; you/we/they <i>were</i>.'],
    v: 'Para contar anécdotas, leer biografías y hablar de historia en inglés.' }),
  qs: [
    [1, 'Past simple of “play”:', 'played', ['plaied', 'playd', 'plays'], 'Verbo regular: + ed.'],
    [1, 'Past simple of “go”:', 'went', ['goed', 'gone', 'goes'], 'Go es irregular.'],
    [2, '“Benito Juárez ___ born in Oaxaca in 1806.”', 'was', ['were', 'is', 'be'], 'He/she → was.'],
    [2, '“We ___ to the beach last summer.”', 'went', ['go', 'goes', 'going'], '“Last summer” → pasado.'],
    [3, 'Negative form: “She ___ the homework yesterday.”', 'didn’t do', ['didn’t did', 'doesn’t did', 'not did'], 'didn’t + verbo base.'],
    [3, '“___ you see the game last night?”', 'Did', ['Do', 'Were', 'Does'], 'Pregunta en pasado: Did + verbo base.'],
    [4, 'Past simple of “study”:', 'studied', ['studyed', 'studed', 'studing'], 'Consonante + y → ied.'],
    [4, 'Which sentence is correct?', 'They were very happy at the party.', ['They was very happy at the party.', 'They are very happy at the party yesterday.', 'They be happy at the party.'], 'They → were.'],
    [5, 'Choose the correct sequence: “First, Malala ___ a blog. Then, she ___ the Nobel Prize in 2014.”', 'wrote / won', ['writed / winned', 'write / win', 'wrote / winned'], 'Write → wrote; win → won (irregulares).'],
    [5, '“Two years ago, my family ___ to Villahermosa.”', 'moved', ['moves', 'is moving', 'move'], '“Ago” indica pasado.']
  ] });

bankTopic({ id: 'in_compare', eje: 'ingr', m: 2, title: 'Describing people and cultures: comparatives and superlatives',

    [2, '“An elephant is ___ than a dog.”', 'bigger', ['big', 'biggest', 'more big'], 'Comparativo + than; se duplica la g.'],

    [5, 'Complete: “Scottish people often speak with a ___ accent ___ Americans.”', 'different / from', ['more different / than', 'differenter / than', 'different / that'], '“Different from” es la estructura correcta.'],
    [5, '“Of the three dishes, fish and chips is ___.” (easy to cook)', 'the easiest', ['the easier', 'the most easy', 'easiest than'], 'Easy → the easiest.']
