/* ===== Comprensión y razonamiento: MATEMÁTICAS =====
   Para cada tema: origen (de dónde sale la regla o fórmula, construido paso a paso) y preguntas de razonamiento
   (por qué funciona, análisis de errores, estimación y sentido del resultado). Formato de qs: [nivel, pregunta, correcta, [distractores], explicación]. */
const RAZ = {};
RAZ.signos = { origen: `<p><b>¿Por qué menos por menos da más?</b> Observa el patrón: 3 × (−2) = −6; 2 × (−2) = −4; 1 × (−2) = −2; 0 × (−2) = 0. Cada vez que el primer número baja 1, el resultado <b>sube 2</b>. Si seguimos el patrón: (−1) × (−2) = 2; (−2) × (−2) = 4. La regla no es un capricho: es lo único que mantiene el patrón.</p>
<p>Otra forma: multiplicar por −1 significa “voltear” al lado contrario de la recta numérica. Voltear dos veces te regresa al lado positivo.</p>
<p>La división es la operación inversa: (−12) ÷ (−3) = 4 porque 4 × (−3) = −12. Por eso las reglas de signos son las mismas.</p>`,
  qs: [
    [2, 'En el patrón 2 × (−3) = −6, 1 × (−3) = −3, 0 × (−3) = 0, ¿cuánto debe dar (−1) × (−3) para que el patrón continúe?', '3, porque cada paso el resultado aumenta 3', ['−3, porque el signo menos siempre gana', '0, porque el patrón se detiene en cero', '−4, porque se suman los dos números']],
    [3, '¿Por qué (−20) ÷ (−4) = 5?', 'Porque 5 × (−4) = −20: la división deshace la multiplicación', ['Porque al dividir los signos se restan entre sí', 'Porque la división siempre da resultado positivo', 'Porque −20 es mayor que −4 en la recta']],
    [4, 'Luis dice: “(−2)³ = 8 porque menos por menos da más”. ¿Qué error comete?', 'Son tres factores negativos: dos dan positivo y el tercero lo vuelve negativo; da −8', ['Ninguno, el resultado 8 es correcto', 'El error es que debía dar −6', 'El error es que las potencias no tienen signo']],
    [5, 'Sin calcular, ¿qué signo tiene (−1)×(−2)×(−3)×…×(−9)?', 'Negativo, porque hay 9 factores negativos (cantidad impar)', ['Positivo, porque hay muchos factores', 'Negativo, porque el último factor es negativo', 'No se puede saber sin multiplicar']]] };
RAZ.jerarquia = { origen: `<p><b>¿Por qué primero se multiplica y después se suma?</b> Porque la multiplicación es una suma abreviada: 2 + 3 × 4 significa “2 más tres grupos de 4”, es decir 2 + (4 + 4 + 4) = 14. Si sumáramos primero (5 × 4 = 20) cambiaríamos lo que dice la expresión.</p>
<p>Las potencias son multiplicaciones abreviadas (5² = 5 × 5), por eso van antes que la multiplicación. Los paréntesis existen justamente para indicar “esto va primero”, cuando queremos romper el orden normal. El acuerdo es universal para que una misma expresión dé el mismo resultado en todo el mundo.</p>`,
  qs: [
    [2, '¿Por qué 2 + 3 × 4 da 14 y no 20?', 'Porque 3 × 4 son tres grupos de 4 que se agregan al 2', ['Porque siempre se opera de derecha a izquierda', 'Porque la suma tiene prioridad sobre la multiplicación', 'Porque 20 es demasiado grande para la expresión']],
    [3, 'Ana resolvió 18 − 6 ÷ 2 = 12 ÷ 2 = 6. ¿Dónde está el error?', 'Restó antes de dividir; lo correcto es 18 − 3 = 15', ['Dividió antes de restar; lo correcto es 6', 'No hay error: el resultado es 6', 'Debía multiplicar 6 × 2 = 12 primero']],
    [4, '¿Qué paréntesis hacen que 4 + 6 × 2 − 1 dé 19?', '(4 + 6) × 2 − 1', ['4 + 6 × (2 − 1)', '4 + (6 × 2) − 1', '4 + 6 × 2 − (1)']],
    [5, '¿Para qué sirven los paréntesis en una expresión?', 'Para indicar que una parte se opera antes, cambiando el orden habitual', ['Para que la expresión se vea más ordenada', 'Para marcar qué números son negativos siempre', 'Para indicar que se suma en lugar de multiplicar']]] };
RAZ.fracdec = { origen: `<p><b>Multiplicar fracciones:</b> ½ × ⅓ significa “la mitad de un tercio”. Si partes un entero en 3 y tomas un tercio, y ese tercio lo partes a la mitad, el entero quedó en 2 × 3 = 6 partes y tomaste 1: ⅙. Por eso se multiplican numeradores y denominadores.</p>
<p><b>Dividir fracciones:</b> 3 ÷ ½ pregunta “¿cuántas mitades caben en 3?”. Caben 6, que es 3 × 2. Dividir entre ½ es lo mismo que multiplicar por 2 (su recíproco). Por eso a ÷ (c/d) = a × (d/c).</p>
<p><b>Decimales:</b> 0.3 × 0.2 = (3/10) × (2/10) = 6/100 = 0.06. Por eso el resultado lleva tantas cifras decimales como los dos factores juntos.</p>`,
  qs: [
    [2, '¿Por qué 0.3 × 0.2 = 0.06 y no 0.6?', 'Porque son 3/10 × 2/10 = 6/100: décimos por décimos dan centésimos', ['Porque al multiplicar decimales se resta un cero', 'Porque 0.6 es mayor que los dos factores', 'Porque el punto siempre se recorre dos lugares a la izquierda']],
    [3, '¿Qué pregunta responde 4 ÷ ½?', '¿Cuántas mitades caben en 4? (son 8)', ['¿Cuánto es la mitad de 4? (son 2)', '¿Cuánto es 4 menos un medio? (son 3.5)', '¿Cuántas veces cabe 4 en un medio? (es 1/8)']],
    [4, 'Sin calcular: ¿5 × 0.8 es mayor o menor que 5?', 'Menor, porque se toma solo una parte (8 décimos) de 5', ['Mayor, porque multiplicar siempre aumenta', 'Igual, porque 0.8 es casi 1', 'Depende de cuántos decimales tenga el resultado']],
    [5, 'Sin calcular: ¿6 ÷ 0.5 es mayor o menor que 6?', 'Mayor: caben 2 medios en cada entero, así que da 12', ['Menor, porque dividir siempre disminuye', 'Igual, porque 0.5 es la mitad de 1', 'Menor: da 3, porque es la mitad']]] };
RAZ.potencias = { origen: `<p>Una potencia es una multiplicación abreviada: 2⁴ = 2 × 2 × 2 × 2. Las leyes no se memorizan: se <b>cuentan factores</b>.</p>
<ul><li>2³ × 2² = (2×2×2) × (2×2) = cinco factores de 2 = 2⁵. Por eso los exponentes <b>se suman</b>.</li><li>2⁵ ÷ 2² = (2×2×2×2×2)/(2×2): se cancelan 2 factores y quedan 3: 2³. Los exponentes <b>se restan</b>.</li><li>(2³)² = 2³ × 2³ = 2⁶. Los exponentes <b>se multiplican</b>.</li><li>2³ ÷ 2³ = 1, y por la regla de la resta es 2⁰. Por eso <b>a⁰ = 1</b>.</li></ul>`,
  qs: [
    [2, '¿Por qué 3² × 3⁴ = 3⁶?', 'Porque son 2 factores de 3 y luego 4 más: 6 factores en total', ['Porque 2 × 4 = 8 y se ajusta a 6', 'Porque se multiplican las bases: 9', 'Porque los exponentes se multiplican siempre']],
    [3, '¿Por qué cualquier número (distinto de 0) elevado a la 0 vale 1?', 'Porque a³ ÷ a³ = 1 y, restando exponentes, también es a⁰', ['Porque el exponente cero borra el número y queda 0', 'Porque así se acordó sin ninguna razón', 'Porque a⁰ significa a × 0 = 1']],
    [4, 'Pedro escribió 2³ × 2⁴ = 4⁷. ¿Qué error cometió?', 'Multiplicó las bases; la base 2 se conserva: 2⁷', ['Sumó los exponentes; debía multiplicarlos: 2¹²', 'Ninguno, 4⁷ es correcto', 'Debió restar los exponentes: 2¹']],
    [5, '¿Qué es mayor, 2¹⁰ o 10²?', '2¹⁰ = 1 024, mucho mayor que 10² = 100', ['10² porque la base es más grande', 'Son iguales porque usan los mismos números', '10² porque 2¹⁰ es solo 20']]] };
RAZ.notacion = { origen: `<p>Multiplicar por 10 recorre todas las cifras un lugar a la izquierda (cada cifra vale 10 veces más). Por eso 3.2 × 10³ = 3.2 × 10 × 10 × 10 = 3 200: el punto “se mueve” 3 lugares. 10⁻³ significa dividir entre 10 tres veces: 3.2 × 10⁻³ = 0.0032.</p>
<p>Se usa porque escribir 300 000 000 m/s (luz) o 0.000 000 001 m es fácil de equivocar: contar ceros es más difícil que leer un exponente. El primer número va entre 1 y 10 para que todos escriban igual.</p>`,
  qs: [
    [2, '¿Por qué 4.5 × 10² = 450?', 'Porque multiplicar por 10 dos veces hace que cada cifra valga 100 veces más', ['Porque se agregan dos ceros al final del 4.5', 'Porque se suma 4.5 + 100', 'Porque el exponente indica cuántos decimales hay']],
    [3, 'Un exponente negativo, como en 7 × 10⁻⁴, indica que el número es:', 'Menor que 1: se dividió entre 10 cuatro veces', ['Negativo: está por debajo de cero', 'Mayor que 1000', 'Un error, los exponentes no pueden ser negativos']],
    [4, 'Marta escribió 25 000 = 25 × 10³ en notación científica. ¿Qué falla?', 'El primer número debe estar entre 1 y 10: es 2.5 × 10⁴', ['Nada, la expresión está correcta y completa', 'Debe ser 25 × 10⁴', 'Debe ser 2.5 × 10³']],
    [5, 'Sin calcular: ¿(3 × 10⁸) × (2 × 10⁻³) es mayor o menor que un millón?', 'Menor: 6 × 10⁵ = 600 000', ['Mayor: 6 × 10¹¹', 'Mayor: 6 × 10²⁴', 'Igual: 6 × 10⁶']]] };
RAZ.raices = { origen: `<p>La raíz cuadrada responde una pregunta geométrica: si un cuadrado tiene 49 cm² de área, ¿cuánto mide su lado? Como área = lado × lado, buscamos un número que multiplicado por sí mismo dé 49: es 7. Por eso √49 = 7 y “raíz” deshace “elevar al cuadrado”.</p>
<p>Para estimar √50: 7² = 49 y 8² = 64, así que el lado está entre 7 y 8, muy cerca de 7 porque 50 está muy cerca de 49.</p>`,
  qs: [
    [2, 'Un cuadrado tiene 81 m² de área. ¿Por qué su lado mide √81 = 9 m?', 'Porque el área es lado × lado, y 9 × 9 = 81', ['Porque 81 ÷ 4 lados ≈ 9', 'Porque 81 ÷ 9 = 9 siempre', 'Porque la raíz divide entre 2: 81 ÷ 2 ≈ 9']],
    [3, '¿Entre qué enteros está √30 y por qué?', 'Entre 5 y 6, porque 5² = 25 y 6² = 36', ['Entre 15 y 16, porque 30 ÷ 2 = 15', 'Entre 3 y 4, porque 3 × 10 = 30', 'Entre 29 y 31, porque está cerca de 30']],
    [4, 'Carlos dice: “√(9 + 16) = 3 + 4 = 7”. ¿Es correcto?', 'No: √(9 + 16) = √25 = 5; la raíz no se reparte en una suma', ['Sí, la raíz se aplica a cada término', 'No: da 25', 'Sí, porque 3² + 4² = 7²']],
    [5, 'Si el lado de un cuadrado se duplica, ¿qué pasa con su área?', 'Se multiplica por 4, porque (2L)² = 4L²', ['Se duplica también', 'Se multiplica por 8', 'Aumenta en 2 unidades']]] };
RAZ.propdirecta = { origen: `<p>Dos cantidades son directamente proporcionales cuando “por cada uno” siempre se obtiene lo mismo. Si 3 kg de tortilla cuestan $66, cada kilo cuesta 66 ÷ 3 = $22: esa es la <b>constante de proporcionalidad</b> (valor unitario), con unidades de pesos por kilo.</p>
<p>Por eso el costo de cualquier cantidad es: costo = (pesos por kg) × (kg). Fíjate que es análisis dimensional: ${frS('$22', '1 kg')} × 5 kg = $110 (kg se cancela). Si una cantidad se duplica, la otra también, porque cada unidad aporta lo mismo.</p>`,
  qs: [
    [2, 'Si 4 cuadernos cuestan $96, ¿qué significa calcular 96 ÷ 4 = 24?', 'Que cada cuaderno cuesta $24: es el valor por unidad', ['Que se necesitan 24 cuadernos', 'Que el descuento es de $24', 'Que 4 cuadernos cuestan $24']],
    [3, '¿Por qué en la proporcionalidad directa la gráfica pasa por el origen (0, 0)?', 'Porque si no compras nada, no pagas nada: 0 × valor unitario = 0', ['Porque todas las gráficas empiezan en cero', 'Porque así se dibuja más fácil', 'Porque el valor unitario es cero']],
    [4, 'Un taxi cobra $15 de banderazo más $8 por km. ¿Es proporcional el costo a los km?', 'No: con 0 km ya se pagan $15, así que el doble de km no cuesta el doble', ['Sí, porque a más km se paga más', 'Sí, porque el precio por km es constante', 'No, porque $8 no es un número entero']],
    [5, 'Si y = 3x, ¿qué pasa con y cuando x se multiplica por 5?', 'También se multiplica por 5', ['Aumenta 5 unidades', 'Se multiplica por 15', 'Se divide entre 5']]] };
RAZ.propinversa = { origen: `<p>En la proporcionalidad inversa lo que se conserva es el <b>total</b>. Si una barda necesita 60 “días-trabajador” (por ejemplo, 6 personas durante 10 días), ese trabajo total no cambia: con 12 personas se reparte entre más y tardan 60 ÷ 12 = 5 días.</p>
<p>Por eso x · y = constante: la constante es la cantidad total (trabajo, distancia, comida) que se reparte. Si una cantidad se duplica, la otra se reduce a la mitad para que el producto siga igual.</p>`,
  qs: [
    [2, 'En “6 pintores tardan 10 días”, ¿qué representa 6 × 10 = 60?', 'El trabajo total: 60 días-pintor que no cambian', ['Los días que tardaría un pintor más', 'El número de pintores necesarios', 'El costo de la obra']],
    [3, '¿Por qué si se duplican los trabajadores el tiempo se reduce a la mitad?', 'Porque el mismo trabajo total se reparte entre el doble de personas', ['Porque trabajan el doble de horas al día', 'Porque así lo dice la regla de proporcionalidad', 'Porque el trabajo total también se reduce a la mitad']],
    [4, 'Un alumno resolvió: “Si 4 llaves llenan un tinaco en 6 h, 8 llaves lo llenan en 12 h”. ¿Qué error cometió?', 'Lo trató como directo; con más llaves tarda menos: 3 h', ['Ninguno, la respuesta 12 h es correcta', 'Debió sumar: 4 + 6 = 10 h', 'Debió dar 8 h, igual al número de llaves']],
    [5, '¿Cuál de estas situaciones es de proporcionalidad inversa?', 'Velocidad y tiempo para recorrer una misma distancia', ['Kilos comprados y precio total pagado', 'Edad de una persona y su estatura', 'Horas trabajadas y salario por hora fijo']]] };
RAZ.reparto = { origen: `<p>Repartir proporcionalmente es justo porque cada “unidad aportada” recibe lo mismo. Si entre todos aportaron $500 y ganaron $2 000, cada peso aportado produjo 2 000 ÷ 500 = $4. Quien aportó $200 recibe 200 × 4 = $800.</p>
<p>En el reparto inverso, quien tiene <b>más</b> del criterio (faltas, errores) debe recibir <b>menos</b>. Por eso se usan los recíprocos: 1/2 es menor que 1/1, así que quien tiene 2 faltas recibe menos que quien tiene 1.</p>`,
  qs: [
    [2, 'Ana aportó el doble que Luis. En un reparto directo, ¿cuánto recibe Ana?', 'El doble que Luis', ['Lo mismo que Luis', 'La mitad que Luis', 'El total menos lo de Luis']],
    [3, '¿Por qué al final conviene sumar todas las partes repartidas?', 'Para comprobar que se repartió exactamente el total, ni más ni menos', ['Para calcular el promedio de cada persona', 'Porque así se obtiene la constante', 'No es necesario, solo es una costumbre']],
    [4, 'Se reparten $900 inversamente a las faltas: Sara 1, Toño 2. Un alumno dio $300 a Sara y $600 a Toño. ¿Qué pasó?', 'Hizo un reparto directo; en el inverso quien falta más recibe menos', ['Está correcto, Toño tiene más faltas', 'Debió repartir $450 a cada uno', 'Debió dar $900 a Sara']],
    [5, '¿Por qué en el reparto inverso se usan los recíprocos (1/a)?', 'Porque al crecer a, su recíproco disminuye, y así recibe menos', ['Porque es más fácil sumar fracciones', 'Porque los recíprocos siempre suman 1', 'Porque así el total queda multiplicado']]] };
RAZ.finanzas = { origen: `<p>“Por ciento” significa “de cada 100”. 15% es 15 de cada 100, es decir 15/100 = 0.15. Por eso el 15% de $400 es 0.15 × 400 = $60.</p>
<p>Un descuento del 20% deja pagar el <b>80%</b> del precio (100% − 20%): precio final = 0.80 × precio. Un aumento del 16% (IVA) hace pagar el 116%: 1.16 × precio. Con esto se entiende por qué un 20% de descuento seguido de un 20% de aumento <b>no</b> regresa al precio original: 0.8 × 1.2 = 0.96.</p>`,
  qs: [
    [2, '¿Por qué el 25% de una cantidad es lo mismo que su cuarta parte?', 'Porque 25 de cada 100 es 25/100 = 1/4', ['Porque 25 es la cuarta parte de 100 pesos', 'Porque se divide entre 25', 'Porque el porcentaje siempre es un cuarto']],
    [3, 'Con un 30% de descuento, ¿qué fracción del precio pagas?', 'El 70%, porque te quitan 30 de cada 100', ['El 30%, que es el descuento', 'El 130%, porque se agrega', 'El 3%, porque es 30 ÷ 10']],
    [4, 'Una prenda de $500 sube 10% y luego baja 10%. ¿Vuelve a costar $500?', 'No: 500 × 1.1 × 0.9 = $495, porque el 10% se calcula sobre cantidades distintas', ['Sí, porque sube y baja lo mismo', 'No, cuesta $510', 'Sí, el porcentaje se cancela']],
    [5, 'Sin calcular, el 18% de 250 es cercano a:', '45, porque el 20% de 250 es 50 y 18% es un poco menos', ['18, porque es el porcentaje', '232, porque se resta', '4.5, porque se divide entre 100']]] };
RAZ.sucesiones = { origen: `<p>En 3, 7, 11, 15… cada término se obtiene sumando 4. Para llegar al término n desde el primero se dan <b>n − 1 saltos</b> de 4: término = 3 + 4(n − 1) = 4n − 1.</p>
<p>Por eso la regla tiene la forma d·n + b: d es el salto (la diferencia) y b ajusta para que el primer término salga bien. Comprueba: n = 1 → 4(1) − 1 = 3 ✔.</p>`,
  qs: [
    [2, 'En la regla 5n + 2, ¿qué significa el 5?', 'Que cada término es 5 más que el anterior', ['Que el primer término es 5', 'Que la sucesión tiene 5 términos', 'Que se multiplica el término anterior por 5']],
    [3, '¿Por qué para llegar al término 10 se suman 9 veces la diferencia y no 10?', 'Porque del término 1 al 10 hay 9 saltos', ['Porque el último salto no cuenta nunca', 'Porque la diferencia se resta una vez', 'Porque 10 − 1 = 9 es la regla de todas las sucesiones']],
    [4, 'Para 2, 5, 8, 11…, Luis propone la regla 3n + 2. ¿Es correcta?', 'No: con n = 1 da 5 y debe dar 2; la regla es 3n − 1', ['Sí, porque la diferencia es 3 y empieza en 2', 'No: la regla es 2n + 3', 'Sí, porque 3 × 1 + 2 = 2']],
    [5, '¿El número 100 pertenece a la sucesión 4n − 1?', 'No: 4n = 101 no da un n entero', ['Sí: es el término 25', 'Sí: es el término 100', 'No: porque 100 es par']]] };
RAZ.expresiones = { origen: `<p>Una letra representa un número que puede cambiar. 3x + 2x = 5x porque “3 veces un número más 2 veces ese número” son 5 veces ese número, sea cual sea.</p>
<p>La propiedad distributiva se ve con áreas: un rectángulo de 3 de alto y (x + 4) de largo se puede partir en dos rectángulos, uno de 3 × x y otro de 3 × 4. Por eso 3(x + 4) = 3x + 12. Dos expresiones son <b>equivalentes</b> si dan lo mismo para cualquier valor de la letra.</p>`,
  qs: [
    [2, '¿Por qué 4a + 3a = 7a pero 4a + 3b no se puede reducir?', 'Porque a y b pueden ser números distintos; solo se juntan cantidades de lo mismo', ['Porque las letras distintas se multiplican', 'Porque 4 + 3 = 7 solo con la letra a', 'Sí se puede: da 7ab']],
    [3, '¿Cómo comprobar que 2(x + 5) y 2x + 10 son equivalentes?', 'Sustituyendo varios valores de x y viendo que siempre dan lo mismo', ['Viendo que tienen los mismos números', 'Sustituyendo solo x = 0', 'Contando cuántas letras tienen']],
    [4, 'Ana escribió 3(x + 2) = 3x + 2. ¿Qué error cometió?', 'Solo multiplicó el primer término; el 3 multiplica también al 2: 3x + 6', ['Ninguno, está correcto', 'Debía sumar: 3 + x + 2', 'Debía dar 5x']],
    [5, 'Un rectángulo mide x de ancho y x + 3 de largo. ¿Qué expresión es su perímetro?', '4x + 6', ['2x + 3', 'x² + 3x', '4x + 3']]] };
RAZ.ecuaciones = { origen: `<p>Una ecuación es una <b>balanza en equilibrio</b>: lo de la izquierda pesa lo mismo que lo de la derecha. Si quitas 5 de un platillo, tienes que quitar 5 del otro para que siga equilibrada. Por eso toda operación se hace en ambos lados.</p>
<p>Para “quitar” algo se usa su operación contraria porque deshace lo que se hizo: si a x se le sumó 7, restar 7 lo deshace (x + 7 − 7 = x). Si x se multiplicó por 3, dividir entre 3 lo deshace (3x ÷ 3 = x). Resolver es ir deshaciendo, en orden inverso, lo que se le hizo a la x.</p>`,
  qs: [
    [2, 'En 2x + 5 = 17, ¿por qué se resta 5 en ambos lados y no solo en uno?', 'Porque si solo se quita de un lado la igualdad deja de ser cierta', ['Porque así se ve más ordenado', 'Porque el 5 está a la izquierda', 'No es necesario, basta en un lado']],
    [3, 'En 4x = 28, ¿por qué se divide entre 4?', 'Porque x está multiplicada por 4 y dividir entre 4 deshace esa multiplicación', ['Porque 28 es múltiplo de 4', 'Porque siempre se divide al final', 'Porque hay que quitar el número más grande']],
    [4, 'Rosa resolvió 3x − 4 = 11 así: 3x = 11 − 4 = 7. ¿Qué error cometió?', 'Para quitar −4 debía sumar 4 en ambos lados: 3x = 15', ['Ninguno, 3x = 7 es correcto', 'Debía dividir 11 entre 3 primero', 'Debía multiplicar ambos lados por 4']],
    [5, 'Obtuviste x = 3 en 5x − 2 = 2x + 7. ¿Cómo sabes, sin la app, que está bien?', 'Sustituyo: 5(3) − 2 = 13 y 2(3) + 7 = 13; los dos lados son iguales', ['Porque 3 es un número entero', 'Porque es el único número posible', 'Porque 5 − 2 = 3']]] };
RAZ.sistemas = { origen: `<p>Cada ecuación con dos incógnitas tiene <b>muchas</b> soluciones (todos los puntos de una recta). Por ejemplo, x + y = 10 se cumple con (1, 9), (2, 8), (7, 3)… Una segunda ecuación da otra recta. La solución del sistema es el punto que cumple <b>las dos a la vez</b>: donde se cruzan.</p>
<p>Sumar o restar ecuaciones es válido porque es sumar cantidades iguales en ambos lados de una balanza: si A = B y C = D, entonces A + C = B + D. Se elige sumar o restar para que una incógnita desaparezca y quede una ecuación con una sola.</p>`,
  qs: [
    [2, '¿Por qué un sistema 2×2 necesita dos ecuaciones?', 'Porque con una sola hay infinitas parejas que la cumplen', ['Porque hay dos personas en el problema', 'Porque así se pueden dibujar dos gráficas bonitas', 'Porque una ecuación no puede tener dos letras']],
    [3, '¿Por qué es válido sumar las ecuaciones x + y = 10 y x − y = 4?', 'Porque se suman cantidades iguales en ambos lados y la igualdad se conserva', ['Porque las dos tienen x', 'Porque los resultados 10 y 4 son positivos', 'No es válido, solo se puede restar']],
    [4, 'Un alumno encontró x = 7 en un sistema y escribió la respuesta “7”. ¿Qué le falta?', 'Calcular y y comprobar la pareja en las dos ecuaciones', ['Nada, con x es suficiente', 'Dividir 7 entre 2', 'Graficar solo la primera ecuación']],
    [5, 'Si dos rectas de un sistema son paralelas, ¿qué significa?', 'Que no hay ningún punto común: el sistema no tiene solución', ['Que tienen infinitas soluciones', 'Que la solución es (0, 0)', 'Que hay exactamente dos soluciones']]] };
RAZ.funciones = { origen: `<p>En y = mx + b, la <b>pendiente m</b> dice cuánto cambia y por cada unidad que avanza x. Si un taxi cobra $6 por km, cada km extra suma $6: m = 6. La <b>ordenada b</b> es el valor cuando x = 0: el banderazo, lo que pagas sin avanzar.</p>
<p>Por eso la pendiente se calcula como (cambio en y) ÷ (cambio en x): “cuánto sube por cada paso”. Si sube 6 en 3 pasos, sube 2 por paso. Las unidades lo confirman: pesos ÷ km = pesos por km.</p>`,
  qs: [
    [2, 'En el costo de un taxi y = 6x + 13, ¿qué significa el 13?', 'Lo que se paga aunque no se avance: el banderazo', ['El costo de cada kilómetro', 'Los kilómetros recorridos', 'El total de un viaje de 6 km']],
    [3, '¿Por qué la pendiente es (y₂ − y₁) ÷ (x₂ − x₁)?', 'Porque mide cuánto cambia y por cada unidad que cambia x', ['Porque así se obtiene la ordenada al origen', 'Porque se promedian los puntos', 'Porque es la distancia entre los puntos']],
    [4, 'Una recta pasa por (0, 4) y (2, 0). Un alumno dice que m = 2. ¿Es correcto?', 'No: y bajó 4 mientras x avanzó 2, así que m = −2', ['Sí, porque avanzó 2 en x', 'No: m = 4', 'Sí, porque 4 ÷ 2 = 2']],
    [5, 'Si m = 0, ¿cómo es la recta y qué significa?', 'Horizontal: y no cambia aunque x cambie', ['Vertical: x no cambia', 'Pasa por el origen siempre', 'No existe la recta']]] };
RAZ.paralelas = { origen: `<p>Cuando una secante cruza dos paralelas, las dos intersecciones son “copias” una de la otra: si deslizas la primera paralela a lo largo de la secante hasta encimarla con la segunda, los ángulos coinciden. Por eso los <b>correspondientes</b> son iguales.</p>
<p>Los <b>opuestos por el vértice</b> son iguales porque cada uno, sumado con el mismo ángulo vecino, da 180° (línea recta). Combinando las dos ideas se obtiene que los <b>alternos internos</b> también son iguales: no hay que memorizar una lista, se deduce.</p>`,
  qs: [
    [2, '¿Por qué dos ángulos adyacentes sobre una recta suman 180°?', 'Porque juntos forman la línea recta, que es medio giro', ['Porque siempre son iguales a 90°', 'Porque así lo indica el transportador', 'Porque son ángulos correspondientes']],
    [3, '¿Por qué los ángulos opuestos por el vértice son iguales?', 'Porque cada uno completa 180° con el mismo ángulo vecino', ['Porque están en lados distintos', 'Porque están sobre rectas paralelas', 'Porque miden 90° siempre']],
    [4, 'Si las dos rectas NO son paralelas, ¿siguen siendo iguales los ángulos correspondientes?', 'No: la igualdad depende de que las rectas sean paralelas', ['Sí, siempre son iguales', 'Sí, porque están en la misma posición', 'Solo si la secante es vertical']],
    [5, 'Un ángulo mide 65° y su alterno interno, entre paralelas, mide:', '65°, porque los alternos internos son iguales', ['115°, porque suman 180°', '25°, porque suman 90°', '130°, porque es el doble']]] };
RAZ.poligonos = { origen: `<p>Desde un vértice de un polígono de n lados se pueden trazar diagonales que lo dividen en <b>n − 2 triángulos</b> (un pentágono, en 3). Cada triángulo suma 180°, así que los ángulos interiores suman 180° × (n − 2).</p>
<p>Los exteriores suman 360° porque, si caminas alrededor del polígono girando en cada esquina, al regresar al inicio diste exactamente una vuelta completa.</p>`,
  qs: [
    [2, '¿Por qué los ángulos interiores de un cuadrilátero suman 360°?', 'Porque una diagonal lo divide en 2 triángulos de 180°', ['Porque tiene 4 ángulos de 90° siempre', 'Porque 4 × 100 = 400 y se ajusta', 'Porque es una vuelta completa']],
    [3, '¿En cuántos triángulos queda dividido un hexágono con diagonales desde un vértice?', '4, porque son n − 2 = 6 − 2', ['6, uno por lado', '3, la mitad de los lados', '5, porque n − 1']],
    [4, '¿Por qué los exteriores de cualquier polígono convexo suman 360°?', 'Porque al recorrer el polígono se gira una vuelta completa', ['Porque cada exterior mide 90°', 'Porque son el doble de los interiores', 'Solo es cierto en el cuadrado']],
    [5, '¿Puede existir un polígono regular con ángulos exteriores de 50°?', 'No: 360 ÷ 50 = 7.2 no es un número entero de lados', ['Sí, tiene 7 lados', 'Sí, tiene 50 lados', 'No, porque 50 es par']]] };
RAZ.congruencia = { origen: `<p>Dos triángulos son congruentes si uno se puede encimar exactamente sobre el otro. No hace falta comparar las 6 medidas: con 3 lados (LLL) el triángulo ya queda “rígido”, solo se puede armar de una forma. Por eso los techos y puentes usan triángulos.</p>
<p>Con dos lados y el ángulo entre ellos (LAL), o dos ángulos y el lado entre ellos (ALA), también queda determinado. En cambio, con tres ángulos (AAA) solo se fija la forma, no el tamaño: hay triángulos grandes y chicos con los mismos ángulos.</p>`,
  qs: [
    [2, '¿Por qué los puentes y torres usan triángulos?', 'Porque con tres lados fijos el triángulo no se puede deformar', ['Porque son más bonitos', 'Porque usan menos material que cualquier figura', 'Porque sus ángulos son de 90°']],
    [3, '¿Por qué AAA no basta para asegurar congruencia?', 'Porque fija la forma pero no el tamaño', ['Porque los ángulos no se pueden medir con exactitud', 'Sí basta, es un criterio válido', 'Porque faltan los vértices']],
    [4, '¿Se puede construir un triángulo con lados 3, 4 y 9 cm?', 'No: 3 + 4 = 7 es menor que 9, los lados cortos no alcanzan a cerrarlo', ['Sí, cualquier tres medidas sirven', 'Sí, sería un triángulo rectángulo', 'No, porque 9 es impar']],
    [5, 'Dos triángulos tienen dos lados iguales pero distinto ángulo entre ellos. ¿Son congruentes?', 'No: el ángulo entre los lados cambia la forma del triángulo', ['Sí, por el criterio LAL', 'Sí, porque dos lados bastan', 'Solo si son rectángulos']]] };
RAZ.areas = { origen: `<p><b>Triángulo:</b> dos triángulos iguales forman un paralelogramo de base b y altura h; por eso el triángulo es la mitad: b × h ÷ 2.</p>
<p><b>Polígono regular:</b> se divide en n triángulos iguales desde el centro. Cada uno tiene base = lado y altura = apotema. El área es n × (lado × apotema ÷ 2) = perímetro × apotema ÷ 2.</p>
<p><b>Círculo:</b> si lo cortas en muchas rebanadas y las acomodas alternando, se forma casi un rectángulo de altura r y base igual a la mitad de la circunferencia (π r). Área = π r × r = π r². π es cuántas veces cabe el diámetro en la circunferencia (≈ 3.14).</p>`,
  qs: [
    [2, '¿Por qué el área del triángulo lleva “÷ 2”?', 'Porque dos triángulos iguales forman un paralelogramo de la misma base y altura', ['Porque tiene dos lados iguales', 'Porque así se corrige el error de medición', 'Porque el triángulo tiene 3 lados y no 4']],
    [3, '¿Qué significa π ≈ 3.14?', 'Que la circunferencia mide unas 3.14 veces el diámetro', ['Que el área mide 3.14 cm²', 'Que el radio es 3.14 veces el diámetro', 'Que un círculo tiene 3.14 lados']],
    [4, 'Si el radio de un círculo se duplica, ¿qué pasa con su área?', 'Se multiplica por 4, porque el radio está al cuadrado', ['Se duplica', 'Se multiplica por 3.14', 'Aumenta 2 cm²']],
    [5, '¿Por qué el área se mide en cm² y el perímetro en cm?', 'El área cuenta cuadritos de 1 cm × 1 cm; el perímetro mide una longitud', ['Porque el área es el doble del perímetro', 'Por costumbre, podrían ser iguales', 'Porque el área siempre es mayor']]] };
RAZ.volumen = { origen: `<p>Un prisma se puede llenar por <b>capas</b>. La primera capa tiene tantos cubitos como el área de la base; si la altura es h, caben h capas iguales. Por eso V = (área de la base) × altura. Esto vale para cualquier prisma y también para el cilindro, cuya base es un círculo: V = π r² h.</p>
<p>Las unidades lo confirman: cm² × cm = cm³ (cubitos de 1 cm por lado). Y como 1 L es un cubo de 10 cm de lado, 1 L = 1 000 cm³.</p>`,
  qs: [
    [2, '¿Por qué el volumen de un prisma es área de la base × altura?', 'Porque se apilan tantas capas iguales a la base como indica la altura', ['Porque se suman todas las caras', 'Porque se multiplica el perímetro por 3', 'Porque así lo indica la fórmula del cubo']],
    [3, '¿Por qué 1 L equivale a 1 000 cm³?', 'Porque 1 L es un cubo de 10 cm de lado: 10 × 10 × 10', ['Porque 1 L pesa 1 000 g siempre', 'Porque el litro tiene 1 000 lados', 'Porque 100 × 10 = 1 000']],
    [4, 'Si duplicas la altura de un cilindro y dejas igual el radio, ¿qué pasa con el volumen?', 'Se duplica, porque caben el doble de capas', ['Se cuadruplica', 'No cambia', 'Se multiplica por π']],
    [5, 'Si duplicas el radio de un cilindro y dejas la altura igual, el volumen:', 'Se multiplica por 4, porque el área de la base depende de r²', ['Se duplica', 'Se multiplica por 8', 'Aumenta 2 cm³']]] };
RAZ.conversiones = { origen: `<p>Un factor de conversión vale 1 porque arriba y abajo está la misma cantidad: ${frS('1 000 m', '1 km')} es “un kilómetro entre un kilómetro”. Multiplicar por 1 no cambia una cantidad, solo la forma de escribirla.</p>
<p>Las unidades se cancelan igual que los números: ${frS('5', '5')} = 1 y ${frS('km', 'km')} = 1. Por eso, si el factor está bien acomodado, la unidad que no queremos desaparece sola, y si está al revés, la unidad no se cancela y nos damos cuenta del error. Es una autocomprobación integrada.</p>
<p>Antes de calcular conviene <b>predecir</b>: de km a m el número debe crecer (los metros son más pequeños, se necesitan más); de g a kg debe achicarse.</p>`,
  qs: [
    [2, '¿Por qué multiplicar por (1 000 m / 1 km) no cambia la cantidad?', 'Porque 1 000 m y 1 km son lo mismo, así que la fracción vale 1', ['Porque 1 000 entre 1 es 1 000', 'Sí la cambia: la hace 1 000 veces mayor', 'Porque las unidades no importan']],
    [3, 'Al convertir 3 km a m, ¿el número debe crecer o disminuir y por qué?', 'Crecer: el metro es más pequeño, así que se necesitan más metros', ['Disminuir: el metro es más pequeño', 'Quedar igual: es la misma distancia', 'Crecer: porque se divide']],
    [4, 'Un alumno escribió 5 kg × (1 kg / 1 000 g). ¿Cómo sabe que está mal?', 'Porque kg no se cancela: quedan kg² arriba y g abajo', ['Porque el resultado es muy pequeño', 'Porque 1 000 no es divisible entre 5', 'Está bien acomodado']],
    [5, '¿Por qué 1 m² = 10 000 cm² y no 100 cm²?', 'Porque un cuadrado de 1 m × 1 m mide 100 cm × 100 cm', ['Porque el cuadrado tiene 4 lados de 100', 'Porque 100 + 100 = 10 000', 'Porque se elevan los cm al cubo']]] };
RAZ.tendencia = { origen: `<p>La <b>media</b> es el valor que tendría cada dato si todos se repartieran parejo: si 3 amigos tienen $10, $20 y $60, juntos tienen $90 y repartido en partes iguales tocan $30 a cada uno. Por eso se suma y se divide entre el número de datos.</p>
<p>La <b>mediana</b> es el dato de en medio al ordenarlos: no le afectan los valores extremos. En el ejemplo, la mediana es $20: describe mejor a “la mayoría” que la media, que subió por el dato de $60. El <b>rango</b> mide qué tan dispersos están: mayor − menor.</p>`,
  qs: [
    [2, '¿Qué significa que la media de calificaciones de un grupo sea 8?', 'Que si se repartieran los puntos por igual, cada alumno tendría 8', ['Que todos sacaron 8', 'Que la mitad sacó más de 8 siempre', 'Que 8 fue la calificación más repetida']],
    [3, 'En los sueldos 8, 9, 9, 10 y 60 (miles), ¿qué describe mejor el sueldo típico?', 'La mediana (9), porque el 60 jala la media hacia arriba', ['La media (19.2), porque usa todos los datos', 'El rango (52), porque es el más grande', 'La moda no existe en estos datos']],
    [4, 'Dos grupos tienen media 8, pero uno tiene rango 1 y otro rango 6. ¿Qué indica?', 'Que en el primero las calificaciones son parecidas y en el segundo muy dispersas', ['Que el primero tiene mejor promedio', 'Que los dos grupos son idénticos', 'Que el segundo tiene más alumnos']],
    [5, 'Si a todos los datos se les suma 2, ¿qué pasa con la media y el rango?', 'La media aumenta 2 y el rango no cambia', ['Los dos aumentan 2', 'Ninguno cambia', 'La media se duplica y el rango aumenta 2']]] };
RAZ.graficas = { origen: `<p>Un histograma agrupa datos en <b>intervalos</b> porque con muchos datos distintos (estaturas, tiempos) cada valor exacto aparece pocas veces y no se ve el patrón. Al agrupar, se aprecia dónde se concentran.</p>
<p>Las barras van <b>juntas</b> porque los intervalos son continuos (donde termina uno empieza el otro). El polígono de frecuencias une los puntos medios de las barras para mostrar la forma de la distribución y comparar dos grupos en una misma gráfica.</p>`,
  qs: [
    [2, '¿Por qué en un histograma las barras van pegadas?', 'Porque los intervalos son continuos: donde termina uno empieza el otro', ['Para ahorrar espacio en la gráfica', 'Porque así se ven más bonitas', 'Porque todas tienen la misma altura']],
    [3, '¿Para qué agrupar 100 estaturas en intervalos?', 'Para ver dónde se concentran los datos, que con valores sueltos no se aprecia', ['Para que haya menos alumnos', 'Para que todos los datos sean iguales', 'Porque no se pueden graficar estaturas']],
    [4, 'En una tabla, la suma de las frecuencias da 28 pero se encuestó a 30 personas. ¿Qué indica?', 'Que faltó registrar 2 datos o hay un error de conteo', ['Que todo está bien, siempre hay diferencia', 'Que 2 personas mintieron', 'Que la frecuencia relativa es 28']],
    [5, '¿Por qué el polígono de frecuencias usa el punto medio de cada intervalo?', 'Porque representa a todos los datos del intervalo con un solo valor', ['Porque es el valor más grande', 'Porque es donde hay más datos siempre', 'Porque el inicio del intervalo no se puede graficar']]] };
RAZ.probabilidad = { origen: `<p>Si todos los resultados son igual de posibles, la probabilidad es la parte de ellos que nos conviene: casos favorables ÷ casos posibles. En un dado hay 6 caras igual de posibles; 3 son pares, así que P(par) = 3/6 = ½.</p>
<p>La probabilidad <b>frecuencial</b> se obtiene experimentando: al tirar una moneda muchas veces, la fracción de soles se acerca a ½. Con pocas tiradas puede alejarse mucho; con muchas se estabiliza (ley de los grandes números).</p>`,
  qs: [
    [2, '¿Por qué la probabilidad siempre está entre 0 y 1?', 'Porque los casos favorables nunca son más que los posibles', ['Porque así se acordó para facilitar cálculos', 'Porque los dados tienen 6 caras', 'No es cierto, puede ser mayor que 1']],
    [3, 'Salió sol 5 veces seguidas. ¿Es más probable águila en el siguiente volado?', 'No: la moneda no recuerda; sigue siendo ½', ['Sí, porque ya “le toca” águila', 'No: es más probable sol otra vez', 'Sí, la probabilidad sube a 5/6']],
    [4, 'Tiraste un dado 12 veces y el 6 salió 4 veces. ¿El dado está cargado?', 'No se puede asegurar: con pocas tiradas es normal que se aleje de 1/6', ['Sí, debería salir exactamente 2 veces', 'Sí, porque 4 es mayor que 2', 'No, porque 4/12 = 1/6']],
    [5, '¿Por qué P(no sacar 6) = 1 − P(sacar 6)?', 'Porque sacar 6 y no sacarlo cubren todos los casos y suman 1', ['Porque se resta la probabilidad del dado', 'Porque 6 − 1 = 5', 'Porque es el complemento de 6']]] };

/* ===== Comprensión y razonamiento: FÍSICA ===== */
RAZ.medicion = { origen: `<p>Medir es <b>comparar</b> contra una unidad acordada: decir que una mesa mide 1.2 m significa que cabe 1.2 veces la longitud de un metro. Si cada quien usara su propia unidad (cuartas, pasos), los resultados no se podrían comparar; por eso existe el Sistema Internacional.</p>
<p>Ninguna medición es perfecta: el instrumento tiene una división mínima y el observador se equivoca un poco. Al promediar varias medidas, los errores hacia arriba y hacia abajo tienden a compensarse; por eso el promedio es el valor más confiable.</p>`,
  qs: [
    [2, '¿Por qué se necesita un sistema de unidades común?', 'Para que cualquier persona en cualquier lugar compare sus medidas con las de otros', ['Porque las medidas en cuartas no existen', 'Porque así lo exige cada escuela', 'Para que los números sean más grandes']],
    [3, '¿Por qué conviene medir varias veces y promediar?', 'Porque los errores hacia arriba y hacia abajo tienden a compensarse', ['Porque la primera medida siempre está mal', 'Porque así se obtiene un número entero', 'No conviene: basta una medida cuidadosa']],
    [4, 'Un alumno escribe “la masa es 3”. ¿Qué le falta y por qué importa?', 'La unidad: 3 g y 3 kg son cantidades muy distintas', ['Nada, el número es suficiente', 'El signo positivo', 'Decimales: debe ser 3.0']],
    [5, 'Con una regla graduada en milímetros, ¿tiene sentido reportar 12.347 cm?', 'No: la regla solo distingue décimas de cm (mm), así que 12.3 cm', ['Sí, más decimales es más exacto', 'Sí, si se mide con cuidado', 'No: hay que reportar 12 cm siempre']]] };
RAZ.densidad = { origen: `<p>Si cortas un bloque de aluminio a la mitad, cada mitad tiene la mitad de masa y la mitad de volumen. Lo que <b>no cambia</b> es cuántos gramos hay en cada cm³: esa es la densidad, una propiedad del material, no del objeto.</p>
<p>Por eso se calcula dividiendo: ρ = m ÷ V responde “¿cuántos gramos le tocan a cada cm³?”. Las unidades lo dicen: g/cm³ se lee “gramos por cada centímetro cúbico”. Saber eso permite deducir las otras formas sin memorizarlas: si cada cm³ tiene 2.7 g, 10 cm³ tienen 27 g (m = ρ·V).</p>`,
  qs: [
    [2, 'Si partes una barra de hierro a la mitad, ¿qué pasa con su densidad?', 'No cambia: cada mitad tiene la mitad de masa y la mitad de volumen', ['Se reduce a la mitad', 'Se duplica', 'Depende del tamaño del corte']],
    [3, '¿Qué significa que el aluminio tenga 2.7 g/cm³?', 'Que cada centímetro cúbico de aluminio tiene 2.7 gramos', ['Que un bloque de aluminio pesa 2.7 g', 'Que ocupa 2.7 cm³ siempre', 'Que es 2.7 veces más grande que el agua']],
    [4, '¿Por qué un barco de acero flota si el acero es más denso que el agua?', 'Porque con el aire de su interior, su densidad promedio es menor que la del agua', ['Porque el acero de los barcos es especial y ligero', 'Porque el agua de mar empuja más que la dulce siempre', 'Porque los objetos grandes siempre flotan']],
    [5, 'Un alumno calculó que una piedra tiene densidad 0.3 g/cm³ y se hunde en agua. ¿Qué concluyes?', 'Hay un error: si se hunde su densidad debe ser mayor que 1 g/cm³', ['Que es una piedra muy ligera', 'Que el agua estaba muy fría', 'Nada, es un resultado posible']]] };
RAZ.particulas = { origen: `<p>Muchas cosas que vemos se explican si imaginamos que la materia está hecha de partículas diminutas en movimiento constante. El modelo no se “ve”; se acepta porque <b>explica y predice</b>: el olor de un perfume llega hasta ti porque sus partículas se mueven y se dispersan; un gas se comprime porque entre sus partículas hay mucho espacio vacío.</p>
<p>La temperatura es la medida de qué tan rápido se mueven (en promedio) las partículas. Al calentar, se mueven más, se separan más y por eso los materiales se dilatan o cambian de estado.</p>`,
  qs: [
    [2, '¿Por qué un gas se puede comprimir y un sólido casi no?', 'Porque entre las partículas del gas hay mucho espacio vacío', ['Porque las partículas del gas son más pequeñas', 'Porque el gas no tiene masa', 'Porque el sólido está más caliente']],
    [3, '¿Por qué una gota de colorante se dispersa sola en el agua?', 'Porque las partículas del agua y del colorante se mueven todo el tiempo y se mezclan', ['Porque el colorante es más pesado', 'Porque el agua lo empuja hacia abajo', 'Porque el colorante se evapora']],
    [4, 'Un alumno dice que el hielo, al derretirse, “se convierte en otra sustancia”. ¿Es correcto?', 'No: es la misma sustancia (agua); solo cambia cómo se ordenan y mueven sus partículas', ['Sí, el agua líquida es otra sustancia', 'Sí, porque cambia de color', 'No, porque el hielo no tiene partículas']],
    [5, '¿Por qué los rieles de tren tienen pequeñas separaciones entre tramos?', 'Porque con el calor sus partículas se agitan más y el metal se dilata', ['Para que el tren haga ruido', 'Para ahorrar metal', 'Porque el metal se encoge con el calor']]] };
RAZ.presion = { origen: `<p>La presión dice <b>cuánta fuerza le toca a cada metro cuadrado</b>. Una misma fuerza repartida en un área grande toca a poco por m²; concentrada en un área pequeña toca a mucho. Por eso P = F ÷ A, y su unidad es N/m² (pascal).</p>
<p>Así se entiende que un cuchillo afilado corte (área diminuta, presión enorme) y que las raquetas de nieve eviten hundirse (área grande, presión pequeña), sin cambiar la fuerza (el peso).</p>
<p>En un líquido, cada capa carga el peso de todo el líquido que tiene encima; por eso la presión aumenta con la profundidad: P = ρ · g · h.</p>`,
  qs: [
    [2, '¿Por qué un cuchillo afilado corta mejor que uno sin filo?', 'Porque la misma fuerza actúa sobre un área menor y la presión es mayor', ['Porque el filo pesa más', 'Porque el filo tiene más fuerza propia', 'Porque el cuchillo sin filo es más grande']],
    [3, '¿Qué significa una presión de 500 Pa?', 'Que a cada metro cuadrado le toca una fuerza de 500 N', ['Que la fuerza total es 500 N', 'Que el área es de 500 m²', 'Que pesa 500 kg']],
    [4, '¿Por qué las presas son más gruesas en la parte de abajo?', 'Porque la presión del agua aumenta con la profundidad', ['Porque abajo el agua está más fría', 'Para que se vean más estables', 'Porque abajo hay más peces']],
    [5, 'Si la misma persona se para en un pie en vez de dos, la presión sobre el piso:', 'Se duplica, porque el peso igual se reparte en la mitad del área', ['Se reduce a la mitad', 'No cambia, el peso es el mismo', 'Se cuadruplica']]] };
RAZ.fluidos = { origen: `<p><b>Pascal:</b> un líquido encerrado transmite la presión por igual a todas partes. Si en el émbolo chico la presión es F₁/A₁, en el grande es la misma: F₁/A₁ = F₂/A₂. Como el émbolo grande tiene más área, recibe más fuerza. No es magia: el émbolo chico debe recorrer mucha más distancia (el trabajo se conserva).</p>
<p><b>Arquímedes:</b> un objeto sumergido ocupa el lugar de cierta cantidad de agua. Esa agua, antes, estaba en equilibrio sostenida por el agua de alrededor. Esa misma fuerza de sostén actúa ahora sobre el objeto: el empuje es igual al peso del líquido desplazado.</p>`,
  qs: [
    [2, '¿Por qué un gato hidráulico permite levantar un auto con poca fuerza?', 'Porque la presión se transmite igual y el émbolo grande, con más área, recibe más fuerza', ['Porque el aceite multiplica la energía', 'Porque el auto pierde peso al subir', 'Porque la fuerza se transmite más rápido']],
    [3, '¿Qué “paga” el gato hidráulico a cambio de multiplicar la fuerza?', 'El émbolo chico debe recorrer mucha más distancia', ['Gasta más aceite cada vez', 'El auto sube más rápido', 'No paga nada, es energía gratis']],
    [4, '¿Por qué te sientes más ligero dentro de una alberca?', 'Porque el agua desplazada te empuja hacia arriba con una fuerza igual a su peso', ['Porque tu masa disminuye en el agua', 'Porque la gravedad no actúa en el agua', 'Porque el agua está fría']],
    [5, 'Un mismo objeto se sumerge en agua dulce y en agua de mar (más densa). ¿Dónde recibe más empuje?', 'En el agua de mar: el mismo volumen desplazado pesa más', ['En el agua dulce, porque es más ligera', 'Igual en ambas', 'Depende de la profundidad']]] };
RAZ.rapidez = { origen: `<p>Si un corredor recorre 100 m en 10 s, cada segundo avanza, en promedio, 100 ÷ 10 = 10 m. La rapidez responde “¿cuántos metros por cada segundo?”, por eso v = d ÷ t y la unidad es m/s (metros <b>por</b> segundo; la palabra “por” indica división).</p>
<p>A partir de ese significado se deducen las otras relaciones sin memorizarlas: si avanzo 10 m cada segundo, en 7 s avanzo 70 m (d = v · t); y para recorrer 50 m necesito 5 s (t = d ÷ v). Es el mismo análisis dimensional: ${frS('10 m', '1 s')} × 7 s = 70 m.</p>`,
  qs: [
    [2, '¿Qué significa que un auto vaya a 60 km/h?', 'Que, a ese ritmo, recorre 60 km por cada hora', ['Que recorrió 60 km en total', 'Que tarda 60 horas', 'Que va 60 veces más rápido que una persona']],
    [3, 'Si sabes que v = d ÷ t, ¿cómo obtienes la distancia sin memorizar otra fórmula?', 'Pensando que si avanzo v metros cada segundo, en t segundos avanzo v · t', ['Sumando la velocidad y el tiempo', 'Dividiendo el tiempo entre la velocidad', 'No se puede, hay que memorizar d = v · t']],
    [4, 'Un alumno obtuvo que un ciclista va a 450 m/s. ¿Qué concluyes?', 'Que hay un error: es más rápido que el sonido; probablemente no convirtió unidades', ['Que el ciclista es profesional', 'Que el resultado es correcto si el cálculo está bien', 'Que la bicicleta tiene motor']],
    [5, 'Vas 60 km a 60 km/h y regresas a 30 km/h. ¿Por qué la rapidez media no es 45 km/h?', 'Porque pasas más tiempo yendo lento (2 h) que rápido (1 h)', ['Sí es 45 km/h, es el promedio', 'Porque de regreso hay menos distancia', 'Porque la rapidez media siempre es la menor']]] };
RAZ.graficasmov = { origen: `<p>En una gráfica posición-tiempo, avanzar a la derecha es que pasa el tiempo y subir es que el objeto se aleja. Si en 2 s la línea sube 20 m, el objeto avanzó 10 m por cada segundo: la <b>inclinación</b> (pendiente) es la velocidad. Una línea horizontal significa que pasa el tiempo pero la posición no cambia: está detenido.</p>
<p>En una gráfica velocidad-tiempo, el área bajo la línea es la distancia porque cada rectangulito es velocidad × tiempo = (m/s) × s = m.</p>`,
  qs: [
    [2, 'En una gráfica posición-tiempo, una línea horizontal significa:', 'Que el objeto está detenido: pasa el tiempo y no cambia su posición', ['Que va a velocidad constante muy alta', 'Que se mueve en línea recta horizontal', 'Que está acelerando']],
    [3, '¿Por qué la pendiente de la gráfica posición-tiempo es la velocidad?', 'Porque es el cambio de posición dividido entre el cambio de tiempo', ['Porque es la posición más alta', 'Porque es el área bajo la línea', 'Porque es el tiempo total']],
    [4, '¿Por qué el área bajo una gráfica velocidad-tiempo da la distancia?', 'Porque cada franja es velocidad × tiempo, que son metros', ['Porque el área siempre representa distancia', 'Porque la velocidad es una distancia', 'Porque así se define el área']],
    [5, 'Una gráfica posición-tiempo con línea más inclinada que otra indica:', 'Mayor velocidad: más metros por cada segundo', ['Mayor distancia total siempre', 'Que va cuesta arriba', 'Menor velocidad']]] };
RAZ.aceleracion = { origen: `<p>La aceleración dice <b>cuánto cambia la velocidad cada segundo</b>. Si un auto pasa de 0 a 20 m/s en 4 s, cada segundo gana 20 ÷ 4 = 5 m/s: a = 5 m/s². La unidad se lee “(m/s) por segundo”: de ahí el s².</p>
<p>La fórmula v<sub>f</sub> = v<sub>i</sub> + a·t no es otra cosa nueva: si empiezas con v<sub>i</sub> y cada segundo ganas a, después de t segundos ganaste a·t.</p>
<p>La distancia lleva ½ porque la velocidad no es fija: empieza en v<sub>i</sub> y termina en v<sub>f</sub>, así que en promedio es la mitad del cambio. En la gráfica v-t, el área es un triángulo, y el área de un triángulo lleva ÷ 2.</p>`,
  qs: [
    [2, '¿Qué significa una aceleración de 3 m/s²?', 'Que la velocidad aumenta 3 m/s cada segundo', ['Que recorre 3 metros cada segundo', 'Que tarda 3 segundos en arrancar', 'Que va a 3 m/s todo el tiempo']],
    [3, '¿Por qué v<sub>f</sub> = v<sub>i</sub> + a·t?', 'Porque partes de v<sub>i</sub> y cada uno de los t segundos ganas a', ['Porque se suman todas las magnitudes', 'Porque la aceleración es la velocidad final', 'Porque así se define el tiempo']],
    [4, '¿Por qué la distancia en el movimiento acelerado lleva ½·a·t²?', 'Porque la velocidad cambia; el área bajo la gráfica v-t es un triángulo', ['Porque se divide el tiempo en dos', 'Porque solo se cuenta la mitad del viaje', 'Es un ajuste experimental sin explicación']],
    [5, 'Un auto frena. ¿Qué signo tiene su aceleración si avanza en sentido positivo?', 'Negativo: la velocidad disminuye cada segundo', ['Positivo: sigue avanzando', 'Cero: está frenando', 'Depende de qué tan rápido iba']]] };
RAZ.caida = { origen: `<p>Galileo mostró que, sin aire, todos los cuerpos caen con la misma aceleración: g ≈ 9.8 m/s². Cada segundo de caída la velocidad aumenta 9.8 m/s: después de 1 s va a 9.8 m/s, después de 2 s a 19.6 m/s. Por eso v = g·t.</p>
<p>La caída libre es un movimiento acelerado que parte del reposo; aplicando d = ½·a·t² con a = g se obtiene h = ½·g·t². Al lanzar algo hacia arriba, la gravedad le quita 9.8 m/s cada segundo hasta que su velocidad llega a 0 en el punto más alto.</p>`,
  qs: [
    [2, 'Sin aire, ¿qué cae primero: una bola de boliche o una canica soltadas a la vez?', 'Llegan juntas: la aceleración de caída es la misma para todos', ['La bola de boliche, por ser más pesada', 'La canica, por ser más pequeña', 'Depende del material']],
    [3, '¿Por qué después de 3 s de caída la velocidad es 3 × 9.8 m/s?', 'Porque cada segundo la gravedad aumenta la velocidad 9.8 m/s', ['Porque cae 9.8 m cada segundo', 'Porque la velocidad es constante', 'Porque se suman 3 + 9.8']],
    [4, 'En el punto más alto de un lanzamiento vertical, ¿cuánto vale la aceleración?', '9.8 m/s² hacia abajo: la gravedad sigue actuando aunque la velocidad sea 0', ['Cero, porque está detenida', 'Infinita, porque cambia de sentido', 'Depende de la masa']],
    [5, 'Si el tiempo de caída se duplica, ¿qué pasa con la altura recorrida?', 'Se multiplica por 4, porque depende de t²', ['Se duplica', 'No cambia', 'Se multiplica por 9.8']]] };
RAZ.fuerzas = { origen: `<p>Una fuerza es un empujón o un jalón; además de cuánto (magnitud) importa hacia dónde (dirección). Por eso no siempre se suman como números: dos fuerzas en el mismo sentido se suman; en sentidos contrarios se restan, porque una contrarresta a la otra.</p>
<p>Si las fuerzas se cancelan (resultante cero), el objeto está en <b>equilibrio</b>: no cambia su movimiento. Fuerzas perpendiculares forman un triángulo rectángulo, y por eso su resultante se calcula con el teorema de Pitágoras.</p>`,
  qs: [
    [2, '¿Por qué 30 N a la derecha y 20 N a la izquierda dan 10 N y no 50 N?', 'Porque actúan en sentidos contrarios y una contrarresta parte de la otra', ['Porque siempre se restan las fuerzas', 'Porque la izquierda vale menos', 'Porque 50 N es demasiado']],
    [3, '¿Qué significa que un objeto esté en equilibrio?', 'Que la suma de todas las fuerzas es cero', ['Que no actúa ninguna fuerza sobre él', 'Que está en la mitad de una mesa', 'Que pesa lo mismo que otro']],
    [4, '¿Por qué la resultante de 3 N al este y 4 N al norte es 5 N y no 7 N?', 'Porque son perpendiculares y forman un triángulo rectángulo: √(9 + 16)', ['Porque se restan: 4 − 3 = 1 y se ajusta', 'Porque 7 N es incorrecto por redondeo', 'Porque el este vale más que el norte']],
    [5, 'Un libro descansa sobre una mesa. ¿Actúan fuerzas sobre él?', 'Sí: su peso y la fuerza de la mesa hacia arriba, que se equilibran', ['No, porque está quieto', 'Solo su peso', 'Solo la fuerza de la mesa']]] };
RAZ.newton = { origen: `<p>La segunda ley dice que la aceleración es mayor cuanto mayor es la fuerza neta, y menor cuanto mayor es la masa (cuesta más acelerar un camión que una bicicleta). Juntando ambas ideas: a = F ÷ m, que es lo mismo que F = m · a.</p>
<p>Por eso la unidad de fuerza, el newton, es la fuerza que acelera 1 kg a 1 m/s²: 1 N = 1 kg·m/s². La primera ley es el caso F = 0: sin fuerza neta no hay aceleración, y el objeto sigue igual. La tercera dice que las fuerzas siempre vienen en pares: si empujas la pared, la pared te empuja.</p>`,
  qs: [
    [2, '¿Por qué cuesta más acelerar un camión que una bicicleta con la misma fuerza?', 'Porque tiene más masa, y a mayor masa menor aceleración', ['Porque el camión tiene motor', 'Porque el camión tiene más llantas', 'Porque la fuerza se reparte en el camión']],
    [3, '¿Qué es 1 newton?', 'La fuerza que hace que 1 kg acelere 1 m/s²', ['El peso de 1 kg en la Tierra', 'La fuerza de 1 kg en reposo', 'Una unidad de energía']],
    [4, 'Si un objeto se mueve a velocidad constante, ¿qué puedes decir de la fuerza neta?', 'Que es cero: no hay aceleración', ['Que es constante y distinta de cero', 'Que es igual al peso', 'Que aumenta con el tiempo']],
    [5, 'Si empujas una pared, ¿por qué no se mueve aunque la pared te empuja con la misma fuerza?', 'Porque las fuerzas del par actúan sobre cuerpos distintos; la pared está sujeta al edificio', ['Porque tu fuerza es menor que la de la pared', 'Porque la pared no ejerce fuerza', 'Porque las fuerzas se cancelan en la pared']]] };
RAZ.gravedad = { origen: `<p>La masa es la cantidad de materia (kg) y no cambia de lugar a lugar. El peso es la <b>fuerza</b> con que un planeta atrae esa masa. Por la segunda ley, si un cuerpo cae con aceleración g, la fuerza que lo jala es m·g: por eso P = m · g.</p>
<p>En la Luna g es unas 6 veces menor, así que pesas 6 veces menos, aunque tu masa es la misma. Newton explicó que la misma atracción que hace caer una manzana mantiene a la Luna en órbita, y que se debilita con el cuadrado de la distancia.</p>`,
  qs: [
    [2, '¿Por qué un astronauta pesa menos en la Luna pero su masa es igual?', 'Porque la masa es la materia que tiene y el peso depende de la gravedad del lugar', ['Porque pierde materia en el viaje', 'Porque en la Luna no hay aire', 'Porque la masa también cambia con la gravedad']],
    [3, '¿Por qué P = m · g?', 'Porque el peso es la fuerza que da a la masa la aceleración g (F = m · a)', ['Porque se acordó así', 'Porque g es la masa de la Tierra', 'Porque el peso es la masa por 10']],
    [4, 'Una báscula de baño marca “kg”. ¿Qué mide realmente?', 'Una fuerza (el peso) y la convierte a kg suponiendo la g de la Tierra', ['Directamente la masa en cualquier planeta', 'La densidad del cuerpo', 'El volumen de la persona']],
    [5, 'Si la distancia entre dos cuerpos se duplica, la fuerza de gravedad:', 'Se reduce a la cuarta parte', ['Se reduce a la mitad', 'Se duplica', 'No cambia']]] };
RAZ.trabajo = { origen: `<p>En física, hay trabajo cuando una fuerza logra mover algo en su dirección. Empujar 10 m con 20 N cuesta el doble de esfuerzo que empujar 5 m con la misma fuerza: por eso W = F · d. Si empujas una pared y no se mueve, no hay trabajo (aunque te canses).</p>
<p>La potencia dice qué tan <b>rápido</b> se hace ese trabajo: subir las escaleras corriendo o caminando requiere el mismo trabajo, pero corriendo lo haces en menos tiempo, con más potencia. P = W ÷ t, en joules por segundo (watts).</p>`,
  qs: [
    [2, '¿Por qué si sostienes una mochila sin moverla no haces trabajo (en física)?', 'Porque la fuerza no logra desplazarla: d = 0', ['Porque la mochila no pesa', 'Porque te cansas igual', 'Sí hay trabajo, porque hay fuerza']],
    [3, 'Subes la misma escalera caminando y corriendo. ¿Qué cambia?', 'La potencia: el trabajo es el mismo pero corriendo se hace en menos tiempo', ['El trabajo, que es mayor caminando', 'Tu peso al correr', 'La altura de la escalera']],
    [4, '¿Por qué subir una caja requiere W = m · g · h?', 'Porque hay que vencer su peso (m·g) a lo largo de la altura h', ['Porque se multiplica todo lo que aparece', 'Porque h es la velocidad de subida', 'Porque así se calcula la potencia']],
    [5, 'Un foco de 100 W encendido 10 s. ¿Qué significa?', 'Que transforma 100 J de energía cada segundo: 1 000 J en total', ['Que su energía total es 100 J', 'Que dura 100 segundos', 'Que pesa 100 g']]] };
RAZ.energia = { origen: `<p>La energía es la capacidad de hacer trabajo. Para subir un objeto a una altura h hay que hacer el trabajo m·g·h; esa energía queda “guardada” por estar arriba: E<sub>p</sub> = m·g·h. Al soltarlo, la energía guardada se transforma en movimiento.</p>
<p>La energía cinética crece con el cuadrado de la velocidad: a doble velocidad, cuatro veces la energía. Por eso un choque a 100 km/h es mucho más grave que a 50 km/h. Sin fricción, la suma E<sub>p</sub> + E<sub>c</sub> se conserva: lo que pierde una, lo gana la otra.</p>`,
  qs: [
    [2, '¿Por qué un objeto en lo alto tiene energía aunque esté quieto?', 'Porque se hizo trabajo para subirlo y al caer puede transformarlo en movimiento', ['Porque el aire lo empuja', 'Porque todos los objetos tienen la misma energía', 'No tiene energía si está quieto']],
    [3, 'Si un auto duplica su velocidad, su energía cinética:', 'Se multiplica por 4, porque depende de v²', ['Se duplica', 'No cambia', 'Se reduce a la mitad']],
    [4, 'Una pelota cae sin fricción. A la mitad de la altura, ¿cómo es su energía?', 'Mitad potencial y mitad cinética; la suma es la misma que al inicio', ['Toda cinética', 'Toda potencial', 'Menor que al inicio']],
    [5, 'Una montaña rusa real nunca vuelve a subir tan alto como el punto de partida. ¿Por qué?', 'Porque parte de la energía se transforma en calor y sonido por la fricción', ['Porque la gravedad aumenta', 'Porque la masa del carrito cambia', 'Porque la energía se destruye']]] };
RAZ.calor = { origen: `<p>La temperatura mide qué tan agitadas están las partículas; el calor es la energía que pasa de un cuerpo caliente a uno frío. Una alberca a 30 °C y una taza a 30 °C tienen la misma temperatura, pero la alberca tiene muchísima más energía, porque tiene muchas más partículas.</p>
<p>Por eso el calor necesario depende de tres cosas: cuánta masa calientas, cuánto subes la temperatura y de qué material es (calor específico). De ahí Q = m · c · ΔT. El agua tiene un calor específico alto: tarda en calentarse y en enfriarse, y por eso regula el clima de las costas.</p>`,
  qs: [
    [2, '¿Por qué calentar una olla grande de agua tarda más que una taza?', 'Porque hay más masa que calentar y se necesita más energía', ['Porque la olla es de otro material', 'Porque el agua grande está más fría siempre', 'Porque la estufa calienta menos']],
    [3, '¿Qué diferencia hay entre calor y temperatura?', 'El calor es energía que se transfiere; la temperatura mide la agitación de las partículas', ['Son lo mismo con distinto nombre', 'La temperatura se mide en joules', 'El calor solo existe en verano']],
    [4, 'Mezclas agua a 20 °C con agua a 60 °C en igual cantidad. ¿Qué temperatura final esperas?', '40 °C: el calor que cede la caliente lo gana la fría', ['80 °C: se suman las temperaturas', '60 °C: gana la más caliente', '20 °C: gana la más fría']],
    [5, '¿Por qué en la playa la arena quema y el agua se siente fresca bajo el mismo sol?', 'Porque el agua tiene mayor calor específico: sube menos su temperatura con la misma energía', ['Porque el agua recibe menos sol', 'Porque la arena es más densa', 'Porque el agua se evapora toda']]] };
RAZ.sustentable = { origen: `<p>La energía no se crea ni se destruye: se transforma. Ninguna máquina convierte toda la energía que recibe en la forma útil que queremos; una parte siempre se va como calor. La eficiencia mide qué parte se aprovecha: útil ÷ total.</p>
<p>Por eso ahorrar energía tiene dos caminos: usar menos (apagar) o usar aparatos más eficientes (un LED convierte en luz mucho más de lo que convierte un foco incandescente, que se calienta).</p>`,
  qs: [
    [2, '¿Por qué ninguna máquina tiene 100% de eficiencia?', 'Porque parte de la energía siempre se transforma en calor no aprovechado', ['Porque la energía se destruye', 'Porque los fabricantes no quieren', 'Sí existen máquinas de 100%']],
    [3, 'Un foco incandescente se calienta mucho y un LED casi no. ¿Qué indica?', 'Que el LED convierte más energía en luz y desperdicia menos en calor', ['Que el LED da menos luz', 'Que el incandescente es más eficiente', 'Que el LED no consume energía']],
    [4, 'Un motor tiene 80% de eficiencia y recibe 1 000 J. ¿Qué pasa con 200 J?', 'Se transforman en calor y sonido, no desaparecen', ['Se destruyen', 'Se guardan para después', 'Regresan a la fuente']],
    [5, '¿Por qué la energía solar se considera renovable?', 'Porque su fuente no se agota en escalas de tiempo humanas', ['Porque es gratis', 'Porque no necesita aparatos', 'Porque produce 100% de eficiencia']]] };
RAZ.electrostatica = { origen: `<p>Toda la materia tiene cargas positivas (protones) y negativas (electrones). Normalmente están equilibradas. Al frotar un globo con el cabello, algunos electrones pasan de un material al otro: uno queda con exceso (negativo) y el otro con faltante (positivo). No se crea carga: solo se mueve.</p>
<p>Cargas iguales se repelen y opuestas se atraen. La fuerza disminuye rápido con la distancia: a doble distancia, la cuarta parte (igual que la gravedad).</p>`,
  qs: [
    [2, 'Al frotar un globo, ¿se crea carga eléctrica?', 'No: se transfieren electrones de un material a otro', ['Sí, la fricción fabrica cargas', 'Sí, se crean protones', 'No, el globo no se carga']],
    [3, '¿Por qué un globo cargado se pega a la pared?', 'Porque reordena las cargas de la pared y las opuestas quedan más cerca, atrayéndolo', ['Porque la pared también se frotó', 'Porque el globo tiene pegamento natural', 'Porque la gravedad cambia']],
    [4, 'Si la distancia entre dos cargas se reduce a la mitad, la fuerza:', 'Se multiplica por 4', ['Se duplica', 'Se reduce a la mitad', 'No cambia']],
    [5, '¿Por qué a veces “te da toques” al tocar una manija después de caminar en alfombra?', 'Porque acumulaste carga al frotar y se descarga de golpe al tocar el metal', ['Porque la manija tiene corriente', 'Porque la alfombra tiene electricidad de la casa', 'Porque el metal produce carga']]] };
RAZ.circuitos = { origen: `<p>Una analogía útil es el agua en una tubería: el <b>voltaje</b> es como la diferencia de altura que empuja al agua, la <b>corriente</b> es cuánta agua pasa por segundo y la <b>resistencia</b> es qué tan angosto es el tubo. Con más empuje pasa más agua (más V, más I); con un tubo más angosto pasa menos (más R, menos I). Juntando: I = V ÷ R, que es la ley de Ohm (V = I · R).</p>
<p>En serie, la corriente atraviesa una resistencia tras otra: los obstáculos se suman. En paralelo se abren más caminos: la resistencia total baja, porque la corriente tiene más por dónde pasar.</p>`,
  qs: [
    [2, 'Si aumentas el voltaje y la resistencia no cambia, la corriente:', 'Aumenta, porque hay más “empuje” para las cargas', ['Disminuye', 'No cambia', 'Se vuelve cero']],
    [3, '¿Por qué al conectar resistencias en paralelo la resistencia total disminuye?', 'Porque se abren más caminos para que pase la corriente', ['Porque las resistencias se restan', 'Porque cada resistencia se hace más pequeña', 'No disminuye, aumenta']],
    [4, 'En una serie de focos, uno se funde y todos se apagan. ¿Por qué?', 'Porque en serie solo hay un camino; si se interrumpe, no circula corriente', ['Porque el voltaje desaparece de la casa', 'Porque los demás focos también se funden', 'Porque los focos en serie están en paralelo']],
    [5, '¿Por qué las casas se conectan en paralelo y no en serie?', 'Para que cada aparato reciba el voltaje completo y funcione aunque otro se apague', ['Para gastar menos cable', 'Porque en serie no hay corriente', 'Para que todos se apaguen juntos']]] };
RAZ.potencia_el = { origen: `<p>El voltaje es la energía que recibe cada coulomb de carga (1 V = 1 J por coulomb) y la corriente es cuántos coulombs pasan cada segundo. Multiplicando: (J por coulomb) × (coulombs por segundo) = J por segundo = watts. Por eso P = V · I: las unidades lo explican.</p>
<p>El kWh es energía: es lo que consume un aparato de 1 kW funcionando 1 hora (kW × h). Por eso el recibo de luz cobra kWh: no importa solo qué tan potente es un aparato, sino cuánto tiempo está encendido.</p>`,
  qs: [
    [2, '¿Por qué el recibo de luz cobra kWh y no watts?', 'Porque cobra energía consumida, que depende de la potencia y del tiempo de uso', ['Porque los watts son muy pequeños', 'Porque así lo decide cada estado', 'Porque kWh es la potencia de la casa']],
    [3, 'Un horno de 1 000 W 15 minutos o un foco de 10 W 24 horas. ¿Cuál consume más energía?', 'El horno: 0.25 kWh contra 0.24 kWh, casi lo mismo pero un poco más', ['El foco, porque está más tiempo', 'El horno, porque consume 100 veces más', 'Consumen exactamente lo mismo']],
    [4, '¿Por qué conectar muchos aparatos en un mismo contacto puede ser peligroso?', 'Porque la corriente total (I = P ÷ V) crece y calienta el cable', ['Porque el voltaje aumenta', 'Porque los aparatos se descomponen entre sí', 'Porque se apaga la luz de la casa']],
    [5, 'Las unidades de P = V · I son V × A. ¿Por qué eso da watts?', 'Porque (J/C) × (C/s) = J/s, que es un watt', ['Porque V y A se suman', 'Porque así se definió por costumbre', 'Porque el amperio es un watt']]] };
RAZ.magnetismo = { origen: `<p>Oersted descubrió que un cable con corriente desvía una brújula: la corriente eléctrica produce magnetismo. Si enrollas el cable, los efectos de cada vuelta se suman: más vueltas o más corriente, imán más fuerte. Así funciona un electroimán, y se puede apagar cortando la corriente.</p>
<p>Faraday encontró lo inverso: mover un imán cerca de una bobina genera corriente. En eso se basan los generadores de las presas y las centrales: algo hace girar imanes junto a bobinas.</p>`,
  qs: [
    [2, '¿Por qué un electroimán es más fuerte con más vueltas de cable?', 'Porque el magnetismo de cada vuelta se suma', ['Porque el cable pesa más', 'Porque se gasta más cobre', 'Porque cambia el polo norte']],
    [3, '¿Qué ventaja tiene un electroimán sobre un imán común?', 'Que se puede encender, apagar y regular con la corriente', ['Que nunca pierde fuerza', 'Que no necesita energía', 'Que atrae todos los materiales']],
    [4, '¿Cómo se genera electricidad en una presa?', 'El agua hace girar una turbina que mueve imanes junto a bobinas e induce corriente', ['El agua tiene electricidad que se recoge', 'La presión del agua carga baterías', 'El agua se descompone en electrones']],
    [5, 'Si un imán se queda quieto dentro de una bobina, ¿se genera corriente?', 'No: se necesita que el magnetismo cambie (movimiento)', ['Sí, siempre que haya imán', 'Sí, pero más débil', 'Solo si el imán es grande']]] };
RAZ.ondas = { origen: `<p>Una onda es una perturbación que viaja transportando energía, no materia: las moléculas de aire solo vibran en su lugar mientras el sonido avanza. En cada vibración completa (un periodo T) la onda avanza una longitud de onda λ. Por eso su velocidad es v = λ ÷ T = λ · f (f = vibraciones por segundo = 1/T).</p>
<p>Así se entiende que en un mismo medio, si la frecuencia sube, la longitud de onda baja: la velocidad la fija el medio, no la fuente.</p>`,
  qs: [
    [2, 'Cuando escuchas un sonido, ¿el aire viaja desde la fuente hasta tu oído?', 'No: las partículas vibran en su lugar y lo que viaja es la energía', ['Sí, el aire se desplaza hasta ti', 'Sí, por eso hace viento', 'No, el sonido viaja sin ningún medio']],
    [3, '¿Por qué v = λ · f?', 'Porque en cada vibración la onda avanza λ, y hay f vibraciones por segundo', ['Porque se multiplican las propiedades de la onda', 'Porque la frecuencia es una velocidad', 'Porque así lo indica la gráfica']],
    [4, 'Ves el relámpago antes de oír el trueno. ¿Por qué?', 'Porque la luz viaja muchísimo más rápido que el sonido', ['Porque el trueno ocurre después del rayo', 'Porque los ojos son más rápidos que los oídos', 'Porque el sonido se pierde en las nubes']],
    [5, 'Un sonido más agudo (mayor frecuencia) en el aire tiene longitud de onda:', 'Menor, porque la velocidad en el aire es la misma', ['Mayor', 'Igual', 'Depende del volumen']]] };
RAZ.universo = { origen: `<p>Durante siglos se pensó que todo giraba alrededor de la Tierra, porque así parece. Copérnico propuso que los planetas giran alrededor del Sol; Galileo lo apoyó con observaciones (lunas de Júpiter, fases de Venus) y Kepler describió las órbitas con precisión. Newton explicó el porqué con la gravitación.</p>

const PRAISE = ['¡Correcto! Buen procedimiento.', '¡Bien! Lo resolviste con método.', '¡Exacto!', '¡Muy bien! Ese paso no es fácil.', '¡Correcto! Vas avanzando.'];

<div class="conf">¿Dónde estuvo tu error? ${SUBJECTS[TOP[c.id].subj].errT.map(([k, l]) => `<button class="${c.errT === k ? 'sel' : ''}" data-act="errt" data-arg="${k}">${l}</button>`).join('')}</div></div>`;

function viewGuide() {
  return `<h1>Guía de estudio</h1>
<div class="card"><h2>Para ti, estudiante</h2><ol class="guide">
<li><b>Sigue el ciclo:</b> Aprende → Practica → Evalúate → Repasa. La pantalla de inicio siempre te sugiere el siguiente paso.</li>
<li><b>Usa cuaderno.</b> Resuelve cada ejercicio por escrito. La app revisa el resultado; tu cuaderno muestra el procedimiento.</li>
<li><b>Equivocarte es parte del método.</b> Cuando falles, lee la solución paso a paso y marca dónde estuvo el error. Después pide “uno parecido”.</li>
<li><b>Pide ayuda en orden:</b> primero la pista, luego el primer paso, y solo si sigues atorado, “Tengo duda”.</li>

<li><b>Sesiones cortas y frecuentes:</b> 20 a 30 minutos al día rinden más que 3 horas un solo día. La app te avisa cada 25 minutos para descansar 5.</li>
<li><b>Mezcla temas</b> con la práctica mixta una o dos veces por semana. Cuesta más, pero se aprende mejor.</li>
<li><b>No te saltes los repasos.</b> Repasar justo antes de olvidar es lo que hace que el conocimiento dure.</li>
<li><b>Explica en voz alta</b> cómo resolviste un ejercicio, como si se lo enseñaras a alguien. Si puedes explicarlo, lo entendiste.</li>
<li><b>Tu meta es 9 o más en cada materia.</b> En cada materia verás tu <b>calificación estimada</b>. Cuando la app lo sugiera, haz un <b>simulacro de examen</b>: 10 a 15 preguntas sin pistas, como en la escuela. Si sale menos de 9, estudia los temas que fallaste y repítelo en unos días.</li>
<li><b>Entiende de dónde sale cada regla.</b> Lee “¿De dónde sale?” en cada lección y explícalo en tu cuaderno. Las preguntas con 🧠 no se resuelven con fórmula: hay que razonar.</li>
<li><b>Antes de calcular, predice:</b> ¿el resultado debe ser mayor o menor? ¿en qué unidades? Al terminar, revisa si es razonable (un ciclista no va a 450 m/s).</li>
<li><b>Las preguntas que fallas regresan</b> unas preguntas después, con las opciones en otro orden. No memorices la letra: entiende por qué es la respuesta.</li></ol></div>
<div class="card"><h2>Cómo sube y baja el nivel</h2><table class="tbl"><tr><th>Situación</th><th>Efecto</th></tr><tr><td>3 aciertos seguidos sin pista (niveles 1–2) o 4 (niveles 3–5)</td><td>Sube un nivel</td></tr><tr><td>2 errores seguidos</td><td>Baja un nivel</td></tr><tr><td>Acierto con pista</td><td>Cuenta como acierto, no suma a la racha</td></tr><tr><td>“Tengo duda”</td><td>Explicación guiada; no afecta el nivel</td></tr><tr><td>Autoevaluación con 4–5 de 5</td><td>Sube un nivel (en nivel 5: tema dominado)</td></tr><tr><td>Tema dominado</td><td>Repasos a 1, 3, 7, 14, 30 y 60 días</td></tr></table></div>

<div class="card"><h2>Fundamentos pedagógicos de la app</h2><ul class="guide">
<li><b>Aprendizaje para el dominio</b> (Bloom): no se avanza de nivel hasta mostrar dominio consistente.</li>
<li><b>Zona de desarrollo próximo y andamiaje</b> (Vygotsky): la dificultad se ajusta para que el reto sea alcanzable; las pistas y la explicación guiada sostienen sin resolver por el alumno.</li>
<li><b>Ejemplos resueltos y desvanecimiento:</b> primero se observan soluciones paso a paso, luego se practica con apoyo y al final sin él.</li>
<li><b>Comprensión antes que receta:</b> cada regla y fórmula se construye desde su significado (“¿De dónde sale?”), y 30% de las preguntas piden razonar: por qué funciona, encontrar el error, estimar si el resultado es razonable o predecir.</li>
<li><b>Autoexplicación:</b> antes de practicar se pide explicar la idea con palabras propias; explicar obliga a entender.</li>
<li><b>Práctica de recuperación:</b> responder sin mirar fortalece la memoria más que releer.</li>
<li><b>Corrección del error con reintento diferido:</b> la pregunta fallada vuelve tres preguntas después para confirmar que se corrigió el concepto.</li>
<li><b>Evaluación con criterio:</b> nivelado = nivel 4 con 80% de aciertos; calificación estimada y simulacros sin pistas alineados a la meta de 9.</li>
<li><b>Reactivos sin pistas de forma:</b> distractores plausibles y de longitud similar a la respuesta, y variantes de verdadero/falso para que no se acierte por descarte superficial.</li>
<li><b>Repaso espaciado</b> (curva del olvido): los temas dominados regresan a intervalos crecientes.</li>
<li><b>Práctica intercalada:</b> los repasos relámpago y la práctica mixta obligan a decidir qué método usar.</li>
<li><b>Retroalimentación inmediata y específica:</b> detecta errores típicos (signo, punto decimal, fórmula equivocada) y explica el porqué.</li>
<li><b>Metacognición:</b> el registro de confianza y de tipo de error enseña a reconocer lo que se sabe y lo que no.</li>
<li><b>Mentalidad de crecimiento:</b> los mensajes valoran el esfuerzo y presentan el error como parte del aprendizaje.</li>

function monthStart(m) { const now = new Date(); const y = now.getMonth() >= 7 ? now.getFullYear() : now.getFullYear() - 1; return new Date(y, 8 + m - 1, 15); }
function schoolMonth() { for (let m = 10; m >= 1; m--) if (new Date() >= monthStart(m)) return m; return 0; }
const autoSeen = id => new Date() >= monthStart(CAL[id] || 10);
const seenModeOf = sid => (prof().seenMode || {})[sid] || 'auto';
function isSeen(id) { const sid = TOP[id].subj; return seenModeOf(sid) === 'manual' ? !!prof().seen[id] : autoSeen(id); }
const seenTopics = sid => (sid ? subjTopics(sid) : TOPICS.filter(t => !SUBJECTS[t.subj].pending)).filter(t => isSeen(t.id));
/* Nivelado = nivel 4 o más con al menos 80% de aciertos en las últimas 8 respuestas (o tema dominado). Coherente con la meta de 9. */
const leveled = s => !!s && (s.mastered || (s.lvl >= 4 && acc(s, 8) >= 0.8));
const DIAGLBL = [['Prioridad de nivelación', 'bad'], ['Reforzar', 'rev'], ['Bien', 'ok']];
function diagOf(id) { const s = peek(id); return s && s.diag !== undefined ? s.diag : null; }
const diagDone = sid => !!prof().diag[sid];
function planTopics(sid) {
  return seenTopics(sid).filter(t => !leveled(peek(t.id))).sort((a, b) => {
    const da = diagOf(a.id), db = diagOf(b.id);
    return ((da === null ? 1 : da) - (db === null ? 1 : db)) || (mastery(peek(a.id)) - mastery(peek(b.id))) || ((CAL[a.id] || 10) - (CAL[b.id] || 10));

}
const undiagnosed = sid => seenTopics(sid).filter(t => diagOf(t.id) === null && !(peek(t.id) && peek(t.id).att));

function levelStats(sid) { const seen = seenTopics(sid); const lev = seen.filter(t => leveled(peek(t.id))).length; return { seen: seen.length, lev, pct: seen.length ? Math.round(lev / seen.length * 100) : 0 }; }

  const plan = planTopics(sid);

}

function startQuiz(mode, arg) {

  if (mode === 'bim') { const ts = shuffle(seenTopics(arg)); if (!ts.length) return toast('Todavía no hay temas vistos en clase para un simulacro.'); const n = Math.min(15, Math.max(10, ts.length)); for (let i = 0; i < n; i++) { const t = ts[i % ts.length]; items.push({ id: t.id, lvl: i % 2 ? 4 : 3 }); } }
  S = { kind: 'quiz', mode: mode === 'diagnew' ? 'diag' : mode, diagNew: mode === 'diagnew', topic: arg, subj, items: mode.startsWith('diag') ? items : shuffle(items), qi: 0, res: [], sec: 0 };

function nextQuestion(sameId) {

  }
  if (S.mode === 'eje') {

  let done = false;
  try { if (DL) { await DL.save({ filename: fn, data }); done = true; } } catch (e) { done = false; }
  /* iPad/iPhone como app instalada (pantalla de inicio): la hoja para compartir permite “Guardar en Archivos”. */

/* ---- Calificación estimada (escala SEP 5-10) y meta de 9 ----
   Por tema: 10 × aciertos recientes × factor de dificultad del nivel (N1 0.6 · N2 0.7 · N3 0.8 · N4 0.95 · N5 1.0).
   Un 9 exige nivel 4 o más con ≥95% de aciertos, o nivel 5 con ≥90%. Si hay simulacro en los últimos 30 días, pesa 50%. */
const META = 9, LVF = [0.6, 0.7, 0.8, 0.95, 1];

function lastBim(sid) { const e = (prof().exams || []).filter(x => x.bim === sid).slice(-1)[0]; return e || null; }
function subjGrade(sid) {
  const seen = seenTopics(sid); if (!seen.length) return null;
  const gs = seen.map(t => topicGrade(peek(t.id))); const known = gs.filter(g => g !== null);
  const lb = lastBim(sid), recentBim = lb && Date.now() - lb.d < 30 * DAY ? lb.g : null;
  if (!known.length && recentBim === null) return { g: null, cov: 0, n: seen.length, bim: lb };
  const tAvg = known.length ? known.reduce((a, b) => a + b, 0) / known.length : null;
  const g = tAvg === null ? recentBim : recentBim === null ? tAvg : (tAvg + recentBim) / 2;
  return { g: Math.round(g * 10) / 10, cov: known.length / seen.length, n: seen.length, bim: lb, weak: seen.filter(t => { const x = topicGrade(peek(t.id)); return x === null || x < META; }) };
}
const gradeCls = g => g === null ? '' : g >= META ? 'ok' : g >= 8 ? 'rev' : 'bad';

  const G = subjGrade(sid); if (!G) return '';
  if (G.g === null) return `<div class="card gradebox"><b>Calificación estimada: sin datos todavía.</b> <span class="small mut">Se calcula con tu práctica de los temas vistos en clase y con los simulacros de examen. Meta: ${META} o más.</span></div>`;
  const w = (G.weak || []).slice(0, 4);
  return `<div class="card gradebox ${gradeCls(G.g)}"><div class="row"><div class="gnum">${fmt(G.g, 1)}</div><div style="flex:1"><b>Calificación estimada</b> · meta ${META} o más<br><span class="small mut">${G.cov < 1 ? `Basada en ${Math.round(G.cov * 100)}% de los temas vistos (los temas sin práctica no cuentan todavía). ` : ''}${G.bim ? `Último simulacro: ${fmt(G.bim.g, 1)} (${new Date(G.bim.d).toLocaleDateString('es-MX')}).` : 'Aún no haces un simulacro de examen.'}</span>${G.g < META && w.length ? `<br><span class="small">Para subir: ${w.map(t => `<a href="#/tema/${t.id}/practica">${t.title}</a>`).join(' · ')}</span>` : ''}</div></div></div>`;
}
